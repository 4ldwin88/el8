<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Account Status</title><style>:root{--bg:#f6f3ec;--card:#fffdfa;--ink:#17191c;--muted:#74766f;--line:#e4dfd5;--soft:#eee9df}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.wrap{max-width:640px;margin:auto;padding:30px 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:30px}h1{font-size:36px;line-height:1.05}.muted{color:var(--muted);line-height:1.5}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--ink);color:white;font:inherit;font-weight:800;margin-top:16px}</style></head><body><div class="wrap"><b style="font-size:30px">EL8</b><div class="card"><h1 id="title">Account paused</h1><p id="copy" class="muted">This account is not currently available for ordinary EL8 activity.</p><button id="signOutBtn" class="btn">Sign out</button></div></div><script type="module">import{getSessionOrRedirect,getMyProfile,signOut}from'./el8-client.js';const s=await getSessionOrRedirect();if(s){const p=await getMyProfile();if(p.account_status==='active')location.replace(p.onboarding_status==='completed'?'app.html':p.onboarding_status==='safety_paused'?'safety-hold.html':'onboarding-start.html');if(p.account_status==='deactivated'){title.textContent='Account deactivated';copy.textContent='This prototype account has been deactivated by an EL8 administrator.'}else{title.textContent='Account paused';copy.textContent='This prototype account has been administratively paused. Sign in later after an administrator restores access.'}signOutBtn.onclick=()=>signOut()}</script></body></html>
