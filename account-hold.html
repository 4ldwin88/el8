<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Account Status</title><link rel="stylesheet" href="assets/el8-ui.css"></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Account status</div><div class="el8-card"><h1 id="title">Account paused</h1><p id="copy">This account is not currently available for ordinary EL8 activity.</p><button id="signOutBtn" class="el8-btn">Sign out</button></div></main><script type="module">document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light';import{getSessionOrRedirect,getMyProfile,signOut}from'./el8-client.js';const s=await getSessionOrRedirect();if(s){const p=await getMyProfile();if(p.account_status==='active')location.replace(p.onboarding_status==='completed'?'app.html#home':p.onboarding_status==='safety_paused'?'safety-hold.html':'onboarding-start.html');if(p.account_status==='deactivated'){title.textContent='Account deactivated';copy.textContent='This prototype account has been deactivated by an EL8 administrator.'}else{title.textContent='Account paused';copy.textContent='This prototype account has been administratively paused. Sign in later after an administrator restores access.'}signOutBtn.onclick=()=>signOut()}</script></body></html>
