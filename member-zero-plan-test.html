<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Member Zero Plan Test</title><style>body{font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;margin:0}.wrap{max-width:680px;margin:auto;padding:26px 18px 60px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:22px;margin-top:16px}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#777}h1{font-size:24px;margin:8px 0}h2{font-size:19px}p{line-height:1.45;color:#555}.options{display:grid;gap:9px;margin-top:18px}.option,.btn{padding:13px 14px;border:1px solid #ccc;background:#fff;border-radius:11px;font-size:15px;text-align:left}.option.selected{border:2px solid #222;background:#f0f0ed}.btn{background:#171717;color:#fff;border:0;text-align:center}.secondary{background:#ecece8;color:#222}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.progress{height:5px;background:#eee;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#777}.item{border:1px solid #ddd;border-radius:13px;padding:14px;margin:10px 0}.tag{font-size:12px;color:#777}.grid{display:grid;gap:8px}.rating{display:flex;gap:6px;flex-wrap:wrap}.rating button{padding:8px 10px;border:1px solid #ccc;background:white;border-radius:9px}.rating button.on{background:#222;color:white}.meta{font-size:12px;color:#888;margin-top:10px}textarea{width:100%;box-sizing:border-box;min-height:70px;border:1px solid #ccc;border-radius:10px;padding:10px;font:inherit}</style></head><body><main class="wrap"><div class="eyebrow">EL8 · Plan Engine v1 · Member Zero H1</div><div id="app" class="card"></div></main><script type="module">import E from './discovery-v2-engine.js';import{buildPlan,respondToItem}from'./intelligence/planning/plan-engine.js';
let s=E.session(),q,sel=[],started=Date.now(),plan=null,trace=null;const app=document.querySelector('#app'),exclusive=new Set(['other','unsure']);const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function toggle(id){if(q.mode!=='multi')sel=[id];else if(exclusive.has(id))sel=[id];else{sel=sel.filter(x=>!exclusive.has(x));sel=sel.includes(id)?sel.filter(x=>x!==id):[...sel,id]}renderQ()}
function next(){if(!sel.length)return;E.answer(s,q.id,q.mode==='multi'?sel:sel[0]);sel=[];advance()}
function advance(){q=E.next(s);q?renderQ():expectation()}
function renderQ(){let n=s.asked.length+1;app.innerHTML=`<div class=eyebrow>Discovery · Question ${n}</div><div class=progress><span style="width:${Math.min(100,n/8*100)}%"></span></div><h1>${esc(q.text)}</h1><div class=options>${q.options.map(o=>`<button class="option ${sel.includes(o.id)?'selected':''}" data-id="${esc(o.id)}">${esc(o.label)}</button>`).join('')}</div><div class=actions><button class=btn id=n ${sel.length?'':'disabled'}>Continue</button></div><div class=meta>Answer normally. The plan is hidden until Discovery is frozen.</div>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>toggle(b.dataset.id));app.querySelector('#n').onclick=next}
function expectation(){trace=E.trace(s);app.innerHTML=`<div class=eyebrow>Discovery frozen</div><h1>Before EL8 shows its plan</h1><p>What 1–2 things would you reasonably expect a good plan to prioritize based on the questions you just answered?</p><textarea id=exp placeholder="Short answer is fine"></textarea><div class=actions><button class=btn id=go>Reveal EL8 plan</button></div>`;app.querySelector('#go').onclick=()=>makePlan(app.querySelector('#exp').value)}
function makePlan(expect){const ranked=(trace.ranked||[]).map((x,i)=>({id:x.id,confidence:x.confidence??x.score??Math.max(.4,.9-i*.1),importance:4,urgency:3,readiness:3,breadth:x.breadth||1}));plan=buildPlan({ranked,safetyHold:trace.safetyHold},{capacity:'medium'});window.__EL8_H1={expectation:expect,trace,plan,startedAt:new Date(started).toISOString()};renderPlan(expect)}
function cadence(a){let c=a.cadence||{};return c.type==='daily'?'Daily':c.type==='weekly_target'?`${c.target||1}× this week`:c.type==='specific_days'?'Specific days':'One time'}
function renderPlan(expect){app.innerHTML=`<div class=eyebrow>Shadow plan · not saved</div><h1>EL8's proposed plan</h1><p><b>Your expectation:</b> ${esc(expect||'Not entered')}</p>${plan.status!=='active'?`<div class=item><b>Status:</b> ${esc(plan.status)} · ${esc(plan.reason)}</div>`:(plan.active||[]).map((a,i)=>`<div class=item><div class=tag>Active ${i+1} · ${esc(cadence(a))}</div><h2>${esc(a.title||a.id)}</h2><p>${esc(a.description||a.goal||'')}</p><div class=grid data-id="${esc(a.id)}"><div>Relevant? <span class=rating data-k=relevance>${buttons(['Yes','Partly','No'])}</span></div><div>Realistically actionable? <span class=rating data-k=actionability>${buttons(['Yes','Partly','No'])}</span></div><div>Burden? <span class=rating data-k=burden>${buttons(['Too easy','Appropriate','Too demanding'])}</span></div><div>Preference? <span class=rating data-k=preference>${buttons(['Accept','Later','Not for me'])}</span></div></div></div>`).join('')}<div class=item><b>Backlog:</b> ${(plan.backlog||[]).length} eligible alternative(s)</div><p>After rating the active commitment(s), choose <b>Later</b> or <b>Not for me</b> on one item to test replacement. Your selections remain in this browser only for this validation session.</p><div class=actions><button class="btn secondary" id=done>Finish H1 review</button></div>`;wireRatings();app.querySelector('#done').onclick=finish}
function buttons(xs){return xs.map(x=>`<button data-v="${esc(x)}">${esc(x)}</button>`).join('')}
function wireRatings(){app.querySelectorAll('.rating button').forEach(b=>b.onclick=()=>{let r=b.parentElement;r.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');let box=r.closest('[data-id]'),id=box.dataset.id,key=r.dataset.k;window.__EL8_H1.ratings??={};window.__EL8_H1.ratings[id]??={};window.__EL8_H1.ratings[id][key]=b.dataset.v;if(key==='preference'&&(b.dataset.v==='Later'||b.dataset.v==='Not for me')){let decision=b.dataset.v==='Later'?'defer':'reject';plan=respondToItem(plan,id,{decision},{capacity:'medium'});window.__EL8_H1.planAfterResponse=plan;}})}
function finish(){let d=window.__EL8_H1;app.innerHTML=`<div class=eyebrow>H1 review captured locally</div><h1>Test complete</h1><p>Nothing was written to your live EL8 plan. Send a screenshot of this page or tell ChatGPT you finished the Member Zero test so the result can be reviewed.</p><details><summary>Validation record</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(JSON.stringify(d,null,2))}</pre></details>`}
advance();</script></body></html>
