<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Profile</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.memberHead{display:flex;align-items:center;gap:14px}.memberAvatar{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:19px;font-weight:800}.memberName{font-size:20px;font-weight:800}.meta{font-size:12px;color:var(--muted)}.menu a,.menu button{display:flex;width:100%;justify-content:space-between;padding:15px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-decoration:none;text-align:left}.menu a:first-child,.menu button:first-child{border-top:0}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:max(7px,env(safe-area-inset-bottom));z-index:20}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:var(--muted);text-decoration:none;text-align:center;padding:8px 2px 7px;font-size:11px}.nav a.active{color:var(--ink);font-weight:800}.mark{width:62px;height:62px;display:block;margin:-30px auto -1px}.mark img{width:100%;height:100%}.settingsRow{display:flex;justify-content:space-between;gap:12px;align-items:center}.switch{display:flex;background:var(--soft);border-radius:12px;padding:3px}.switch button{border:0;background:transparent;color:var(--ink);padding:8px 10px;border-radius:9px;font:inherit}.switch button.active{background:var(--card);font-weight:800}</style></head><body><main class="el8-shell" style="padding-bottom:110px"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Profile</div><h1>Your EL8.</h1><div class="el8-card memberHead"><div class="memberAvatar" id="avatar">M</div><div><div class="memberName" id="name">Member</div><div class="meta">Member ID · <span id="memberId">—</span></div></div></div><div class="el8-card menu"><a href="profile-setup.html?return=profile">Overview <span>›</span></a><a href="coming-soon.html?feature=Saved">Saved <span>›</span></a><a href="history.html?return=profile">History <span>›</span></a><a href="coming-soon.html?feature=Achievements">Achievements <span>›</span></a><a href="history.html?return=profile#assessments">Assessments <span>›</span></a><a href="coming-soon.html?feature=Goals">Goals <span>›</span></a><a href="coming-soon.html?feature=Rewards">Rewards <span>›</span></a><a href="coming-soon.html?feature=Reports">Reports <span>›</span></a><a href="coming-soon.html?feature=Connections">Connections <span>›</span></a></div><div class="el8-card"><div class="settingsRow"><div><h2 style="margin:0 0 5px">Appearance</h2><p style="margin:0">Choose how EL8 looks.</p></div><div class="switch"><button id="lightBtn">Light</button><button id="darkBtn">Dark</button></div></div></div><div class="el8-card menu"><a href="privacy-data.html">Privacy & Data <span>›</span></a></div><div class="el8-card menu"><button id="signout">Sign out <span>›</span></button></div></main><nav class="nav"><div class="navin"><a href="home.html">Home</a><a href="explore.html">Explore</a><a href="track.html"><span class="mark"><img src="assets/brand/el8-mark.svg" alt=""></span>Track</a><a href="insights.html">Insights</a><a class="active" href="profile.html">Profile</a></div></nav><script type="module">import{supabase,getSessionOrRedirect,getMyProfile,signOut}from'./el8-client.js';const s=await getSessionOrRedirect();if(!s)throw Error('No session');const p=await getMyProfile();const avatar=document.getElementById('avatar'),name=document.getElementById('name'),memberId=document.getElementById('memberId'),signout=document.getElementById('signout'),lightBtn=document.getElementById('lightBtn'),darkBtn=document.getElementById('darkBtn');function paint(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('el8-theme',t)}catch(e){}lightBtn.classList.toggle('active',t==='light');darkBtn.classList.toggle('active',t==='dark')}paint(p.appearance||'light');if(p.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const l=p.display_name?.trim()?.[0]?.toUpperCase()||'M';avatar.textContent=l;name.textContent=p.display_name?.trim()||'Member';memberId.textContent=p.member_code||'—';async function setTheme(t){const old=p.appearance||'light';paint(t);const{error}=await supabase.from('el8_profiles').update({appearance:t,updated_at:new Date().toISOString()}).eq('user_id',s.user.id);if(error){paint(old);alert('Appearance could not be saved.');return}p.appearance=t}lightBtn.onclick=()=>setTheme('light');darkBtn.onclick=()=>setTheme('dark');signout.addEventListener('click',async()=>{signout.disabled=true;try{await signOut()}catch(e){signout.disabled=false;alert('Could not sign out. Please try again.')}});</script></body></html>
