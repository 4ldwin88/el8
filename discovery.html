<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Discovery</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:28px 0 10px}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid currentColor}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted);line-height:1.45}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Discovery</div><h1>Find what matters most.</h1><p>EL8 will ask only what it needs to understand where a small change could make the most useful difference.</p><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><p class="small">Discovery is adaptive. Questions change with your answers, and uncertainty is preserved rather than hidden.</p></main><script type="module">import{getSessionOrRedirect,getMyProfile,supabase}from'./el8-client.js';import{createDiscoverySession,nextDiscoveryStep,answerDiscoveryQuestion,submitDiscoveryTriage,submitDiscoveryPriority,finishDiscovery,initialPlanProposal,saveDiscoveryDraft,loadDiscoveryDraft,clearDiscoveryDraft}from'./app/onboarding/discovery-runtime.js';import{persistDiscovery}from'./app/onboarding/persistence.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile();if(profile.account_status&&profile.account_status!=='active')location.replace('account-hold.html');let s=loadDiscoveryDraft()||createDiscoverySession(),finishing=false;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls');function button(text,fn){const b=document.createElement('button');b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b)}async function finish(){if(finishing)return;finishing=true;prompt.textContent='Saving Discovery…';options.innerHTML='';controls.innerHTML='';try{const output=finishDiscovery(s),proposal=initialPlanProposal(s);await persistDiscovery({userId:auth.user.id,memberCode:profile.member_code,timezone:profile.timezone||'UTC',output});sessionStorage.setItem('el8_initial_plan_proposal',JSON.stringify(proposal));sessionStorage.setItem('el8_discovery_output',JSON.stringify(output));clearDiscoveryDraft();const{error}=await supabase.from('el8_profiles').update({onboarding_status:'plan_required',updated_at:new Date().toISOString()}).eq('user_id',auth.user.id);if(error)throw error;location.replace('plan-proposal.html')}catch(e){finishing=false;prompt.textContent=e.message;button('Try again',finish)}}function render(){saveDiscoveryDraft(s);prompt.innerHTML='';options.innerHTML='';controls.innerHTML='';const step=nextDiscoveryStep(s);if(step.type==='question'){prompt.innerHTML=`<strong>${step.question.text}</strong>`;let chosen=[];(step.question.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.label||o.text||o.id;b.onclick=()=>{if(step.question.responseMode==='multi'){chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id];b.classList.toggle('selected')}else{answerDiscoveryQuestion(s,step.question,o.id);render()}};options.appendChild(b)});if(step.question.responseMode==='multi')button('Continue',()=>{if(chosen.length){answerDiscoveryQuestion(s,step.question,chosen);render()}});return}if(step.type==='triage'){prompt.innerHTML='<strong>How important are these to you right now?</strong>';const values={};(step.question.concerns||s.concernIds.map(id=>({id,label:id}))).forEach(c=>{const wrap=document.createElement('div');wrap.innerHTML=`<p><strong>${c.label||c.id}</strong></p>`;[1,2,3].forEach(v=>{const b=document.createElement('button');b.className='option';b.textContent=v===1?'Lower priority':v===2?'Important':'Very important';b.onclick=()=>{values[c.id]=v;[...wrap.querySelectorAll('button')].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};wrap.appendChild(b)});options.appendChild(wrap)});button('Continue',()=>{submitDiscoveryTriage(s,values);render()});return}if(step.type==='priority-resolution'){prompt.innerHTML=`<strong>${step.question.text}</strong>`;let chosen=[];(step.question.concerns||[]).forEach(c=>{const b=document.createElement('button');b.className='option';b.textContent=c.label||c.id;b.onclick=()=>{chosen=chosen.includes(c.id)?chosen.filter(x=>x!==c.id):chosen.length<2?[...chosen,c.id]:chosen;b.classList.toggle('selected',chosen.includes(c.id))};options.appendChild(b)});button('Continue',()=>{if(chosen.length){submitDiscoveryPriority(s,chosen);render()}});return}finish()}render();</script></body></html>
