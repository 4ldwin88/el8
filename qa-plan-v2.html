<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan v2 QA</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.pass,.fail{font-weight:800}.row{padding:10px 0;border-top:1px solid var(--line)}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Internal QA</div><h1>Adaptive Plan v2</h1><p>This matrix is non-persistent. It validates the expected branch/transition contract without creating plans, reviews or other member records.</p><div class="el8-card"><button id="runQa" type="button" class="primary">Run Plan v2 QA</button><div id="qaStatus" class="row">Loading QA session…</div><div id="qaResults"></div></div><button class="el8-bottom-action" onclick="location.href='app.html#plan'">Back to Plan</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const btn=document.getElementById('runQa'),statusEl=document.getElementById('qaStatus'),resultsEl=document.getElementById('qaResults');try{const session=await getSessionOrRedirect();if(!session)throw new Error('No authenticated session');const profile=await getMyProfile();document.documentElement.dataset.theme=profile?.appearance||'light';statusEl.textContent='Ready.';btn.addEventListener('click',async()=>{btn.disabled=true;statusEl.textContent='Running non-persistent matrix…';resultsEl.innerHTML='';try{const{data,error}=await supabase.functions.invoke('persistence-harness',{body:{mode:'plan_review_v2_matrix'}});if(error)throw error;if(!data)throw new Error('No response from QA harness');statusEl.textContent=data.ok?'All Plan v2 branches passed.':'One or more branches failed.';resultsEl.innerHTML=(data.results||[]).map(x=>`<div class="row"><span class="${x.pass?'pass':'fail'}">${x.pass?'PASS':'FAIL'} · ${x.recommendation}</span><br><small>old: ${x.old_status||'—'} · result: ${x.resulting_plan||'—'} · lineage: ${x.lineage_ok===false?'failed':'ok'}</small></div>`).join('')+`<div class="row"><small>Persistent records created: ${data.persistent_records_created??'unknown'} · ${data.marker||''}</small></div>`}catch(e){statusEl.textContent='QA failed to run.';resultsEl.innerHTML=`<div class="row fail">${String(e?.message||e)}</div>`}finally{btn.disabled=false}})}catch(e){btn.disabled=true;statusEl.textContent='QA page initialization failed.';resultsEl.innerHTML=`<div class="row fail">${String(e?.message||e)}</div>`}</script></body></html>
