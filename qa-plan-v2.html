<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan v2 QA</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.pass{font-weight:800}.fail{font-weight:800}.row{padding:10px 0;border-top:1px solid var(--line)}pre{white-space:pre-wrap;word-break:break-word;font-size:12px}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Internal QA</div><h1>Adaptive Plan v2</h1><p>This test uses temporary isolated records and cleans them up automatically. It does not alter your real active plan.</p><div class="el8-card"><button id="run" class="primary">Run Plan v2 QA</button><div id="status" class="row">Ready.</div><div id="results"></div></div><button class="el8-bottom-action" onclick="location.href='app.html#plan'">Back to Plan</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const profile=await getMyProfile();document.documentElement.dataset.theme=profile.appearance||'light';run.onclick=async()=>{run.disabled=true;status.textContent='Running isolated matrix…';results.innerHTML='';const{data,error}=await supabase.functions.invoke('persistence-harness',{body:{mode:'plan_review_v2_matrix'}});if(error||!data){status.textContent='QA failed to run: '+(error?.message||'No response');run.disabled=false;return}status.textContent=data.ok?'All Plan v2 branches passed.':'One or more branches failed.';results.innerHTML=(data.results||[]).map(x=>`<div class="row"><span class="${x.pass?'pass':'fail'}">${x.pass?'PASS':'FAIL'} · ${x.recommendation}</span><br><small>old: ${x.old_status||'—'} · result: ${x.resulting_plan||'—'} · lineage: ${x.lineage_ok===false?'failed':'ok'}${x.error?` · ${x.error}`:''}</small></div>`).join('')+`<div class="row"><small>Cleanup: ${data.cleanup||'unknown'} · ${data.marker||''}</small></div>`;run.disabled=false;};</script></body></html>
