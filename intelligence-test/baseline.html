<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test · Baseline</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 70px}.progress{height:5px;background:var(--line);border-radius:5px;margin:22px 0}.bar{height:100%;background:var(--gold);border-radius:5px}.screen{display:none}.screen.active{display:block}.q{margin:16px 0}.q strong{display:block;margin-bottom:8px}.options{display:flex;flex-wrap:wrap;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.nav{display:flex;gap:9px;margin-top:22px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.note,.hint{font-size:12px;color:var(--muted)}.tester{margin-top:24px}.tester textarea{width:100%;min-height:82px;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;resize:vertical}.stage{display:flex;justify-content:space-between;gap:12px;align-items:center}.stage span{font-size:12px;color:var(--muted)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence Test</div></div></div><div class="stage"><span>Baseline</span><span id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="screens"></div><section class="el8-card tester"><strong>Tester Notes</strong><p class="hint">Notice a bug, irrelevant or repeated question, confusing wording, or anything else? Tell us here. Please don't include identifying information.</p><textarea id="testerNote" placeholder="Optional note about this screen…"></textarea></section><p id="message" class="note" role="status"></p><div class="nav"><button id="back" class="el8-btn secondary">Back</button><button id="next" class="el8-btn">Continue</button></div></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{baselineDerivedOutputs}from'../app/onboarding/baseline-contract.js';import{buildBaselineDiscoveryHandoff}from'../app/onboarding/baseline-discovery-handoff.js';let session=loadTestSession();if(!session?.started_at){location.replace('./');throw Error('No active Intelligence Test')}const dims=['Physical','Emotional','Intellectual','Social','Spiritual','Occupational','Financial','Environmental'],R=session.baseline_answers||{};let page=Number(session.baseline_page||0);const pages=[{eyebrow:'Baseline · Starting point',title:'How is life feeling right now?',questions:dims.map(d=>({key:'dim_'+d,label:d,values:['Struggling','Needs attention','Okay','Going well','Very strong']}))},{eyebrow:'Baseline · Priorities',title:'Where is the pressure showing up?',questions:[{key:'impact',label:'Which area interferes most with daily life?',values:[...dims,'None']},{key:'worsening',label:'Which area has been getting harder recently?',values:[...dims,'None','Unsure']},{key:'priority',label:'Where would you most like EL8 to help first?',values:[...dims,'No preference','Unsure']}]},{eyebrow:'Baseline · Capacity',title:'What is realistic right now?',questions:[{key:'readiness',label:'How ready do you feel to make a change?',values:['Not ready','Somewhat ready','Ready','Very ready']},{key:'time',label:'How much time can you realistically give this most days?',values:['<5 min','5–15 min','15–30 min','>30 min','Varies']},{key:'load',label:'How manageable does life feel overall right now?',values:['Overwhelming','Difficult','Manageable','Comfortable','Very manageable']}]},{eyebrow:'Baseline · Context',title:'Anything EL8 should account for?',questions:[{key:'constraints',label:'What should EL8 keep in mind when suggesting actions?',values:['Accessibility','Privacy','Culture','Language','Cost','Time','Professional guidance','None','Prefer not to say'],multi:true},{key:'change',label:'Compared with a few weeks ago, life overall feels…',values:['Much harder','A little harder','About the same','A little better','Much better','Unsure']}]}];function qHtml(q){return `<div class="q"><strong>${q.label}</strong>${q.multi?'<span class="note"><em>Select all that apply.</em></span>':''}<div class="options" data-key="${q.key}" data-multi="${q.multi?'1':'0'}">${q.values.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div></div>`}screens.innerHTML=pages.map(p=>`<section class="screen"><div class="el8-eyebrow">${p.eyebrow}</div><h1>${p.title}</h1>${p.questions.map(qHtml).join('')}</section>`).join('');function syncSelections(){document.querySelectorAll('.options').forEach(g=>{const val=R[g.dataset.key];g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',Array.isArray(val)?val.includes(x.dataset.v):val===x.dataset.v))})}document.querySelectorAll('.options').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const key=g.dataset.key,prev=R[key];if(g.dataset.multi==='1'){const exclusive=['None','Prefer not to say'];let values=Array.isArray(R[key])?R[key]:[];if(exclusive.includes(b.dataset.v))values=[b.dataset.v];else{values=values.filter(v=>!exclusive.includes(v));values=values.includes(b.dataset.v)?values.filter(v=>v!==b.dataset.v):[...values,b.dataset.v]}R[key]=values}else R[key]=b.dataset.v;session.baseline_answers=R;saveTestSession(session);syncSelections();event(session,prev?'baseline_answer_changed':'baseline_answered','baseline',`baseline-${page+1}`,key,{key,value:R[key],page:page+1})});async function persistNote(){const text=testerNote.value.trim();if(!text)return;const ok=await note(session,{stage:'baseline',screenId:`baseline-${page+1}`,text});if(ok)testerNote.value=''}function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));bar.style.width=((page+1)/pages.length*100)+'%';counter.textContent=`${page+1} of ${pages.length}`;back.style.visibility=page?'visible':'hidden';next.textContent=page===pages.length-1?'Complete Baseline':'Continue';session.baseline_page=page;session.stage='baseline';saveTestSession(session);syncSelections();scrollTo(0,0);event(session,'baseline_page_view','baseline',`baseline-${page+1}`,null,{page:page+1,total:pages.length})}function valid(){return pages[page].questions.every(q=>q.multi?Array.isArray(R[q.key])&&R[q.key].length>0:Boolean(R[q.key]))}back.onclick=async()=>{if(page){await persistNote();await event(session,'baseline_back','baseline',`baseline-${page+1}`,null,{from:page+1});page--;show()}};next.onclick=async()=>{if(!valid()){message.textContent='Complete the questions on this screen to continue.';event(session,'baseline_validation_block','baseline',`baseline-${page+1}`);return}message.textContent='';await persistNote();if(page<pages.length-1){page++;show();return}next.disabled=true;const derived=baselineDerivedOutputs({...R,impact:R.impact?[R.impact]:[],worsening:R.worsening?[R.worsening]:[]});derived.feasibility={...derived.feasibility,overall_load:R.load};derived.constraints=R.constraints||[];derived.overall_change=R.change;const handoff=buildBaselineDiscoveryHandoff(derived);derived.discovery_handoff=handoff;session.baseline={module_id:'UNI-BASE-005',module_version:'0.5',responses:R,derived_outputs:derived};session.baseline_handoff=handoff;session.stage='discovery';delete session.baseline_page;saveTestSession(session);await event(session,'baseline_complete','baseline','baseline-4',null,{candidateDimensions:handoff.candidateDimensions,candidateConcernCount:handoff.candidateConcerns.length});location.href='discovery.html'};show();</script></body></html>
