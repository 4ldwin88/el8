<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test · Plan Deepening</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 80px}.q{margin:18px 0;padding-top:16px;border-top:1px solid var(--line)}.option{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid var(--gold)}textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.small,.qa-back{font-size:12px;color:var(--muted)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence Test</div></div></div><div class="el8-eyebrow">One decision-relevant layer</div><h1>EL8 needs a little more context.</h1><p>Only questions that can change which action is selected belong here.</p><section class="el8-card"><div id="questions"></div><p id="msg" class="small"></p><button id="continueBtn" class="el8-btn">Use these answers</button></section><a class="qa-back" href="../qa.html">Back to QA menu</a></main><script type="module">import{loadTestSession,saveTestSession,event}from'./intelligence-test.js';import{buildOnboardingAdaptivePlan}from'../app/onboarding/adaptive-plan.js';const s=loadTestSession();if(!s?.confirmed_priorities?.length){location.replace('priorities.html');throw Error('Priorities required')}const recommended=(s.recommended_priorities||[]).filter(x=>x.recommended).map(x=>x.concernId);let adaptive=s.adaptive_plan||buildOnboardingAdaptivePlan({discoveryOutput:s.discovery,recommendedPriorities:recommended,confirmedPriorities:s.confirmed_priorities,baselineHandoff:s.baseline_handoff||{},selectionEvidence:s.selection_evidence||{}});if(adaptive.status!=='deepen'){location.replace('plan.html');throw Error('Selection deepening not required')}const requirements=adaptive.selectionDeepening?.requirements||[],answers={...(s.selection_evidence||{})},host=document.getElementById('questions'),msg=document.getElementById('msg'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));host.innerHTML=requirements.map(r=>`<div class="q" data-key="${esc(r.evidenceKey)}"><strong>${esc(r.prompt)}</strong>${r.options?.length?r.options.map(o=>`<button type="button" class="option" data-v="${esc(o)}">${esc(o)}</button>`).join(''):`<textarea rows="3"></textarea>`}</div>`).join('');host.onclick=e=>{const b=e.target.closest('.option');if(!b)return;const q=b.closest('.q');answers[q.dataset.key]=b.dataset.v;q.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b))};continueBtn.onclick=async()=>{host.querySelectorAll('.q').forEach(q=>{const t=q.querySelector('textarea');if(t?.value.trim())answers[q.dataset.key]=t.value.trim()});if(requirements.some(r=>!answers[r.evidenceKey]))return msg.textContent='Answer each question to continue.';adaptive=buildOnboardingAdaptivePlan({discoveryOutput:s.discovery,recommendedPriorities:recommended,confirmedPriorities:s.confirmed_priorities,baselineHandoff:s.baseline_handoff||{},selectionEvidence:answers});s.selection_evidence=answers;s.adaptive_plan=adaptive;s.stage=adaptive.status==='active'?'plan':adaptive.status;saveTestSession(s);await event(s,'selection_deepening_complete','selection-deepening','selection-evidence',null,{resultStatus:adaptive.status,reason:adaptive.reason||null,selectedActionIds:(adaptive.active||[]).map(x=>x.id)});if(adaptive.status==='active')location.href='plan.html';else msg.textContent=`EL8 still cannot compose a plan: ${adaptive.reason||adaptive.status}.`};</script></body></html>
