<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Plan Deepening</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 80px}.q{margin:18px 0;padding-top:16px;border-top:1px solid var(--line)}.q:first-child{border-top:0;padding-top:0}.option{display:block;width:100%;text-align:left;margin:8px 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid var(--gold)}textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.small{font-size:12px;color:var(--muted)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Planning</div></div></div><div class="el8-eyebrow">One more layer</div><h1>EL8 needs a little more context.</h1><p>These questions are asked only because the answers can change which action EL8 recommends.</p><section class="el8-card"><div id="questions"></div><p id="msg" class="small"></p><button id="continueBtn" class="el8-btn">Use these answers</button></section></main><script type="module">import{loadTestSession,saveTestSession,event}from'./intelligence-test.js';import{buildCanonicalBrowserPlan}from'../app/onboarding/canonical-browser-plan.js';const s=loadTestSession();if(!s?.confirmed_priorities?.length||!s?.member_state){location.replace('priorities.html');throw Error('Priorities and Member State required')}let adaptive=s.adaptive_plan;if(adaptive?.status!=='deepen'){location.replace('plan.html');throw Error('Selection deepening not required')}const requirements=adaptive.selectionDeepening?.requirements||[],answers={...(s.selection_evidence||{})},host=document.getElementById('questions'),msg=document.getElementById('msg');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));host.innerHTML=requirements.map(r=>`<div class="q" data-key="${esc(r.evidenceKey)}"><strong>${esc(r.prompt)}</strong><p class="small">Asked because it can affect ${esc(r.purpose.replaceAll('_',' '))}.</p>${r.options?.length?r.options.map(o=>`<button type="button" class="option" data-v="${esc(o)}">${esc(o)}</button>`).join(''):`<textarea rows="3" placeholder="Your answer"></textarea>`}</div>`).join('');host.addEventListener('click',e=>{const b=e.target.closest('.option');if(!b)return;const q=b.closest('.q');answers[q.dataset.key]=b.dataset.v;q.querySelectorAll('.option').forEach(x=>x.classList.toggle('selected',x===b))});continueBtn.onclick=async()=>{host.querySelectorAll('.q').forEach(q=>{const t=q.querySelector('textarea');if(t?.value.trim())answers[q.dataset.key]=t.value.trim()});const missing=requirements.filter(r=>!answers[r.evidenceKey]);if(missing.length){msg.textContent='Answer each question to continue.';return}const built=buildCanonicalBrowserPlan({discoveryOutput:s.discovery,confirmedPriorities:s.confirmed_priorities,memberState:s.member_state,selectionEvidence:answers,activationEvidence:s.activation_evidence||{}});s.selection_evidence=answers;s.canonical_plan=built.plan;s.adaptive_plan={...built.plan,...built.view};s.stage=built.plan.status==='active'?'plan':built.plan.status;saveTestSession(s);await event(s,'selection_deepening_complete','selection-deepening','selection-evidence',null,{evidenceKeys:Object.keys(answers),resultStatus:built.plan.status,selectedActionIds:(built.plan.active||[]).map(x=>x.id)});if(built.plan.status==='active')location.href='plan.html';else{msg.textContent=`EL8 still cannot compose a plan: ${built.plan.reason||built.plan.status}.`;continueBtn.disabled=true}};event(s,'selection_deepening_view','selection-deepening','selection-evidence',null,{requirementCount:requirements.length,evidenceKeys:requirements.map(x=>x.evidenceKey)});</script></body></html>
