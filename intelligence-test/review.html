<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Accelerated Review</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:26px 18px 90px}.scenario{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.scenario.selected{outline:2px solid var(--gold)}.small{font-size:12px;color:var(--muted)}.tester textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.result{margin-top:18px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Accelerated Review</div></div></div><div class="el8-eyebrow">Compressed time, canonical logic</div><h1>Test the closed loop now.</h1><p>Choose what happened after the intervention. EL8 will run the same Review and Adaptation logic used by the canonical Intelligence loop without waiting for the real review date.</p><div id="scenarios"></div><section id="result" class="el8-card result" hidden></section><section class="el8-card tester"><strong>Tester Notes</strong><textarea id="testerNote" placeholder="Anything wrong with the review or adaptation decision?"></textarea></section><button id="run" class="el8-btn" style="margin-top:20px">Run accelerated review</button><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{CANONICAL_QA_SCENARIOS}from'../app/profile/canonical-qa-scenarios.js';import{runCanonicalBrowserScenario}from'../app/profile/canonical-qa-runner.js';let s=loadTestSession();if(!s?.member_state||s.member_state.activePlan?.status!=='ACTIVE'||!s?.canonical_plan){location.replace('plan.html');throw Error('Activated canonical plan required')}let selected=null;const pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());scenarios.innerHTML=CANONICAL_QA_SCENARIOS.map(x=>`<button class="scenario" type="button" data-id="${x.id}"><strong>${x.label}</strong><span class="small" style="display:block">Expected route: ${pretty(x.expected.route)}</span></button>`).join('');scenarios.onclick=e=>{const b=e.target.closest('.scenario');if(!b)return;selected=b.dataset.id;document.querySelectorAll('.scenario').forEach(x=>x.classList.toggle('selected',x===b));msg.textContent=''};run.onclick=async()=>{if(!selected){msg.textContent='Choose a review outcome.';return}run.disabled=true;try{if(testerNote.value.trim())await note(s,{stage:'review',screenId:'accelerated-canonical-review',text:testerNote.value});const out=runCanonicalBrowserScenario({id:selected,memberId:s.member_state.memberId,plan:s.canonical_plan,state:s.member_state});s.member_state=out.state;s.accelerated_review={scenario:selected,pass:out.pass,errors:out.errors,evidence:out.evidence,reviewDecision:out.reviewDecision,reviewReason:out.reviewReason,nextRoute:out.nextRoute,adaptationConstraint:out.adaptationConstraint,memberState:out.memberState};s.stage='completed';saveTestSession(s);await event(s,'accelerated_review_complete','review','accelerated-canonical-review',null,{scenario:selected,pass:out.pass,reviewDecision:out.reviewDecision,nextRoute:out.nextRoute,adaptationConstraint:out.adaptationConstraint,memberStateRevision:s.member_state.revision});result.hidden=false;result.innerHTML=`<div class="el8-eyebrow">Canonical result</div><h2>${pretty(out.reviewDecision)}</h2><p>Next route: <strong>${pretty(out.nextRoute)}</strong>${out.adaptationConstraint?` · Constraint: <strong>${pretty(out.adaptationConstraint)}</strong>`:''}</p><p class="small">Member State revision ${s.member_state.revision} · ${out.pass?'Scenario matched the canonical expectation.':'Regression detected: '+out.errors.join('; ')}</p>`;run.textContent='Continue to results';run.disabled=false;run.onclick=()=>location.href='complete.html'}catch(e){run.disabled=false;msg.textContent='Review failed: '+String(e?.message||e)}};event(s,'accelerated_review_view','review','accelerated-canonical-review',null,{scenarioCount:CANONICAL_QA_SCENARIOS.length,memberStateRevision:s.member_state.revision});</script></body></html>
