<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Outcome & Review</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:26px 18px 90px}.scenario{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.scenario.selected{outline:2px solid var(--gold)}.small{font-size:12px;color:var(--muted)}.tester textarea{width:100%;box-sizing:border-box}.result{margin-top:18px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Outcome & Review</div></div></div><div class="el8-eyebrow">Action → Evidence → Outcome → Review → Learn</div><h1>Record what happened, then test the loop.</h1><p>Review consumes canonical Outcome evidence. Its evidence-backed result is then persisted as durable Member State learning.</p><div id="scenarios"></div><section id="result" class="el8-card result" hidden></section><section class="el8-card tester"><strong>Tester Notes</strong><textarea id="testerNote"></textarea></section><button id="run" class="el8-btn" style="margin-top:20px">Record outcome & run review</button><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{resultPayload}from'../app/research/intelligence-test-contract.js';import{complete}from'./submit.js';import{CANONICAL_QA_SCENARIOS}from'../app/profile/canonical-qa-scenarios.js';import{createCanonicalQaOutcome}from'../app/profile/canonical-qa-outcome.js';import{runCanonicalBrowserScenario}from'../app/profile/canonical-qa-runner.js';import{recordReviewLearning}from'../intelligence/learning/browser-learning.js';let s=loadTestSession();if(!s?.member_state||s.member_state.activePlan?.status!=='ACTIVE'||!s?.canonical_plan){location.replace('plan.html');throw Error('Activated canonical plan required')}let selected=null;const pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());scenarios.innerHTML=CANONICAL_QA_SCENARIOS.map(x=>`<button class="scenario" type="button" data-id="${x.id}"><strong>${x.label}</strong><span class="small" style="display:block">Expected route: ${pretty(x.expected.route)}</span></button>`).join('');scenarios.onclick=e=>{const b=e.target.closest('.scenario');if(!b)return;selected=b.dataset.id;document.querySelectorAll('.scenario').forEach(x=>x.classList.toggle('selected',x===b));msg.textContent=''};run.onclick=async()=>{if(!selected){msg.textContent='Choose an outcome.';return}run.disabled=true;try{if(testerNote.value.trim())await note(s,{stage:'review',screenId:'outcome-review',text:testerNote.value});const canonicalEvidence=createCanonicalQaOutcome({scenarioId:selected,state:s.member_state});s.outcome_evidence=canonicalEvidence;await event(s,'outcome_evidence_recorded','outcome','canonical-outcome',null,{scenario:selected,outcomeId:canonicalEvidence.outcome.outcomeId,evidenceRefs:canonicalEvidence.outcome.evidenceRefs});const out=runCanonicalBrowserScenario({id:selected,memberId:s.member_state.memberId,plan:s.canonical_plan,state:s.member_state,outcomeEvidence:canonicalEvidence});s.member_state=recordReviewLearning(out.state,{outcomeEvidence:canonicalEvidence,review:{decision:out.reviewDecision,reason:out.reviewReason}});s.accelerated_review={scenario:selected,pass:out.pass,errors:out.errors,outcome:canonicalEvidence.outcome,evidenceUsed:out.evidence,reviewDecision:out.reviewDecision,reviewReason:out.reviewReason,nextRoute:out.nextRoute,adaptationConstraint:out.adaptationConstraint,learning:s.member_state.learning.at(-1),memberStateRevision:s.member_state.revision};s.stage='completed';saveTestSession(s);await event(s,'learning_recorded','learning','accelerated-learning',null,{learningId:s.member_state.learning.at(-1)?.id,evidenceRefs:canonicalEvidence.outcome.evidenceRefs,reviewDecision:out.reviewDecision,memberStateRevision:s.member_state.revision});await event(s,'accelerated_review_complete','review','accelerated-canonical-review',null,{scenario:selected,pass:out.pass,reviewDecision:out.reviewDecision,nextRoute:out.nextRoute,memberStateRevision:s.member_state.revision});const submitted=await complete(resultPayload(s));s.telemetry={submitted,attempted_at:new Date().toISOString()};saveTestSession(s);result.hidden=false;result.innerHTML=`<div class="el8-eyebrow">Canonical result</div><h2>${pretty(out.reviewDecision)}</h2><p>Outcome: <strong>${pretty(canonicalEvidence.outcome.benefitDirection)}</strong> · Next route: <strong>${pretty(out.nextRoute)}</strong></p><p class="small">Observation → Evidence → Outcome → Review → Learning. Member State revision ${s.member_state.revision}. ${out.pass?'Scenario matched expectation.':'Regression: '+out.errors.join('; ')}</p>`;run.textContent='Continue to results';run.disabled=false;run.onclick=()=>location.href='complete.html'}catch(e){run.disabled=false;msg.textContent='Review failed: '+String(e?.message||e)}};event(s,'accelerated_review_view','review','outcome-review',null,{scenarioCount:CANONICAL_QA_SCENARIOS.length,evidenceAssignmentCount:s.member_state.activePlan.evidenceAssignments?.length||0});</script></body></html>
