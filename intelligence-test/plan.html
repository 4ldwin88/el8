<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:54px 18px 90px}.group{margin:14px 0}.action{cursor:pointer}.action.selected{outline:2px solid var(--ink)}.small{font-size:12px;color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.choices{display:grid;gap:8px;margin-top:14px}.choice{width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}.why{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit}.scale{display:flex;gap:6px;flex-wrap:wrap}.scale button{padding:9px 11px}.scale button.selected{outline:2px solid var(--ink)}textarea{width:100%;min-height:80px;box-sizing:border-box}.status-card{border-left:4px solid var(--gold)}.evidence-dialog{max-width:560px;width:calc(100% - 36px);border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:22px}.evidence-dialog::backdrop{background:rgba(0,0,0,.45)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="el8-eyebrow">Your starting plan</div><h1>Here’s a manageable place to begin.</h1><p>EL8 recommends only Actions supported by your Focus and available evidence.</p><div id="plan"></div><div class="row"><button id="changeFocus" class="el8-btn">Change focus</button></div><section id="surveyCard" class="el8-card"><h2>Before you finish</h2><div id="core"></div></section><section style="margin:20px 0"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" placeholder="Optional: note anything wrong with the proposed Actions, reasoning, or experience…"></textarea></section><button id="submit" class="el8-btn">Finish</button><p id="msg" class="small"></p></main><dialog id="evidenceDialog" class="evidence-dialog"><div id="evidenceBody"></div><button id="closeEvidence" type="button" class="el8-btn">Close</button></dialog><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';import{canonicalBrowserPlanView}from'../app/onboarding/browser-planning-adapter.js';import{buildPlan}from'../intelligence/planning/planningEngine.js';import{resultPayload}from'../app/research/intelligence-test-contract.js';import{complete}from'./submit.js';installQaChrome({stage:'plan',screenId:'canonical-plan-selection',backHref:'priorities.html'});let s=loadTestSession();if(!s){location.replace('index.html');throw Error('Test session required')}const $=id=>document.getElementById(id),pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view=canonicalBrowserPlanView(s.canonical_plan??{}),actions=view.actions||[],selected=new Set(s.selected_action_ids||actions.slice(0,3).map(x=>x.actionId||x.id));function rebuildPlan(requirement,value){const input=s.planning_input;if(!input)throw Error('Canonical Planning input is missing');const prior=input.planningContext??{},goalIntents={...(prior.goalIntents??{})};const focusId=String(requirement.requirementId||'').replace(/^goal:/,'');goalIntents[focusId]=value;const nextInput={...input,planningContext:{...prior,goalIntents}};const nextPlan=buildPlan(nextInput);s.planning_input=nextInput;s.canonical_plan=nextPlan;s.planning_deepening_answers={...(s.planning_deepening_answers||{}),[requirement.requirementId]:value};s.selected_action_ids=[];saveTestSession(s);view=canonicalBrowserPlanView(nextPlan);actions=view.actions||[];selected=new Set(actions.slice(0,3).map(x=>x.actionId||x.id));s.selected_action_ids=[...selected];saveTestSession(s);return nextPlan}async function answerDeepening(requirement,value){try{await event(s,'planning_deepening_answered','plan','canonical-plan-selection',null,{requirementId:requirement.requirementId,purpose:requirement.purpose,value});const nextPlan=rebuildPlan(requirement,value);await event(s,'planning_rebuilt_after_deepening','plan','canonical-plan-selection',null,{requirementId:requirement.requirementId,planStatus:nextPlan.status,planReason:nextPlan.reason,actionIds:(nextPlan.proposedActions||[]).map(x=>x.actionId)});render()}catch(error){$('msg').textContent='Planning could not apply that answer. Your progress is saved.';await event(s,'planning_deepening_error','plan','canonical-plan-selection',null,{requirementId:requirement.requirementId,message:String(error?.message||error).slice(0,300)})}}function disposition(){if(!s.confirmed_focus?.length)return'<section class="el8-card"><h2>No Plan is needed from this assessment.</h2></section>';if(view.status==='deepen'){const req=view.deepeningRequirements?.[0];if(req?.options?.length)return `<section class="el8-card status-card"><div class="el8-eyebrow">One more thing</div><h2>${esc(req.prompt||'A little more information is needed.')}</h2><div class="choices">${req.options.map(v=>`<button type="button" class="choice" data-deepen="${esc(v)}">${esc(v)}</button>`).join('')}</div><p class="small">Your answer is used by Planning to rebuild the recommendation.</p></section>`;return `<section class="el8-card status-card"><h2>A little more information is needed first.</h2><p>${esc(req?.prompt||'EL8 needs decision-critical evidence before it can recommend the right Action.')}</p><p class="small">This Planning requirement does not yet have a supported QA interaction.</p></section>`}if(view.status==='professional_route')return'<section class="el8-card status-card"><h2>This Focus needs a different route.</h2><p>EL8 does not have an appropriate autonomous Action for this Focus. The governed path is professional or external support.</p></section>';if(view.status==='coverage_gap')return'<section class="el8-card status-card"><h2>Planning coverage gap detected.</h2><p>This Focus is supported, but the Action library cannot currently produce a governed recommendation. This remains a QA defect.</p></section>';return'<section class="el8-card"><h2>No autonomous Action is appropriate right now.</h2></section>'}function render(){actions=view.actions||[];$('plan').innerHTML=actions.length?actions.map((a,i)=>{const id=a.actionId||a.id;return `<section class="el8-card group action ${selected.has(id)?'selected':''}" data-id="${esc(id)}"><div class="el8-eyebrow">${i?'Also recommended':'Recommended starting point'}</div><h2>${esc(a.title||pretty(id))}</h2>${a.rationale?`<p>${esc(a.rationale)}</p>`:''}<button type="button" class="why" data-evidence="${esc(id)}">Why this?</button><p class="small">Tap the card to ${selected.has(id)?'remove':'add'}.</p></section>`}).join(''):disposition();document.querySelectorAll('[data-deepen]').forEach(b=>b.onclick=()=>answerDeepening(view.deepeningRequirements[0],b.dataset.deepen));document.querySelectorAll('.action').forEach(x=>x.onclick=e=>{if(e.target.closest('.why'))return;const id=x.dataset.id,was=selected.has(id);was?selected.delete(id):selected.add(id);s.selected_action_ids=[...selected];saveTestSession(s);event(s,was?'plan_action_removed':'plan_action_selected','plan','canonical-plan-selection',null,{actionId:id,selectedCount:selected.size});render()});document.querySelectorAll('.why').forEach(b=>b.onclick=e=>{e.stopPropagation();openEvidence(actions.find(a=>(a.actionId||a.id)===b.dataset.evidence))});$('submit').hidden=view.status==='deepen';$('surveyCard').hidden=view.status==='deepen'}function openEvidence(a){if(!a)return;const basis=a.evidenceBasis||{},focus=(basis.supportingFocusIds||a.focusIds||[]).map(pretty),drivers=(basis.driverConstructIds||[]).map(pretty),refs=basis.evidenceRefs||[],sources=basis.sourceIds||a.evidenceSourceIds||[];$('evidenceBody').innerHTML=`<div class="el8-eyebrow">Evidence</div><h2>${esc(a.title||pretty(a.actionId))}</h2><h3>What EL8 observed</h3><p>${focus.length?`Your confirmed focus includes ${esc(focus.join(', '))}.`:'This recommendation uses your confirmed Focus.'}${drivers.length?` EL8 also has supporting evidence related to ${esc(drivers.join(', '))}.`:''}</p><h3>Why this Action</h3><p>${esc(basis.rationale||a.permittedRationaleClaim||a.rationale||'The Action matched the governed Planning criteria for your current Focus and evidence.')}</p><h3>Evidence strength</h3><p>${esc(pretty(basis.evidenceStrength||'unknown'))}${basis.confidenceBand?` · recommendation confidence: ${esc(pretty(basis.confidenceBand))}`:''}</p><details><summary>QA provenance</summary><p class="small">Evidence refs: ${esc(refs.join(', ')||'none')}<br>Source IDs: ${esc(sources.join(', ')||'none')}<br>Driver constructs: ${esc((basis.driverConstructIds||[]).join(', ')||'none')}</p></details>`;$('evidenceDialog').showModal();event(s,'plan_evidence_opened','plan','canonical-plan-selection',null,{actionId:a.actionId,evidenceRefCount:refs.length,sourceCount:sources.length,driverConstructIds:basis.driverConstructIds||[]})}$('closeEvidence').onclick=()=>$('evidenceDialog').close();render();$('changeFocus').onclick=async()=>{await event(s,'plan_change_focus','plan','canonical-plan-selection',null,{selectedActionIds:[...selected]});s.stage='focus';saveTestSession(s);location.href='priorities.html'};const qs=[['understood','How well did EL8 understand what matters to you?',['1','2','3','4','5']],['useful','How useful does this proposed result feel?',['1','2','3','4','5']],['burden','Did the process feel too long or burdensome?',['Not at all','A little','Somewhat','Very']],['intent','Would you consider using EL8 based on this experience?',['Definitely not','Probably not','Maybe','Probably','Definitely']]];$('core').innerHTML=qs.map(([k,t,vals])=>`<div><strong>${t}</strong><div class="scale" data-k="${k}">${vals.map(v=>`<button type="button" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div></div>`).join('');const survey={...(s.survey||{})};document.querySelectorAll('.scale').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;survey[g.dataset.k]=b.dataset.v;[...g.children].forEach(x=>x.classList.toggle('selected',x===b));event(s,'qa_rating_selected','plan','canonical-plan-selection',null,{metric:g.dataset.k,value:b.dataset.v})});$('submit').onclick=async()=>{if(view.status==='coverage_gap'){ $('msg').textContent='This test cannot finish as a successful Plan while a coverage defect is open.';return}if(actions.length&&!selected.size){$('msg').textContent='Choose an Action, or change your Focus.';return}$('submit').disabled=true;s.survey=survey;s.selected_action_ids=[...selected];saveTestSession(s);if($('testerNote').value.trim())await note(s,{stage:'plan',screenId:'canonical-plan-selection',text:$('testerNote').value});await event(s,'plan_review_complete','plan','canonical-plan-selection',null,{selectedActionIds:[...selected],planStatus:view.status,survey});const ok=await complete(resultPayload(s),s);if(ok){s.stage='completed';saveTestSession(s);location.href='complete.html'}else{$('submit').disabled=false;$('msg').textContent='We could not save this test yet. Your progress remains saved.'}};event(s,'plan_view','plan','canonical-plan-selection',null,{actionCount:actions.length,actionIds:actions.map(x=>x.actionId||x.id),planStatus:view.status,planReason:view.reason,focusIds:(s.confirmed_focus||[]).map(x=>x.constructId),focusResolutions:view.focusResolutions});</script></body></html>
