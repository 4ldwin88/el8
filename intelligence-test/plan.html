<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test · Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:26px 18px 90px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.group{margin:14px 0}.group h2{font-size:16px;margin:4px 0 8px}.action{cursor:pointer}.action.selected{outline:2px solid var(--gold)}.small{font-size:12px;color:var(--muted)}.tester textarea,textarea,select{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.q{margin:18px 0}.scale{display:flex;gap:6px;flex-wrap:wrap}.scale button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px}.scale button.selected{background:var(--ink);color:var(--bg)}.row{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence Test</div></div></div><div class="stage"><span></span><span></span><span></span><span></span></div><div class="labels"><span>Discovery</span><span>Prioritize</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Planning</div><h1>Choose the actions that fit.</h1><p>EL8 recommends Actions from your confirmed Focus and available evidence. You remain in control of what goes into the Plan.</p><div id="plan"></div><div class="row"><button id="changeFocus" class="el8-btn" type="button">Change focus</button></div><section class="el8-card"><h2>How well did EL8 do?</h2><div id="core"></div></section><section class="el8-card tester"><strong>Tester Notes</strong><textarea id="testerNote" placeholder="Anything wrong with the proposed actions or reasoning?"></textarea></section><button id="submit" class="el8-btn" style="margin-top:20px">Submit Test</button><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{canonicalBrowserPlanView}from'../app/onboarding/browser-planning-adapter.js';import{resultPayload}from'../app/research/intelligence-test-contract.js';import{complete}from'./submit.js';let s=loadTestSession();if(!s?.confirmed_focus?.length){location.replace('priorities.html');throw Error('Confirmed Focus required')}if(!s?.canonical_plan){location.replace('priorities.html');throw Error('Canonical Plan required')}const view=canonicalBrowserPlanView(s.canonical_plan),actions=view.actions||[],selected=new Set(s.selected_action_ids||actions.slice(0,Math.min(3,actions.length)).map(x=>x.actionId||x.id));const pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());const track=a=>a.trackingRequirement?.label||a.trackingRequirement?.description||a.measurement||'Review the agreed outcome evidence at the Action review point.';const assess=a=>a.additionalAssessmentRequirement?.label||a.additionalAssessmentRequirement?.description||null;function render(){plan.innerHTML=actions.map((a,i)=>{const id=a.actionId||a.id;return `<section class="el8-card group action ${selected.has(id)?'selected':''}" data-id="${id}"><div class="el8-eyebrow">${i===0?'Highly recommended':'Recommended'}</div><h2>${a.title||pretty(id)}</h2>${a.rationale?`<p>${a.rationale}</p>`:''}<p><strong>Track:</strong> ${track(a)}</p>${assess(a)?`<p><strong>More information needed:</strong> ${assess(a)}</p>`:''}<p class="small">Tap to ${selected.has(id)?'remove from':'add to'} your Plan.</p></section>`}).join('')||'<section class="el8-card"><p>EL8 needs more information before recommending an Action.</p></section>';document.querySelectorAll('.action').forEach(x=>x.onclick=()=>{const id=x.dataset.id;selected.has(id)?selected.delete(id):selected.add(id);s.selected_action_ids=[...selected];saveTestSession(s);render()})}render();changeFocus.onclick=()=>{s.stage='focus';saveTestSession(s);location.href='priorities.html'};const qs=[['understood','How well did EL8 understand what matters to you?',['1','2','3','4','5']],['useful','How useful does this proposed plan feel?',['1','2','3','4','5']],['burden','Did the process feel too long or burdensome?',['Not at all','A little','Somewhat','Very']],['intent','Would you consider using EL8 based on this experience?',['Definitely not','Probably not','Maybe','Probably','Definitely']]];core.innerHTML=qs.map(([k,t,vals])=>`<div class="q"><strong>${t}</strong><div class="scale" data-k="${k}">${vals.map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('');const survey={...(s.survey||{})};document.querySelectorAll('.scale').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;survey[g.dataset.k]=b.dataset.v;[...g.children].forEach(x=>x.classList.toggle('selected',x===b))});submit.onclick=async()=>{if(actions.length&&!selected.size){msg.textContent='Choose at least one Action, or change your Focus.';return}submit.disabled=true;s.survey=survey;s.selected_action_ids=[...selected];s.proposed_plan={canonical:true,focus:s.confirmed_focus,selectedActionIds:[...selected],planStatus:view.status};saveTestSession(s);if(testerNote.value.trim())await note(s,{stage:'plan',screenId:'canonical-plan-selection',text:testerNote.value});await event(s,'plan_review_complete','plan','canonical-plan-selection',null,{selectedActionIds:[...selected],planStatus:view.status});const ok=await complete(resultPayload(s));if(ok){s.stage='completed';saveTestSession(s);location.href='complete.html'}else{submit.disabled=false;msg.textContent='Submission failed. Your test remains saved in this browser.'}};event(s,'plan_view','plan','canonical-plan-selection',null,{actionCount:actions.length,actionIds:actions.map(x=>x.actionId||x.id)});</script></body></html>
