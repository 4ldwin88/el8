<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test · Proposed Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:26px 18px 90px}.stage{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(5,1fr);font-size:9px;color:var(--muted);text-align:center}.group{margin:18px 0}.action{padding:14px 0;border-top:1px solid var(--line)}.action:first-of-type{border-top:0}.small{font-size:12px;color:var(--muted)}.tester textarea,textarea,select{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.q{margin:18px 0}.scale{display:flex;gap:6px;flex-wrap:wrap}.scale button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 11px}.scale button.selected{background:var(--ink);color:var(--bg)}.optional{margin-top:22px}.optional summary{font-weight:800;cursor:pointer}.final-intro{border-left:3px solid var(--gold);padding-left:13px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence Test</div></div></div><div class="stage"><span></span><span></span><span></span><span></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Priorities</span><span>Deepen</span><span>Plan</span></div><div class="final-intro"><div class="el8-eyebrow">Final step · Review & submit</div><h1>Here's what EL8 would suggest.</h1><p>Review the proposed plan and tell us how well the reasoning fits. You are not activating this plan.</p></div><div id="plan"></div><section class="el8-card"><h2>How well did EL8 do?</h2><div id="core"></div><details class="optional"><summary>Help shape EL8 (optional)</summary><div class="q"><label>Would you trust EL8 enough to try following this plan?</label><select data-k="trust"><option value="">Choose…</option><option>No</option><option>Maybe</option><option>Yes</option><option>Not sure</option></select></div><div class="q"><label>What did EL8 get wrong or miss?</label><textarea data-k="liked_least"></textarea></div><div class="q"><label>Additional comments</label><textarea data-k="comments"></textarea></div></details></section><section class="el8-card tester"><strong>Tester Notes</strong><textarea id="testerNote" placeholder="Anything wrong with the proposed plan?"></textarea></section><button id="submit" class="el8-btn" style="margin-top:20px">Submit Test</button><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{resultPayload}from'../app/research/intelligence-test-contract.js';import{complete}from'./submit.js';let s=loadTestSession(),adaptive=s.adaptive_plan;if(!s?.confirmed_priorities?.length){location.replace('priorities.html');throw Error('Priorities required')}if(!adaptive||adaptive.status!=='active'){location.replace(adaptive?.status==='deepen'?'selection-deepening.html':'priorities.html');throw Error('Active canonical plan required')}if(adaptive.activationStatus==='needs_plan_specific_assessment'){location.replace('activation-deepening.html');throw Error('Activation evidence required')}const actions=adaptive.active||[],pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());plan.innerHTML=actions.map(a=>`<section class="el8-card group"><div class="el8-eyebrow">${pretty(a.dimension||'Wellness')}</div><h2>${a.title||pretty(a.id)}</h2>${a.rationale?`<p>${a.rationale}</p>`:''}${a.measurement?`<p><strong>How we'll know:</strong> ${a.measurement}</p>`:''}<p class="small">Why this is here: ${pretty(a.driver||'confirmed priority')}${a.reviewDays?` · Review in ${a.reviewDays} days`:''}</p></section>`).join('')||'<section class="el8-card"><p>No active actions were produced.</p></section>';s.proposed_plan={confirmedPriorities:s.confirmed_priorities,candidateActions:actions,canonical:true,activationStatus:adaptive.activationStatus};saveTestSession(s);const qs=[['understood','How well did EL8 understand what matters to you?',['1','2','3','4','5']],['useful','How useful does this proposed plan feel?',['1','2','3','4','5']],['burden','Did the process feel too long or burdensome?',['Not at all','A little','Somewhat','Very']],['intent','Would you consider using EL8 based on this experience?',['Definitely not','Probably not','Maybe','Probably','Definitely']]];core.innerHTML=qs.map(([k,t,vals])=>`<div class="q"><strong>${t}</strong><div class="scale" data-k="${k}">${vals.map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('');const survey={...(s.survey||{})};document.querySelectorAll('.scale').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;survey[g.dataset.k]=b.dataset.v;[...g.children].forEach(x=>x.classList.toggle('selected',x===b))});document.querySelectorAll('[data-k]:not(.scale)').forEach(x=>x.onchange=()=>survey[x.dataset.k]=x.value);submit.onclick=async()=>{submit.disabled=true;submit.textContent='Submitting…';s.survey=survey;saveTestSession(s);if(testerNote.value.trim())await note(s,{stage:'plan',screenId:'canonical-proposed-plan',text:testerNote.value});await event(s,'plan_review_complete','plan','canonical-proposed-plan',null,{actionCount:actions.length,actionIds:actions.map(x=>x.id),activationStatus:adaptive.activationStatus});const ok=await complete(resultPayload(s));if(ok){s.stage='completed';saveTestSession(s);location.href='complete.html'}else{submit.disabled=false;submit.textContent='Submit Test';msg.textContent='Submission failed. Your test remains saved in this browser.'}};event(s,'plan_view','plan','canonical-proposed-plan',null,{actionCount:actions.length,actionIds:actions.map(x=>x.id)});</script></body></html>
