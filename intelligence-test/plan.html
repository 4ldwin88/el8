<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:22px 18px 80px}.group{margin:7px 0;padding:11px 12px;cursor:pointer;border:1px solid var(--line)}.group.selected{outline:2px solid var(--ink)}.group.recommended{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}.small{font-size:11px;color:var(--muted)}.tester textarea{width:100%;box-sizing:border-box;min-height:80px}.final-intro{border-left:3px solid var(--gold);padding-left:12px}.final-intro h1{margin-bottom:6px}.final-intro p{font-size:13px;margin-top:0}.plan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.plan-actions button{padding:11px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.rec-label{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}.detail{padding-top:5px;border-top:1px solid var(--line);margin-top:6px;font-size:12px;line-height:1.35}.detail p{margin:3px 0}.check{float:right;font-size:11px;font-weight:700}.group h2{font-size:16px;margin:1px 0 4px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Plan</div></div></div><div class="final-intro"><div class="el8-eyebrow">Your proposed plan</div><h1>Choose the actions that fit.</h1><p>Recommended actions are highlighted in gold. Select or unselect alternatives, then accept the action set that fits you.</p></div><div id="plan"></div><div class="plan-actions"><button id="acceptPlan" type="button">Accept plan</button><button id="changeFocus" type="button">Change focus</button></div><section class="el8-card tester" style="margin-top:18px"><strong>Tester Notes</strong><p class="small">Flag anything that feels generic, unrealistic, unsupported, repetitive, or missing.</p><textarea id="testerNote"></textarea></section><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note,installExitTest}from'./intelligence-test.js';import{activateCanonicalBrowserPlan,selectCanonicalBrowserPlanActions}from'../app/onboarding/canonical-browser-plan.js';let s=loadTestSession(),canonical=s?.canonical_plan;const $=id=>document.getElementById(id),plan=$('plan'),acceptPlan=$('acceptPlan'),changeFocus=$('changeFocus'),testerNote=$('testerNote'),msg=$('msg');if(!s?.confirmed_priorities?.length||!s?.member_state){location.replace('priorities.html');throw Error('Canonical priorities and Member State required')}if(!canonical||canonical.status!=='active'){location.replace(canonical?.status==='deepen'?'selection-deepening.html':'priorities.html');throw Error('Active canonical plan required')}installExitTest({session:s,stage:'plan',screenId:'canonical-plan-selection'});const pretty=x=>String(x||'').replace(/^problem:/,'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),idOf=a=>a.intervention_id||a.id,recommended=new Set((canonical.active||[]).map(idOf)),candidates=[...(canonical.active||[]),...(canonical.backlog||[])],maxSelected=Math.max(1,(canonical.active||[]).length),selected=new Set((s.selected_plan_actions||[]).filter(id=>candidates.some(a=>idOf(a)===id)));if(!selected.size)for(const id of recommended)selected.add(id);function focusName(a){return({'problem:financial_strain':'money','problem:income_gap':'work and income','problem:low_activity':'physical activity','problem:poor_sleep':'sleep','problem:execution_gap':'follow-through','problem:stress':'stress','problem:social_disconnection':'connection','problem:environment_friction':'environment'})[a.problemId]||pretty(a.problemId).toLowerCase()}function plainTemplate(t){return String(t||'').replace(/\bN\b/g,'a chosen number of').replace('member-approved','realistic').replace('member-selected','selected')}function humanize(v){return String(v||'').replaceAll('_',' ').replaceAll('/',' or ')}function trackingText(m={}){const adherence=humanize(m.adherence);const outcome=humanize(m.outcome);if(adherence&&outcome)return`${adherence}; EL8 uses this to check ${outcome}`;if(adherence)return adherence;if(outcome)return`Record enough to check ${outcome}`;return'Record completion and the result needed for the next review'}function duration(a){return a.reviewRule?.window||'Review as soon as there is enough information to decide the next step.'}function render(){plan.innerHTML=candidates.map(a=>{const id=idOf(a),templates=(a.actionTemplates||[]).map(plainTemplate),measurement=a.measurement||{},isRec=recommended.has(id);return`<section class="el8-card group ${selected.has(id)?'selected':''} ${isRec?'recommended':''}" data-id="${id}" role="checkbox" aria-checked="${selected.has(id)}" tabindex="0"><span class="check">${selected.has(id)?'✓ Selected':'Select'}</span>${isRec?'<div class="rec-label">EL8 recommended</div>':''}<h2>${a.title||pretty(id)}</h2><p class="small">For your ${focusName(a)} focus.</p><div class="detail">${templates.length?`<p><strong>Action:</strong> ${templates.join(' Or ')}</p>`:''}<p><strong>Track:</strong> ${trackingText(measurement)}.</p><p><strong>Review:</strong> ${duration(a)}</p>${a.deepeningRequirements?.length?'<p><strong>Setup:</strong> After you select this action, EL8 may ask a short follow-up if it changes how the action should be configured.</p>':''}</div></section>`}).join('')||'<section class="el8-card"><p>No eligible actions were produced.</p></section>';msg.textContent=selected.size?`${selected.size} action${selected.size===1?'':'s'} selected · maximum ${maxSelected}.`:'Select at least one action.'}function toggle(id){if(selected.has(id))selected.delete(id);else if(selected.size<maxSelected)selected.add(id);else{msg.textContent=`This plan can activate up to ${maxSelected} action${maxSelected===1?'':'s'} at once. Unselect one first.`;return}s.selected_plan_actions=[...selected];saveTestSession(s);event(s,'plan_action_toggled','plan','canonical-plan-selection',null,{actionId:id,selected:selected.has(id),selectedInterventionIds:[...selected],recommended:recommended.has(id)});render()}plan.onclick=e=>{const card=e.target.closest('[data-id]');if(card)toggle(card.dataset.id)};plan.onkeydown=e=>{if(!['Enter',' '].includes(e.key))return;const card=e.target.closest('[data-id]');if(card){e.preventDefault();toggle(card.dataset.id)}};async function saveNote(){if(testerNote.value.trim())await note(s,{stage:'plan',screenId:'canonical-plan-selection',text:testerNote.value})}acceptPlan.onclick=async()=>{if(!selected.size){msg.textContent='Select at least one action.';return}acceptPlan.disabled=true;changeFocus.disabled=true;try{await saveNote();const chosen=selectCanonicalBrowserPlanActions({plan:canonical,selectedInterventionIds:[...selected],activationEvidence:s.activation_evidence||{}});s.canonical_plan=chosen;s.adaptive_plan={...(s.adaptive_plan||{}),...chosen};s.selected_plan_actions=[...selected];saveTestSession(s);if(chosen.activationStatus==='needs_plan_specific_assessment'){s.stage='activation-deepening';saveTestSession(s);await event(s,'plan_actions_confirmed','plan','canonical-plan-selection',null,{selectedInterventionIds:[...selected],nextStage:'activation-deepening'});location.href='activation-deepening.html';return}const activation=activateCanonicalBrowserPlan({plan:chosen,memberState:s.member_state,acceptedInterventionIds:[...selected]});s.action_decisions=Object.fromEntries([...selected].map(id=>[id,{status:'ACCEPTED'}]));s.canonical_plan=activation.plan;s.adaptive_plan={...(s.adaptive_plan||{}),...activation.plan};s.member_state=activation.memberState;s.stage='review';saveTestSession(s);await event(s,'canonical_plan_activated','plan','canonical-plan-selection',null,{acceptedInterventionIds:[...selected],memberStateRevision:s.member_state.revision,planningRevision:s.canonical_plan.memberStateRevision});location.href='review.html'}catch(e){acceptPlan.disabled=false;changeFocus.disabled=false;msg.textContent='Could not activate plan: '+String(e?.message||e)}};changeFocus.onclick=async()=>{await saveNote();s.stage='priorities';saveTestSession(s);await event(s,'plan_change_focus','plan','canonical-plan-selection',null,{selectedInterventionIds:[...selected],confirmedPriorities:s.confirmed_priorities});location.href='priorities.html'};render();event(s,'plan_view','plan','canonical-plan-selection',null,{candidateCount:candidates.length,recommendedInterventionIds:[...recommended],selectedInterventionIds:[...selected],planningRevision:canonical.memberStateRevision,qaMode:'accelerated_internal'});</script></body></html>
