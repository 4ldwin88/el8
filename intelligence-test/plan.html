<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:26px 18px 90px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.group{margin:18px 0}.small{font-size:12px;color:var(--muted)}.tester textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.final-intro{border-left:3px solid var(--gold);padding-left:13px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Plan</div></div></div><div class="stage"><span></span><span></span><span></span><span></span></div><div class="labels"><span>Discovery</span><span>Priorities</span><span>Plan</span><span>Review</span></div><div class="final-intro"><div class="el8-eyebrow">Canonical Planning</div><h1>Here's what EL8 would suggest.</h1><p>Review the plan, then activate it to continue the accelerated closed-loop QA. No waiting period is required.</p></div><div id="plan"></div><section class="el8-card tester"><strong>Tester Notes</strong><textarea id="testerNote" placeholder="Anything wrong with the proposed plan?"></textarea></section><button id="activate" class="el8-btn" style="margin-top:20px">Activate plan & test review loop</button><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{applyCanonicalBrowserPlan}from'../app/onboarding/browser-member-state-plan.js';let s=loadTestSession(),canonical=s?.canonical_plan,adaptive=s?.adaptive_plan;if(!s?.confirmed_priorities?.length||!s?.member_state){location.replace('priorities.html');throw Error('Canonical priorities and Member State required')}if(!canonical||canonical.status!=='active'){location.replace(canonical?.status==='deepen'?'selection-deepening.html':'priorities.html');throw Error('Active canonical plan required')}if(canonical.activationStatus==='needs_plan_specific_assessment'){location.replace('activation-deepening.html');throw Error('Activation evidence required')}const actions=canonical.active||[],pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());plan.innerHTML=actions.map(a=>`<section class="el8-card group"><div class="el8-eyebrow">${pretty(a.dimension||'Wellness')}</div><h2>${a.title||pretty(a.id)}</h2>${a.rationale?`<p>${a.rationale}</p>`:''}${a.measurement?`<p><strong>How we'll know:</strong> ${typeof a.measurement==='string'?a.measurement:pretty(a.measurement.metric||'review evidence')}</p>`:''}<p class="small">Why this is here: ${pretty(a.driver||a.problemId||'confirmed priority')}${canonical.reviewDays?` · Canonical review in ${canonical.reviewDays} days`:''}</p></section>`).join('')||'<section class="el8-card"><p>No active actions were produced.</p></section>';activate.onclick=async()=>{activate.disabled=true;activate.textContent='Activating…';try{if(testerNote.value.trim())await note(s,{stage:'plan',screenId:'canonical-plan-activation',text:testerNote.value});s.member_state=applyCanonicalBrowserPlan(s.member_state,canonical);s.proposed_plan={confirmedPriorities:s.confirmed_priorities,candidateActions:actions,canonical:true,activationStatus:canonical.activationStatus};s.stage='review';saveTestSession(s);await event(s,'plan_activated','plan','canonical-plan-activation',null,{actionCount:actions.length,actionIds:actions.map(x=>x.id),memberStateRevision:s.member_state.revision,reviewDueAt:s.member_state.activePlan.reviewDueAt});location.href='review.html'}catch(e){activate.disabled=false;activate.textContent='Activate plan & test review loop';msg.textContent='Activation failed: '+String(e?.message||e)}};event(s,'plan_view','plan','canonical-plan-activation',null,{actionCount:actions.length,actionIds:actions.map(x=>x.id),planningRevision:canonical.memberStateRevision});</script></body></html>
