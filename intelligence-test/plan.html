<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:54px 18px 90px}.group{margin:14px 0}.action{cursor:pointer}.action.selected{outline:2px solid var(--gold)}.small{font-size:12px;color:var(--muted)}.scale{display:flex;gap:6px;flex-wrap:wrap}.scale button{padding:9px 11px}.scale button.selected{outline:2px solid var(--ink)}textarea{width:100%;min-height:80px;box-sizing:border-box}.row{display:flex;gap:10px;flex-wrap:wrap}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="el8-eyebrow">Your starting plan</div><h1>Here’s a manageable place to begin.</h1><p>EL8 recommends only Actions supported by your Focus and available evidence.</p><div id="plan"></div><div class="row"><button id="changeFocus" class="el8-btn">Change focus</button></div><section class="el8-card"><h2>Before you finish</h2><div id="core"></div></section><section style="margin:20px 0"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" placeholder="Optional: note anything wrong with the proposed Actions, reasoning, or experience…"></textarea></section><button id="submit" class="el8-btn">Finish</button><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';import{canonicalBrowserPlanView}from'../app/onboarding/browser-planning-adapter.js';import{resultPayload}from'../app/research/intelligence-test-contract.js';import{complete}from'./submit.js';installQaChrome({stage:'plan',screenId:'canonical-plan-selection',backHref:'priorities.html'});let s=loadTestSession();if(!s){location.replace('index.html');throw Error('Test session required')}const noFocus=!s.confirmed_focus?.length,view=canonicalBrowserPlanView(s.canonical_plan??{}),actions=view.actions||[],selected=new Set(s.selected_action_ids||actions.slice(0,Math.min(3,actions.length)).map(x=>x.actionId||x.id));const pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());function render(){plan.innerHTML=actions.map((a,i)=>{const id=a.actionId||a.id;return `<section class="el8-card group action ${selected.has(id)?'selected':''}" data-id="${id}"><div class="el8-eyebrow">${i?'Also recommended':'Recommended starting point'}</div><h2>${a.title||pretty(id)}</h2>${a.rationale?`<p>${a.rationale}</p>`:''}<p class="small">Tap to ${selected.has(id)?'remove':'add'}.</p></section>`}).join('')||(noFocus?'<section class="el8-card"><h2>No Plan is needed from this Discovery.</h2></section>':'<section class="el8-card"><h2>More understanding is needed first.</h2></section>');document.querySelectorAll('.action').forEach(x=>x.onclick=()=>{const id=x.dataset.id,was=selected.has(id);was?selected.delete(id):selected.add(id);s.selected_action_ids=[...selected];saveTestSession(s);event(s,was?'plan_action_removed':'plan_action_selected','plan','canonical-plan-selection',null,{actionId:id,selectedCount:selected.size});render()})}render();changeFocus.onclick=async()=>{await event(s,'plan_change_focus','plan','canonical-plan-selection',null,{selectedActionIds:[...selected]});s.stage='focus';saveTestSession(s);location.href='priorities.html'};const qs=[['understood','How well did EL8 understand what matters to you?',['1','2','3','4','5']],['useful','How useful does this proposed result feel?',['1','2','3','4','5']],['burden','Did the process feel too long or burdensome?',['Not at all','A little','Somewhat','Very']],['intent','Would you consider using EL8 based on this experience?',['Definitely not','Probably not','Maybe','Probably','Definitely']]];core.innerHTML=qs.map(([k,t,vals])=>`<div><strong>${t}</strong><div class="scale" data-k="${k}">${vals.map(v=>`<button type="button" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('');const survey={...(s.survey||{})};document.querySelectorAll('.scale').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;survey[g.dataset.k]=b.dataset.v;[...g.children].forEach(x=>x.classList.toggle('selected',x===b));event(s,'qa_rating_selected','plan','canonical-plan-selection',null,{metric:g.dataset.k,value:b.dataset.v})});submit.onclick=async()=>{if(actions.length&&!selected.size){msg.textContent='Choose an Action, or change your Focus.';await event(s,'plan_finish_blocked','plan','canonical-plan-selection',null,{reason:'no_action_selected'});return}submit.disabled=true;s.survey=survey;s.selected_action_ids=[...selected];saveTestSession(s);if(testerNote.value.trim())await note(s,{stage:'plan',screenId:'canonical-plan-selection',text:testerNote.value});await event(s,'plan_review_complete','plan','canonical-plan-selection',null,{selectedActionIds:[...selected],planStatus:view.status,noFocus,survey});const ok=await complete(resultPayload(s),s);if(ok){s.stage='completed';saveTestSession(s);location.href='complete.html'}else{submit.disabled=false;msg.textContent='We could not save this test yet. Your progress remains saved.';await event(s,'test_submission_failed','plan','canonical-plan-selection',null,{planStatus:view.status})}};event(s,'plan_view','plan','canonical-plan-selection',null,{actionCount:actions.length,actionIds:actions.map(x=>x.actionId||x.id),planStatus:view.status,noFocus,focusIds:(s.confirmed_focus||[]).map(x=>x.constructId)});</script></body></html>
