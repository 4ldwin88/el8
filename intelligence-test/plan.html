<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:680px;margin:auto;padding:26px 18px 90px}.group{margin:18px 0}.small{font-size:12px;color:var(--muted)}.tester textarea{width:100%;box-sizing:border-box}.final-intro{border-left:3px solid var(--gold);padding-left:13px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.actions button{padding:10px 5px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.actions button.selected{background:var(--ink);color:var(--bg)}.replace{margin-top:9px;display:none}.replace.show{display:block}.replace input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Plan</div></div></div><div class="final-intro"><div class="el8-eyebrow">Canonical Planning</div><h1>EL8 recommends the plan. You control the actions.</h1><p>Accept, defer, decline, or replace each ordinary action before activation. Accelerated QA continues immediately afterward.</p></div><div id="plan"></div><section class="el8-card tester"><strong>Tester Notes</strong><textarea id="testerNote"></textarea></section><button id="activate" class="el8-btn" style="margin-top:20px">Activate chosen actions</button><p id="msg" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{applyCanonicalBrowserPlan}from'../app/onboarding/browser-member-state-plan.js';let s=loadTestSession(),canonical=s?.canonical_plan;if(!s?.confirmed_priorities?.length||!s?.member_state){location.replace('priorities.html');throw Error('Canonical priorities and Member State required')}if(!canonical||canonical.status!=='active'){location.replace(canonical?.status==='deepen'?'selection-deepening.html':'priorities.html');throw Error('Active canonical plan required')}if(canonical.activationStatus==='needs_plan_specific_assessment'){location.replace('activation-deepening.html');throw Error('Activation evidence required')}const actions=canonical.active||[],decisions={...(s.action_decisions||{})},pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),idOf=a=>a.intervention_id||a.id;function render(){plan.innerHTML=actions.map(a=>{const id=idOf(a),d=decisions[id]||{status:'ACCEPTED'};return`<section class="el8-card group" data-id="${id}"><div class="el8-eyebrow">${pretty(a.dimension||'Wellness')}</div><h2>${a.title||pretty(id)}</h2>${a.rationale?`<p>${a.rationale}</p>`:''}<p class="small">Why this is here: ${pretty(a.driver||a.problemId||'confirmed priority')}</p><div class="actions"><button data-status="ACCEPTED">Accept</button><button data-status="DEFERRED">Defer</button><button data-status="DECLINED">Decline</button><button data-status="REPLACED">Replace</button></div><div class="replace ${d.status==='REPLACED'?'show':''}"><input value="${d.replacement?.title||''}" placeholder="Replacement action"></div></section>`}).join('')||'<section class="el8-card"><p>No active actions were produced.</p></section>';for(const card of plan.querySelectorAll('[data-id]')){const d=decisions[card.dataset.id]||{status:'ACCEPTED'};for(const b of card.querySelectorAll('button[data-status]'))b.classList.toggle('selected',b.dataset.status===d.status)}}for(const a of actions)if(!decisions[idOf(a)])decisions[idOf(a)]={status:'ACCEPTED'};plan.addEventListener('click',e=>{const b=e.target.closest('button[data-status]');if(!b)return;const card=b.closest('[data-id]'),id=card.dataset.id;decisions[id]={...(decisions[id]||{}),status:b.dataset.status};render();event(s,'plan_action_decision','plan','canonical-plan-activation',null,{actionId:id,status:b.dataset.status})});plan.addEventListener('input',e=>{if(!e.target.matches('.replace input'))return;const card=e.target.closest('[data-id]'),id=card.dataset.id,original=actions.find(a=>idOf(a)===id);decisions[id]={status:'REPLACED',replacement:{...original,id:`qa-replacement:${id}`,intervention_id:`qa-replacement:${id}`,title:e.target.value}}});activate.onclick=async()=>{const viable=Object.values(decisions).some(d=>['ACCEPTED','REPLACED'].includes(d.status));if(!viable){msg.textContent='Accept or replace at least one action before activation.';return}for(const [id,d] of Object.entries(decisions))if(d.status==='REPLACED'&&!d.replacement?.title?.trim()){msg.textContent=`Enter a replacement action for ${pretty(id)}.`;return}activate.disabled=true;try{if(testerNote.value.trim())await note(s,{stage:'plan',screenId:'canonical-plan-activation',text:testerNote.value});s.action_decisions=decisions;s.member_state=applyCanonicalBrowserPlan(s.member_state,canonical,{actionDecisions:decisions});s.proposed_plan={confirmedPriorities:s.confirmed_priorities,candidateActions:actions,actionDecisions:decisions,canonical:true,activationStatus:canonical.activationStatus};s.stage='review';saveTestSession(s);await event(s,'plan_activated','plan','canonical-plan-activation',null,{actionDecisions:Object.fromEntries(Object.entries(decisions).map(([id,d])=>[id,d.status])),memberStateRevision:s.member_state.revision,reviewDueAt:s.member_state.activePlan.reviewDueAt});location.href='review.html'}catch(e){activate.disabled=false;msg.textContent='Activation failed: '+String(e?.message||e)}};render();event(s,'plan_view','plan','canonical-plan-activation',null,{actionCount:actions.length,planningRevision:canonical.memberStateRevision});</script></body></html>
