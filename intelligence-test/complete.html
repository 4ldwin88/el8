<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Complete</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:620px;margin:auto;padding:45px 18px}.card{padding:28px}.small{font-size:13px;color:var(--muted)}.trace{text-align:left;margin-top:18px}.trace p{margin:8px 0}</style></head><body><main class="page"><div class="el8-brand" style="justify-content:center"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · E2E QA</div></div></div><section class="el8-card card" style="margin-top:32px"><div class="el8-eyebrow">Closed loop complete</div><h1>The Intelligence journey reached Review & Adaptation.</h1><p id="summary"></p><div id="trace" class="trace"></div><p class="small">This accelerated path compresses elapsed time only; the decision is produced by the canonical Review and Adaptation modules.</p><button id="again" class="el8-btn" style="margin-top:18px">Run another scenario</button></section></main><script type="module">import{loadTestSession,clearTestSession}from'./intelligence-test.js';const s=loadTestSession(),r=s?.accelerated_review,pretty=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());if(!r){location.replace('review.html');throw Error('Accelerated canonical review required')}summary.textContent=r.pass?'The selected scenario followed the expected canonical route.':'The scenario exposed a regression that should be investigated before merge.';trace.innerHTML=`<p><strong>Review decision:</strong> ${pretty(r.reviewDecision)}</p><p><strong>Next route:</strong> ${pretty(r.nextRoute)}</p>${r.adaptationConstraint?`<p><strong>Adaptation constraint:</strong> ${pretty(r.adaptationConstraint)}</p>`:''}<p><strong>Member State revision:</strong> ${s.member_state?.revision??'—'}</p><p><strong>Plan state:</strong> ${pretty(s.member_state?.activePlan?.status||'unknown')}</p>${r.errors?.length?`<p><strong>Regression:</strong> ${r.errors.join('; ')}</p>`:''}`;again.onclick=()=>{clearTestSession();location.replace('./')}</script></body></html>
