<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Tailor Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 80px}.q{margin:16px 0;padding:16px 0;border-top:1px solid var(--line)}textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.small{font-size:12px;color:var(--muted)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1</div></div></div><div class="el8-eyebrow">Planning · activation evidence</div><h1>A few details before activating the plan.</h1><p>Planning has selected the intervention. These questions collect only the evidence the canonical plan requires before activation.</p><section class="el8-card"><div id="questions"></div><p id="msg" class="small"></p><button id="continueBtn" class="el8-btn">Update plan</button></section></main><script type="module">import{loadTestSession,saveTestSession,event,installExitTest}from'./intelligence-test.js';import{buildCanonicalBrowserPlan}from'../app/onboarding/canonical-browser-plan.js';let s=loadTestSession(),plan=s.canonical_plan;if(!plan||plan.status!=='active'||!s.member_state){location.replace('priorities.html');throw Error('Canonical active plan and Member State required')}const reqs=plan.deepening?.blocking||[],evidence={...(s.activation_evidence||{})};if(!reqs.length){location.replace('plan.html');throw Error('No activation deepening required')}installExitTest({session:s,stage:'activation-deepening',screenId:'activation-evidence'});const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));questions.innerHTML=reqs.map(r=>`<div class="q" data-key="${esc(r.evidenceKey)}"><strong>${esc(r.prompt||'Please provide this detail.')}</strong><p class="small">${esc(r.decisionImpact||'Needed before this action can be activated.')}</p><textarea rows="2">${esc(evidence[r.evidenceKey]||'')}</textarea></div>`).join('');continueBtn.onclick=async()=>{questions.querySelectorAll('.q').forEach(q=>{const v=q.querySelector('textarea').value.trim();if(v)evidence[q.dataset.key]=v});if(reqs.some(r=>!evidence[r.evidenceKey])){msg.textContent='Answer each required question to continue.';return}const built=buildCanonicalBrowserPlan({discoveryOutput:s.discovery,confirmedPriorities:s.confirmed_priorities,memberState:s.member_state,selectionEvidence:s.selection_evidence||{},activationEvidence:evidence});plan=built.plan;s.activation_evidence=evidence;s.canonical_plan=plan;s.adaptive_plan={...plan,...built.view};s.stage=plan.activationStatus==='ready'||plan.activationStatus==='ready_with_optional_deepening'?'plan':'activation-deepening';saveTestSession(s);await event(s,'activation_deepening_complete','activation-deepening','activation-evidence',null,{evidenceKeys:Object.keys(evidence),activationStatus:plan.activationStatus});if(s.stage==='plan')location.href='plan.html';else{msg.textContent='EL8 still needs required activation evidence.'}};event(s,'activation_deepening_view','activation-deepening','activation-evidence',null,{requirementCount:reqs.length,evidenceKeys:reqs.map(x=>x.evidenceKey)});</script></body></html>
