<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test · Tailor Plan</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 80px}.q{margin:16px 0;padding:16px 0;border-top:1px solid var(--line)}textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:11px;font:inherit}.small{font-size:12px;color:var(--muted)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence Test</div></div></div><div class="el8-eyebrow">Tailor the selected plan</div><h1>A few details before showing the plan.</h1><p>EL8 has already chosen the intervention. These questions only determine whether it can be implemented and measured appropriately.</p><section class="el8-card"><div id="questions"></div><p id="msg" class="small"></p><button id="continueBtn" class="el8-btn">Show proposed plan</button></section></main><script type="module">import{loadTestSession,saveTestSession,event}from'./intelligence-test.js';import{buildOnboardingAdaptivePlan}from'../app/onboarding/adaptive-plan.js';let s=loadTestSession(),plan=s.adaptive_plan;if(!plan||plan.status!=='active'){location.replace('priorities.html');throw Error('Active plan required')}const reqs=plan.deepening?.blocking||[],evidence={...(s.plan_evidence||{})};if(!reqs.length){location.replace('plan.html');throw Error('No activation deepening required')}const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));questions.innerHTML=reqs.map(r=>`<div class="q" data-key="${esc(r.evidenceKey)}"><strong>${esc(r.prompt||'Please provide this detail.')}</strong><p class="small">${esc(r.decisionImpact||'Needed before this action can be activated.')}</p><textarea rows="2"></textarea></div>`).join('');continueBtn.onclick=async()=>{questions.querySelectorAll('.q').forEach(q=>{const v=q.querySelector('textarea').value.trim();if(v)evidence[q.dataset.key]=v});if(reqs.some(r=>!evidence[r.evidenceKey])){msg.textContent='Answer each required question to continue.';return}plan=buildOnboardingAdaptivePlan({discoveryOutput:s.discovery,confirmedPriorities:s.confirmed_priorities,baselineHandoff:s.baseline_handoff||{},selectionEvidence:s.selection_evidence||{},evidence});s.plan_evidence=evidence;s.adaptive_plan=plan;saveTestSession(s);await event(s,'activation_deepening_complete','activation-deepening','activation-evidence',null,{evidenceKeys:Object.keys(evidence),activationStatus:plan.activationStatus});if(plan.activationStatus==='ready'||plan.activationStatus==='ready_with_optional_deepening')location.href='plan.html';else{msg.textContent='EL8 still needs required activation evidence.'}};event(s,'activation_deepening_view','activation-deepening','activation-evidence',null,{requirementCount:reqs.length});</script></body></html>
