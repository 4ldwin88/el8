<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.wrap{max-width:720px;margin:auto;padding:54px 18px 70px}.hero h1{font-size:38px}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mode button{padding:11px}.mode button.active{outline:2px solid var(--ink)}.status{font-size:13px;color:var(--muted)}</style></head><body><main class="wrap"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><section class="hero"><div class="el8-eyebrow">Intelligence Test</div><h1>Help us test whether EL8 actually understands you.</h1><p>This prototype tests Discovery → Focus → Plan. You are testing EL8, not yourself.</p></section><section class="el8-card"><h2>How are you testing today?</h2><div class="mode" id="modes"><button data-mode="self">As myself</button><button data-mode="roleplay">Roleplaying someone</button><button data-mode="prefer_not_to_say" class="active">Prefer not to say</button></div><button id="begin" class="el8-btn" style="margin-top:18px">Begin Discovery</button><div id="status" class="status">The timer starts when you begin Discovery.</div></section></main><script type="module">import{newTestSession,start,clearTestSession}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';installQaChrome({stage:'entry',screenId:'test-entry'});let mode='prefer_not_to_say';clearTestSession();modes.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;modes.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b))});begin.onclick=async()=>{begin.disabled=true;try{const s=newTestSession(mode);await start(s);location.href='discovery.html'}catch(e){begin.disabled=false;status.textContent='The test could not start: '+String(e?.message||e).slice(0,180)}}</script></body></html>
