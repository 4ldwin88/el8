<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:54px 18px 70px}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid currentColor}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:82px;box-sizing:border-box}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="el8-eyebrow">Getting to know you</div><h1>Let’s start with how life has been lately.</h1><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section style="margin-top:20px"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" placeholder="Optional: note anything irrelevant, repetitive, confusing, missing, or inconsistent…"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';import{createDiscoverySession,nextDiscoveryStep,answerDiscoveryQuestion,submitDiscoveryTriage,resolveDiscoveryConstruct,submitDiscoverySafetyConfirmation,finishDiscovery,discoveryPriorityCandidates}from'../app/onboarding/discovery-runtime.js';installQaChrome({stage:'discovery',screenId:'adaptive-discovery',backHref:'index.html'});let research=loadTestSession();if(!research){location.replace('index.html');throw Error('Test session required')}let s=research.discovery_session||createDiscoverySession(),finishing=false,current=null;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),message=document.getElementById('message'),testerNote=document.getElementById('testerNote'),EXCLUSIVE=new Set(['unsure','none','no','nothing','prefer_not_to_say']);function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function restore(){if(research.discovery_session)s={...research.discovery_session,questionBank:s.questionBank}}function button(text,fn){const b=document.createElement('button');b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b);return b}async function saveNote(){const text=testerNote.value.trim();if(text&&await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text}))testerNote.value=''}async function advance(fn,eventType,payload={}){await saveNote();await event(research,eventType,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render()}async function finish(){if(finishing)return;finishing=true;await saveNote();try{const output=finishDiscovery(s),candidates=discoveryPriorityCandidates(output);research.discovery=output;research.recommended_priorities=candidates;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{candidateCount:candidates.length,traceStateCount:output.trace?.states?.length||0});location.href='priorities.html'}catch(e){finishing=false;message.textContent='Something interrupted this step. Your answers are still saved.';await event(research,'discovery_finish_error','discovery','finish',null,{message:String(e?.message||e).slice(0,300)});button('Try again',finish)}}function render(){restore();save();prompt.innerHTML='';options.innerHTML='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type,reason:current.reason||null});if(current.type==='question'){prompt.innerHTML=`<strong>${current.question.text}</strong>`;let chosen=current.question.responseMode==='multi'?[]:null;const buttons=[];(current.question.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.label||o.text||o.id;buttons.push([o.id,b]);b.onclick=()=>{if(current.question.responseMode==='multi'){if(EXCLUSIVE.has(o.id))chosen=chosen.includes(o.id)?[]:[o.id];else{chosen=chosen.filter(x=>!EXCLUSIVE.has(x));chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([id,x])=>x.classList.toggle('selected',chosen.includes(id)))}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}};options.appendChild(b)});button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer to continue.';event(research,'discovery_continue_blocked','discovery','question',current.question?.id||null,{reason:'no_answer'});return}advance(()=>answerDiscoveryQuestion(s,current.question,chosen),'discovery_answer',{answer:chosen})});return}if(current.type==='triage'){const states=current.states||[],importance={};prompt.innerHTML='<strong>Is there anything here you especially want EL8 to keep in mind?</strong>';for(const x of states){const id=x.constructId||x.concernId;importance[id]=0;const b=document.createElement('button');b.className='option';b.textContent=x.label||id;b.onclick=()=>{importance[id]=importance[id]?0:3;b.classList.toggle('selected',Boolean(importance[id]))};options.appendChild(b)}button('Continue',()=>advance(()=>submitDiscoveryTriage(s,importance),'discovery_triage',{importance}));return}if(current.type==='priority-resolution'){const target=current.concern||current.state||current.states?.[0],id=target?.constructId||target?.concernId;if(id){prompt.innerHTML=`<strong>Should EL8 keep ${target.label||id} in mind as we decide what matters most?</strong>`;button('Yes',()=>advance(()=>resolveDiscoveryConstruct(s,id,'established'),'discovery_resolution',{constructId:id,resolution:'established'}));button('Not right now',()=>advance(()=>resolveDiscoveryConstruct(s,id,'deferred'),'discovery_resolution',{constructId:id,resolution:'deferred'}));return}}if(current.type==='safety'){prompt.innerHTML='<strong>A safety confirmation is required before ordinary recommendations continue.</strong>';button('Return to start',()=>location.href='index.html');message.textContent='Safety flow is intentionally gated in this QA build.';return}finish()}render();</script></body></html>
