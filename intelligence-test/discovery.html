<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 30px}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}.option.selected{outline:2px solid currentColor}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted)}.triage{padding:10px 0;border-top:1px solid var(--line)}.scale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.scale button{min-width:0;padding:8px 4px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:11px;line-height:1.15}.scale button.selected{background:var(--ink);color:var(--bg)}.tester textarea,.other-input{width:100%;min-height:72px;box-sizing:border-box;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.other-wrap{margin:8px 0 14px}.synthesis,.entry-plan{margin:0 0 16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}.synthesis p,.entry-plan p{margin:8px 0 0}.entry-action{padding:9px 0;border-top:1px solid var(--line)}.entry-action:first-of-type{border-top:0}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Discovery</div></div></div><div class="el8-eyebrow">Adaptive Discovery</div><h1>Find what matters most.</h1><p>EL8 asks only what it still needs to understand.</p><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section class="el8-card tester"><strong>Tester Notes</strong><p class="small">Flag irrelevant, repetitive, confusing, or inconsistent behavior.</p><textarea id="testerNote"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note,installExitTest}from'./intelligence-test.js';import{createDiscoverySession,createDiscoverySessionFromHandoff,nextDiscoveryStep,answerDiscoveryQuestion,submitDiscoveryTriage,submitBroadEntryPlanChoice,submitDiscoveryPriority,finishDiscovery}from'../app/onboarding/discovery-runtime.js';import{standardEntryPlan}from'../intelligence/planning/standard-entry-plan.js';import{projectOnboardingMemberState}from'../app/onboarding/member-state-projection.js';import{buildCanonicalBrowserPriorities}from'../app/onboarding/canonical-browser-prioritization.js';let research=loadTestSession();if(!research){location.replace('index.html');throw Error('Test session required')}installExitTest({session:research,stage:'discovery',screenId:'adaptive-discovery'});const fresh=()=>research.discovery_handoff?createDiscoverySessionFromHandoff(research.discovery_handoff):createDiscoverySession();let s=research.discovery_session?{...research.discovery_session}:fresh(),finishing=false,current=null;if(research.discovery_session)s.questionBank=fresh().questionBank;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),message=document.getElementById('message'),testerNote=document.getElementById('testerNote');function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function button(text,fn){const b=document.createElement('button');b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b)}async function saveNote(){const text=testerNote.value.trim();if(text){await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text});testerNote.value=''}}function top(){requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'instant'}))}async function advance(fn,type,payload={}){await saveNote();await event(research,type,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render();top()}function answerIds(questionId){return[...new Set((s.observationLog||[]).filter(o=>o.questionId===questionId).map(o=>o.answerValue).filter(Boolean))]}function has(q,id){return answerIds(q).includes(id)}function synthesisHtml(){const established=(s.concernIds||[]).filter(id=>s.resolutionStates?.[id]==='established'),summaries=[];if(established.includes('money')){const bits=[];if(has('M3','no_income'))bits.push('you currently have no income');if(has('M3','expenses'))bits.push('regular expenses are difficult to cover');if(has('M3','debt'))bits.push('debt or required payments are part of the pressure');summaries.push(`<p><strong>Money:</strong> ${bits.length?bits.join(', '):'money pressure needs attention'}.</p>`)}if(established.includes('work')){const bits=[];if(has('W0','no_job')||has('W3','no_work'))bits.push('you do not currently have work');if(has('W6','credentials')||has('W5','credentials'))bits.push('skills, credentials or experience may be limiting your options');if(has('W6','looking')||has('W5','opportunity'))bits.push('finding a suitable opportunity is part of the difficulty');summaries.push(`<p><strong>Work & income:</strong> ${bits.length?bits.join(', '):'your current work or income situation needs attention'}.</p>`)}if(established.includes('health')){const bits=[];if(has('PH0','body'))bits.push('your physical condition or how your body feels needs attention');if(has('PH0','activity'))bits.push('your current activity level is something you want to improve');if(has('PH0','symptoms'))bits.push('physical symptoms are affecting you');summaries.push(`<p><strong>Health:</strong> ${bits.length?bits.join(', '):'your physical health needs attention'}.</p>`)}if(established.includes('energy')){const bits=[];if(has('E2','low'))bits.push('low energy is getting in the way');summaries.push(`<p><strong>Energy:</strong> ${bits.length?bits.join(', '):'your energy level needs attention'}.</p>`)}for(const id of established.filter(x=>!['money','work','health','energy'].includes(x))){const label=id.replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());summaries.push(`<p><strong>${label}:</strong> this area needs attention based on what you shared.</p>`)}if(s.facts?.memberDescribedConcern)summaries.push(`<p><strong>Something else:</strong> ${s.facts.memberDescribedConcern}</p>`);const limits=[];if(has('M9','cost')||has('PH2A','cost'))limits.push('next steps need to keep costs very low');if(has('M9','access')||has('PH2A','access'))limits.push('you may need help accessing information, accounts, services or suitable options');if(has('M9','support')||has('PH2A','support'))limits.push('another person or professional may need to be involved');if(has('M9','time')||has('PH2A','time'))limits.push('next steps need to stay quick and manageable');if(has('M9','energy')||has('PH2A','energy'))limits.push('effort should stay low for now');return `<div class="synthesis"><strong>Here’s my understanding</strong>${summaries.join('')||'<p class="small">No specific concern has been established yet.</p>'}${limits.length?`<p><strong>Plan fit:</strong> ${limits.join('; ')}.</p>`:''}</div>`}async function finish(){if(finishing)return;finishing=true;try{await saveNote();const output=finishDiscovery(s);research.discovery=output;research.member_state=projectOnboardingMemberState({memberId:`qa:${research.id}`,discoveryOutput:output});const prioritized=buildCanonicalBrowserPriorities({memberState:research.member_state,discoveryOutput:output});research.prioritization=prioritized.result;research.prioritization_decision_factors=prioritized.decisionFactors;research.recommended_priorities=prioritized.candidates;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{supportedProblemCount:prioritized.input.supportedProblemIds.length,priorityCandidateCount:prioritized.candidates.length,memberStateRevision:research.member_state.revision,baselineStatus:research.member_state.baseline.status,prioritizationSchema:prioritized.result.schemaVersion,decisionFactors:prioritized.decisionFactors,testMode:research.tester_mode||null});location.href='priorities.html'}catch(e){finishing=false;save();prompt.innerHTML='<strong>Discovery needs more information before it can continue.</strong>';options.innerHTML='';controls.innerHTML='';message.textContent=e.message;button('Continue Discovery',()=>{render();top()})}}async function acceptEntryPlan(){const plan=standardEntryPlan();research.standard_entry_plan=plan;research.stage='standard-entry-plan';submitBroadEntryPlanChoice(s,'accept',current.reason);save();saveTestSession(research);await event(research,'standard_entry_plan_selected','discovery','entry-plan-offer',null,{reason:current.reason,planId:plan.id,actionIds:plan.actions.map(a=>a.id)});location.href='standard-entry-plan.html'}function render(){save();prompt.innerHTML='';options.innerHTML='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type,reason:current.stop?.reason||current.reason||null});if(current.type==='question'){prompt.innerHTML=`${current.question.role==='handoff-validation'?synthesisHtml():''}<strong>${current.question.text}</strong>`;let chosen=current.question.responseMode==='multi'?[]:null,otherInput=null;const buttons=[];(current.question.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.label||o.text||o.id;buttons.push([o,b]);b.onclick=()=>{if(Array.isArray(chosen)){const exclusive=o.exclusiveWithinGroup===true;if(exclusive)chosen=chosen.includes(o.id)?[]:[o.id];else{chosen=chosen.filter(id=>!current.question.options.find(x=>x.id===id)?.exclusiveWithinGroup);chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([x,el])=>el.classList.toggle('selected',chosen.includes(x.id)));if(otherInput)otherInput.parentElement.style.display=chosen.includes('other')?'block':'none'}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}};options.appendChild(b);if(current.question.id==='G1'&&o.id==='other'){const wrap=document.createElement('div');wrap.className='other-wrap';wrap.style.display='none';wrap.innerHTML='<label class="small" for="g1Other"><strong>What else would you like EL8 to help with?</strong></label>';otherInput=document.createElement('textarea');otherInput.id='g1Other';otherInput.className='other-input';otherInput.placeholder='Describe it in your own words…';wrap.appendChild(otherInput);options.appendChild(wrap)}});button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer.';return}const described=current.question.id==='G1'&&Array.isArray(chosen)&&chosen.includes('other')?otherInput?.value.trim():'';if(current.question.id==='G1'&&chosen.includes('other')&&!described){message.textContent='Tell EL8 what we missed, or deselect Something else.';return}advance(()=>{answerDiscoveryQuestion(s,current.question,chosen);if(described)s.facts={...(s.facts||{}),memberDescribedConcern:described}},'discovery_answer',{answer:chosen,memberDescribedConcern:described||null})});return}if(current.type==='triage'){prompt.innerHTML='<strong>How important are these to you right now?</strong>';const values={},concerns=current.question.concerns||[];concerns.forEach(c=>{const wrap=document.createElement('div');wrap.className='triage';wrap.innerHTML=`<strong>${c.label||c.id}</strong>`;const scale=document.createElement('div');scale.className='scale';[['0','Not important'],['1','Somewhat important'],['2','Important'],['3','Very important']].forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{values[c.id]=+v;[...scale.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};scale.appendChild(b)});wrap.appendChild(scale);options.appendChild(wrap)});button('Continue',()=>{if(Object.keys(values).length<concerns.length){message.textContent='Rate each area.';return}advance(()=>submitDiscoveryTriage(s,values),'discovery_triage',{values})});return}if(current.type==='entry-plan-offer'){const positive=current.reason==='positive-baseline-learning',uncertain=current.reason==='uncertain-start',plan=standardEntryPlan();prompt.innerHTML=positive?'<strong>You seem to be starting from a generally good place.</strong><p>EL8 can start with a short standard entry plan to learn your normal patterns.</p>':uncertain?'<strong>It’s okay not to know what needs attention yet.</strong><p>EL8 can start with a short standard entry plan to gather a few comparable signals and help identify what is most useful to explore.</p>':'<strong>You’ve listed a lot of important concerns.</strong><p>EL8 suggests a standard entry plan so we can measure what is affecting you day to day before narrowing the focus.</p>';options.innerHTML=`<div class="entry-plan"><strong>${plan.title}</strong><p class="small">${plan.purpose}</p>${plan.actions.map(a=>`<div class="entry-action"><strong>${a.title}</strong><p class="small">${a.action}</p></div>`).join('')}</div>`;button('Use standard entry plan',acceptEntryPlan);button(positive?'Continue with goal-based Discovery':'Continue adaptive Discovery',()=>advance(()=>submitBroadEntryPlanChoice(s,'continue',current.reason),'standard_entry_plan_declined',{reason:current.reason}));return}if(current.type==='priority-resolution'){prompt.innerHTML='<strong>Which one or two areas feel most important to you right now?</strong>';let chosen=[];(current.question.concerns||[]).forEach(c=>{const b=document.createElement('button');b.className='option';b.textContent=c.label||c.id;b.onclick=()=>{chosen=chosen.includes(c.id)?chosen.filter(x=>x!==c.id):chosen.length<2?[...chosen,c.id]:chosen;b.classList.toggle('selected',chosen.includes(c.id))};options.appendChild(b)});button('Continue',()=>{if(!chosen.length)return;advance(()=>submitDiscoveryPriority(s,chosen),'discovery_importance',{chosen})});return}if(current.type==='safety'){prompt.innerHTML='<strong>Safety confirmation required.</strong>';return}if(current.type==='finish'&&current.stop?.incomplete){prompt.innerHTML='<strong>Discovery needs one more clarification before it can continue.</strong>';message.textContent=`QA recovery required: ${current.stop.reason}.`;button('Retry Discovery',()=>{render();top()});return}finish()}render();top();</script></body></html>
