<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:24px 0}.progress span{display:block;width:25%;height:100%;background:var(--gold)}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid currentColor}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted);line-height:1.45}.helper{display:block;font-size:12px;color:var(--muted);font-style:italic;font-weight:400;margin-top:5px}.qa{margin-top:20px}.qa-label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.qa textarea{width:100%;min-height:82px;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit}.safety-q{margin:16px 0}.safety-q strong{display:block;margin-bottom:8px}.safety-q .row{gap:8px}.safety-q button{flex:1;min-width:90px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="progress"><span></span></div><div class="el8-eyebrow">Getting to know you</div><h1>Let’s start with how life has been lately.</h1><p>There does not need to be a problem. EL8 will get a broad picture first, then ask only what could help clarify what matters to you.</p><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section class="qa" aria-label="Internal QA note"><label class="qa-label" for="testerNote">QA note</label><textarea id="testerNote" placeholder="Optional: note anything irrelevant, repetitive, confusing, missing, or inconsistent…"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{createDiscoverySession,nextDiscoveryStep,answerDiscoveryQuestion,submitDiscoveryTriage,resolveDiscoveryConstruct,submitDiscoverySafetyConfirmation,finishDiscovery,discoveryPriorityCandidates}from'../app/onboarding/discovery-runtime.js';let research=loadTestSession();if(!research){location.replace('index.html');throw Error('Test session required')}let s=research.discovery_session||createDiscoverySession(),finishing=false,current=null;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),message=document.getElementById('message'),testerNote=document.getElementById('testerNote'),EXCLUSIVE=new Set(['unsure','none','no','nothing','prefer_not_to_say']);function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function restore(){if(research.discovery_session)s={...research.discovery_session,questionBank:s.questionBank}}function button(text,fn){const b=document.createElement('button');b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b);return b}async function saveNote(){const text=testerNote.value.trim();if(!text)return;const ok=await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text});if(ok)testerNote.value=''}async function advance(fn,eventType,payload={}){await saveNote();await event(research,eventType,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render()}async function finish(){if(finishing)return;finishing=true;await saveNote();prompt.textContent='Putting the picture together…';options.innerHTML='';controls.innerHTML='';try{const output=finishDiscovery(s),candidates=discoveryPriorityCandidates(output);research.discovery=output;research.recommended_priorities=candidates;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{candidateCount:candidates.length,traceStateCount:output.trace?.states?.length||0});location.href='priorities.html'}catch(e){finishing=false;message.textContent='Something interrupted this step. Your answers are still saved.';button('Try again',finish)}}function renderSafety(){prompt.innerHTML='<strong>I want to check something important before we continue.</strong><em class="helper">Please answer each question directly. These answers determine whether ordinary EL8 recommendations should pause.</em>';const confirmation={immediateDanger:null,intent:null,canStaySafe:null};const questions=[['immediateDanger','Are you in immediate danger right now?',true],['intent','Do you currently intend to harm yourself or someone else?',true],['canStaySafe','Can you stay safe right now?',false]];for(const[key,label]of questions){const wrap=document.createElement('div');wrap.className='safety-q';const title=document.createElement('strong');title.textContent=label;wrap.appendChild(title);const row=document.createElement('div');row.className='row';for(const[value,text]of [[true,'Yes'],[false,'No']]){const b=document.createElement('button');b.className='option';b.textContent=text;b.onclick=()=>{confirmation[key]=value;[...row.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};row.appendChild(b)}wrap.appendChild(row);options.appendChild(wrap)}button('Continue',async()=>{if(Object.values(confirmation).some(v=>typeof v!=='boolean')){message.textContent='Please answer all three safety questions to continue.';return}await saveNote();await event(research,'safety_confirmation','discovery','safety',null,{complete:true,immediateDanger:confirmation.immediateDanger,intent:confirmation.intent,canStaySafe:confirmation.canStaySafe});submitDiscoverySafetyConfirmation(s,confirmation);save();if(s.safety?.status==='escalate'){prompt.innerHTML='<strong>EL8 is pausing ordinary recommendations.</strong>';options.innerHTML='';controls.innerHTML='';message.textContent='Your answers indicate that immediate safety support should take priority. This test will not continue into Focus or Planning.';research.stage='safety_paused';saveTestSession(research);await event(research,'safety_escalated','discovery','safety',null,{status:s.safety.status});return}render()});message.textContent='Your wellbeing comes first. EL8 will only continue ordinary recommendations when the canonical Safety gate allows it.'}function render(){restore();save();prompt.innerHTML='';options.innerHTML='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type});if(current.type==='question'){prompt.innerHTML=`<strong>${current.question.text}</strong>${current.question.responseMode==='multi'?'<em class="helper">Select any that fit.</em>':''}`;let chosen=current.question.responseMode==='multi'?[]:null;const buttons=[];(current.question.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.label||o.text||o.id;buttons.push([o.id,b]);b.onclick=()=>{if(current.question.responseMode==='multi'){if(EXCLUSIVE.has(o.id)){chosen=chosen.includes(o.id)?[]:[o.id]}else{chosen=chosen.filter(x=>!EXCLUSIVE.has(x));chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([id,x])=>x.classList.toggle('selected',chosen.includes(id)))}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}};options.appendChild(b)});button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer to continue.';return}advance(()=>answerDiscoveryQuestion(s,current.question,chosen),'discovery_answer',{answer:chosen})});return}if(current.type==='triage'){const states=current.states||[];prompt.innerHTML='<strong>Is there anything here you especially want EL8 to keep in mind?</strong><em class="helper">Choose what feels relevant to you. You can leave everything unselected.</em>';const importance={};for(const x of states){const id=x.constructId||x.concernId;importance[id]=0;const b=document.createElement('button');b.className='option';b.textContent=x.label||id;b.onclick=()=>{importance[id]=importance[id]?0:3;b.classList.toggle('selected',Boolean(importance[id]))};options.appendChild(b)}button('Continue',()=>advance(()=>submitDiscoveryTriage(s,importance),'discovery_triage',{importance}));return}if(current.type==='priority-resolution'){const target=current.concern||current.state||current.states?.[0];const id=target?.constructId||target?.concernId;if(id){prompt.innerHTML=`<strong>Should EL8 keep ${target.label||id} in mind as we decide what matters most?</strong>`;button('Yes',()=>advance(()=>resolveDiscoveryConstruct(s,id,'established'),'discovery_resolution',{constructId:id,resolution:'established'}));button('Not right now',()=>advance(()=>resolveDiscoveryConstruct(s,id,'deferred'),'discovery_resolution',{constructId:id,resolution:'deferred'}));return}}if(current.type==='safety'){renderSafety();return}finish()}render();</script></body></html>
