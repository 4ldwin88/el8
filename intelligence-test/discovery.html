<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:760px;margin:auto;min-height:100vh;padding:54px 18px 70px}.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:24px 0}.progress span{display:block;width:35%;height:100%;background:var(--gold)}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid currentColor}.choice-set.compact{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:9px 0}.choice-set.compact .option{width:auto;margin:0;padding:10px 12px;min-height:44px}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:82px;box-sizing:border-box}.triage-item{padding:16px 0;border-bottom:2px solid var(--line)}.triage-item:last-child{border-bottom:0}.triage-answers{display:grid;gap:8px}.triage-answers.compact{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.triage-answers.compact .option{width:auto;margin:0;padding:10px 12px;min-height:44px}.triage-answers .option{margin:0}.triage-index{font-size:12px;color:var(--muted);margin-bottom:4px}.triage-label{font-weight:700;margin-bottom:10px}.response-matrix{margin-top:16px}.matrix-head,.matrix-row{display:grid;grid-template-columns:minmax(112px,1.25fr) repeat(4,minmax(82px,1fr));align-items:stretch}.matrix-head{font-size:12px;font-weight:700;color:var(--muted)}.matrix-head>div,.matrix-row>div{padding:10px 8px}.matrix-row{border-top:1px solid var(--line)}.matrix-dimension{display:flex;align-items:center;font-weight:750}.matrix-choice{display:flex;align-items:stretch;justify-content:center;padding:6px!important}.matrix-choice button{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}.matrix-choice button:hover{background:var(--soft)}.matrix-choice button.selected{background:var(--ink);color:var(--bg);font-weight:800}.matrix-mobile-scale{display:none}@media(max-width:640px){.choice-set.compact,.triage-answers.compact{grid-template-columns:repeat(2,minmax(0,1fr))}.matrix-head{display:none}.matrix-row{display:block;border-top:1px solid var(--line);margin:0;padding:12px 0}.matrix-row>div{padding:0}.matrix-dimension{font-size:16px;margin-bottom:9px}.matrix-mobile-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:5px;color:var(--muted);font-size:10px;text-align:center}.matrix-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.matrix-choice{padding:0!important}.matrix-choice button{min-height:48px;padding:5px;font-size:11px;border:1px solid var(--line);background:var(--card)}} </style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="progress"><span></span></div><div class="el8-eyebrow">Getting to know you</div><h1>Let’s start with how life has been lately.</h1><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section style="margin-top:20px"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" aria-label="Internal QA note" placeholder="Optional: note anything irrelevant, repetitive, confusing, missing, or inconsistent…"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';import{createDiscoverySession,nextDiscoveryStep,answerDiscoveryQuestion,answerDiscoveryInteraction,submitDiscoveryTriage,resolveDiscoveryConstruct,finishDiscovery,discoveryPriorityCandidates}from'../app/onboarding/discovery-runtime.js';installQaChrome({stage:'discovery',screenId:'adaptive-discovery'});let research=loadTestSession();if(!research){location.replace('index.html');throw Error('Test session required')}let s=research.discovery_session||createDiscoverySession(),finishing=false,current=null;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),message=document.getElementById('message'),testerNote=document.getElementById('testerNote'),EXCLUSIVE=new Set(['unsure','none','no','nothing','prefer_not_to_say']),COMPACT_CHOICE_THRESHOLD=8;function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function restore(){if(research.discovery_session)s={...research.discovery_session,questionBank:s.questionBank}}function button(text,fn){const b=document.createElement('button');b.type='button';b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b);return b}function humanize(value=''){return String(value).replaceAll('_',' ').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())}function applyChoiceDensity(q,host){host.classList.add('choice-set');if((q.options||[]).length>=COMPACT_CHOICE_THRESHOLD)host.classList.add('compact')}async function saveNote(){const text=testerNote.value.trim();if(text&&await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text}))testerNote.value=''}async function advance(fn,eventType,payload={}){await saveNote();await event(research,eventType,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render()}function selectionWidget(q,host,onChange){applyChoiceDensity(q,host);let chosen=q.responseMode==='multi'?[]:null;const buttons=[];(q.options||[]).forEach(o=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=o.label||o.text||o.id;buttons.push([o.id,b]);b.onclick=()=>{if(q.responseMode==='multi'){if(EXCLUSIVE.has(o.id))chosen=chosen.includes(o.id)?[]:[o.id];else{chosen=chosen.filter(x=>!EXCLUSIVE.has(x));chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([id,x])=>x.classList.toggle('selected',chosen.includes(id)))}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}onChange(chosen)};host.appendChild(b)});return()=>chosen}async function finish(){if(finishing)return;finishing=true;await saveNote();try{const output=finishDiscovery(s),candidates=discoveryPriorityCandidates(output);research.discovery=output;research.recommended_priorities=candidates;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{candidateCount:candidates.length,traceStateCount:output.trace?.states?.length||0,questionCount:output.trace?.timing?.questionCount||0,incomplete:Boolean(output.trace?.incomplete)});location.href='priorities.html'}catch(e){finishing=false;message.textContent='Something interrupted this step. Your answers are still saved.';await event(research,'discovery_finish_error','discovery','finish',null,{message:String(e?.message||e).slice(0,300)});button('Try again',finish)}}function renderMatrix(label){const qs=current.questions||[],answers={};prompt.innerHTML=`<strong>${label}</strong><p class="small">Choose one response for each area.</p>`;const scale=(qs[0]?.options||[]).map(o=>({id:o.id,label:o.label||o.text||o.id}));const matrix=document.createElement('div');matrix.className='response-matrix';matrix.setAttribute('role','group');matrix.setAttribute('aria-label','Eight dimension wellbeing response matrix');const head=document.createElement('div');head.className='matrix-head';head.innerHTML='<div aria-hidden="true"></div>'+scale.map(o=>`<div>${o.label}</div>`).join('');matrix.appendChild(head);qs.forEach(q=>{const row=document.createElement('section');row.className='matrix-row';const dimension=document.createElement('div');dimension.className='matrix-dimension';dimension.textContent=q.dimension?humanize(q.dimension):(q.label||humanize(q.constructId||q.id));row.appendChild(dimension);const mobileScale=document.createElement('div');mobileScale.className='matrix-mobile-scale';mobileScale.innerHTML=scale.map(o=>`<span>${o.label}</span>`).join('');row.appendChild(mobileScale);const choices=document.createElement('div');choices.className='matrix-choices';const rowButtons=[];(q.options||[]).forEach(o=>{const cell=document.createElement('div');cell.className='matrix-choice';const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`${dimension.textContent}: ${o.label||o.text||o.id}`);b.textContent='';b.title=o.label||o.text||o.id;b.onclick=()=>{answers[q.id]=o.id;rowButtons.forEach(x=>x.classList.remove('selected'));b.classList.add('selected');message.textContent=''};rowButtons.push(b);cell.appendChild(b);choices.appendChild(cell)});row.appendChild(choices);matrix.appendChild(row)});options.appendChild(matrix);button('Continue',()=>{const missing=qs.filter(q=>!answers[q.id]);if(missing.length){message.textContent='Choose one response for each area to continue.';event(research,'discovery_continue_blocked','discovery','matrix',null,{reason:'incomplete_matrix',missingQuestionIds:missing.map(q=>q.id)});return}advance(()=>answerDiscoveryInteraction(s,current,answers),'discovery_matrix_answer',{interaction:current.interaction,questionIds:qs.map(q=>q.id),answers})})}function renderComposite(label,{singleQuestion=false}={}){const qs=current.questions||[],answers={};prompt.innerHTML=`<strong>${label}</strong>`;qs.forEach((q,i)=>{const wrap=document.createElement('section');wrap.className='triage-item';if(!singleQuestion){const title=document.createElement('strong');title.textContent=q.text;wrap.appendChild(title)}else{const idx=document.createElement('div');idx.className='triage-index';idx.textContent=`Item ${i+1} of ${qs.length}`;wrap.appendChild(idx);const rowLabel=document.createElement('div');rowLabel.className='triage-label';rowLabel.textContent=q.dimension?humanize(q.dimension):(q.label||humanize(q.constructId||q.id));wrap.appendChild(rowLabel)}const choices=document.createElement('div');choices.className='triage-answers';wrap.appendChild(choices);selectionWidget(q,choices,v=>answers[q.id]=v);options.appendChild(wrap)});button('Continue',()=>{const missing=qs.filter(q=>!(Array.isArray(answers[q.id])?answers[q.id].length:Boolean(answers[q.id])));if(missing.length){message.textContent='Choose an answer for each item to continue.';event(research,'discovery_continue_blocked','discovery',current.type,null,{reason:'incomplete_composite',missingQuestionIds:missing.map(q=>q.id)});return}advance(()=>answerDiscoveryInteraction(s,current,answers),'discovery_composite_answer',{interaction:current.interaction,questionIds:qs.map(q=>q.id),answers})})}function render(){restore();save();window.scrollTo({top:0,left:0,behavior:'instant'});prompt.innerHTML='';options.innerHTML='';options.className='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type,interaction:current.interaction||null,reason:current.reason||current.stop?.reason||null,questionCount:Array.isArray(current.questions)?current.questions.length:(current.question?1:0)});if(current.type==='question'){prompt.innerHTML=`<strong>${current.question.text}</strong>`;let chosen;selectionWidget(current.question,options,v=>chosen=v);button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer to continue.';event(research,'discovery_continue_blocked','discovery','question',current.question?.id||null,{reason:'no_answer'});return}advance(()=>answerDiscoveryQuestion(s,current.question,chosen),'discovery_answer',{answer:chosen})});return}if(current.type==='matrix'){renderMatrix('For each area below, how are things going for you right now?');return}if(current.type==='driver-triage'){renderComposite('What seems to be contributing to the difficult areas you identified?',{singleQuestion:true});return}if(current.type==='triage'){const states=current.states||[],importance={};prompt.innerHTML='<strong>Which of these should matter most as EL8 chooses where to focus?</strong>';if(states.length>=COMPACT_CHOICE_THRESHOLD)options.classList.add('choice-set','compact');for(const x of states){const id=x.constructId||x.concernId;importance[id]=0;const b=document.createElement('button');b.className='option';b.textContent=x.label||humanize(id);b.onclick=()=>{importance[id]=importance[id]?0:3;b.classList.toggle('selected',Boolean(importance[id]))};options.appendChild(b)}button('Continue',()=>advance(()=>submitDiscoveryTriage(s,importance),'discovery_triage',{importance}));return}if(current.type==='priority-resolution'){const target=current.concern||current.state||current.states?.[0],id=target?.constructId||target?.concernId;if(id){prompt.innerHTML=`<strong>Should EL8 keep ${target.label||humanize(id)} in mind as we decide what matters most?</strong>`;button('Yes',()=>advance(()=>resolveDiscoveryConstruct(s,id,'established'),'discovery_resolution',{constructId:id,resolution:'established'}));button('Not right now',()=>advance(()=>resolveDiscoveryConstruct(s,id,'deferred'),'discovery_resolution',{constructId:id,resolution:'deferred'}));return}}if(current.type==='safety'){prompt.innerHTML='<strong>A safety confirmation is required before ordinary recommendations continue.</strong>';message.textContent='Safety flow requires separate QA validation before this test can continue.';return}if(current.type==='finish'){event(research,'discovery_finish_reached','discovery','finish',null,{reason:current.stop?.reason||null,incomplete:Boolean(current.stop?.incomplete),stateCount:current.states?.length||0,questionsAsked:s.questionsAsked});finish();return}event(research,'discovery_unhandled_step','discovery',String(current.type||'unknown'),null,{stepType:current.type||null});message.textContent='This Discovery step is not supported by the QA interface yet. Your progress is saved.'}render();</script></body></html>
