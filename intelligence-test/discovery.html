<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence v0.1 · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 30px}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}.option.selected{outline:2px solid currentColor}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted)}.triage{padding:10px 0;border-top:1px solid var(--line)}.scale{display:flex;gap:5px;flex-wrap:wrap}.scale button{padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}.scale button.selected{background:var(--ink);color:var(--bg)}.tester textarea{width:100%;min-height:72px;box-sizing:border-box}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence v0.1 · Discovery</div></div></div><div class="el8-eyebrow">Adaptive Discovery</div><h1>Find what matters most.</h1><p>EL8 asks only what it still needs to understand.</p><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section class="el8-card tester"><strong>Tester Notes</strong><p class="small">Flag irrelevant, repetitive, confusing, or inconsistent behavior.</p><textarea id="testerNote"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note,installExitTest}from'./intelligence-test.js';import{createDiscoverySession,createDiscoverySessionFromHandoff,nextDiscoveryStep,answerDiscoveryQuestion,submitDiscoveryTriage,submitDiscoveryPriority,finishDiscovery}from'../app/onboarding/discovery-runtime.js';import{projectOnboardingMemberState}from'../app/onboarding/member-state-projection.js';import{buildCanonicalBrowserPriorities}from'../app/onboarding/canonical-browser-prioritization.js';let research=loadTestSession();if(!research){location.replace('index.html');throw Error('Test session required')}installExitTest({session:research,stage:'discovery',screenId:'adaptive-discovery'});const fresh=()=>research.discovery_handoff?createDiscoverySessionFromHandoff(research.discovery_handoff):createDiscoverySession();let s=research.discovery_session?{...research.discovery_session}:fresh(),finishing=false,current=null;if(research.discovery_session)s.questionBank=fresh().questionBank;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),message=document.getElementById('message'),testerNote=document.getElementById('testerNote'),EXCLUSIVE=new Set(['unsure','none','no','nothing','prefer_not_to_say']);function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function button(text,fn){const b=document.createElement('button');b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b)}async function saveNote(){const text=testerNote.value.trim();if(text){await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text});testerNote.value=''}}async function advance(fn,type,payload={}){await saveNote();await event(research,type,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render()}async function finish(){if(finishing)return;finishing=true;try{await saveNote();const output=finishDiscovery(s);research.discovery=output;research.member_state=projectOnboardingMemberState({memberId:`qa:${research.id}`,discoveryOutput:output});const prioritized=buildCanonicalBrowserPriorities({memberState:research.member_state,discoveryOutput:output});research.prioritization=prioritized.result;research.prioritization_decision_factors=prioritized.decisionFactors;research.recommended_priorities=prioritized.candidates;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{supportedProblemCount:prioritized.input.supportedProblemIds.length,priorityCandidateCount:prioritized.candidates.length,memberStateRevision:research.member_state.revision,baselineStatus:research.member_state.baseline.status,prioritizationSchema:prioritized.result.schemaVersion,decisionFactors:prioritized.decisionFactors});location.href='priorities.html'}catch(e){finishing=false;save();await event(research,'discovery_finish_blocked','discovery','incomplete',null,{reason:e.message,phase:s.phase,incomplete:s.incomplete,asked:s.asked||[],concernIds:s.concernIds||[]});prompt.innerHTML='<strong>Discovery needs more information before it can continue.</strong>';options.innerHTML='';controls.innerHTML='';message.textContent=e.message;button('Continue Discovery',()=>render())}}function render(){save();prompt.innerHTML='';options.innerHTML='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type,reason:current.stop?.reason||current.reason||null});if(current.type==='question'){prompt.innerHTML=`<strong>${current.question.text}</strong>`;let chosen=current.question.responseMode==='multi'?[]:null;const buttons=[];(current.question.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.label||o.text||o.id;buttons.push([o.id,b]);b.onclick=()=>{if(Array.isArray(chosen)){if(EXCLUSIVE.has(o.id))chosen=chosen.includes(o.id)?[]:[o.id];else{chosen=chosen.filter(x=>!EXCLUSIVE.has(x));chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([id,x])=>x.classList.toggle('selected',chosen.includes(id)))}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}};options.appendChild(b)});button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer.';return}advance(()=>answerDiscoveryQuestion(s,current.question,chosen),'discovery_answer',{answer:chosen})});return}if(current.type==='triage'){prompt.innerHTML='<strong>How important are these to you right now?</strong>';const values={};(current.question.concerns||s.concernIds.map(id=>({id,label:id}))).forEach(c=>{const wrap=document.createElement('div');wrap.className='triage';wrap.innerHTML=`<strong>${c.label||c.id}</strong>`;const scale=document.createElement('div');scale.className='scale';[['0','Not now'],['1','Somewhat'],['2','Important'],['3','Very']].forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{values[c.id]=+v;[...scale.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};scale.appendChild(b)});wrap.appendChild(scale);options.appendChild(wrap)});button('Continue',()=>{if(Object.keys(values).length<s.concernIds.length){message.textContent='Rate each area.';return}advance(()=>submitDiscoveryTriage(s,values),'discovery_triage',{values})});return}if(current.type==='priority-resolution'){prompt.innerHTML='<strong>Which one or two areas feel most important to you right now?</strong>';let chosen=[];(current.question.concerns||[]).forEach(c=>{const b=document.createElement('button');b.className='option';b.textContent=c.label||c.id;b.onclick=()=>{chosen=chosen.includes(c.id)?chosen.filter(x=>x!==c.id):chosen.length<2?[...chosen,c.id]:chosen;b.classList.toggle('selected',chosen.includes(c.id))};options.appendChild(b)});button('Continue',()=>{if(!chosen.length)return;advance(()=>submitDiscoveryPriority(s,chosen),'discovery_importance',{chosen})});return}if(current.type==='safety'){prompt.innerHTML='<strong>Safety confirmation required.</strong><p class="small">The canonical safety path has interrupted ordinary Discovery. Record the behavior for QA.</p>';return}if(current.type==='finish'&&current.stop?.incomplete){event(research,'discovery_incomplete','discovery','incomplete',null,{reason:current.stop.reason,concernIds:current.stop.concernIds||[],phase:s.phase,asked:s.asked||[]});prompt.innerHTML='<strong>Discovery is not ready to hand off yet.</strong>';message.textContent=`Internal QA stopped safely: ${current.stop.reason}. Your Discovery draft has been preserved.`;button('Retry Discovery',()=>render());return}finish()}render();</script></body></html>
