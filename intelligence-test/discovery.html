<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:760px;margin:auto;min-height:100vh;padding:54px 18px 70px}.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:24px 0}.progress span{display:block;width:0;height:100%;background:var(--gold)}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid currentColor}.choice-set.compact,.triage-answers.compact{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:9px 0}.choice-set.compact .option,.triage-answers.compact .option{width:auto;margin:0;padding:10px 12px;min-height:42px}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted)}textarea{width:100%;min-height:82px;box-sizing:border-box}.triage-item{padding:10px 0}.triage-item+.triage-item{border-top:1px solid var(--line)}.response-matrix{margin-top:16px;border:0}.matrix-head,.matrix-row{display:grid;grid-template-columns:minmax(112px,1.25fr) repeat(4,minmax(56px,.72fr));align-items:stretch}.matrix-head{font-size:12px;font-weight:700;color:var(--muted);text-align:center}.matrix-head>div,.matrix-row>div{padding:7px 5px}.matrix-row{border-top:1px solid var(--line)}.matrix-dimension{display:flex;align-items:center;font-weight:750}.matrix-choice{display:flex;align-items:stretch;justify-content:center;padding:4px!important}.matrix-choice button{width:100%;min-height:30px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}.matrix-choice button.selected{background:var(--ink);color:var(--bg)}.matrix-mobile-scale{display:none}@media(max-width:640px){.choice-set.compact,.triage-answers.compact{grid-template-columns:repeat(2,minmax(0,1fr))}.matrix-head{display:none}.matrix-row{display:block;margin:0;padding:10px 0}.matrix-row>div{padding:0}.matrix-dimension{font-size:15px;margin-bottom:7px}.matrix-mobile-scale{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px;color:var(--muted);font-size:9px;text-align:center}.matrix-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.matrix-choice{padding:0!important}.matrix-choice button{min-height:34px}}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="progress"><span id="progressFill"></span></div><div class="el8-eyebrow">Getting to know you</div><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section style="margin-top:20px"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" aria-label="Internal QA note" placeholder="Optional: note anything irrelevant, repetitive, confusing, missing, or inconsistent…"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';import{createDiscoverySession,nextDiscoveryStep,answerDiscoveryQuestion,answerDiscoveryInteraction,submitDiscoveryTriage,resolveDiscoveryConstruct,finishDiscovery,discoveryPriorityCandidates}from'../app/onboarding/discovery-runtime.js';installQaChrome({stage:'discovery',screenId:'adaptive-discovery'});let research=loadTestSession();if(!research){location.replace('index.html');throw Error('Test session required')}let s=research.discovery_session||createDiscoverySession(),finishing=false,current=null,noteSaving=false;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),message=document.getElementById('message'),testerNote=document.getElementById('testerNote'),progressFill=document.getElementById('progressFill'),EXCLUSIVE=new Set(['unsure','none','no','nothing','prefer_not_to_say']),COMPACT_CHOICE_THRESHOLD=8;function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function restore(){if(research.discovery_session)s={...research.discovery_session,questionBank:s.questionBank}}function button(text,fn){const b=document.createElement('button');b.type='button';b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b);return b}function humanize(v=''){return String(v).replaceAll('_',' ').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())}async function saveNote(){if(noteSaving)return;const text=testerNote.value.trim();if(!text)return;noteSaving=true;try{if(await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text}))testerNote.value=''}finally{noteSaving=false}}async function advance(fn,eventType,payload={}){await saveNote();await event(research,eventType,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render()}function selectionWidget(q,host,onChange,{forceCompact=false}={}){host.classList.add('choice-set');if(forceCompact||(q.options||[]).length>=COMPACT_CHOICE_THRESHOLD)host.classList.add('compact');let chosen=q.responseMode==='multi'?[]:null;const buttons=[];(q.options||[]).forEach(o=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=o.label||o.text||o.id;buttons.push([o.id,b]);b.onclick=()=>{if(q.responseMode==='multi'){if(EXCLUSIVE.has(o.id))chosen=chosen.includes(o.id)?[]:[o.id];else{chosen=chosen.filter(x=>!EXCLUSIVE.has(x));chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([id,x])=>x.classList.toggle('selected',chosen.includes(id)))}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}onChange(chosen)};host.appendChild(b)});return()=>chosen}async function finish(){if(finishing)return;finishing=true;await saveNote();try{const output=finishDiscovery(s),candidates=discoveryPriorityCandidates(output);research.discovery=output;research.recommended_priorities=candidates;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{candidateCount:candidates.length,traceStateCount:output.trace?.states?.length||0,questionCount:output.trace?.timing?.questionCount||0,incomplete:Boolean(output.trace?.incomplete)});location.href='priorities.html'}catch(e){finishing=false;message.textContent='Something interrupted this step. Your answers are still saved.';button('Try again',finish)}}function renderMatrix(){const qs=current.questions||[],answers={};prompt.innerHTML='<strong>How are things going in each area right now?</strong>';const scale=(qs[0]?.options||[]).map(o=>({id:o.id,label:o.label||o.text||o.id})),matrix=document.createElement('div');matrix.className='response-matrix';const head=document.createElement('div');head.className='matrix-head';head.innerHTML='<div></div>'+scale.map(o=>`<div>${o.label}</div>`).join('');matrix.appendChild(head);qs.forEach(q=>{const row=document.createElement('section');row.className='matrix-row';const d=document.createElement('div');d.className='matrix-dimension';d.textContent=q.label||humanize(q.dimension||q.constructId||q.id);row.appendChild(d);const ms=document.createElement('div');ms.className='matrix-mobile-scale';ms.innerHTML=scale.map(o=>`<span>${o.label}</span>`).join('');row.appendChild(ms);const choices=document.createElement('div');choices.className='matrix-choices';const rowButtons=[];(q.options||[]).forEach(o=>{const cell=document.createElement('div');cell.className='matrix-choice';const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`${d.textContent}: ${o.label||o.text||o.id}`);b.onclick=()=>{answers[q.id]=o.id;rowButtons.forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};rowButtons.push(b);cell.appendChild(b);choices.appendChild(cell)});row.appendChild(choices);matrix.appendChild(row)});options.appendChild(matrix);button('Continue',()=>{const missing=qs.filter(q=>!answers[q.id]);if(missing.length){message.textContent='Choose one response for each area.';return}advance(()=>answerDiscoveryInteraction(s,current,answers),'discovery_matrix_answer',{answers})})}function renderDriverScreen(){const qs=current.questions||[],answers={};prompt.innerHTML='<strong>What seems connected to what’s going on?</strong><p class="small">Select anything that seems to be contributing or being affected. These are possibilities to explore, not conclusions.</p>';qs.forEach(q=>{const wrap=document.createElement('section');wrap.className='triage-item';const choices=document.createElement('div');choices.className='triage-answers';selectionWidget(q,choices,v=>answers[q.id]=v,{forceCompact:true});wrap.appendChild(choices);options.appendChild(wrap)});button('Continue',()=>{const missing=qs.filter(q=>!(Array.isArray(answers[q.id])?answers[q.id].length:Boolean(answers[q.id])));if(missing.length){message.textContent='Choose what fits, or select the available none/not sure option.';return}advance(()=>answerDiscoveryInteraction(s,current,answers),'discovery_driver_relationship_answer',{questionIds:qs.map(q=>q.id),answers})})}function render(){restore();save();prompt.innerHTML='';options.innerHTML='';options.className='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);progressFill.style.width=current.type==='matrix'?'0%':current.type==='driver-triage'?'18%':'35%';event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type,interaction:current.interaction||null,reason:current.reason||current.stop?.reason||null});if(current.type==='question'){prompt.innerHTML=`<strong>${current.question.text}</strong>`;let chosen;selectionWidget(current.question,options,v=>chosen=v);button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer.';return}advance(()=>answerDiscoveryQuestion(s,current.question,chosen),'discovery_answer',{answer:chosen})});return}if(current.type==='matrix'){renderMatrix();return}if(current.type==='driver-triage'){renderDriverScreen();return}if(current.type==='triage'){const states=current.states||[],importance={};prompt.innerHTML='<strong>Which should matter most as EL8 decides where to focus?</strong>';if(states.length>=COMPACT_CHOICE_THRESHOLD)options.classList.add('choice-set','compact');for(const x of states){const id=x.constructId||x.concernId;importance[id]=0;const b=document.createElement('button');b.className='option';b.textContent=x.label||humanize(id);b.onclick=()=>{importance[id]=importance[id]?0:3;b.classList.toggle('selected',Boolean(importance[id]))};options.appendChild(b)}button('Continue',()=>advance(()=>submitDiscoveryTriage(s,importance),'discovery_triage',{importance}));return}if(current.type==='priority-resolution'){const target=current.concern||current.state||current.states?.[0],id=target?.constructId||target?.concernId;if(id){prompt.innerHTML=`<strong>Should EL8 keep ${target.label||humanize(id)} in mind?</strong>`;button('Yes',()=>advance(()=>resolveDiscoveryConstruct(s,id,'established'),'discovery_resolution',{constructId:id}));button('Not right now',()=>advance(()=>resolveDiscoveryConstruct(s,id,'deferred'),'discovery_resolution',{constructId:id}));return}}if(current.type==='safety'){prompt.innerHTML='<strong>A safety confirmation is required before ordinary recommendations continue.</strong>';return}if(current.type==='finish'){finish();return}message.textContent='This step could not be displayed. Your progress is saved.'}render();</script></body></html>
