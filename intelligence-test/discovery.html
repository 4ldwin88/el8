<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--line)}.stage span.done,.stage span.active{background:var(--gold)}.stage-labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.option{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.option.selected{outline:2px solid currentColor}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:13px;color:var(--muted);line-height:1.45}.helper{display:block;font-size:12px;color:var(--muted);font-style:italic;font-weight:400;margin-top:5px}.tester{margin-top:20px}.tester textarea{width:100%;min-height:82px;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence Test</div></div></div><div class="stage"><span class="done"></span><span class="active"></span><span></span><span></span></div><div class="stage-labels"><span>Baseline</span><span>Discovery</span><span>Priorities</span><span>Plan</span></div><div class="el8-eyebrow">Discovery</div><h1>Find what matters most.</h1><p>EL8 will ask only what it still needs to understand.</p><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section class="el8-card tester"><strong>Tester Notes</strong><p class="small">Did this question seem irrelevant, repetitive, confusing, or inconsistent with earlier answers? Tell us.</p><textarea id="testerNote" placeholder="Optional note about this question…"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{createDiscoverySessionFromHandoff,nextDiscoveryStep,answerDiscoveryQuestion,submitDiscoveryTriage,submitDiscoveryPriority,finishDiscovery,initialPlanProposal,discoveryPriorityCandidates}from'../app/onboarding/discovery-runtime.js';let research=loadTestSession();if(!research?.baseline_handoff){location.replace('baseline.html');throw Error('Baseline required')}let s=research.discovery_session||createDiscoverySessionFromHandoff(research.baseline_handoff),finishing=false,current=null;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),EXCLUSIVE=new Set(['unsure','none','no','nothing','prefer_not_to_say']);function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function restore(){if(research.discovery_session)s={...research.discovery_session,questionBank:s.questionBank}}function button(text,fn){const b=document.createElement('button');b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b)}async function saveNote(){const text=testerNote.value.trim();if(!text)return;const ok=await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text});if(ok)testerNote.value=''}async function advance(fn,eventType,payload={}){await saveNote();await event(research,eventType,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render()}async function finish(){if(finishing)return;finishing=true;await saveNote();prompt.textContent='Finishing Discovery…';options.innerHTML='';controls.innerHTML='';try{const output=finishDiscovery(s),proposal=initialPlanProposal(s),candidates=discoveryPriorityCandidates(output);research.discovery=output;research.recommended_priorities=candidates;research.proposed_plan=proposal;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{candidateCount:candidates.length,traceStateCount:output.trace?.states?.length||0});location.href='priorities.html'}catch(e){finishing=false;message.textContent='Discovery could not finish. '+e.message;button('Try again',finish)}}function render(){restore();save();prompt.innerHTML='';options.innerHTML='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type});if(current.type==='question'){prompt.innerHTML=`<strong>${current.question.text}</strong>${current.question.responseMode==='multi'?'<em class="helper">Select any that fit.</em>':''}`;let chosen=current.question.responseMode==='multi'?[]:null;const buttons=[];(current.question.options||[]).forEach(o=>{const b=document.createElement('button');b.className='option';b.textContent=o.label||o.text||o.id;buttons.push([o.id,b]);b.onclick=()=>{if(current.question.responseMode==='multi'){if(EXCLUSIVE.has(o.id)){chosen=chosen.includes(o.id)?[]:[o.id]}else{chosen=chosen.filter(x=>!EXCLUSIVE.has(x));chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([id,x])=>x.classList.toggle('selected',chosen.includes(id)))}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}};options.appendChild(b)});button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer to continue.';return}advance(()=>answerDiscoveryQuestion(s,current.question,chosen),'discovery_answer',{answer:chosen})});return}if(current.type==='triage'||current.type==='priority-resolution'){message.textContent='This step is no longer expected when Baseline already supplied member importance. If shown, please note it for the tester.'}finish()}render();</script></body></html>
