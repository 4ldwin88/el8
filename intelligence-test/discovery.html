<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Discovery</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:760px;margin:auto;min-height:100vh;padding:42px 18px 64px}.progress{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin:18px 0}.progress span{display:block;width:0;height:100%;background:var(--gold)}.option{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;line-height:1.25}.option.selected{outline:2px solid currentColor}.choice-set.compact,.triage-answers.compact{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:5px;margin:6px 0}.choice-set.compact .option,.triage-answers.compact .option{width:auto;margin:0;padding:7px 9px;min-height:34px}.row{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}textarea{width:100%;min-height:70px;box-sizing:border-box}.other-input{margin:7px 0 4px;min-height:42px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}.response-matrix{margin-top:8px;border:0}.matrix-head,.matrix-row{display:grid;grid-template-columns:minmax(145px,1.5fr) minmax(180px,1fr);align-items:center}.matrix-head{font-size:11px;font-weight:700;color:var(--muted);text-align:center}.matrix-head>div,.matrix-row>div{padding:4px}.matrix-row{border-top:1px solid var(--line);min-height:38px}.matrix-dimension{display:flex;align-items:center;font-weight:650;font-size:13px;line-height:1.25}.matrix-scale,.matrix-choices{display:grid;grid-template-columns:repeat(var(--scale-count,4),minmax(52px,1fr));gap:4px}.matrix-choice{display:flex;align-items:stretch;justify-content:center;padding:0!important}.matrix-choice button{width:100%;min-height:28px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--ink);font:inherit;font-size:12px;cursor:pointer}.matrix-choice button.selected{background:var(--ink);color:var(--bg)}.matrix-mobile-scale{display:none}@media(max-width:640px){.choice-set.compact,.triage-answers.compact{grid-template-columns:repeat(2,minmax(0,1fr))}.matrix-head{display:grid;grid-template-columns:minmax(100px,1.1fr) minmax(170px,1fr)}.matrix-row{grid-template-columns:minmax(100px,1.1fr) minmax(170px,1fr);padding:3px 0}.matrix-dimension{font-size:12px;margin:0}.matrix-scale,.matrix-choices{grid-template-columns:repeat(var(--scale-count,4),minmax(42px,1fr));gap:3px}.matrix-choice button{min-height:28px}}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="progress"><span id="progressFill"></span></div><div class="el8-eyebrow">Getting to know you</div><div class="el8-card"><div id="prompt"></div><div id="options"></div><div id="controls" class="row"></div></div><section style="margin-top:16px"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" aria-label="Internal QA note" placeholder="Optional: note anything irrelevant, repetitive, confusing, missing, or inconsistent…"></textarea></section><p id="message" class="small"></p></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';import{createDiscoverySession,nextDiscoveryStep,answerDiscoveryQuestion,answerDiscoveryInteraction,submitDiscoveryTriage,finishDiscovery,discoveryPriorityCandidates}from'../app/onboarding/discovery-runtime.js';installQaChrome({stage:'discovery',screenId:'adaptive-discovery'});let research=loadTestSession();if(!research){location.replace('index.html');throw Error('Test session required')}let s=research.discovery_session||createDiscoverySession(),finishing=false,current=null,noteSaving=false;const prompt=document.getElementById('prompt'),options=document.getElementById('options'),controls=document.getElementById('controls'),message=document.getElementById('message'),testerNote=document.getElementById('testerNote'),progressFill=document.getElementById('progressFill'),EXCLUSIVE=new Set(['unsure','none','no','nothing','prefer_not_to_say']),COMPACT_CHOICE_THRESHOLD=8;function save(){research.discovery_session={...s,questionBank:undefined};saveTestSession(research)}function restore(){if(research.discovery_session)s={...research.discovery_session,questionBank:s.questionBank}}function button(text,fn){const b=document.createElement('button');b.type='button';b.className='el8-btn';b.textContent=text;b.onclick=fn;controls.appendChild(b);return b}function humanize(v=''){return String(v).replaceAll('_',' ').toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())}function optionLabel(o={}){return String(o.label||o.text||o.id||'').trim()}function optionKey(o={}){return optionLabel(o).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}function optionTailRank(o={}){const id=String(o.id||'').toLowerCase(),label=optionKey(o);if(id==='none'||id==='nothing'||label==='none'||label==='none of these'||label==='nothing'||label==='nothing right now')return 1;if(id==='other'||id==='something_else'||id==='something-else'||label==='other'||label==='something else'||label.startsWith('something else '))return 2;if(id==='prefer_not_to_say'||label==='prefer not to say')return 3;return 0}function isOther(o={}){return optionTailRank(o)===2}function presentedOptions(raw=[]){const seen=new Set();return raw.filter(o=>{const key=optionKey(o);if(!key||seen.has(key))return false;seen.add(key);return true}).map((o,index)=>({o,index,rank:optionTailRank(o)})).sort((a,b)=>a.rank-b.rank||a.index-b.index).map(x=>x.o)}async function saveNote(){if(noteSaving)return;const text=testerNote.value.trim();if(!text)return;noteSaving=true;try{if(await note(research,{stage:'discovery',screenId:current?.type||'discovery',questionId:current?.question?.id||null,text}))testerNote.value=''}finally{noteSaving=false}}async function advance(fn,eventType,payload={}){await saveNote();await event(research,eventType,'discovery',current?.type||'discovery',current?.question?.id||null,payload);fn();save();render()}function selectionWidget(q,host,onChange,{forceCompact=false}={}){host.classList.add('choice-set');const shown=presentedOptions(q.options||[]);if(forceCompact||shown.length>=COMPACT_CHOICE_THRESHOLD)host.classList.add('compact');let chosen=q.responseMode==='multi'?[]:null,otherText='';const buttons=[],otherBox=document.createElement('textarea');otherBox.className='other-input';otherBox.placeholder='Tell EL8 what fits instead…';otherBox.hidden=true;otherBox.oninput=()=>{otherText=otherBox.value.trim();onChange(chosen,{otherText})};shown.forEach(o=>{const b=document.createElement('button');b.type='button';b.className='option';b.textContent=optionLabel(o);buttons.push([o.id,b]);b.onclick=()=>{if(q.responseMode==='multi'){if(EXCLUSIVE.has(o.id)||isOther(o))chosen=chosen.includes(o.id)?[]:[o.id];else{chosen=chosen.filter(x=>!EXCLUSIVE.has(x)&&!shown.some(y=>isOther(y)&&y.id===x));chosen=chosen.includes(o.id)?chosen.filter(x=>x!==o.id):[...chosen,o.id]}buttons.forEach(([id,x])=>x.classList.toggle('selected',chosen.includes(id)))}else{chosen=o.id;buttons.forEach(([,x])=>x.classList.remove('selected'));b.classList.add('selected')}otherBox.hidden=!isOther(o)||!(Array.isArray(chosen)?chosen.includes(o.id):chosen===o.id);if(otherBox.hidden){otherText='';otherBox.value=''}else otherBox.focus();onChange(chosen,{otherText})};host.appendChild(b)});host.appendChild(otherBox);return()=>({chosen,otherText})}async function finish(){if(finishing)return;finishing=true;await saveNote();try{const output=finishDiscovery(s),candidates=discoveryPriorityCandidates(output);research.discovery=output;research.recommended_priorities=candidates;research.stage='priorities';delete research.discovery_session;saveTestSession(research);await event(research,'discovery_complete','discovery','complete',null,{candidateCount:candidates.length,traceStateCount:output.trace?.states?.length||0,questionCount:output.trace?.timing?.questionCount||0,incomplete:Boolean(output.trace?.incomplete)});location.href='priorities.html'}catch(e){finishing=false;message.textContent='Something interrupted this step. Your answers are still saved.';button('Try again',finish)}}function sharedScaleMatrix(qs,answers,{labelsOnly=false}={}){const scale=presentedOptions(qs[0]?.options||[]).map(o=>({id:o.id,label:optionLabel(o)})),matrix=document.createElement('div');matrix.className='response-matrix';matrix.style.setProperty('--scale-count',String(scale.length));const head=document.createElement('div');head.className='matrix-head';head.innerHTML='<div></div>';const headScale=document.createElement('div');headScale.className='matrix-scale';scale.forEach(o=>{const x=document.createElement('div');x.textContent=o.label;headScale.appendChild(x)});head.appendChild(headScale);matrix.appendChild(head);qs.forEach(q=>{const row=document.createElement('section');row.className='matrix-row';const d=document.createElement('div');d.className='matrix-dimension';d.textContent=labelsOnly?(q.label||humanize(q.constructId||q.id)):(q.label||humanize(q.dimension||q.constructId||q.id));row.appendChild(d);const choices=document.createElement('div');choices.className='matrix-choices';const rowButtons=[];scale.forEach(o=>{const cell=document.createElement('div');cell.className='matrix-choice';const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`${d.textContent}: ${o.label}`);b.onclick=()=>{answers[q.id]=o.id;rowButtons.forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};rowButtons.push(b);cell.appendChild(b);choices.appendChild(cell)});row.appendChild(choices);matrix.appendChild(row)});options.appendChild(matrix)}function renderMatrix(){const qs=current.questions||[],answers={};prompt.innerHTML='<strong>How are things going in each area right now?</strong>';sharedScaleMatrix(qs,answers);button('Continue',()=>{const missing=qs.filter(q=>!answers[q.id]);if(missing.length){message.textContent='Choose one response for each area.';return}advance(()=>answerDiscoveryInteraction(s,current,answers),'discovery_matrix_answer',{answers})})}function renderDriverScreen(){const qs=current.questions||[],answers={},severity=current.interaction==='graph-severity-triage';prompt.innerHTML=severity?'<strong>How much is each of these affecting your day-to-day life?</strong><p class="small">For each item, choose how much impact it is having right now.</p>':'<strong>Could each of these be connected to what you’re experiencing?</strong><p class="small">For each item, choose Yes if it seems connected, No if it does not, or Not sure if you cannot tell yet. A connection is a hypothesis, not a causal conclusion.</p>';if(!qs.length){message.textContent='No items need review.';return}sharedScaleMatrix(qs,answers,{labelsOnly:true});button('Continue',()=>{const missing=qs.filter(q=>!answers[q.id]);if(missing.length){message.textContent='Choose one response for each item.';return}advance(()=>answerDiscoveryInteraction(s,current,answers),'discovery_driver_relationship_answer',{questionIds:qs.map(q=>q.id),answers})})}function render(){restore();save();prompt.innerHTML='';options.innerHTML='';options.className='';controls.innerHTML='';message.textContent='';current=nextDiscoveryStep(s);progressFill.style.width=current.type==='matrix'?'0%':current.type==='driver-triage'?'18%':'35%';event(research,'discovery_step_view','discovery',current.type,current.question?.id||null,{type:current.type,interaction:current.interaction||null,reason:current.reason||current.stop?.reason||null});if(current.type==='question'){prompt.innerHTML=`<strong>${current.question.text}</strong>`;let chosen,otherText='';selectionWidget(current.question,options,(v,meta={})=>{chosen=v;otherText=meta.otherText||''});button('Continue',()=>{if(!(Array.isArray(chosen)?chosen.length:Boolean(chosen))){message.textContent='Choose an answer.';return}const selected=presentedOptions(current.question.options||[]).find(o=>Array.isArray(chosen)?chosen.includes(o.id):chosen===o.id);if(selected&&isOther(selected)&&!otherText){message.textContent='Tell EL8 what fits instead.';return}advance(()=>answerDiscoveryQuestion(s,current.question,chosen),'discovery_answer',{answer:chosen,...(otherText?{otherText}: {})})});return}if(current.type==='matrix'){renderMatrix();return}if(current.type==='driver-triage'){renderDriverScreen();return}if(current.type==='triage'){const states=current.states||[],importance={};prompt.innerHTML='<strong>Which should matter most as EL8 decides where to focus?</strong>';if(states.length>=COMPACT_CHOICE_THRESHOLD)options.classList.add('choice-set','compact');for(const x of states){const id=x.constructId||x.concernId;importance[id]=0;const b=document.createElement('button');b.className='option';b.textContent=x.label||humanize(id);b.onclick=()=>{importance[id]=importance[id]?0:3;b.classList.toggle('selected',Boolean(importance[id]))};options.appendChild(b)}button('Continue',()=>advance(()=>submitDiscoveryTriage(s,importance),'discovery_triage',{importance}));return}if(current.type==='safety'){prompt.innerHTML='<strong>A safety confirmation is required before ordinary recommendations continue.</strong>';return}if(current.type==='finish'){finish();return}message.textContent='This step could not be displayed. Your progress is saved.'}render();</script></body></html>
