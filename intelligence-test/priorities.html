<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Focus</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:54px 18px 70px}.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:24px 0}.progress span{display:block;width:75%;height:100%;background:var(--gold)}.priority{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{background:var(--ink);color:var(--bg);border-color:var(--ink)}.small{font-size:12px;color:var(--muted)}.secondary{margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--line)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="progress"><span></span></div><div class="el8-eyebrow">Choose your focus</div><h1>Here’s what seems most worth considering.</h1><p>EL8 recommends the strongest starting points while keeping other well-supported options available. Choose one or more areas you want your plan to address.</p><div id="cards"></div><p id="msg" class="small"></p><button id="toPlan" type="button" class="el8-btn">Continue with my focus</button><button id="none" type="button" class="el8-btn secondary">None of these fit</button><section style="margin-top:22px"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" style="width:100%;min-height:80px;box-sizing:border-box" placeholder="Optional: note anything EL8 missed, ranked strangely, or misunderstood…"></textarea></section></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';installQaChrome({stage:'focus',screenId:'focus-confirmation'});const $=id=>document.getElementById(id),cards=$('cards'),msg=$('msg'),tester=$('testerNote');let s=loadTestSession();if(!s?.discovery){location.replace('discovery.html');throw Error('Discovery required')}async function initialize(){try{await event(s,'focus_bootstrap_started','focus','focus-confirmation',null,{hasDiscovery:true,discoveryCandidateCount:s.recommended_priorities?.length||0});const[{prioritizeCandidates},{confirmFocus,applyFocusConfirmation,focusConfirmationPlanningInput},{discoveryOutputToMemberState,memberStateToPrioritizationInput},{buildPlan}]=await Promise.all([import('../intelligence/prioritization/prioritization.js'),import('../intelligence/prioritization/focus-confirmation.js'),import('../intelligence/state/discovery-member-state-adapter.js'),import('../intelligence/planning/planningEngine.js')]);const memberState=discoveryOutputToMemberState(s.discovery,{memberId:`qa:${s.id}`}),priorityInput=memberStateToPrioritizationInput(memberState),discoveryCandidates=Array.isArray(s.recommended_priorities)?s.recommended_priorities:[],canonicalIds=new Set(priorityInput.candidates.map(x=>x.constructId)),usableDiscoveryCandidates=discoveryCandidates.filter(x=>canonicalIds.has(x.constructId)),prioritizationInput=usableDiscoveryCandidates.length?{...priorityInput,candidates:usableDiscoveryCandidates.map(x=>({constructId:x.constructId,status:'supported',evidenceRefs:x.evidenceRefs||priorityInput.candidates.find(c=>c.constructId===x.constructId)?.evidenceRefs||[]})),evidenceRefs:[...new Set(usableDiscoveryCandidates.flatMap(x=>x.evidenceRefs||[]))]}:{...priorityInput,candidates:[]},prioritization=prioritizeCandidates(prioritizationInput);await event(s,'focus_handoff','focus','focus-confirmation',null,{discoveryCandidateCount:discoveryCandidates.length,memberStateCandidateCount:priorityInput.candidates.length,usableCandidateCount:prioritizationInput.candidates.length});s.member_state=memberState;s.prioritization=prioritization;saveTestSession(s);const candidates=[...(prioritization.recommended??[]),...(prioritization.alternatives??[])],recommendedIds=new Set((prioritization.recommended??[]).map(x=>x.constructId)),selectedIds=new Set();const pretty=x=>String(x).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());cards.innerHTML=candidates.map(x=>`<button class="priority" type="button" data-id="${x.constructId}"><small>${recommendedIds.has(x.constructId)?'Recommended':'Other supported focus'}</small><br><strong>${pretty(x.constructId)}</strong></button>`).join('');if(!candidates.length){cards.innerHTML='<section class="el8-card"><h2>No well-supported Focus was produced.</h2><p>Discovery did not establish enough evidence for a Focus recommendation. Your answers are saved.</p></section>';$('toPlan').hidden=true;await event(s,'focus_no_supported_candidate','focus','focus-confirmation',null,{memberStateRevision:memberState.revision,discoveryCandidateCount:s.recommended_priorities?.length||0,memberStateCandidateCount:priorityInput.candidates.length,discoveryTraceStateCount:s.discovery?.trace?.states?.length||0});return}cards.onclick=e=>{const b=e.target.closest('.priority');if(!b)return;const id=b.dataset.id;selectedIds.has(id)?selectedIds.delete(id):selectedIds.add(id);document.querySelectorAll('.priority').forEach(x=>x.classList.toggle('selected',selectedIds.has(x.dataset.id)));event(s,selectedIds.has(id)?'focus_candidate_selected':'focus_candidate_removed','focus','focus-confirmation',null,{constructId:id,recommended:recommendedIds.has(id),selectedCount:selectedIds.size})};async function persistFocus(rejectAll=false){const accepted=rejectAll?[]:candidates.filter(x=>selectedIds.has(x.constructId));const decisions=candidates.map(({constructId})=>accepted.some(x=>x.constructId===constructId)?{constructId,decision:'accepted',memberRank:accepted.findIndex(x=>x.constructId===constructId)+1,reasonCodes:['member_selected_focus']}:{constructId,decision:'rejected',reasonCodes:[rejectAll?'member_rejected_candidate':'member_not_selected_focus']});const confirmation=confirmFocus({prioritization,decisions}),updatedState=applyFocusConfirmation(memberState,confirmation),confirmed=confirmation.accepted;let plan=null,planningInput=null;if(confirmed.length){planningInput=focusConfirmationPlanningInput(confirmation,{memberState:updatedState,evidenceRefs:priorityInput.evidenceRefs});plan=buildPlan(planningInput)}Object.assign(s,{focus_confirmation:confirmation,member_state:updatedState,confirmed_focus:confirmed,planning_input:planningInput,canonical_plan:plan,stage:'plan'});saveTestSession(s);if(tester.value.trim())await note(s,{stage:'focus',screenId:'focus-confirmation',text:tester.value});await event(s,confirmed.length?'focus_confirmed':'focus_rejected_all','focus','focus-confirmation',null,{focusIds:confirmed.map(x=>x.constructId),candidateCount:candidates.length,planStatus:plan?.status??'no_plan'});location.href='plan.html'}$('toPlan').onclick=async()=>{if(!selectedIds.size){msg.textContent='Choose at least one area, or use “None of these fit.”';await event(s,'focus_continue_blocked_no_selection','focus','focus-confirmation',null,{candidateCount:candidates.length});return}await persistFocus(false)};$('none').onclick=()=>persistFocus(true);await event(s,'focus_view','focus','focus-confirmation',null,{recommendedCount:prioritization.recommended?.length||0,alternativeCount:prioritization.alternatives?.length||0,candidateCount:candidates.length,memberStateRevision:memberState.revision,discoveryCandidateCount:s.recommended_priorities?.length||0,memberStateCandidateCount:priorityInput.candidates.length,discoveryTraceStateCount:s.discovery?.trace?.states?.length||0})}catch(error){await event(s,'focus_render_error','focus','focus-confirmation',null,{message:String(error?.message||error).slice(0,300)});cards.innerHTML='<section class="el8-card"><h2>Focus could not be formed.</h2><p>This is a QA failure. Your Discovery answers are saved. Use Exit to leave the test.</p></section>';$('toPlan').hidden=true;$('none').hidden=true;msg.textContent=String(error?.message||error)}}initialize();</script></body></html>
