<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Focus</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:54px 18px 70px}.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:24px 0}.progress span{display:block;width:75%;height:100%;background:var(--gold)}.priority{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{outline:2px solid var(--gold)}.small{font-size:12px;color:var(--muted)}.secondary{margin-top:10px;background:transparent;color:var(--ink);border:1px solid var(--line)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="progress"><span></span></div><div class="el8-eyebrow">Choose your focus</div><h1>Here’s what seems most worth considering.</h1><p>EL8 recommends the strongest starting point and keeps other legitimate options available.</p><div id="cards"></div><p id="msg" class="small"></p><button id="toPlan" type="button" class="el8-btn">Continue with my focus</button><button id="none" type="button" class="el8-btn secondary">None of these fit</button><button id="restartDiscovery" type="button" class="el8-btn secondary" hidden>Continue Discovery</button><section style="margin-top:22px"><label class="small" for="testerNote">QA note</label><textarea id="testerNote" style="width:100%;min-height:80px;box-sizing:border-box" placeholder="Optional: note anything EL8 missed, ranked strangely, or misunderstood…"></textarea></section></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{installQaChrome}from'./chrome.js';import{prioritizeCandidates}from'../intelligence/prioritization/prioritization.js';import{confirmFocus,applyFocusConfirmation,focusConfirmationPlanningInput}from'../intelligence/prioritization/focus-confirmation.js';import{discoveryOutputToMemberState,memberStateToPrioritizationInput}from'../intelligence/state/discovery-member-state-adapter.js';import{buildCanonicalPlan}from'../intelligence/planning/canonical-plan-engine.js';installQaChrome({stage:'focus',screenId:'focus-confirmation',backHref:'discovery.html'});const $=id=>document.getElementById(id),cards=$('cards'),msg=$('msg'),tester=$('testerNote');let s=loadTestSession();if(!s?.discovery){location.replace('discovery.html');throw Error('Discovery required')}let memberState,priorityInput,prioritization;try{memberState=discoveryOutputToMemberState(s.discovery,{memberId:`qa:${s.id}`});priorityInput=memberStateToPrioritizationInput(memberState);prioritization=prioritizeCandidates(priorityInput)}catch(error){await event(s,'focus_render_error','focus','focus-confirmation',null,{message:String(error?.message||error).slice(0,300)});msg.textContent='EL8 could not form a Focus from this Discovery. Go back and continue Discovery.';$('toPlan').hidden=true;$('none').hidden=true;$('restartDiscovery').hidden=false;$('restartDiscovery').onclick=()=>location.href='discovery.html';throw error}s.member_state=memberState;s.prioritization=prioritization;saveTestSession(s);const candidates=[...(prioritization.recommended??[]),...(prioritization.alternatives??[])],recommendedId=prioritization.recommended?.[0]?.constructId??null;let selectedId=null;const pretty=x=>String(x).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());cards.innerHTML=candidates.map((x,i)=>`<button class="priority" type="button" data-id="${x.constructId}"><small>${i<(prioritization.recommended?.length||0)?'Recommended':'Alternative'}</small><br><strong>${pretty(x.constructId)}</strong></button>`).join('');if(!candidates.length){cards.innerHTML='<section class="el8-card"><h2>EL8 does not have enough information yet.</h2><p>Discovery ended before it produced a supported Focus candidate. This is a test failure, not a result you need to act on.</p></section>';$('toPlan').hidden=true;$('none').hidden=true;$('restartDiscovery').hidden=false;await event(s,'focus_empty_dead_end_detected','focus','focus-confirmation',null,{recommendedCount:0,alternativeCount:0,memberStateRevision:memberState.revision,discoveryTraceStateCount:s.discovery?.trace?.states?.length||0});$('restartDiscovery').onclick=async()=>{await event(s,'focus_return_to_discovery','focus','focus-confirmation');location.href='discovery.html'}}cards.onclick=e=>{const b=e.target.closest('.priority');if(!b)return;selectedId=b.dataset.id;document.querySelectorAll('.priority').forEach(x=>x.classList.toggle('selected',x.dataset.id===selectedId));event(s,'focus_candidate_selected','focus','focus-confirmation',null,{constructId:selectedId,recommended:selectedId===recommendedId})};async function persistFocus(rejectAll=false){let decisions=rejectAll?candidates.map(({constructId})=>({constructId,decision:'rejected',reasonCodes:['member_rejected_candidate']})):[];if(selectedId&&!rejectAll){if(recommendedId&&selectedId!==recommendedId)decisions.push({constructId:recommendedId,decision:'replaced',replacementConstructId:selectedId,reasonCodes:['member_selected_alternative']});decisions.push({constructId:selectedId,decision:'accepted',memberRank:1,reasonCodes:['member_selected_focus']})}const confirmation=confirmFocus({prioritization,decisions}),updatedState=applyFocusConfirmation(memberState,confirmation),confirmed=confirmation.accepted;let plan=null,planningInput=null;if(confirmed.length){planningInput=focusConfirmationPlanningInput(confirmation,{memberState:updatedState,evidenceRefs:priorityInput.evidenceRefs});plan=buildCanonicalPlan(planningInput)}Object.assign(s,{focus_confirmation:confirmation,member_state:updatedState,confirmed_focus:confirmed,planning_input:planningInput,canonical_plan:plan,stage:'plan'});saveTestSession(s);if(tester.value.trim())await note(s,{stage:'focus',screenId:'focus-confirmation',text:tester.value});await event(s,confirmed.length?'focus_confirmed':'focus_rejected_all','focus','focus-confirmation',null,{focusIds:confirmed.map(x=>x.constructId),candidateCount:candidates.length,planStatus:plan?.status??'no_plan'});location.href='plan.html'}$('toPlan').onclick=async()=>{if(!selectedId){msg.textContent='Choose an area, or use “None of these fit.”';await event(s,'focus_continue_blocked_no_selection','focus','focus-confirmation',null,{candidateCount:candidates.length});return}await persistFocus(false)};$('none').onclick=()=>persistFocus(true);event(s,'focus_view','focus','focus-confirmation',null,{recommendedCount:prioritization.recommended?.length||0,alternativeCount:prioritization.alternatives?.length||0,candidateCount:candidates.length,memberStateRevision:memberState.revision,discoveryTraceStateCount:s.discovery?.trace?.states?.length||0});</script></body></html>
