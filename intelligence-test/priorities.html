<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Intelligence Test · Priorities</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 70px}.priority{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{outline:2px solid var(--gold);box-shadow:inset 4px 0 0 var(--gold)}.tag{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.priority.recommended .tag{color:var(--gold)}.confidence,.small{font-size:12px;color:var(--muted)}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:12px 0}.rating button{padding:11px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}.rating button.selected{background:var(--ink);color:var(--bg)}.tester textarea{width:100%;min-height:80px;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit}.error{color:#9b2c2c}.qa-back{display:inline-block;margin-top:18px;color:var(--muted);font-size:12px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Intelligence Test</div></div></div><div class="el8-eyebrow">What EL8 understood</div><h1 id="title">These look most important right now.</h1><p>Select up to two priorities that best match what should be focused on.</p><div id="cards"></div><div><strong>Did EL8 get the priorities right?</strong><div class="rating" id="ratings"><button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button></div><div class="small">1 = Not accurate · 5 = Very accurate</div></div><p id="msg" class="small error"></p><button id="toPlan" class="el8-btn">Confirm priorities</button><section class="el8-card tester" style="margin-top:22px"><strong>Tester Notes</strong><textarea id="testerNote" placeholder="Optional note…"></textarea></section><a class="qa-back" href="../qa.html">Back to QA menu</a></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{buildOnboardingAdaptivePlan}from'../app/onboarding/adaptive-plan.js';const $=id=>document.getElementById(id),cardsEl=$('cards'),msgEl=$('msg'),ratingsEl=$('ratings'),testerNoteEl=$('testerNote');let s=loadTestSession();if(!s?.discovery){location.replace('discovery.html');throw Error('Discovery required')}const candidates=s.recommended_priorities||[],selected=new Set(s.confirmed_priorities||[]),recommended=candidates.filter(x=>x.recommended).map(x=>x.concernId);const cap=x=>String(x||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase()),confidence=c=>Number(c.evidenceConfidence)>=.75?'Strong evidence':Number(c.evidenceConfidence)>=.45?'Moderate evidence':'Some evidence';cardsEl.innerHTML=candidates.map(c=>`<button type="button" class="priority ${c.recommended?'recommended':''}" data-id="${c.concernId}"><span class="tag">${c.recommended?'EL8 recommends':c.memberEmphasized?'You emphasized':'EL8 noticed'}</span><strong>${cap(c.label||c.concernId)}</strong><span class="confidence">${confidence(c)}</span></button>`).join('');function sync(){document.querySelectorAll('.priority').forEach(b=>b.classList.toggle('selected',selected.has(b.dataset.id)))}cardsEl.onclick=e=>{const b=e.target.closest('.priority');if(!b)return;if(selected.has(b.dataset.id))selected.delete(b.dataset.id);else if(selected.size<2)selected.add(b.dataset.id);else return msgEl.textContent='Choose up to two priorities.';sync()};let rating=s.priority_accuracy||null;ratingsEl.onclick=e=>{const b=e.target.closest('button');if(!b)return;rating=Number(b.dataset.v);[...ratingsEl.children].forEach(x=>x.classList.toggle('selected',x===b))};toPlan.onclick=async()=>{if(!selected.size)return msgEl.textContent='Choose at least one priority.';if(!rating)return msgEl.textContent='Please rate the priority accuracy before continuing.';s.confirmed_priorities=[...selected];s.priority_accuracy=rating;const adaptive=buildOnboardingAdaptivePlan({discoveryOutput:s.discovery,recommendedPriorities:recommended,confirmedPriorities:s.confirmed_priorities,baselineHandoff:s.baseline_handoff||{},selectionEvidence:s.selection_evidence||{}});s.adaptive_plan=adaptive;s.stage=adaptive.status==='deepen'?'selection-deepening':'plan';saveTestSession(s);if(testerNoteEl.value.trim())await note(s,{stage:'priorities',screenId:'priority-confirmation',text:testerNoteEl.value.trim()});await event(s,'priorities_confirmed','priorities','priority-confirmation',null,{recommended,confirmed:s.confirmed_priorities,nextState:adaptive.status,reason:adaptive.reason||null});location.href=adaptive.status==='deepen'?'selection-deepening.html':'plan.html'};sync();if(rating)[...ratingsEl.children].forEach(x=>x.classList.toggle('selected',Number(x.dataset.v)===rating));</script></body></html>
