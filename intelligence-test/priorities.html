<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Focus</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 70px}.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:24px 0}.progress span{display:block;width:75%;height:100%;background:var(--gold)}.priority{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{outline:2px solid var(--gold);box-shadow:inset 4px 0 0 var(--gold)}.tag{display:block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.qa{margin-top:22px}.qa-label{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.qa textarea{width:100%;min-height:80px;box-sizing:border-box;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit}.error{color:#9b2c2c;margin-top:10px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="../assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in focus.</div></div></div><div class="progress"><span></span></div><div class="el8-eyebrow">Choose your focus</div><h1>Here’s what seems most worth considering.</h1><p>These suggestions come from what you shared. EL8 can recommend where to start, but the choice is yours. Choose up to two, or go back if none feels right.</p><div id="cards"></div><p id="msg" class="small error"></p><button id="toPlan" type="button" class="el8-btn">Continue with my focus</button><section class="qa" aria-label="Internal QA note"><label class="qa-label" for="testerNote">QA note</label><textarea id="testerNote" placeholder="Optional: note anything EL8 missed, ranked strangely, or misunderstood…"></textarea></section></main><script type="module">import{loadTestSession,saveTestSession,event,note}from'./intelligence-test.js';import{prioritizeCandidates}from'../intelligence/prioritization/prioritization.js';import{discoveryOutputToMemberState,memberStateToPrioritizationInput}from'../intelligence/state/discovery-member-state-adapter.js';import{canonicalPlanningInputFromBrowser}from'../app/onboarding/browser-planning-adapter.js';import{buildCanonicalPlan}from'../intelligence/planning/canonical-plan-engine.js';const $=id=>document.getElementById(id),cards=$('cards'),msg=$('msg'),tester=$('testerNote');let s=loadTestSession();if(!s?.discovery){location.replace('discovery.html');throw Error('Discovery required')}const memberState=discoveryOutputToMemberState(s.discovery,{memberId:`qa:${s.id}`});const priorityInput=memberStateToPrioritizationInput(memberState);const prioritization=prioritizeCandidates(priorityInput);s.member_state=memberState;s.prioritization=prioritization;saveTestSession(s);const selected=new Set((s.confirmed_focus||[]).map(x=>x.constructId));const pretty=x=>String(x).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());cards.innerHTML=prioritization.recommended.map((x,i)=>`<button class="priority" type="button" data-id="${x.constructId}"><span class="tag">${i===0?'Recommended starting point':'Also worth considering'}</span><strong>${pretty(x.constructId)}</strong></button>`).join('')||'<section class="el8-card"><p>Nothing clearly needs to become a Focus from what you shared. That is a valid result.</p><p class="small">EL8 should not create a problem just to produce a Plan.</p></section>';cards.onclick=e=>{const b=e.target.closest('.priority');if(!b)return;const id=b.dataset.id;if(selected.has(id))selected.delete(id);else if(selected.size<2)selected.add(id);else{msg.textContent='Choose up to two areas for now.';return}msg.textContent='';document.querySelectorAll('.priority').forEach(x=>x.classList.toggle('selected',selected.has(x.dataset.id)))};document.getElementById('toPlan').onclick=async()=>{if(!selected.size){if(!prioritization.recommended.length){s.confirmed_focus=[];s.stage='plan';saveTestSession(s);await event(s,'focus_none_supported','focus','focus-confirmation',null,{memberStateRevision:memberState.revision});location.href='plan.html';return}msg.textContent='Choose an area, or go back if none feels right.';return}const confirmed=[...selected].map(constructId=>({constructId,decision:'accepted'}));const planningInput=canonicalPlanningInputFromBrowser({memberStateRevision:memberState.revision,confirmedFocus:confirmed,evidenceRefs:priorityInput.evidenceRefs});const plan=buildCanonicalPlan(planningInput);s.confirmed_focus=confirmed;s.planning_input=planningInput;s.canonical_plan=plan;s.stage='plan';saveTestSession(s);if(tester.value.trim())await note(s,{stage:'focus',screenId:'focus-confirmation',text:tester.value});await event(s,'focus_confirmed','focus','focus-confirmation',null,{focusIds:[...selected],memberStateRevision:memberState.revision,planStatus:plan.status});location.href='plan.html'};document.querySelectorAll('.priority').forEach(x=>x.classList.toggle('selected',selected.has(x.dataset.id)));event(s,'focus_view','focus','focus-confirmation',null,{candidateCount:prioritization.recommended.length,memberStateRevision:memberState.revision});</script></body></html>
