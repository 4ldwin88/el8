<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · History</title><style>:root{--g:#D6A648;--bg:#F7F3EA;--card:#fffdf8;--ink:#121417;--muted:#6d6c66;--line:#e5ded1}html[data-theme=dark]{--bg:#121417;--card:#1b1e22;--ink:#F7F3EA;--muted:#aaa79f;--line:#34373b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Inter,system-ui,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 80px}.brand{font-size:28px;letter-spacing:.12em}.tag,.eyebrow{color:var(--g);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.eyebrow{margin-top:28px}h1{font-size:34px;margin:9px 0 12px}p{color:var(--muted);line-height:1.45}.back{color:var(--ink);text-decoration:none;font-weight:800}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filter{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;white-space:nowrap}.filter.active{background:var(--ink);color:var(--bg)}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;cursor:pointer}.meta{font-size:12px;color:var(--muted);margin-bottom:6px}.summary{font-weight:800}.pill{display:inline-block;font-size:11px;color:var(--g);margin-top:8px}.empty{padding:28px 4px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);font:inherit}.field textarea{min-height:90px}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;margin-top:9px}.primary{background:var(--ink);color:var(--bg)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.danger{color:#a33}.status{font-size:13px;color:var(--muted)}</style></head><body><div class="app"><a class="back" href="app.html#me">← Me</a><div class="brand">EL8</div><div class="tag">Life, in balance.</div><div class="eyebrow">Me · History</div><h1>Your record.</h1><p>Tracking, check-ins and assessments will live together here. Edit mistakes or remove records that should no longer affect EL8.</p><div class="filters"><button class="filter active" data-type="all">All</button><button class="filter" data-type="tracking">Tracking</button><button class="filter" data-type="checkin">Check-ins</button><button class="filter" data-type="assessment">Assessments</button></div><div id="status" class="status">Loading…</div><div id="list"></div></div><div class="modal" id="modal"><div class="sheet"><h2>Edit record</h2><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div class="field"><label>Dimension</label><input id="dimension"></div><div class="field"><label>Category</label><input id="category"></div><button class="primary" id="save">Save changes</button><button class="secondary danger" id="delete">Delete from History</button><button class="secondary" id="close">Cancel</button></div></div><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light';const $=id=>document.getElementById(id);let profile,entries=[],filter='all',current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fmt(iso){return new Intl.DateTimeFormat(undefined,{timeZone:profile.timezone||'UTC',dateStyle:'medium',timeStyle:'short'}).format(new Date(iso))}function render(){const rows=entries.filter(e=>!e.deleted_at&&(filter==='all'||e.record_type===filter));$('status').textContent=rows.length?`${rows.length} record${rows.length===1?'':'s'}`:'No records yet.';$('list').innerHTML=rows.map((e,i)=>`<div class="item" data-id="${esc(e.entry_id)}"><div class="meta">${esc(fmt(e.payload?.event_time||e.created_at))}</div><div class="summary">${esc(e.payload?.summary||e.record_type)}</div><div class="pill">${esc(e.payload?.dimension||'Unclassified')} · ${esc(e.payload?.category||e.record_type)}</div></div>`).join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openEntry(x.dataset.id))}function openEntry(id){current=entries.find(e=>e.entry_id===id);if(!current)return;$('summary').value=current.payload?.summary||'';$('dimension').value=current.payload?.dimension||'';$('category').value=current.payload?.category||'';$('modal').classList.add('show')}async function load(){const{data,error}=await supabase.from('el8_entries').select('*').eq('member_id',profile.member_code).order('created_at',{ascending:false});if(error)throw error;entries=data||[];render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.type;render()});$('close').onclick=()=>$('modal').classList.remove('show');$('save').onclick=async()=>{if(!current)return;const payload={...current.payload,summary:$('summary').value.trim(),dimension:$('dimension').value.trim(),category:$('category').value.trim(),member_edited_at:new Date().toISOString()};const{error}=await supabase.from('el8_entries').update({payload,confirmation_status:'corrected'}).eq('entry_id',current.entry_id).eq('member_id',profile.member_code);if(error){alert(error.message);return}current.payload=payload;current.confirmation_status='corrected';$('modal').classList.remove('show');render()};$('delete').onclick=async()=>{if(!current||!confirm('Remove this record from EL8 History and calculations?'))return;const now=new Date().toISOString();const{error}=await supabase.from('el8_entries').update({deleted_at:now}).eq('entry_id',current.entry_id).eq('member_id',profile.member_code);if(error){alert(error.message);return}current.deleted_at=now;$('modal').classList.remove('show');render()};await getSessionOrRedirect();profile=await getMyProfile();await load();</script></body></html>
