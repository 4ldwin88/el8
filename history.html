<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · History</title><style>:root{--g:#D6A648;--bg:#F7F3EA;--card:#fffdf8;--ink:#121417;--muted:#6d6c66;--line:#e5ded1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 80px}.brand{font-size:28px;font-weight:850}.eyebrow{color:var(--g);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:28px}h1{font-size:34px;margin:9px 0 12px}p{color:var(--muted);line-height:1.45}.back{color:var(--ink);text-decoration:none;font-weight:800}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filter{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;white-space:nowrap}.filter.active{background:var(--ink);color:var(--bg)}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;cursor:pointer}.meta{font-size:12px;color:var(--muted);margin-bottom:6px}.summary{font-weight:800}.pill{display:inline-block;font-size:11px;color:var(--g);margin-top:8px}.status{font-size:13px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px}.previewRow{padding:11px 0;border-bottom:1px solid var(--line)}.previewRow:last-child{border-bottom:0}.previewLabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.previewValue{line-height:1.45;white-space:pre-wrap}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);font:inherit}.field textarea{min-height:80px}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;margin-top:9px}.primary{background:var(--ink);color:var(--bg)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.danger{color:#a33}.hidden{display:none}</style></head><body><div class="app"><a class="back" href="app.html#me">← Me</a><div class="brand">EL8</div><div class="eyebrow">Me · History</div><h1>Your record.</h1><p>Tracking, check-ins and assessments live together here. Open a record to review it.</p><div class="filters"><button class="filter active" data-type="all">All</button><button class="filter" data-type="tracking">Tracking</button><button class="filter" data-type="checkin">Check-ins</button><button class="filter" data-type="assessment">Assessments</button></div><div id="status" class="status">Loading…</div><div id="list"></div></div><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Record</h2><div id="preview"></div><div id="editor" class="hidden"><div id="trackingFields"><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div class="field"><label>Dimension</label><input id="dimension"></div><div class="field"><label>Category</label><input id="category"></div></div><div id="dailyFields" class="hidden"><div class="field"><label>Employment & income</label><textarea id="employment"></textarea></div><div class="field"><label>Debt</label><select id="debt"><option value="better">Better</option><option value="unchanged">Unchanged</option><option value="worse">Worse</option></select></div><div class="field"><label>Eating</label><select id="eating"><option value="on_plan">On plan</option><option value="partly_on_plan">Partly on plan</option><option value="off_plan">Off plan</option></select></div><div class="field"><label>Movement</label><input id="movement"></div><div class="field"><label>Manageability</label><select id="manage"><option value="easy">Easy</option><option value="manageable">Manageable</option><option value="difficult">Difficult</option><option value="too_much">Too much</option></select></div><div class="field"><label>Note</label><textarea id="note"></textarea></div></div><div id="weeklyFields" class="hidden"><div class="field"><label>Overall week</label><select id="wOverall"><option value="very_difficult">Very difficult</option><option value="difficult">Difficult</option><option value="mixed">Mixed</option><option value="good">Good</option><option value="very_good">Very good</option></select></div><div class="field"><label>Meaningful progress</label><textarea id="wProgress"></textarea></div><div class="field"><label>Friction</label><textarea id="wFriction"></textarea></div><div class="field"><label>Employment / income</label><textarea id="wEmployment"></textarea></div><div class="field"><label>Debt</label><select id="wDebt"><option value="better">Better</option><option value="unchanged">Unchanged</option><option value="worse">Worse</option></select></div><div class="field"><label>Eating</label><select id="wEating"><option value="mostly_on_plan">Mostly on plan</option><option value="mixed">Mixed</option><option value="mostly_off_plan">Mostly off plan</option></select></div><div class="field"><label>Movement</label><input id="wMovement"></div><div class="field"><label>Manageability</label><select id="wManage"><option value="easy">Easy</option><option value="manageable">Manageable</option><option value="difficult">Difficult</option><option value="too_much">Too much</option></select></div><div class="field"><label>Plan adjustment</label><textarea id="wAdjustment"></textarea></div><div class="field"><label>Note</label><textarea id="wNote"></textarea></div></div></div><button class="primary" id="edit">Edit</button><button class="primary hidden" id="save">Save changes</button><button class="secondary danger" id="delete">Delete</button><button class="secondary" id="cancelEdit">Cancel editing</button><button class="secondary" id="close">Close</button></div></div><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const $=id=>document.getElementById(id);let session,profile,records=[],filter='all',current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=s=>String(s??'—').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());const tz=()=>profile?.timezone||'America/Toronto';function fmt(iso){return new Intl.DateTimeFormat('en-CA',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)).replace(',','')}function render(){const rows=records.filter(r=>filter==='all'||r.type===filter).sort((a,b)=>new Date(b.time)-new Date(a.time));$('status').textContent=rows.length?`${rows.length} record${rows.length===1?'':'s'}`:'No records yet.';$('list').innerHTML=rows.map(r=>`<div class="item" data-key="${esc(r.key)}"><div class="meta">${esc(fmt(r.time))}</div><div class="summary">${esc(r.title)}</div><div class="pill">${esc(r.label)}</div></div>`).join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openRecord(x.dataset.key))}function rows(a){return a.filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=='').map(([l,v])=>`<div class="previewRow"><div class="previewLabel">${esc(l)}</div><div class="previewValue">${esc(v)}</div></div>`).join('')}function previewCurrent(){const r=current.raw;if(current.kind==='daily')return rows([['Logged',fmt(current.time)],['Date',r.local_date?.replaceAll('-','/')],['Employment & income',r.employment_action],['Debt',pretty(r.debt_status)],['Eating',pretty(r.eating_status)],['Movement',r.movement],['Manageability',pretty(r.manageability)],['Note',r.member_note]]);if(current.kind==='weekly'){const s=r.active_signals||{};return rows([['Logged',fmt(current.time)],['Period',`${r.week_start?.replaceAll('-','/')}–${r.week_end?.replaceAll('-','/')}`],['Overall week',pretty(r.overall_week)],['Meaningful progress',r.progress],['Friction',r.friction],['Employment & income',s.employment_income],['Debt',pretty(s.debt)],['Eating',pretty(s.eating)],['Movement',s.movement],['Manageability',pretty(s.manageability)],['Plan adjustment',r.plan_adjustment],['Note',r.member_note]]);}const p=r.payload||{};return rows([['Logged',fmt(current.time)],['Summary',p.summary],['Dimension',p.dimension||'Unclassified'],['Category',p.category||'Tracking'],['Confidence',pretty(p.confidence)],['Nutrition',p.nutrition_summary||p.nutrition||null]]);}function setMode(editing){$('preview').classList.toggle('hidden',editing);$('editor').classList.toggle('hidden',!editing);$('edit').classList.toggle('hidden',editing);$('save').classList.toggle('hidden',!editing);$('cancelEdit').classList.toggle('hidden',!editing);$('close').classList.toggle('hidden',editing);$('delete').classList.toggle('hidden',editing||current?.kind!=='tracking')}function fillEditor(){const r=current.raw,daily=current.kind==='daily',weekly=current.kind==='weekly';$('trackingFields').classList.toggle('hidden',daily||weekly);$('dailyFields').classList.toggle('hidden',!daily);$('weeklyFields').classList.toggle('hidden',!weekly);if(daily){$('employment').value=r.employment_action||'';$('debt').value=r.debt_status||'unchanged';$('eating').value=r.eating_status||'partly_on_plan';$('movement').value=r.movement||'';$('manage').value=r.manageability||'manageable';$('note').value=r.member_note||''}else if(weekly){const s=r.active_signals||{};$('wOverall').value=r.overall_week;$('wProgress').value=r.progress||'';$('wFriction').value=r.friction||'';$('wEmployment').value=s.employment_income||'';$('wDebt').value=s.debt||'unchanged';$('wEating').value=s.eating||'mixed';$('wMovement').value=s.movement||'';$('wManage').value=s.manageability||'manageable';$('wAdjustment').value=r.plan_adjustment||'';$('wNote').value=r.member_note||''}else{$('summary').value=r.payload?.summary||'';$('dimension').value=r.payload?.dimension||'';$('category').value=r.payload?.category||''}}function openRecord(key){current=records.find(r=>r.key===key);if(!current)return;$('modalTitle').textContent=current.kind==='daily'?'Daily check-in':current.kind==='weekly'?'Weekly check-in':'Tracking record';$('preview').innerHTML=previewCurrent();fillEditor();setMode(false);$('modal').classList.add('show')}async function load(){const[entriesRes,dailyRes,weeklyRes]=await Promise.all([supabase.from('el8_entries').select('*').eq('member_id',profile.member_code).is('deleted_at',null),supabase.from('el8_daily_checkins').select('*').eq('user_id',session.user.id),supabase.from('el8_weekly_checkins').select('*').eq('user_id',session.user.id)]);for(const r of[entriesRes,dailyRes,weeklyRes])if(r.error)throw r.error;records=(entriesRes.data||[]).map(e=>({key:'entry:'+e.entry_id,type:e.record_type||'tracking',kind:'tracking',time:e.payload?.event_time||e.created_at,title:e.payload?.summary||'Tracking record',label:`${e.payload?.dimension||'Unclassified'} · ${e.payload?.category||'Tracking'}`,raw:e})).concat((dailyRes.data||[]).map(c=>({key:'daily:'+c.id,type:'checkin',kind:'daily',time:c.submitted_at||c.updated_at,title:`Daily check-in · ${c.local_date.replaceAll('-','/')}`,label:'Daily check-in',raw:c})),(weeklyRes.data||[]).map(c=>({key:'weekly:'+c.id,type:'checkin',kind:'weekly',time:c.submitted_at||c.updated_at,title:`Weekly check-in · ${c.week_start.replaceAll('-','/')}–${c.week_end.replaceAll('-','/')}`,label:'Weekly check-in',raw:c})));render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));filter=b.dataset.type;render()});$('close').onclick=()=>$('modal').classList.remove('show');$('edit').onclick=()=>setMode(true);$('cancelEdit').onclick=()=>{fillEditor();setMode(false)};$('save').onclick=async()=>{if(!current)return;if(current.kind==='daily'){const changes={employment_action:$('employment').value.trim(),debt_status:$('debt').value,eating_status:$('eating').value,movement:$('movement').value.trim(),manageability:$('manage').value,member_note:$('note').value.trim()||null,updated_at:new Date().toISOString()};const{data,error}=await supabase.from('el8_daily_checkins').update(changes).eq('id',current.raw.id).eq('user_id',session.user.id).select().single();if(error)return alert(error.message);current.raw=data}else if(current.kind==='weekly'){const changes={overall_week:$('wOverall').value,progress:$('wProgress').value.trim(),friction:$('wFriction').value.trim(),plan_adjustment:$('wAdjustment').value.trim()||null,member_note:$('wNote').value.trim()||null,active_signals:{employment_income:$('wEmployment').value.trim(),debt:$('wDebt').value,eating:$('wEating').value,movement:$('wMovement').value.trim(),manageability:$('wManage').value},updated_at:new Date().toISOString()};const{data,error}=await supabase.from('el8_weekly_checkins').update(changes).eq('id',current.raw.id).eq('user_id',session.user.id).select().single();if(error)return alert(error.message);current.raw=data}else{const payload={...current.raw.payload,summary:$('summary').value.trim(),dimension:$('dimension').value.trim(),category:$('category').value.trim(),member_edited_at:new Date().toISOString()};const{error}=await supabase.from('el8_entries').update({payload,confirmation_status:'corrected'}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);current.raw.payload=payload;current.title=payload.summary;current.label=`${payload.dimension||'Unclassified'} · ${payload.category||'Tracking'}`}$('preview').innerHTML=previewCurrent();setMode(false);render()};$('delete').onclick=async()=>{if(!current||current.kind!=='tracking'||!confirm('Remove this record from EL8 History and calculations?'))return;const{error}=await supabase.from('el8_entries').update({deleted_at:new Date().toISOString()}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);records=records.filter(r=>r!==current);$('modal').classList.remove('show');render()};try{session=await getSessionOrRedirect();profile=await getMyProfile();await load()}catch(e){$('status').textContent='History could not load: '+(e.message||String(e))}</script></body></html>
