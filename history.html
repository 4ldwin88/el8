<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EL8 · History</title>
<link rel="stylesheet" href="assets/el8-ui.css">
<style>
.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 80px}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filter{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;white-space:nowrap}.filter.active{background:var(--ink);color:var(--bg)}
.monthNav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:18px 0 8px}.monthNav button,.monthPick{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;min-height:44px;font:inherit;font-weight:800}.monthPick{display:flex;justify-content:center;align-items:center;gap:8px;padding:0 10px}.monthPick select{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:800}
.day{margin:12px 0}.dayHead{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--ink);padding:13px 3px;font:inherit;text-align:left}.dayTitle{font-size:17px;font-weight:850}.dayCount{font-size:12px;color:var(--muted);margin-left:auto;margin-right:10px}.chev{transition:.18s}.day.open .chev{transform:rotate(180deg)}.dayBody{display:none}.day.open .dayBody{display:block}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0;cursor:pointer}.meta{font-size:12px;color:var(--muted);margin-bottom:6px}.summary{font-weight:800}.pill{display:inline-block;font-size:11px;color:var(--g);margin-top:8px}.status{font-size:13px;color:var(--muted);margin:8px 0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px}.previewRow{padding:11px 0;border-bottom:1px solid var(--line)}.previewLabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.previewValue{line-height:1.45;white-space:pre-wrap}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)}.field textarea{min-height:80px}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;margin-top:9px}.primary{background:var(--ink);color:var(--bg)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.danger{color:#a33}.hidden{display:none}.immutable{border-left:3px solid var(--g);background:var(--card);padding:12px 14px;border-radius:12px;margin:12px 0;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="app">
<div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div>
<div class="el8-eyebrow">Me · History</div><h1>Your record.</h1><p>Tracking, check-ins and assessments live together here. Open a record to review it.</p>
<div class="filters"><button class="filter active" data-type="all">All</button><button class="filter" data-type="tracking">Tracking</button><button class="filter" data-type="checkin">Check-ins</button><button class="filter" data-type="assessment">Assessments</button></div>
<div class="monthNav"><button id="prevMonth">‹</button><div class="monthPick"><select id="monthSelect"></select><select id="yearSelect"></select></div><button id="nextMonth">›</button></div>
<div id="status" class="status">Loading…</div><div id="list"></div><button class="el8-bottom-action" id="backMe">Back to Me</button>
</div>
<div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Record</h2><div id="immutable" class="immutable hidden"></div><div id="preview"></div><div id="editor" class="hidden"><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div class="field"><label>Dimension</label><input id="dimension"></div><div class="field"><label>Category</label><input id="category"></div></div><button class="primary" id="edit">Edit tracking record</button><button class="primary hidden" id="save">Save changes</button><button class="secondary danger" id="delete">Delete tracking record</button><button class="secondary hidden" id="cancelEdit">Cancel editing</button><button class="secondary" id="close">Close</button></div></div>
<script type="module">
import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';
const $=id=>document.getElementById(id);let session,profile,records=[],filter='all',current=null,viewDate=new Date(),openDays=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=s=>String(s??'—').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());const tz=()=>profile?.timezone||'America/Toronto';
function localParts(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),g=t=>p.find(x=>x.type===t)?.value;return{y:+g('year'),m:+g('month'),d:+g('day'),key:`${g('year')}-${g('month')}-${g('day')}`}}function dateKey(iso){return localParts(new Date(iso)).key}function fmtTime(iso){return new Intl.DateTimeFormat('en-CA',{timeZone:tz(),hour:'numeric',minute:'2-digit'}).format(new Date(iso))}function fmtFull(iso){return new Intl.DateTimeFormat('en-CA',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)).replace(',','')}function dateLabel(key){const[y,m,d]=key.split('-').map(Number),today=localParts(new Date()).key,label=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'long',day:'numeric',year:'numeric'}).format(new Date(Date.UTC(y,m-1,d)));return key===today?`Today, ${label}`:label}
function initSelectors(){const months=Array.from({length:12},(_,i)=>new Intl.DateTimeFormat('en-US',{month:'long'}).format(new Date(2000,i,1))),now=localParts(new Date()),years=[];$('monthSelect').innerHTML=months.map((x,i)=>`<option value="${i}">${x}</option>`).join('');for(let y=now.y+1;y>=now.y-10;y--)years.push(y);$('yearSelect').innerHTML=years.map(y=>`<option>${y}</option>`).join('');viewDate=new Date(now.y,now.m-1,1);syncSelectors()}function syncSelectors(){$('monthSelect').value=viewDate.getMonth();$('yearSelect').value=viewDate.getFullYear()}
function render(){const vm=viewDate.getMonth()+1,vy=viewDate.getFullYear(),rs=records.filter(r=>(filter==='all'||r.type===filter)&&(()=>{const p=localParts(new Date(r.time));return p.y===vy&&p.m===vm})()).sort((a,b)=>new Date(b.time)-new Date(a.time));$('status').textContent=rs.length?`${rs.length} record${rs.length===1?'':'s'} in ${new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(viewDate)}`:`No records in ${new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(viewDate)}.`;const groups={};rs.forEach(r=>(groups[dateKey(r.time)]??=[]).push(r));const keys=Object.keys(groups).sort().reverse(),today=localParts(new Date()).key;if(keys.length&&!openDays.size)openDays.add(keys.includes(today)?today:keys[0]);$('list').innerHTML=keys.map(k=>`<section class="day ${openDays.has(k)?'open':''}" data-day="${k}"><button class="dayHead"><span class="dayTitle">${esc(dateLabel(k))}</span><span class="dayCount">${groups[k].length}</span><span class="chev">⌄</span></button><div class="dayBody">${groups[k].map(r=>`<div class="item" data-key="${esc(r.key)}"><div class="meta">${esc(fmtTime(r.time))}</div><div class="summary">${esc(r.title)}</div><div class="pill">${esc(r.label)}</div></div>`).join('')}</div></section>`).join('');document.querySelectorAll('.dayHead').forEach(b=>b.onclick=()=>{const s=b.closest('.day'),k=s.dataset.day;s.classList.toggle('open');s.classList.contains('open')?openDays.add(k):openDays.delete(k)});document.querySelectorAll('.item').forEach(x=>x.onclick=e=>{e.stopPropagation();openRecord(x.dataset.key)})}
function rows(a){return a.filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=='').map(([l,v])=>`<div class="previewRow"><div class="previewLabel">${esc(l)}</div><div class="previewValue">${esc(typeof v==='object'?JSON.stringify(v,null,2):v)}</div></div>`).join('')}function previewCurrent(){const r=current.raw;if(current.kind==='assessment')return rows([['Submitted',fmtFull(current.time)],['Assessment',current.title],['Version',r.module_version],['Status',pretty(r.status)],['Responses',r.responses],['Results',r.derived_outputs],['Active completion time',r.active_duration_seconds!=null?`${r.active_duration_seconds} seconds`:null]]);if(current.kind==='daily')return rows([['Logged',fmtFull(current.time)],['Date',r.local_date?.replaceAll('-','/')],['Employment & income',r.employment_action],['Debt',pretty(r.debt_status)],['Eating',pretty(r.eating_status)],['Movement',r.movement],['Manageability',pretty(r.manageability)],['Note',r.member_note]]);if(current.kind==='weekly'){const s=r.active_signals||{};return rows([['Logged',fmtFull(current.time)],['Period',`${r.week_start?.replaceAll('-','/')}–${r.week_end?.replaceAll('-','/')}`],['Overall week',pretty(r.overall_week)],['Meaningful progress',r.progress],['Friction',r.friction],['Employment & income',s.employment_income],['Debt',pretty(s.debt)],['Eating',pretty(s.eating)],['Movement',s.movement],['Manageability',pretty(s.manageability)],['Plan adjustment',r.plan_adjustment],['Note',r.member_note]])}const p=r.payload||{};return rows([['Logged',fmtFull(current.time)],['Summary',p.summary],['Dimension',p.dimension||'Unclassified'],['Category',p.category||'Tracking'],['Confidence',pretty(p.confidence)],['Nutrition',p.nutrition_summary||p.nutrition||null]])}
function setMode(editing=false){const locked=current?.kind!=='tracking';$('immutable').classList.toggle('hidden',!locked);$('immutable').textContent=current?.kind==='assessment'?'Submitted assessments are permanent records. To measure change, complete a new reassessment rather than editing this result.':locked?'Submitted check-ins are permanent historical records. Future check-ins capture later changes without rewriting what was reported at the time.':'';$('preview').classList.toggle('hidden',editing);$('editor').classList.toggle('hidden',!editing);$('edit').classList.toggle('hidden',editing||locked);$('save').classList.toggle('hidden',!editing||locked);$('cancelEdit').classList.toggle('hidden',!editing||locked);$('close').classList.toggle('hidden',editing);$('delete').classList.toggle('hidden',editing||locked)}
function openRecord(key){current=records.find(r=>r.key===key);if(!current)return;$('modalTitle').textContent=current.title;$('preview').innerHTML=previewCurrent();setMode(false);$('modal').classList.add('show')}$('edit').onclick=()=>{if(current?.kind!=='tracking')return;const p=current.raw.payload||{};$('summary').value=p.summary||'';$('dimension').value=p.dimension||'';$('category').value=p.category||'';setMode(true)};$('cancelEdit').onclick=()=>setMode(false);$('close').onclick=()=>$('modal').classList.remove('show');
$('save').onclick=async()=>{if(current?.kind!=='tracking')return;const payload={...(current.raw.payload||{}),summary:$('summary').value.trim(),dimension:$('dimension').value.trim(),category:$('category').value.trim(),member_edited_at:new Date().toISOString()};const{error}=await supabase.from('el8_entries').update({payload,confirmation_status:'corrected'}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);current.raw.payload=payload;current.title=payload.summary||'Tracking record';current.label=`${payload.dimension||'Unclassified'} · ${payload.category||'Tracking'}`;$('preview').innerHTML=previewCurrent();setMode(false);render()};$('delete').onclick=async()=>{if(current?.kind!=='tracking'||!confirm('Remove this tracking record from EL8 History and calculations?'))return;const{error}=await supabase.from('el8_entries').update({deleted_at:new Date().toISOString()}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);records=records.filter(r=>r!==current);$('modal').classList.remove('show');render()};
async function load(){session=await getSessionOrRedirect();if(!session)return;profile=await getMyProfile();document.documentElement.dataset.theme=profile.appearance||'light';if(profile.onboarding_status==='safety_paused'){location.replace('safety-hold.html');return}const[entries,daily,weekly,assess]=await Promise.all([supabase.from('el8_entries').select('entry_id,record_type,created_at,payload,deleted_at').eq('member_id',profile.member_code).is('deleted_at',null),supabase.from('el8_daily_checkins').select('*').eq('user_id',session.user.id),supabase.from('el8_weekly_checkins').select('*').eq('user_id',session.user.id),supabase.from('el8_assessment_sessions').select('*').eq('user_id',session.user.id).eq('status','completed')]);const failures=[entries,daily,weekly,assess].filter(x=>x.error);if(failures.length)throw new Error(failures.map(x=>x.error.message).join(' · '));records=[...(entries.data||[]).map(r=>({key:'t:'+r.entry_id,type:'tracking',kind:'tracking',time:r.payload?.event_time||r.created_at,title:r.payload?.summary||'Tracking record',label:r.payload?.category||r.record_type||'Tracking',raw:r})),...(daily.data||[]).map(r=>({key:'d:'+r.id,type:'checkin',kind:'daily',time:r.submitted_at||r.created_at||r.updated_at,title:'Daily check-in',label:'Daily',raw:r})),...(weekly.data||[]).map(r=>({key:'w:'+r.id,type:'checkin',kind:'weekly',time:r.submitted_at||r.created_at||r.updated_at,title:'Weekly check-in',label:'Weekly',raw:r})),...(assess.data||[]).map(r=>({key:'a:'+r.id,type:'assessment',kind:'assessment',time:r.submitted_at||r.completed_at||r.created_at,title:pretty(r.module_type),label:'Assessment',raw:r}))];render()}
$('backMe').onclick=()=>location.href='app.html#me';document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.type;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));openDays.clear();render()});$('prevMonth').onclick=()=>{viewDate.setMonth(viewDate.getMonth()-1);openDays.clear();syncSelectors();render()};$('nextMonth').onclick=()=>{viewDate.setMonth(viewDate.getMonth()+1);openDays.clear();syncSelectors();render()};$('monthSelect').onchange=()=>{viewDate.setMonth(+$('monthSelect').value);openDays.clear();render()};$('yearSelect').onchange=()=>{viewDate.setFullYear(+$('yearSelect').value);openDays.clear();render()};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};initSelectors();load().catch(e=>$('status').textContent='History could not load: '+e.message);
</script>
</body>
</html>
