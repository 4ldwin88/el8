<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · History</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 80px}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filter{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;white-space:nowrap}.filter.active{background:var(--ink);color:var(--bg)}.monthNav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:18px 0 8px}.monthNav button,.monthPick{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;min-height:44px;font:inherit;font-weight:800}.monthPick{display:flex;justify-content:center;align-items:center;gap:8px;padding:0 10px}.monthPick select{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:800;outline:0}.day{margin:12px 0}.dayHead{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;color:var(--ink);padding:13px 3px;font:inherit;text-align:left}.dayTitle{font-size:17px;font-weight:850}.dayCount{font-size:12px;color:var(--muted);margin-left:auto;margin-right:10px}.chev{transition:transform .18s}.day.open .chev{transform:rotate(180deg)}.dayBody{display:none}.day.open .dayBody{display:block}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:8px 0;cursor:pointer}.meta{font-size:12px;color:var(--muted);margin-bottom:6px}.summary{font-weight:800}.pill{display:inline-block;font-size:11px;color:var(--g);margin-top:8px}.status{font-size:13px;color:var(--muted);margin:8px 0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px}.previewRow{padding:11px 0;border-bottom:1px solid var(--line)}.previewRow:last-child{border-bottom:0}.previewLabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.previewValue{line-height:1.45;white-space:pre-wrap}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}.field textarea{min-height:80px}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;margin-top:9px}.primary{background:var(--ink);color:var(--bg)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.danger{color:#a33}.hidden{display:none}.immutable{border-left:3px solid var(--g);background:var(--card);padding:12px 14px;border-radius:12px;margin:12px 0;color:var(--muted);font-size:13px}</style></head><body><div class="app"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Me · History</div><h1>Your record.</h1><p>Tracking, check-ins and assessments live together here. Open a record to review it.</p><div class="filters"><button class="filter active" data-type="all">All</button><button class="filter" data-type="tracking">Tracking</button><button class="filter" data-type="checkin">Check-ins</button><button class="filter" data-type="assessment">Assessments</button></div><div class="monthNav"><button id="prevMonth" aria-label="Previous month">‹</button><div class="monthPick"><select id="monthSelect" aria-label="Month"></select><select id="yearSelect" aria-label="Year"></select></div><button id="nextMonth" aria-label="Next month">›</button></div><div id="status" class="status">Loading…</div><div id="list"></div><button class="el8-bottom-action" id="backMe">Back to Me</button></div><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Record</h2><div id="immutable" class="immutable hidden">Submitted assessments are permanent records. To measure change, complete a new reassessment rather than editing this result.</div><div id="preview"></div><div id="editor" class="hidden"><div id="trackingFields"><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div class="field"><label>Dimension</label><input id="dimension"></div><div class="field"><label>Category</label><input id="category"></div></div><div id="dailyFields" class="hidden"><div class="field"><label>Employment & income</label><textarea id="employment"></textarea></div><div class="field"><label>Debt</label><select id="debt"><option value="better">Better</option><option value="unchanged">Unchanged</option><option value="worse">Worse</option></select></div><div class="field"><label>Eating</label><select id="eating"><option value="on_plan">On plan</option><option value="partly_on_plan">Partly on plan</option><option value="off_plan">Off plan</option></select></div><div class="field"><label>Movement</label><input id="movement"></div><div class="field"><label>Manageability</label><select id="manage"><option value="easy">Easy</option><option value="manageable">Manageable</option><option value="difficult">Difficult</option><option value="too_much">Too much</option></select></div><div class="field"><label>Note</label><textarea id="note"></textarea></div></div><div id="weeklyFields" class="hidden"><div class="field"><label>Overall week</label><select id="wOverall"><option value="very_difficult">Very difficult</option><option value="difficult">Difficult</option><option value="mixed">Mixed</option><option value="good">Good</option><option value="very_good">Very good</option></select></div><div class="field"><label>Meaningful progress</label><textarea id="wProgress"></textarea></div><div class="field"><label>Friction</label><textarea id="wFriction"></textarea></div><div class="field"><label>Employment / income</label><textarea id="wEmployment"></textarea></div><div class="field"><label>Debt</label><select id="wDebt"><option value="better">Better</option><option value="unchanged">Unchanged</option><option value="worse">Worse</option></select></div><div class="field"><label>Eating</label><select id="wEating"><option value="mostly_on_plan">Mostly on plan</option><option value="mixed">Mixed</option><option value="mostly_off_plan">Mostly off plan</option></select></div><div class="field"><label>Movement</label><input id="wMovement"></div><div class="field"><label>Manageability</label><select id="wManage"><option value="easy">Easy</option><option value="manageable">Manageable</option><option value="difficult">Difficult</option><option value="too_much">Too much</option></select></div><div class="field"><label>Plan adjustment</label><textarea id="wAdjustment"></textarea></div><div class="field"><label>Note</label><textarea id="wNote"></textarea></div></div></div><button class="primary" id="edit">Edit</button><button class="primary hidden" id="save">Save changes</button><button class="secondary danger" id="delete">Delete</button><button class="secondary hidden" id="cancelEdit">Cancel editing</button><button class="secondary" id="close">Close</button></div></div><script type="module">document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light';import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const $=id=>document.getElementById(id);let session,profile,records=[],filter='all',current=null,viewDate=new Date(),openDays=new Set();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=s=>String(s??'—').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());const tz=()=>profile?.timezone||'America/Toronto';function localParts(d){const p=new Intl.DateTimeFormat('en-CA',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),g=t=>p.find(x=>x.type===t)?.value;return{y:+g('year'),m:+g('month'),d:+g('day'),key:`${g('year')}-${g('month')}-${g('day')}`}}function dateKey(iso){return localParts(new Date(iso)).key}function fmtTime(iso){return new Intl.DateTimeFormat('en-CA',{timeZone:tz(),hour:'numeric',minute:'2-digit'}).format(new Date(iso))}function fmtFull(iso){return new Intl.DateTimeFormat('en-CA',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)).replace(',','')}function dateLabel(key){const[y,m,d]=key.split('-').map(Number),today=localParts(new Date()).key,label=new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'long',day:'numeric',year:'numeric'}).format(new Date(Date.UTC(y,m-1,d)));return key===today?`Today, ${label}`:label}function initSelectors(){const months=Array.from({length:12},(_,i)=>new Intl.DateTimeFormat('en-US',{month:'long'}).format(new Date(2000,i,1)));$('monthSelect').innerHTML=months.map((x,i)=>`<option value="${i}">${x}</option>`).join('');const now=localParts(new Date()),years=[];for(let y=now.y+1;y>=now.y-10;y--)years.push(y);$('yearSelect').innerHTML=years.map(y=>`<option value="${y}">${y}</option>`).join('');viewDate=new Date(now.y,now.m-1,1);syncSelectors()}function syncSelectors(){$('monthSelect').value=viewDate.getMonth();$('yearSelect').value=viewDate.getFullYear()}function render(){const vm=viewDate.getMonth()+1,vy=viewDate.getFullYear(),rs=records.filter(r=>(filter==='all'||r.type===filter)&&(()=>{const p=localParts(new Date(r.time));return p.y===vy&&p.m===vm})()).sort((a,b)=>new Date(b.time)-new Date(a.time));$('status').textContent=rs.length?`${rs.length} record${rs.length===1?'':'s'} in ${new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(viewDate)}`:`No records in ${new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(viewDate)}.`;const groups={};rs.forEach(r=>(groups[dateKey(r.time)]??=[]).push(r));const keys=Object.keys(groups).sort().reverse(),today=localParts(new Date()).key;if(keys.length&&!openDays.size)openDays.add(keys.includes(today)?today:keys[0]);$('list').innerHTML=keys.map(k=>`<section class="day ${openDays.has(k)?'open':''}" data-day="${k}"><button class="dayHead"><span class="dayTitle">${esc(dateLabel(k))}</span><span class="dayCount">${groups[k].length}</span><span class="chev">⌄</span></button><div class="dayBody">${groups[k].map(r=>`<div class="item" data-key="${esc(r.key)}"><div class="meta">${esc(fmtTime(r.time))}</div><div class="summary">${esc(r.title)}</div><div class="pill">${esc(r.label)}</div></div>`).join('')}</div></section>`).join('');document.querySelectorAll('.dayHead').forEach(b=>b.onclick=()=>{const s=b.closest('.day'),k=s.dataset.day;s.classList.toggle('open');s.classList.contains('open')?openDays.add(k):openDays.delete(k)});document.querySelectorAll('.item').forEach(x=>x.onclick=e=>{e.stopPropagation();openRecord(x.dataset.key)})}function rows(a){return a.filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=='').map(([l,v])=>`<div class="previewRow"><div class="previewLabel">${esc(l)}</div><div class="previewValue">${esc(typeof v==='object'?JSON.stringify(v,null,2):v)}</div></div>`).join('')}function previewCurrent(){const r=current.raw;if(current.kind==='assessment')return rows([['Submitted',fmtFull(current.time)],['Assessment',current.title],['Version',r.module_version],['Status',pretty(r.status)],['Responses',r.responses],['Results',r.derived_outputs],['Active completion time',r.active_duration_seconds!=null?`${r.active_duration_seconds} seconds`:null]]);if(current.kind==='daily')return rows([['Logged',fmtFull(current.time)],['Date',r.local_date?.replaceAll('-','/')],['Employment & income',r.employment_action],['Debt',pretty(r.debt_status)],['Eating',pretty(r.eating_status)],['Movement',r.movement],['Manageability',pretty(r.manageability)],['Note',r.member_note]]);if(current.kind==='weekly'){const s=r.active_signals||{};return rows([['Logged',fmtFull(current.time)],['Period',`${r.week_start?.replaceAll('-','/')}–${r.week_end?.replaceAll('-','/')}`],['Overall week',pretty(r.overall_week)],['Meaningful progress',r.progress],['Friction',r.friction],['Employment & income',s.employment_income],['Debt',pretty(s.debt)],['Eating',pretty(s.eating)],['Movement',s.movement],['Manageability',pretty(s.manageability)],['Plan adjustment',r.plan_adjustment],['Note',r.member_note]]);}const p=r.payload||{};return rows([['Logged',fmtFull(current.time)],['Summary',p.summary],['Dimension',p.dimension||'Unclassified'],['Category',p.category||'Tracking'],['Confidence',pretty(p.confidence)],['Nutrition',p.nutrition_summary||p.nutrition||null]])}function setMode(editing=false){const immutable=current?.kind==='assessment';$('immutable').classList.toggle('hidden',!immutable);$('preview').classList.toggle('hidden',editing);$('editor').classList.toggle('hidden',!editing);$('edit').classList.toggle('hidden',editing||immutable);$('save').classList.toggle('hidden',!editing||immutable);$('cancelEdit').classList.toggle('hidden',!editing||immutable);$('close').classList.toggle('hidden',editing);$('delete').classList.toggle('hidden',editing||current?.kind!=='tracking'||immutable)}function fillEditor(){if(current.kind==='assessment')return;const r=current.raw,daily=current.kind==='daily',weekly=current.kind==='weekly';$('trackingFields').classList.toggle('hidden',daily||weekly);$('dailyFields').classList.toggle('hidden',!daily);$('weeklyFields').classList.toggle('hidden',!weekly);if(daily){$('employment').value=r.employment_action||'';$('debt').value=r.debt_status||'unchanged';$('eating').value=r.eating_status||'partly_on_plan';$('movement').value=r.movement||'';$('manage').value=r.manageability||'manageable';$('note').value=r.member_note||''}else if(weekly){const s=r.active_signals||{};$('wOverall').value=r.overall_week||'mixed';$('wProgress').value=r.progress||'';$('wFriction').value=r.friction||'';$('wEmployment').value=s.employment_income||'';$('wDebt').value=s.debt||'unchanged';$('wEating').value=s.eating||'mixed';$('wMovement').value=s.movement||'';$('wManage').value=s.manageability||'manageable';$('wAdjustment').value=r.plan_adjustment||'';$('wNote').value=r.member_note||''}else{$('summary').value=r.payload?.summary||'';$('dimension').value=r.payload?.dimension||'';$('category').value=r.payload?.category||''}}function openRecord(key){current=records.find(r=>r.key===key);if(!current)return;$('modalTitle').textContent=current.kind==='assessment'?current.title:current.kind==='daily'?'Daily check-in':current.kind==='weekly'?'Weekly check-in':'Tracking record';$('preview').innerHTML=previewCurrent();fillEditor();setMode(false);$('modal').classList.add('show')}async function load(){const[entriesRes,dailyRes,weeklyRes,assessmentRes]=await Promise.all([supabase.from('el8_entries').select('*').eq('member_id',profile.member_code).is('deleted_at',null),supabase.from('el8_daily_checkins').select('*').eq('user_id',session.user.id),supabase.from('el8_weekly_checkins').select('*').eq('user_id',session.user.id),supabase.from('el8_assessment_sessions').select('id,module_id,module_version,module_type,status,responses,derived_outputs,started_at,submitted_at,active_duration_seconds').eq('user_id',session.user.id).eq('status','completed').not('submitted_at','is',null)]);for(const r of[entriesRes,dailyRes,weeklyRes,assessmentRes])if(r.error)throw r.error;records=(entriesRes.data||[]).map(e=>({key:'entry:'+e.entry_id,type:e.record_type||'tracking',kind:'tracking',time:e.payload?.event_time||e.created_at,title:e.payload?.summary||'Tracking record',label:`${e.payload?.dimension||'Unclassified'} · ${e.payload?.category||'Tracking'}`,raw:e})).concat((dailyRes.data||[]).map(c=>({key:'daily:'+c.id,type:'checkin',kind:'daily',time:c.submitted_at||c.updated_at,title:`Daily check-in · ${c.local_date.replaceAll('-','/')}`,label:'Daily check-in',raw:c})),(weeklyRes.data||[]).map(c=>({key:'weekly:'+c.id,type:'checkin',kind:'weekly',time:c.submitted_at||c.updated_at,title:`Weekly check-in · ${c.week_start.replaceAll('-','/')}–${c.week_end.replaceAll('-','/')}`,label:'Weekly check-in',raw:c})),(assessmentRes.data||[]).map(a=>{const baseline=a.module_type==='universal_baseline';return{key:'assessment:'+a.id,type:'assessment',kind:'assessment',time:a.submitted_at,title:baseline?'Universal Baseline Assessment':pretty(a.module_id||a.module_type||'Assessment'),label:baseline?'Baseline · Immutable':'Assessment · Immutable',raw:a}}));render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));filter=b.dataset.type;openDays.clear();render()});$('prevMonth').onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()-1,1);openDays.clear();syncSelectors();render()};$('nextMonth').onclick=()=>{viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,1);openDays.clear();syncSelectors();render()};$('monthSelect').onchange=()=>{viewDate=new Date(+$('yearSelect').value,+$('monthSelect').value,1);openDays.clear();render()};$('yearSelect').onchange=()=>{viewDate=new Date(+$('yearSelect').value,+$('monthSelect').value,1);openDays.clear();render()};$('backMe').onclick=()=>location.href='app.html#me';$('close').onclick=()=>$('modal').classList.remove('show');$('edit').onclick=()=>setMode(true);$('cancelEdit').onclick=()=>{fillEditor();setMode(false)};$('save').onclick=async()=>{if(!current||current.kind==='assessment')return;if(current.kind==='daily'){const changes={employment_action:$('employment').value.trim(),debt_status:$('debt').value,eating_status:$('eating').value,movement:$('movement').value.trim(),manageability:$('manage').value,member_note:$('note').value.trim()||null,updated_at:new Date().toISOString()};const{data,error}=await supabase.from('el8_daily_checkins').update(changes).eq('id',current.raw.id).eq('user_id',session.user.id).select().single();if(error)return alert(error.message);current.raw=data}else if(current.kind==='weekly'){const changes={overall_week:$('wOverall').value,progress:$('wProgress').value.trim(),friction:$('wFriction').value.trim(),plan_adjustment:$('wAdjustment').value.trim()||null,member_note:$('wNote').value.trim()||null,active_signals:{employment_income:$('wEmployment').value.trim(),debt:$('wDebt').value,eating:$('wEating').value,movement:$('wMovement').value.trim(),manageability:$('wManage').value},updated_at:new Date().toISOString()};const{data,error}=await supabase.from('el8_weekly_checkins').update(changes).eq('id',current.raw.id).eq('user_id',session.user.id).select().single();if(error)return alert(error.message);current.raw=data}else{const payload={...current.raw.payload,summary:$('summary').value.trim(),dimension:$('dimension').value.trim(),category:$('category').value.trim(),member_edited_at:new Date().toISOString()};const{error}=await supabase.from('el8_entries').update({payload,confirmation_status:'corrected'}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);current.raw.payload=payload;current.title=payload.summary;current.label=`${payload.dimension||'Unclassified'} · ${payload.category||'Tracking'}`}$('preview').innerHTML=previewCurrent();setMode(false);render()};$('delete').onclick=async()=>{if(!current||current.kind!=='tracking'||!confirm('Remove this record from EL8 History and calculations?'))return;const{error}=await supabase.from('el8_entries').update({deleted_at:new Date().toISOString()}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);records=records.filter(r=>r!==current);$('modal').classList.remove('show');render()};try{session=await getSessionOrRedirect();profile=await getMyProfile();initSelectors();await load()}catch(e){$('status').textContent='History could not load: '+(e.message||String(e))}</script></body></html>
