<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>EL8 · History</title>
  <link rel="stylesheet" href="assets/el8-ui.css">
  <link rel="stylesheet" href="assets/history.css">
</head>
<body>
  <div class="app">
    <div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div>
    <div class="el8-eyebrow">Profile · History</div><h1>Your record.</h1><p>Tracking, check-ins and assessments live together here. Open a record to review it.</p>
    <div class="filters"><button class="filter active" data-type="all">All</button><button class="filter" data-type="tracking">Tracking</button><button class="filter" data-type="checkin">Check-ins</button><button class="filter" data-type="assessment">Assessments</button></div>
    <div class="monthNav"><button id="prevMonth">‹</button><div class="monthPick"><select id="monthSelect"></select><select id="yearSelect"></select></div><button id="nextMonth">›</button></div><div id="status" class="status">Loading…</div><div id="list"></div><button class="el8-bottom-action" id="backProfile">Back to Profile</button>
  </div>
  <div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Record</h2><div id="immutable" class="immutable hidden"></div><div id="preview"></div><div id="editor" class="hidden"><div class="immutable">Corrections preserve the prior version in the audit history rather than rewriting it invisibly.</div><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div class="field"><label>Dimension</label><input id="dimension"></div><div class="field"><label>Category</label><input id="category"></div><div class="field"><label>Reason for correction</label><input id="reason" placeholder="What needed correcting?"></div></div><button class="primary" id="edit">Correct tracking record</button><button class="primary hidden" id="save">Save correction</button><button class="secondary hidden" id="cancelEdit">Cancel correction</button><button class="secondary" id="close">Close</button></div></div>
  <script type="module" src="history.js"></script>
</body>
</html>
