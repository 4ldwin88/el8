<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · History</title><style>:root{--g:#D6A648;--bg:#F7F3EA;--card:#fffdf8;--ink:#121417;--muted:#6d6c66;--line:#e5ded1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 80px}.brand{font-size:28px;font-weight:850}.eyebrow{color:var(--g);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:28px}h1{font-size:34px;margin:9px 0 12px}p{color:var(--muted);line-height:1.45}.back{color:var(--ink);text-decoration:none;font-weight:800}.filters{display:flex;gap:8px;overflow:auto;margin:18px 0}.filter{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 13px;white-space:nowrap}.filter.active{background:var(--ink);color:var(--bg)}.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;cursor:pointer}.meta{font-size:12px;color:var(--muted);margin-bottom:6px}.summary{font-weight:800}.pill{display:inline-block;font-size:11px;color:var(--g);margin-top:8px}.status{font-size:13px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:22px}.field{margin:12px 0}.field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);font:inherit}.field textarea{min-height:80px}.primary,.secondary{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;margin-top:9px}.primary{background:var(--ink);color:var(--bg)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.danger{color:#a33}.hidden{display:none}</style></head><body><div class="app"><a class="back" href="app.html#me">← Me</a><div class="brand">EL8</div><div class="eyebrow">Me · History</div><h1>Your record.</h1><p>Tracking, check-ins and assessments live together here. Open a record to review or correct it.</p><div class="filters"><button class="filter active" data-type="all">All</button><button class="filter" data-type="tracking">Tracking</button><button class="filter" data-type="checkin">Check-ins</button><button class="filter" data-type="assessment">Assessments</button></div><div id="status" class="status">Loading…</div><div id="list"></div></div><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Record</h2><div id="trackingFields"><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div class="field"><label>Dimension</label><input id="dimension"></div><div class="field"><label>Category</label><input id="category"></div></div><div id="checkinFields" class="hidden"><div class="field"><label>Employment & income</label><textarea id="employment"></textarea></div><div class="field"><label>Debt</label><select id="debt"><option value="better">Better</option><option value="unchanged">Unchanged</option><option value="worse">Worse</option></select></div><div class="field"><label>Eating</label><select id="eating"><option value="on_plan">On plan</option><option value="partly_on_plan">Partly on plan</option><option value="off_plan">Off plan</option></select></div><div class="field"><label>Movement</label><input id="movement"></div><div class="field"><label>Manageability</label><select id="manage"><option value="easy">Easy</option><option value="manageable">Manageable</option><option value="difficult">Difficult</option><option value="too_much">Too much</option></select></div><div class="field"><label>Note</label><textarea id="note"></textarea></div></div><button class="primary" id="save">Save changes</button><button class="secondary danger" id="delete">Delete from History</button><button class="secondary" id="close">Cancel</button></div></div><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const $=id=>document.getElementById(id);let session,profile,records=[],filter='all',current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tz=()=>profile?.timezone||'America/Toronto';function fmt(iso){return new Intl.DateTimeFormat('en-CA',{timeZone:tz(),year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(iso)).replace(',','')}function checkinSummary(r){return `Daily check-in · ${r.local_date.replaceAll('-','/')}`}function render(){const rows=records.filter(r=>filter==='all'||r.type===filter).sort((a,b)=>new Date(b.time)-new Date(a.time));$('status').textContent=rows.length?`${rows.length} record${rows.length===1?'':'s'}`:'No records yet.';$('list').innerHTML=rows.map(r=>`<div class="item" data-key="${esc(r.key)}"><div class="meta">${esc(fmt(r.time))}</div><div class="summary">${esc(r.title)}</div><div class="pill">${esc(r.label)}</div></div>`).join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>openRecord(x.dataset.key))}function openRecord(key){current=records.find(r=>r.key===key);if(!current)return;const isCheck=current.type==='checkin';$('modalTitle').textContent=isCheck?'Daily check-in':'Tracking record';$('trackingFields').classList.toggle('hidden',isCheck);$('checkinFields').classList.toggle('hidden',!isCheck);$('delete').classList.toggle('hidden',isCheck);if(isCheck){const r=current.raw;$('employment').value=r.employment_action||'';$('debt').value=r.debt_status||'unchanged';$('eating').value=r.eating_status||'partly_on_plan';$('movement').value=r.movement||'';$('manage').value=r.manageability||'manageable';$('note').value=r.member_note||''}else{const r=current.raw;$('summary').value=r.payload?.summary||'';$('dimension').value=r.payload?.dimension||'';$('category').value=r.payload?.category||''}$('modal').classList.add('show')}async function load(){const [entriesRes,checksRes]=await Promise.all([supabase.from('el8_entries').select('*').eq('member_id',profile.member_code).is('deleted_at',null),supabase.from('el8_daily_checkins').select('*').eq('user_id',session.user.id)]);if(entriesRes.error)throw entriesRes.error;if(checksRes.error)throw checksRes.error;records=(entriesRes.data||[]).map(e=>({key:'entry:'+e.entry_id,type:e.record_type||'tracking',time:e.payload?.event_time||e.created_at,title:e.payload?.summary||'Tracking record',label:`${e.payload?.dimension||'Unclassified'} · ${e.payload?.category||'Tracking'}`,raw:e})).concat((checksRes.data||[]).map(c=>({key:'check:'+c.id,type:'checkin',time:c.submitted_at||c.updated_at,title:checkinSummary(c),label:'Daily check-in',raw:c})));render()}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));filter=b.dataset.type;render()});$('close').onclick=()=>$('modal').classList.remove('show');$('save').onclick=async()=>{if(!current)return;if(current.type==='checkin'){const changes={employment_action:$('employment').value.trim(),debt_status:$('debt').value,eating_status:$('eating').value,movement:$('movement').value.trim(),manageability:$('manage').value,member_note:$('note').value.trim()||null,updated_at:new Date().toISOString()};const{data,error}=await supabase.from('el8_daily_checkins').update(changes).eq('id',current.raw.id).eq('user_id',session.user.id).select().single();if(error)return alert(error.message);current.raw=data;current.time=data.submitted_at||data.updated_at}else{const payload={...current.raw.payload,summary:$('summary').value.trim(),dimension:$('dimension').value.trim(),category:$('category').value.trim(),member_edited_at:new Date().toISOString()};const{error}=await supabase.from('el8_entries').update({payload,confirmation_status:'corrected'}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);current.raw.payload=payload;current.title=payload.summary;current.label=`${payload.dimension||'Unclassified'} · ${payload.category||'Tracking'}`}$('modal').classList.remove('show');render()};$('delete').onclick=async()=>{if(!current||current.type==='checkin'||!confirm('Remove this record from EL8 History and calculations?'))return;const now=new Date().toISOString();const{error}=await supabase.from('el8_entries').update({deleted_at:now}).eq('entry_id',current.raw.entry_id).eq('member_id',profile.member_code);if(error)return alert(error.message);records=records.filter(r=>r!==current);$('modal').classList.remove('show');render()};try{session=await getSessionOrRedirect();profile=await getMyProfile();await load()}catch(e){$('status').textContent='History could not load: '+(e.message||String(e))}</script></body></html>
