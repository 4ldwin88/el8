<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Member Access</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.access{max-width:620px;margin:auto;min-height:100vh;padding:26px 18px 70px}.access h1{font-size:38px;line-height:1.06;margin:38px 0 12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--soft);padding:5px;border-radius:15px}.tab{border:0;border-radius:11px;padding:12px;background:transparent;color:var(--ink);font:inherit;font-weight:750}.tab.active{background:var(--card)}.panel{display:none}.panel.active{display:block}.field{display:flex;flex-direction:column;gap:7px;margin:14px 0}.field label{font-weight:700}.field input,.field select{font:inherit;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--card);color:var(--ink)}.optional{font-weight:500;color:var(--muted);font-size:12px}.notice{padding:13px 14px;border-radius:14px;background:var(--soft);color:var(--muted);line-height:1.45;margin-top:14px}.error{border-left:3px solid #a8564d}.small{font-size:13px;line-height:1.45;color:var(--muted)}</style></head><body><main class="access"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><h1>Your EL8 starts with you.</h1><p>Sign in, or create an account to establish your baseline and first plan.</p><div class="el8-card"><div class="tabs"><button class="tab active" data-tab="signin">Sign in</button><button class="tab" data-tab="signup">Sign up</button></div><section id="signin" class="panel active"><div class="field"><label for="inEmail">Email</label><input id="inEmail" type="email" autocomplete="email"></div><div class="field"><label for="inPassword">Password</label><input id="inPassword" type="password" autocomplete="current-password"></div><button id="signInBtn" class="el8-btn">Sign in</button></section><section id="signup" class="panel"><div class="field"><label for="upName">Name</label><input id="upName" autocomplete="name" required></div><div class="field"><label for="upEmail">Email</label><input id="upEmail" type="email" autocomplete="email" required></div><div class="field"><label for="upBirthdate">Date of birth</label><input id="upBirthdate" type="date" autocomplete="bday" required></div><div class="field"><label for="upSex">Sex <span class="optional">Optional</span></label><select id="upSex"><option value="">Prefer not to answer now</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="prefer_not_to_say">Prefer not to say</option></select></div><div class="field"><label for="upUnits">Measurement system <span class="optional">Optional</span></label><select id="upUnits"><option value="">Choose later</option><option value="metric">Metric · kg, cm</option><option value="imperial">Imperial · lb, ft/in</option></select></div><div class="field"><label for="upCountry">Country <span class="optional">Optional</span></label><input id="upCountry" autocomplete="country-name" placeholder="Canada"></div><div class="field"><label for="upTimezone">Timezone <span class="optional">Detected automatically</span></label><input id="upTimezone" autocomplete="off"></div><div class="field"><label for="upPassword">Password</label><input id="upPassword" type="password" autocomplete="new-password" minlength="8" required><div class="small">At least 8 characters.</div></div><div class="field"><label for="upPasswordConfirmation">Confirm password</label><input id="upPasswordConfirmation" type="password" autocomplete="new-password" minlength="8" required></div><button id="signUpBtn" class="el8-btn">Create account</button></section><div id="message" style="display:none" class="notice" role="status" aria-live="polite"></div></div></main><script type="module">import{supabase,getMyProfile}from'./el8-client.js';import{validateSignup}from'./app/auth/signup-contract.js';import{onboardingRoute}from'./app/onboarding/flow.js';const msg=document.getElementById('message'),EMAIL_REDIRECT='https://4ldwin88.github.io/el8-prototype/index.html';upTimezone.value=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';function show(text,bad=false){msg.style.display='block';msg.className='notice'+(bad?' error':'');msg.textContent=text}async function route(){const p=await getMyProfile({refresh:true});if(p.account_status&&p.account_status!=='active')return location.replace('account-hold.html');location.replace(onboardingRoute(p))}const{data:{session}}=await supabase.auth.getSession();if(session)await route();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab));msg.style.display='none'});signInBtn.onclick=async()=>{signInBtn.disabled=true;signInBtn.textContent='Signing in…';const{error}=await supabase.auth.signInWithPassword({email:inEmail.value.trim(),password:inPassword.value});if(error){signInBtn.disabled=false;signInBtn.textContent='Sign in';return show(error.message,true)}await route()};signUpBtn.onclick=async()=>{const input={name:upName.value.trim(),email:upEmail.value.trim(),birthdate:upBirthdate.value,sex:upSex.value,country:upCountry.value.trim(),timezone:upTimezone.value.trim(),measurementSystem:upUnits.value,password:upPassword.value,passwordConfirmation:upPasswordConfirmation.value};const check=validateSignup(input);if(!check.valid)return show(Object.values(check.errors)[0],true);signUpBtn.disabled=true;signUpBtn.textContent='Creating account…';const locale=navigator.language||'en-CA';const metadata={display_name:input.name,birthdate:input.birthdate,locale};if(input.sex)metadata.sex=input.sex;if(input.country)metadata.country=input.country;if(input.timezone)metadata.timezone=input.timezone;if(input.measurementSystem)metadata.measurement_system=input.measurementSystem;const{data,error}=await supabase.auth.signUp({email:input.email,password:input.password,options:{emailRedirectTo:EMAIL_REDIRECT,data:metadata}});if(error){signUpBtn.disabled=false;signUpBtn.textContent='Create account';return show(error.message,true)}if(data.session){const update={...metadata,onboarding_status:'baseline_required',updated_at:new Date().toISOString()};const{error:profileError}=await supabase.from('el8_profiles').update(update).eq('user_id',data.session.user.id);if(profileError){signUpBtn.disabled=false;signUpBtn.textContent='Create account';return show(profileError.message,true)}location.replace('assessment.html?v=3')}else{signUpBtn.disabled=false;signUpBtn.textContent='Create account';show('Check your email to confirm your account. After confirmation, EL8 will continue with your baseline.')}};</script></body></html>
