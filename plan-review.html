<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan review</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:32px;margin:18px 0 8px}.q{margin:15px 0}.q label{display:block;font-weight:800;margin-bottom:7px}.q select,.q input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:12px;color:var(--muted);line-height:1.45}.result{margin-top:16px;padding:13px;border-radius:13px;background:var(--soft)}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Plan review</div><h1>How is this action going?</h1><p class="small">Review one action at a time. EL8 separates whether you could follow it from whether it actually helped.</p><div class="el8-card"><form id="form"><div class="q"><label for="action">Action</label><select id="action"></select></div><div class="q"><label for="adherence">How much were you able to follow it? (0–100%)</label><input id="adherence" type="number" min="0" max="100" step="10" required></div><div class="q"><label for="benefit">What happened to the result it was meant to improve?</label><select id="benefit"><option value="unknown">Not sure yet</option><option value="improved">Improved</option><option value="unchanged">No meaningful change</option><option value="worsened">Worsened</option></select></div><div class="q"><label for="barrier">Main barrier, if any</label><select id="barrier"><option value="">None</option><option value="burden">Too burdensome</option><option value="irrelevance">Did not feel relevant</option><option value="forgotten">Forgot</option><option value="external_barrier">External barrier</option><option value="access">Access problem</option><option value="schedule">Schedule/timing</option><option value="other">Other</option></select></div><div class="q"><label for="measurement">Do you have enough evidence to judge the result?</label><select id="measurement"><option value="unknown">Not sure</option><option value="yes">Yes</option><option value="no">No</option></select></div><div class="q"><label><input id="context" type="checkbox" style="width:auto"> Something important in my circumstances changed</label></div><div class="q"><label><input id="safety" type="checkbox" style="width:auto"> New safety or professional-care concern</label></div><button class="el8-btn" id="submit" type="submit">Review action</button><p id="message" class="small" aria-live="polite"></p><div id="result"></div></form></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{planInterventions,isProductionPlan}from'./app/plan/plan-model.js';import{reviewAction,memberReviewCopy}from'./app/plan/adaptive-review.js';import{persistActionReview}from'./app/plan/review-persistence.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const member=await getMyProfile();document.documentElement.dataset.theme=member.appearance||'light';if(member.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const{data:raw,error:pe}=await supabase.from('el8_plans').select('*').eq('user_id',session.user.id).eq('status','active').eq('is_test',false).order('created_at',{ascending:false}).limit(1).maybeSingle();if(pe)throw pe;const plan=isProductionPlan(raw)?raw:null,actions=planInterventions(plan),action=document.getElementById('action'),form=document.getElementById('form'),message=document.getElementById('message'),result=document.getElementById('result'),submit=document.getElementById('submit');action.innerHTML=actions.map(a=>`<option value="${a.id}">${a.action||a.title||a.label||a.id}</option>`).join('');if(!plan||!actions.length){message.textContent='There is no active action to review.';message.classList.add('error');submit.disabled=true}form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;message.textContent='';message.classList.remove('error');result.innerHTML='';try{const adherence=Number(document.getElementById('adherence').value)/100,benefitDirection=document.getElementById('benefit').value,barrier=document.getElementById('barrier').value,measurement=document.getElementById('measurement').value,status=adherence>=.95?'completed':adherence<=.05?'not_completed':'partially_completed';const review=reviewAction({plan,actionId:action.value,status,adherence,benefitDirection,barrierCodes:barrier?[barrier]:[],contextChanged:document.getElementById('context').checked,safetyChanged:document.getElementById('safety').checked,measurementSufficient:measurement==='unknown'?null:measurement==='yes',recordedAt:new Date().toISOString()});await persistActionReview({userId:session.user.id,memberCode:member?.member_code||null,planId:plan.id,review,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone});const copy=memberReviewCopy(review.decision);result.className='result';result.innerHTML=`<strong>${copy.title}</strong><div class="small">${copy.detail}</div>`;message.textContent='Review saved. Your plan has not been silently changed.'}catch(err){message.textContent=err.message;message.classList.add('error')}finally{submit.disabled=false}});</script></body></html>
