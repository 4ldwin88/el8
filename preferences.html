<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Preferences</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:620px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:28px 0 10px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field select,.field input{width:100%;box-sizing:border-box;font:inherit;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink)}.hint{font-size:12px;color:var(--muted);margin-top:6px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Preferences</div><h1>Make EL8 fit your day.</h1><p>Your plan is set. Now choose how EL8 should present information and support you. These are preferences, not Baseline questions.</p><div class="el8-card"><div class="field"><label for="units">Measurement system</label><select id="units"><option value="metric">Metric · kg, cm</option><option value="imperial">Imperial · lb, ft/in</option></select><div class="hint">Used for member-facing weight and measurements.</div></div><div class="field"><label for="hydrationTarget">Daily hydration target</label><input id="hydrationTarget" type="number" inputmode="numeric" min="500" max="10000" step="100"><div class="hint">mL per day. Quick Log uses this target for progress.</div></div><div class="field"><label for="theme">Appearance</label><select id="theme"><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="field"><label for="language">Language</label><select id="language"><option value="en-CA">English</option></select></div><div class="field"><label for="reminders">Plan reminders</label><select id="reminders"><option value="helpful">Helpful reminders</option><option value="minimal">Minimal reminders</option></select></div><button id="continueBtn" class="el8-btn">Continue</button><p id="message"></p></div></main><script type="module">import{getSessionOrRedirect,getMyProfile,supabase}from'./el8-client.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile();const units=document.getElementById('units'),hydrationTarget=document.getElementById('hydrationTarget'),theme=document.getElementById('theme'),language=document.getElementById('language'),reminders=document.getElementById('reminders'),continueBtn=document.getElementById('continueBtn'),message=document.getElementById('message');units.value=['metric','imperial'].includes(profile.measurement_system)?profile.measurement_system:'metric';hydrationTarget.value=Number(profile.hydration_target_ml)||3000;theme.value=['light','dark'].includes(profile.appearance)?profile.appearance:'light';language.value='en-CA';reminders.value=profile.reminder_preference||'helpful';continueBtn.onclick=async()=>{const target=Number(hydrationTarget.value);if(!Number.isInteger(target)||target<500||target>10000){message.textContent='Hydration target must be between 500 and 10,000 mL.';return}continueBtn.disabled=true;const{error}=await supabase.from('el8_profiles').update({measurement_system:units.value,hydration_target_ml:target,appearance:theme.value,locale:language.value,reminder_preference:reminders.value,onboarding_status:'introduction_required',updated_at:new Date().toISOString()}).eq('user_id',auth.user.id);if(error){continueBtn.disabled=false;message.textContent=error.message;return}localStorage.setItem('el8-theme',theme.value);location.replace('app-introduction.html')};</script></body></html>
