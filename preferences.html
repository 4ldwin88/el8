<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Preferences</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:620px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:28px 0 10px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field select{width:100%;font:inherit;padding:13px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Preferences</div><h1>Make EL8 fit your day.</h1><p>Set a few account preferences now. You can change them later.</p><div class="el8-card"><div class="field"><label for="theme">Appearance</label><select id="theme"><option value="system">Use device setting</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="field"><label for="language">Language</label><select id="language"><option value="en">English</option></select></div><div class="field"><label for="reminders">Plan reminders</label><select id="reminders"><option value="helpful">Helpful reminders</option><option value="minimal">Minimal reminders</option></select></div><button id="continueBtn" class="el8-btn">Continue</button><p id="message"></p></div></main><script type="module">import{getSessionOrRedirect,supabase}from'./el8-client.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');continueBtn.onclick=async()=>{localStorage.setItem('el8_theme_preference',theme.value);localStorage.setItem('el8_language_preference',language.value);localStorage.setItem('el8_reminder_preference',reminders.value);continueBtn.disabled=true;const{error}=await supabase.from('el8_profiles').update({onboarding_status:'introduction_required',updated_at:new Date().toISOString()}).eq('user_id',auth.user.id);if(error){continueBtn.disabled=false;message.textContent=error.message;return}location.replace('app-introduction.html')};</script></body></html>
