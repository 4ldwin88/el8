<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Discovery v2.4 Test</title><style>body{font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;margin:0}.wrap{max-width:620px;margin:auto;padding:28px 20px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#777}.version{display:inline-block;margin-top:10px;padding:5px 9px;border:1px solid #bbb;border-radius:999px;font-size:12px;font-weight:700;background:#fff}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 3px 14px #0000000b}h1{font-size:25px;margin:7px 0 8px}p{line-height:1.45;color:#555}.options{display:grid;gap:10px;margin-top:22px}.option{width:100%;text-align:left;padding:14px 15px;border:1px solid #ccc;background:#fff;border-radius:12px;font-size:16px;cursor:pointer}.option.selected{border:2px solid #222;background:#f0f0ed}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.primary,.secondary{padding:12px 16px;border-radius:10px;border:0;font-size:15px;cursor:pointer}.primary{background:#171717;color:white}.primary:disabled{opacity:.35}.secondary{background:#e9e9e5}.meta{font-size:13px;color:#888;margin-top:12px}.progress{height:5px;background:#e9e9e5;border-radius:9px;margin:14px 0 2px;overflow:hidden}.progress span{display:block;height:100%;background:#777}.result pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f1;padding:12px;border-radius:10px;font-size:12px}</style></head><body><main class="wrap"><div class="eyebrow">EL8 · Discovery human validation</div><div class="version">Discovery v2.4 · Generalized Concern Sufficiency</div><div id="app" class="card"></div></main><script type="module">import E from './discovery-v2-engine.js';
const VERSION='Discovery v2.4';let s=E.session(),q=null,selected=[],started=Date.now();const app=document.querySelector('#app'),exclusive=new Set(['other','unsure']);
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toggle(id){if(q.mode!=='multi'){selected=[id];render();return;}if(exclusive.has(id))selected=selected.length===1&&selected[0]===id?[]:[id];else{selected=selected.filter(x=>!exclusive.has(x));selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];}render();}
function submit(){if(!selected.length)return;E.answer(s,q.id,q.mode==='multi'?selected:selected[0]);selected=[];advance();}
function advance(){q=E.next(s);if(!q){finish();return;}render();}
function render(){const n=s.asked.length+1,p=Math.min(100,n/8*100);app.innerHTML=`<div class="eyebrow">${VERSION} · Question ${n}</div><div class="progress"><span style="width:${p}%"></span></div><h1>${esc(q.text)}</h1><div class="options">${q.options.map(o=>`<button class="option ${selected.includes(o.id)?'selected':''}" data-id="${esc(o.id)}">${esc(o.label)}</button>`).join('')}</div><div class="actions"><button id="next" class="primary" ${selected.length?'':'disabled'}>${q.mode==='multi'?'Continue':'Next'}</button>${s.asked.length>=2?'<button id="stop" class="secondary">Stop for now</button>':''}</div><div class="meta">${q.mode==='multi'?'Choose all that fit. “Something else” and “Not sure” cannot be combined with other answers.':'Choose the answer that fits best.'}</div>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>toggle(b.dataset.id));app.querySelector('#next').onclick=submit;const stop=app.querySelector('#stop');if(stop)stop.onclick=()=>{s.optedOut=true;finish();};}
function finish(){const t=E.trace(s),secs=Math.round((Date.now()-started)/1000),top=t.ranked.slice(0,5);app.innerHTML=`<div class="result"><div class="eyebrow">${VERSION} · Test complete</div><h1>Thanks. This run is finished.</h1><p>You can stop here. The information below is only for testing EL8.</p><p><b>Version:</b> ${VERSION}<br><b>Questions asked:</b> ${t.asked.length}<br><b>Time:</b> ${secs} seconds<br><b>Exit:</b> ${esc(t.exitReason||'none')}</p><details><summary>Tester notes</summary><p>Did the questions respond to your answers? Did EL8 leave anything you raised unexplored? Was anything repetitive, confusing, missing, or too long?</p></details><details><summary>Developer route trace</summary><p><b>Top internal signals:</b> ${top.map(x=>esc(x.id)).join(', ')||'none'}</p><p><b>Open member-raised signals:</b> ${(t.openSignals||[]).map(esc).join(', ')||'none'}</p><pre>${esc(JSON.stringify({...t,testVersion:VERSION,durationSeconds:secs},null,2))}</pre></details><div class="actions"><button id="again" class="secondary">Start another test</button></div></div>`;app.querySelector('#again').onclick=()=>{s=E.session();selected=[];started=Date.now();advance();};}
advance();</script></body></html>
