<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Universal Baseline</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 70px}.progress{height:5px;background:var(--line);border-radius:5px;margin:22px 0 8px}.bar{height:100%;background:var(--gold);border-radius:5px}.count{font-size:11px;color:var(--muted);text-align:right}.screen{display:none}.screen.active{display:block}.screen h1{font-size:30px;line-height:1.12;margin:18px 0 8px}.context{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:8px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.helper,.note{font-size:12px;color:var(--muted)}.nav{display:flex;gap:9px;margin-top:20px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.scan{display:grid;gap:12px}.indicator{border-top:1px solid var(--line);padding-top:12px}.indicator:first-child{border-top:0;padding-top:0}.indicator strong{display:block;margin-bottom:7px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.rate{border:1px solid var(--line);border-radius:10px;padding:9px 2px;background:var(--card);color:var(--ink);font:inherit;font-size:11px}.rate.sel{background:var(--ink);color:var(--bg)}.scaleLabels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:7px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><div id="screens"></div><p id="message" class="note"></p><div class="nav"><button id="back" class="el8-btn secondary">Back</button><button id="next" class="el8-btn">Continue</button></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{instrumentOnboardingStage,recordOnboardingEvent}from'./app/onboarding/telemetry.js';import{buildBaselineDiscoveryHandoff}from'./app/onboarding/baseline-discovery-handoff.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile();const qa=Boolean(sessionStorage.getItem('el8_qa_run_id'))||new URLSearchParams(location.search).get('qa')==='1';async function existingBaseline(){if(qa)return null;const{data}=await supabase.from('el8_assessment_sessions').select('derived_outputs').eq('user_id',auth.user.id).eq('module_type','universal_baseline').eq('status','completed').order('submitted_at',{ascending:false}).limit(1).maybeSingle();return data}const old=await existingBaseline();if(old){sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(old.derived_outputs?.discovery_handoff||buildBaselineDiscoveryHandoff(old.derived_outputs||{})));location.replace('discovery.html?from=baseline');throw Error('EL8_REDIRECT')}instrumentOnboardingStage('baseline');const R={indicators:{}};const indicators=[['sleep_energy','Sleep & energy',['sleep','energy'],'Physical'],['physical_health','Physical health',['health'],'Physical'],['mood_stress','Mood & stress',['stress'],'Emotional'],['focus_motivation','Focus & motivation',['focus','direction'],'Intellectual'],['relationships_support','Relationships & support',['relationships','support'],'Social'],['work_responsibilities','Work & responsibilities',['work'],'Occupational'],['money','Money & financial security',['money'],'Financial'],['home_environment','Home & daily environment',['home'],'Environmental'],['direction_purpose','Direction & purpose',['direction'],'Spiritual']];const areas=['Body, health, sleep or energy','Mood, stress or emotions','Focus, motivation or mental engagement','Relationships or social support','Meaning, values or direction','Work, school or responsibilities','Money or financial security','Home, surroundings or access'];const Q=[{key:'indicator_scan',type:'scan',title:'How are these parts of life going?',context:'Give each a quick rating. These are starting signals, not scores or diagnoses.'},{key:'drivers',title:'What tends to throw other things off?',context:'Choose the underlying factors that seem to create problems elsewhere.',values:['Poor sleep or low energy','Stress, worry or difficult emotions','Low motivation or trouble getting started','Difficulty focusing or staying organized','Conflict, loneliness or lack of support','Workload, unemployment or lack of direction','Money pressure or financial uncertainty','Home environment or limited access','Health symptoms, pain or physical limitations','Not sure yet','Nothing consistently throws me off'],multi:true},{key:'supports',title:'What is helping you stay on track?',context:'Choose the things currently working in your favor.',values:['Health or physical habits','Mindset or coping','Learning, interests or creativity','People and relationships','Meaning, values or faith','Work, school or responsibilities','Financial stability','Home or environment','Something else','Nothing stands out'],multi:true},{key:'change',title:'How have the last few weeks been?',context:'Choose the closest overall direction.',values:['Much harder','A little harder','About the same','A little better','Much better','Up and down','Unsure']},{key:'impact',title:'What is getting in the way the most?',context:'Choose the one area with the biggest day-to-day impact.',values:[...areas,'Something else','Nothing stands out']},{key:'goal',title:'Where would improvement make the biggest difference?',context:'This is your preference. Discovery will investigate what is connected before EL8 recommends a focus.',values:[...areas,'Making life more manageable overall','Not sure yet']},{key:'readiness',title:'How ready are you to work on something?',context:'This helps EL8 keep the first plan realistic.',values:['Not ready right now','Open to something very small','Ready to make a change','Very ready to take action']},{key:'capacity',title:'What could realistically fit right now?',context:'Choose what is sustainable on most days.',values:['1–2 minutes','5–15 minutes','15–30 minutes','More than 30 minutes','It varies a lot']},{key:'constraints',title:'What should EL8 account for?',context:'Select anything that could materially affect the plan.',values:['Cost','Limited time','Accessibility or physical limitations','Privacy','Culture, beliefs or values','Language','Professional guidance may be needed','Something else','Nothing specific','Prefer not to say'],multi:true}];const concernMap={'Body, health, sleep or energy':['health','sleep','energy'],'Mood, stress or emotions':['stress'],'Focus, motivation or mental engagement':['focus','direction'],'Relationships or social support':['relationships','support'],'Meaning, values or direction':['direction'],'Work, school or responsibilities':['work'],'Money or financial security':['money'],'Home, surroundings or access':['home'],'Poor sleep or low energy':['sleep','energy'],'Stress, worry or difficult emotions':['stress'],'Low motivation or trouble getting started':['energy','direction'],'Difficulty focusing or staying organized':['focus'],'Conflict, loneliness or lack of support':['relationships','support'],'Workload, unemployment or lack of direction':['work','direction'],'Money pressure or financial uncertainty':['money'],'Home environment or limited access':['home'],'Health symptoms, pain or physical limitations':['health']};const dimMap={'Body, health, sleep or energy':'Physical','Mood, stress or emotions':'Emotional','Focus, motivation or mental engagement':'Intellectual','Relationships or social support':'Social','Meaning, values or direction':'Spiritual','Work, school or responsibilities':'Occupational','Money or financial security':'Financial','Home, surroundings or access':'Environmental'};let page=0;function screen(q){if(q.type==='scan')return `<section class="screen"><div class="el8-eyebrow">Baseline · Quick scan</div><h1>${q.title}</h1><p class="context">${q.context}</p><div class="scan">${indicators.map(([id,label])=>`<div class="indicator"><strong>${label}</strong><div class="scale" data-indicator="${id}">${[1,2,3,4,5].map(v=>`<button type="button" class="rate" data-v="${v}">${v}</button>`).join('')}</div></div>`).join('')}</div><div class="scaleLabels"><span>Poor</span><span>Good</span></div></section>`;return `<section class="screen"><div class="el8-eyebrow">Baseline</div><h1>${q.title}</h1><p class="context">${q.context}</p>${q.multi?'<p class="helper">Select all that apply.</p>':''}<div class="options" data-key="${q.key}" data-multi="${q.multi?'1':'0'}">${q.values.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div></section>`}screens.innerHTML=Q.map(screen).join('');document.querySelectorAll('.scale').forEach(g=>g.onclick=e=>{const b=e.target.closest('.rate');if(!b)return;R.indicators[g.dataset.indicator]=Number(b.dataset.v);g.querySelectorAll('.rate').forEach(x=>x.classList.toggle('sel',x===b))});document.querySelectorAll('.options').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const key=g.dataset.key;if(g.dataset.multi==='1'){const exclusive=['Nothing consistently throws me off','Nothing stands out','Nothing specific','Prefer not to say'];let values=Array.isArray(R[key])?R[key]:[];if(exclusive.includes(b.dataset.v))values=[b.dataset.v];else{values=values.filter(v=>!exclusive.includes(v));values=values.includes(b.dataset.v)?values.filter(v=>v!==b.dataset.v):[...values,b.dataset.v]}R[key]=values;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',values.includes(x.dataset.v)));return}R[key]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))});function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));bar.style.width=((page+1)/Q.length*100)+'%';count.textContent=`${page+1} of ${Q.length}`;back.style.visibility=page?'visible':'hidden';next.textContent=page===Q.length-1?'Continue to Discovery':'Continue';scrollTo(0,0)}function valid(){const q=Q[page];if(q.type==='scan')return indicators.every(([id])=>R.indicators[id]);return q.multi?Array.isArray(R[q.key])&&R[q.key].length:Boolean(R[q.key])}back.onclick=()=>{if(page){page--;show()}};next.onclick=async()=>{if(!valid()){message.textContent=Q[page].type==='scan'?'Rate each indicator to continue.':'Choose an answer to continue.';return}message.textContent='';if(page<Q.length-1){page++;show();return}next.disabled=true;const lowIndicators=indicators.filter(([id])=>R.indicators[id]<=2),concerns=[...new Set([...lowIndicators.flatMap(x=>x[2]),...(R.drivers||[]).flatMap(x=>concernMap[x]||[]),...[R.impact,R.goal].flatMap(x=>concernMap[x]||[])])],priorityConcerns=[...new Set([R.impact,R.goal].flatMap(x=>concernMap[x]||[]))],conditions={};for(const[id,,cs,dim]of indicators){const v=R.indicators[id];if(v<=2)conditions[dim]='Needs attention';else if(v>=4&&!conditions[dim])conditions[dim]='Going well'}const time=R.capacity==='1–2 minutes'?'<5 min':R.capacity==='5–15 minutes'?'5–15 min':R.capacity==='15–30 minutes'?'15–30 min':R.capacity==='More than 30 minutes'?'>30 min':'Varies',readiness=R.readiness==='Not ready right now'?'Not ready':R.readiness==='Open to something very small'?'Somewhat ready':R.readiness==='Ready to make a change'?'Ready':'Very ready',constraintMap={'Accessibility or physical limitations':'Accessibility','Culture, beliefs or values':'Culture','Limited time':'Time','Professional guidance may be needed':'Professional guidance','Nothing specific':'None'};const derived={condition_baseline:conditions,candidate_concerns:concerns,member_priority_concerns:priorityConcerns,indicator_signals:Object.fromEntries(indicators.map(([id,label,cs,dim])=>[id,{label,value:R.indicators[id],concerns:cs,dimension:dim}])),concern_topics:(R.drivers||[]).flatMap(topic=>(concernMap[topic]||[]).map(concernId=>({concernId,topic}))),functional_impact:[dimMap[R.impact]||null].filter(Boolean),member_priority:dimMap[R.goal]||null,feasibility:{readiness,time},constraints:(R.constraints||[]).map(x=>constraintMap[x]||x),overall_change:R.change,baseline_summary:{indicators:R.indicators,drivers:R.drivers||[],supports:R.supports||[],goal:R.goal}};const handoff=buildBaselineDiscoveryHandoff(derived);derived.discovery_handoff=handoff;if(qa){sessionStorage.setItem('el8_qa_baseline',JSON.stringify({responses:R,derived_outputs:derived}));const runId=sessionStorage.getItem('el8_qa_run_id');if(runId)await supabase.from('el8_qa_events').insert({run_id:runId,user_id:auth.user.id,event_type:'baseline_completed',step:'baseline',payload:{responses:R,derived_outputs:derived,next:'adaptive_discovery'}})}else{const saved=await supabase.from('el8_assessment_sessions').insert({user_id:auth.user.id,member_code:profile.member_code||null,module_id:'UNI-BASE-MVP',module_version:'1.2-indicator-driver',module_type:'universal_baseline',status:'completed',trigger_type:'onboarding',local_timezone:profile.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',responses:R,derived_outputs:derived,started_at:new Date().toISOString(),submitted_at:new Date().toISOString()});if(saved.error){next.disabled=false;message.textContent=saved.error.message;return}}sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff));['el8_discovery_output','el8_initial_plan_proposal','el8_confirmed_priorities'].forEach(k=>sessionStorage.removeItem(k));recordOnboardingEvent('baseline_complete',{qa,next:'adaptive_discovery',candidateConcerns:concerns});location.replace('discovery.html?from=baseline')};show();</script></body></html>
