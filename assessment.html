<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Universal Baseline</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 90px}.progress{height:5px;background:var(--line);border-radius:5px;margin:22px 0 8px}.bar{height:100%;background:var(--gold);border-radius:5px}.count{font-size:11px;color:var(--muted);text-align:right}.screen{display:none}.screen.active{display:block}.screen h1{font-size:30px;line-height:1.12;margin:18px 0 8px}.context{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:8px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.helper{font-size:11px;color:var(--muted);margin:0 0 10px}.nav{display:flex;gap:9px;margin-top:20px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.note{font-size:12px;color:var(--muted)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><div id="screens"></div><p id="message" class="note"></p><div class="nav"><button id="back" class="el8-btn secondary">Back</button><button id="next" class="el8-btn">Continue</button></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{instrumentOnboardingStage,recordOnboardingEvent}from'./app/onboarding/telemetry.js';import{buildBaselineDiscoveryHandoff}from'./app/onboarding/baseline-discovery-handoff.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile();if(profile.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const qa=Boolean(sessionStorage.getItem('el8_qa_run_id'))||new URLSearchParams(location.search).get('qa')==='1';async function existingBaseline(){if(qa)return null;const{data,error}=await supabase.from('el8_assessment_sessions').select('id,derived_outputs').eq('user_id',auth.user.id).eq('module_type','universal_baseline').eq('status','completed').order('submitted_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;return data}async function recoverBaseline(b){if(!b)return false;const handoff=b.derived_outputs?.discovery_handoff||buildBaselineDiscoveryHandoff(b.derived_outputs||{});sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff));location.replace('discovery.html?from=baseline');return true}if(await recoverBaseline(await existingBaseline()))throw Error('EL8_REDIRECT');instrumentOnboardingStage('baseline');const dims=['Physical','Emotional','Intellectual','Social','Spiritual','Occupational','Financial','Environmental'],R={};const scale=['Struggling','Needs attention','Okay','Going well','Very strong'];const Q=[{key:'dim_Physical',title:'How are you doing physically?',context:'Think about sleep, energy, movement, nutrition, pain, symptoms and your ability to get through the day.',values:scale},{key:'dim_Emotional',title:'How are you doing emotionally?',context:'Think about mood, stress, coping, emotional stability and how manageable things feel.',values:scale},{key:'dim_Intellectual',title:'How is your mind being supported?',context:'Think about focus, learning, curiosity, creativity and feeling mentally engaged.',values:scale},{key:'dim_Social',title:'How are your relationships and support?',context:'Think about connection, belonging, loneliness and whether you have people you can rely on.',values:scale},{key:'dim_Spiritual',title:'How connected do you feel to meaning or purpose?',context:'This can include values, faith, reflection, identity or simply having a sense of what matters to you.',values:scale},{key:'dim_Occupational',title:'How are work and day-to-day responsibilities going?',context:'Think about employment, school, caregiving, direction, workload and whether your daily role feels sustainable.',values:scale},{key:'dim_Financial',title:'How are things financially?',context:'Think about income, bills, debt, savings, financial security and how much money affects your daily life.',values:scale},{key:'dim_Environmental',title:'How well is your environment supporting you?',context:'Think about your home, safety, comfort, transportation, access to necessities and the places where you spend your time.',values:scale},{key:'impact',title:'What is affecting daily life the most right now?',context:'Choose the area creating the most pressure or interference. You do not need to know EL8’s wellness categories.',values:['Body, health or energy','Mood, stress or emotions','Focus, learning or mental engagement','Relationships or social support','Meaning, values or purpose','Work, school or responsibilities','Money or financial security','Home, surroundings or access','Nothing stands out']},{key:'worsening',title:'Has any part of life been getting noticeably harder?',context:'Choose the area with the clearest recent decline, if there is one.',values:['Body, health or energy','Mood, stress or emotions','Focus, learning or mental engagement','Relationships or social support','Meaning, values or purpose','Work, school or responsibilities','Money or financial security','Home, surroundings or access','Nothing in particular','Unsure']},{key:'priority',title:'Where would improvement help you most?',context:'This is your preference, not a commitment. Discovery will investigate before EL8 recommends a focus.',values:['Body, health or energy','Mood, stress or emotions','Focus, learning or mental engagement','Relationships or social support','Meaning, values or purpose','Work, school or responsibilities','Money or financial security','Home, surroundings or access','No preference yet','Unsure']},{key:'readiness',title:'How ready are you to work on something?',context:'There is no ideal answer. EL8 uses this to avoid giving you a plan that asks too much.',values:['Not ready','Somewhat ready','Ready','Very ready']},{key:'time',title:'How much time could you realistically give a plan on most days?',context:'Choose what is sustainable, not what you think you should be able to do.',values:['Less than 5 minutes','5–15 minutes','15–30 minutes','More than 30 minutes','It varies a lot']},{key:'load',title:'How manageable does life feel overall?',context:'This helps EL8 keep the first plan appropriately small.',values:['Overwhelming','Difficult','Manageable','Comfortable','Very manageable']},{key:'constraints',title:'What should EL8 keep in mind?',context:'Select anything that could affect what is realistic for you.',values:['Accessibility needs','Privacy','Culture or beliefs','Language','Cost','Limited time','Need professional guidance','Nothing specific','Prefer not to say'],multi:true},{key:'change',title:'Compared with a few weeks ago, how is life overall?',context:'A broad direction is enough.',values:['Much harder','A little harder','About the same','A little better','Much better','Unsure']}];const mapArea={'Body, health or energy':'Physical','Mood, stress or emotions':'Emotional','Focus, learning or mental engagement':'Intellectual','Relationships or social support':'Social','Meaning, values or purpose':'Spiritual','Work, school or responsibilities':'Occupational','Money or financial security':'Financial','Home, surroundings or access':'Environmental','Nothing stands out':'None','Nothing in particular':'None','No preference yet':'No preference'};let page=0;function html(q,i){return `<section class="screen"><div class="el8-eyebrow">Baseline</div><h1>${q.title}</h1><p class="context">${q.context}</p>${q.multi?'<p class="helper">Select all that apply.</p>':''}<div class="options" data-key="${q.key}" data-multi="${q.multi?'1':'0'}">${q.values.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div></section>`}screens.innerHTML=Q.map(html).join('');document.querySelectorAll('.options').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const key=g.dataset.key;if(g.dataset.multi==='1'){const exclusive=['Nothing specific','Prefer not to say'];let values=Array.isArray(R[key])?R[key]:[];if(exclusive.includes(b.dataset.v))values=[b.dataset.v];else{values=values.filter(v=>!exclusive.includes(v));values=values.includes(b.dataset.v)?values.filter(v=>v!==b.dataset.v):[...values,b.dataset.v]}R[key]=values;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',values.includes(x.dataset.v)));return}R[key]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))});function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));bar.style.width=((page+1)/Q.length*100)+'%';count.textContent=`${page+1} of ${Q.length}`;back.style.visibility=page?'visible':'hidden';next.textContent=page===Q.length-1?'Continue to Discovery':'Continue';scrollTo(0,0)}function valid(){const q=Q[page];return q.multi?Array.isArray(R[q.key])&&R[q.key].length:Boolean(R[q.key])}back.onclick=()=>{if(page){page--;show()}};next.onclick=async()=>{if(!valid()){message.textContent='Choose an answer to continue.';return}message.textContent='';if(page<Q.length-1){page++;show();return}next.disabled=true;const constraintMap={'Accessibility needs':'Accessibility','Culture or beliefs':'Culture','Limited time':'Time','Need professional guidance':'Professional guidance','Nothing specific':'None'};const derived={condition_baseline:Object.fromEntries(dims.map(d=>[d,R['dim_'+d]])),functional_impact:[mapArea[R.impact]||R.impact],worsening:[mapArea[R.worsening]||R.worsening],member_priority:mapArea[R.priority]||R.priority,feasibility:{readiness:R.readiness,time:R.time==='Less than 5 minutes'?'<5 min':R.time==='More than 30 minutes'?'>30 min':R.time==='It varies a lot'?'Varies':R.time,overall_load:R.load},constraints:(R.constraints||[]).map(x=>constraintMap[x]||x),overall_change:R.change};const handoff=buildBaselineDiscoveryHandoff(derived);derived.discovery_handoff=handoff;if(qa){sessionStorage.setItem('el8_qa_baseline',JSON.stringify({responses:R,derived_outputs:derived}));const runId=sessionStorage.getItem('el8_qa_run_id');if(runId)await supabase.from('el8_qa_events').insert({run_id:runId,user_id:auth.user.id,event_type:'baseline_completed',step:'baseline',payload:{responses:R,derived_outputs:derived,next:'adaptive_discovery'}})}else{const saved=await supabase.from('el8_assessment_sessions').insert({user_id:auth.user.id,member_code:profile.member_code||null,module_id:'UNI-BASE-PROVISIONAL',module_version:'0.9-plain-language',module_type:'universal_baseline',status:'completed',trigger_type:'onboarding',local_timezone:profile.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',responses:R,derived_outputs:derived,started_at:new Date().toISOString(),submitted_at:new Date().toISOString()});if(saved.error){next.disabled=false;message.textContent=saved.error.message;return}}sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff));['el8_discovery_output','el8_initial_plan_proposal','el8_confirmed_priorities'].forEach(k=>sessionStorage.removeItem(k));recordOnboardingEvent('baseline_complete',{qa,next:'adaptive_discovery'});location.replace('discovery.html?from=baseline')};show();</script></body></html>
