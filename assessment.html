<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Universal Baseline</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 70px}.progress{height:5px;background:var(--line);border-radius:5px;margin:22px 0}.bar{height:100%;background:var(--gold);border-radius:5px}.screen{display:none}.screen.active{display:block}.q{margin:16px 0}.q strong{display:block;margin-bottom:8px}.options{display:flex;flex-wrap:wrap;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.nav{display:flex;gap:9px;margin-top:22px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.note{font-size:12px;color:var(--muted)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="screens"></div><p id="message" class="note"></p><div class="nav"><button id="back" class="el8-btn secondary">Back</button><button id="next" class="el8-btn">Continue</button></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{instrumentOnboardingStage,recordOnboardingEvent}from'./app/onboarding/telemetry.js';import{buildBaselineDiscoveryHandoff}from'./app/onboarding/baseline-discovery-handoff.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile();if(profile.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}async function existingBaseline(){const{data,error}=await supabase.from('el8_assessment_sessions').select('id,derived_outputs,submitted_at').eq('user_id',auth.user.id).eq('module_type','universal_baseline').eq('status','completed').order('submitted_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;return data}async function recoverBaseline(baseline){if(!baseline)return false;const handoff=baseline.derived_outputs?.discovery_handoff||buildBaselineDiscoveryHandoff(baseline.derived_outputs||{});try{sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff))}catch(e){}if(profile.onboarding_status==='baseline_required'||profile.onboarding_status==='new'||profile.onboarding_status==='profile_complete'){const{error}=await supabase.from('el8_profiles').update({onboarding_status:'discovery_required',updated_at:new Date().toISOString()}).eq('user_id',auth.user.id);if(error)throw error}recordOnboardingEvent('baseline_existing_recovered',{baselineId:baseline.id});location.replace('discovery.html');return true}try{if(await recoverBaseline(await existingBaseline()))throw new Error('EL8_REDIRECT')}catch(e){if(e.message==='EL8_REDIRECT')throw e;message.textContent='EL8 could not verify your existing baseline. Please reload or try again.';throw e}instrumentOnboardingStage('baseline');const dims=['Physical','Emotional','Intellectual','Social','Spiritual','Occupational','Financial','Environmental'],R={};let page=0;const pages=[{eyebrow:'Baseline · Starting point',title:'How is life feeling right now?',questions:dims.map(d=>({key:'dim_'+d,label:d,values:['Struggling','Needs attention','Okay','Going well','Very strong']}))},{eyebrow:'Baseline · Priorities',title:'Where is the pressure showing up?',questions:[{key:'impact',label:'Which area interferes most with daily life?',values:[...dims,'None']},{key:'worsening',label:'Which area has been getting harder recently?',values:[...dims,'None','Unsure']},{key:'priority',label:'Where would you most like EL8 to help first?',values:[...dims,'No preference','Unsure']}]},{eyebrow:'Baseline · Capacity',title:'What is realistic right now?',questions:[{key:'readiness',label:'How ready do you feel to make a change?',values:['Not ready','Somewhat ready','Ready','Very ready']},{key:'time',label:'How much time can you realistically give this most days?',values:['<5 min','5–15 min','15–30 min','>30 min','Varies']},{key:'load',label:'How manageable does life feel overall right now?',values:['Overwhelming','Difficult','Manageable','Comfortable','Very manageable']}]},{eyebrow:'Baseline · Context',title:'Anything EL8 should account for?',questions:[{key:'constraints',label:'What should EL8 keep in mind when suggesting actions?',values:['Accessibility','Privacy','Culture','Language','Cost','Time','Professional guidance','None','Prefer not to say'],multi:true},{key:'change',label:'Compared with a few weeks ago, life overall feels…',values:['Much harder','A little harder','About the same','A little better','Much better','Unsure']}]}];function qHtml(q){return `<div class="q"><strong>${q.label}</strong>${q.multi?'<span class="note">Select all that apply.</span>':''}<div class="options" data-key="${q.key}" data-multi="${q.multi?'1':'0'}">${q.values.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div></div>`}screens.innerHTML=pages.map((p,i)=>`<section class="screen"><div class="el8-eyebrow">${p.eyebrow}</div><h1>${p.title}</h1>${p.questions.map(qHtml).join('')}${i===pages.length-1?'<p class="note">This Baseline is provisional. Question wording, ordering, branching and safety detection will continue to be tested and refined.</p>':''}</section>`).join('');document.querySelectorAll('.options').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const key=g.dataset.key;if(g.dataset.multi==='1'){const exclusive=['None','Prefer not to say'];let values=Array.isArray(R[key])?R[key]:[];if(exclusive.includes(b.dataset.v)){values=[b.dataset.v]}else{values=values.filter(v=>!exclusive.includes(v));values=values.includes(b.dataset.v)?values.filter(v=>v!==b.dataset.v):[...values,b.dataset.v]}R[key]=values;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',values.includes(x.dataset.v)));recordOnboardingEvent('baseline_multi_changed',{key,values,page:page+1});return}const prev=R[key];R[key]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));recordOnboardingEvent(prev?'baseline_answer_changed':'baseline_answered',{key,value:R[key],page:page+1})});function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));bar.style.width=((page+1)/pages.length*100)+'%';back.style.visibility=page?'visible':'hidden';next.textContent=page===pages.length-1?'Complete baseline':'Continue';scrollTo(0,0);recordOnboardingEvent('baseline_page_view',{page:page+1,total:pages.length})}function valid(){return pages[page].questions.every(q=>q.multi?Array.isArray(R[q.key])&&R[q.key].length>0:Boolean(R[q.key]))}back.onclick=()=>{if(page){recordOnboardingEvent('baseline_back',{from:page+1});page--;show()}};next.onclick=async()=>{if(!valid()){message.textContent='Complete the questions on this screen to continue.';recordOnboardingEvent('baseline_validation_block',{page:page+1});return}message.textContent='';if(page<pages.length-1){page++;show();return}next.disabled=true;recordOnboardingEvent('baseline_submit',{answerCount:Object.keys(R).length});try{const prior=await existingBaseline();if(prior){await recoverBaseline(prior);return}}catch(e){next.disabled=false;message.textContent='EL8 could not verify your baseline. Please try again.';return}const derived={condition_baseline:Object.fromEntries(dims.map(d=>[d,R['dim_'+d]])),functional_impact:R.impact?[R.impact]:[],worsening:R.worsening?[R.worsening]:[],member_priority:R.priority,feasibility:{readiness:R.readiness,time:R.time,overall_load:R.load},constraints:R.constraints||[],overall_change:R.change},handoff=buildBaselineDiscoveryHandoff(derived);derived.discovery_handoff=handoff;const{error}=await supabase.from('el8_assessment_sessions').insert({user_id:auth.user.id,member_code:profile.member_code||null,module_id:'UNI-BASE-PROVISIONAL',module_version:'0.6-provisional',module_type:'universal_baseline',status:'completed',trigger_type:'onboarding',local_timezone:profile.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',responses:R,derived_outputs:derived,started_at:new Date().toISOString(),submitted_at:new Date().toISOString()});if(error){next.disabled=false;message.textContent=error.code==='23505'?'Your baseline is already complete. Reloading will continue your onboarding.':error.message;return}sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff));recordOnboardingEvent('baseline_handoff_created',{candidateDimensions:handoff.candidateDimensions,candidateConcernCount:handoff.candidateConcerns.length,constraintCount:handoff.signals.constraints.length});const{error:profileError}=await supabase.from('el8_profiles').update({onboarding_status:'discovery_required',updated_at:new Date().toISOString()}).eq('user_id',auth.user.id);if(profileError){next.disabled=false;message.textContent=profileError.message;return}recordOnboardingEvent('baseline_complete');location.replace('discovery.html')};show();</script></body></html>
