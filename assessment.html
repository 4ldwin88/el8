<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Baseline</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:760px;margin:auto;padding:26px 14px 70px}.version{font-size:11px;color:var(--muted);margin:8px 0}.progress{height:5px;background:var(--line);border-radius:5px;margin:16px 0 8px}.bar{height:100%;background:var(--gold);border-radius:5px}.count,.note{font-size:11px;color:var(--muted)}.count{text-align:right}.screen{display:none}.screen.active{display:block}.options{display:grid;gap:9px}.matrix-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}.matrix{width:100%;min-width:610px;border-collapse:collapse;table-layout:fixed}.matrix th,.matrix td{border-bottom:1px solid var(--line);padding:10px 5px;text-align:center;vertical-align:middle}.matrix thead th{position:sticky;top:0;background:var(--card);font-size:10px;line-height:1.15;color:var(--muted);font-weight:700}.matrix .label{position:sticky;left:0;z-index:2;width:185px;text-align:left;padding-left:12px;background:var(--card);font-size:12px;font-weight:700;color:var(--ink)}.matrix thead .label{z-index:3}.matrix tr:last-child th,.matrix tr:last-child td{border-bottom:0}.pick{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:transparent;color:transparent;padding:0}.pick.sel{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 8px var(--card)}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 6px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.nav{display:flex;gap:9px;margin-top:20px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="version">Baseline v1.5 · Discovery runtime v1.4</div><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><div id="screens"></div><p id="message" class="note"></p><div class="nav"><button id="back" class="el8-btn secondary">Back</button><button id="next" class="el8-btn">Continue</button></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{buildBaselineDiscoveryHandoff}from'./app/onboarding/baseline-discovery-handoff.js';import{instrumentOnboardingStage,recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile(),qa=Boolean(sessionStorage.getItem('el8_qa_run_id'))||new URLSearchParams(location.search).get('qa')==='1';instrumentOnboardingStage('baseline');const R={indicators:{}},I=[['sleep','Sleep & energy',['sleep','energy'],'Physical'],['health','Physical health',['health'],'Physical'],['movement','Movement & fitness',['health','energy'],'Physical'],['nutrition','Nutrition & eating',['health','energy'],'Physical'],['mood','Mood & stress',['stress'],'Emotional'],['focus','Focus & motivation',['focus','direction'],'Intellectual'],['relationships','Relationships & support',['relationships','support'],'Social'],['work','Work & responsibilities',['work'],'Occupational'],['money','Money & financial security',['money'],'Financial'],['home','Home & daily environment',['home'],'Environmental'],['purpose','Direction & purpose',['direction'],'Spiritual']],ratings=[['Struggling',1],['Not great',2],['Okay',3],['Good',4],['Going well',5]],drivers=['Energy, stress or motivation','People or relationships','Work or direction','Money pressure','Health or physical limitations','Home or environment','Not sure yet','Nothing consistently throws me off'],supports=['My habits or routines','People in my life','Work, learning or interests','Meaning, values or faith','Financial or home stability','Nothing stands out'],constraints=['Cost','Limited time','Physical or accessibility needs','Privacy, culture, beliefs or language','Professional guidance may be needed','Nothing specific','Prefer not to say'],Q=[{type:'scan',title:'How are these parts of life going?'},{key:'drivers',title:'What most affects the rest of your life?',values:drivers,multi:true},{key:'supports',title:'What is helping most right now?',values:supports,multi:true},{type:'context',title:'What is realistic right now?'}];let page=0;const opts=(key,values,multi=false)=>`<div class="options" data-key="${key}" data-multi="${multi?'1':'0'}">${values.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div>`;const matrix=()=>`<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="label">Part of life</th>${ratings.map(([t])=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${I.map(([id,label])=>`<tr data-indicator="${id}"><th class="label" scope="row">${label}</th>${ratings.map(([text,value])=>`<td><button type="button" class="pick" data-v="${value}" aria-label="${label}: ${text}">${text}</button></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;screens.innerHTML=Q.map(q=>q.type==='scan'?`<section class="screen"><div class="el8-eyebrow">Baseline · Quick scan</div><h1>${q.title}</h1><p class="note">Choose one description for each row. Labels stay on the left; the scale stays fixed across the top.</p>${matrix()}</section>`:q.type==='context'?`<section class="screen"><div class="el8-eyebrow">Baseline · Plan context</div><h1>${q.title}</h1><h3>Readiness</h3>${opts('readiness',['Not ready','Open to something very small','Ready','Very ready'])}<h3>Time on most days</h3>${opts('capacity',['1–2 minutes','5–15 minutes','15–30 minutes','More than 30 minutes','Varies'])}<h3>Anything EL8 must account for?</h3>${opts('constraints',constraints,true)}</section>`:`<section class="screen"><div class="el8-eyebrow">Baseline</div><h1>${q.title}</h1><p class="note">Choose only what adds context beyond your ratings.</p>${opts(q.key,q.values,q.multi)}</section>`).join('');document.querySelector('.matrix').onclick=e=>{const b=e.target.closest('.pick');if(!b)return;const row=b.closest('tr'),id=row.dataset.indicator;R.indicators[id]=+b.dataset.v;row.querySelectorAll('.pick').forEach(x=>x.classList.toggle('sel',x===b))};document.querySelectorAll('.options').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const k=g.dataset.key;if(g.dataset.multi==='1'){const exclusive=['Nothing consistently throws me off','Nothing stands out','Nothing specific','Prefer not to say'];let a=Array.isArray(R[k])?R[k]:[];a=exclusive.includes(b.dataset.v)?[b.dataset.v]:[...new Set([...a.filter(x=>!exclusive.includes(x)),b.dataset.v])];if(!exclusive.includes(b.dataset.v)&&R[k]?.includes(b.dataset.v))a=a.filter(x=>x!==b.dataset.v);R[k]=a;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',a.includes(x.dataset.v)))}else{R[k]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))}});function valid(){if(page===0)return I.every(([id])=>R.indicators[id]);if(page===3)return R.readiness&&R.capacity&&R.constraints?.length;return R[Q[page].key]?.length}function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));bar.style.width=((page+1)/Q.length*100)+'%';count.textContent=`${page+1} of ${Q.length}`;back.style.visibility=page?'visible':'hidden';next.textContent=page===Q.length-1?'Continue to Discovery':'Continue';scrollTo(0,0)}back.onclick=()=>{if(page){page--;show()}};next.onclick=async()=>{if(!valid()){message.textContent='Complete this screen to continue.';return}message.textContent='';if(page<Q.length-1){page++;show();return}next.disabled=true;const low=I.filter(([id])=>R.indicators[id]<=2),driverMap={'Energy, stress or motivation':['sleep','energy','stress','direction'],'People or relationships':['relationships','support'],'Work or direction':['work','direction'],'Money pressure':['money'],'Health or physical limitations':['health'],'Home or environment':['home']},concerns=[...new Set([...low.flatMap(x=>x[2]),...(R.drivers||[]).flatMap(x=>driverMap[x]||[])])],conditions={};for(const[id,,cs,dim]of I){const v=R.indicators[id];if(v<=2)conditions[dim]='Needs attention';else if(v>=4&&!conditions[dim])conditions[dim]='Going well'}const derived={condition_baseline:conditions,candidate_concerns:concerns,member_priority_concerns:[],indicator_signals:Object.fromEntries(I.map(([id,label,cs,dim])=>[id,{id,label,value:R.indicators[id],concerns:cs,dimension:dim}])),concern_topics:(R.drivers||[]).flatMap(topic=>(driverMap[topic]||[]).map(concernId=>({concernId,topic}))),feasibility:{readiness:R.readiness,time:R.capacity},constraints:R.constraints||[],baseline_summary:{indicators:R.indicators,drivers:R.drivers||[],supports:R.supports||[]},test_version:'baseline-1.5/discovery-1.4'};const handoff=buildBaselineDiscoveryHandoff(derived);derived.discovery_handoff=handoff;if(qa){sessionStorage.setItem('el8_qa_baseline',JSON.stringify({responses:R,derived_outputs:derived}));const runId=sessionStorage.getItem('el8_qa_run_id');if(runId)await supabase.from('el8_qa_events').insert({run_id:runId,user_id:auth.user.id,event_type:'baseline_completed',step:'baseline',payload:{responses:R,derived_outputs:derived,next:'adaptive_discovery',test_version:'1.5'}})}else{const saved=await supabase.from('el8_assessment_sessions').insert({user_id:auth.user.id,member_code:profile.member_code||null,module_id:'UNI-BASE-MVP',module_version:'1.5-signal-first-matrix',module_type:'universal_baseline',status:'completed',trigger_type:'onboarding',responses:R,derived_outputs:derived,started_at:new Date().toISOString(),submitted_at:new Date().toISOString()});if(saved.error){next.disabled=false;message.textContent=saved.error.message;return}}sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff));recordOnboardingEvent('baseline_complete',{qa,next:'adaptive_discovery',candidateConcerns:concerns,testVersion:'1.5'});location.replace('discovery.html?from=baseline')};show();</script></body></html>
