<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Universal Baseline</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;padding:26px 18px 70px}.progress{height:5px;background:var(--line);border-radius:5px;margin:22px 0 8px}.bar{height:100%;background:var(--gold);border-radius:5px}.count{font-size:11px;color:var(--muted);text-align:right}.screen{display:none}.screen.active{display:block}.screen h1{font-size:30px;line-height:1.12;margin:18px 0 8px}.context{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 18px}.options{display:grid;gap:8px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.helper,.note{font-size:12px;color:var(--muted)}.nav{display:flex;gap:9px;margin-top:20px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="progress"><div id="bar" class="bar"></div></div><div id="count" class="count"></div><div id="screens"></div><p id="message" class="note"></p><div class="nav"><button id="back" class="el8-btn secondary">Back</button><button id="next" class="el8-btn">Continue</button></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{instrumentOnboardingStage,recordOnboardingEvent}from'./app/onboarding/telemetry.js';import{buildBaselineDiscoveryHandoff}from'./app/onboarding/baseline-discovery-handoff.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile();if(profile.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const qa=Boolean(sessionStorage.getItem('el8_qa_run_id'))||new URLSearchParams(location.search).get('qa')==='1';async function existingBaseline(){if(qa)return null;const{data,error}=await supabase.from('el8_assessment_sessions').select('id,derived_outputs').eq('user_id',auth.user.id).eq('module_type','universal_baseline').eq('status','completed').order('submitted_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;return data}async function recoverBaseline(b){if(!b)return false;const handoff=b.derived_outputs?.discovery_handoff||buildBaselineDiscoveryHandoff(b.derived_outputs||{});sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff));location.replace('discovery.html?from=baseline');return true}if(await recoverBaseline(await existingBaseline()))throw Error('EL8_REDIRECT');instrumentOnboardingStage('baseline');const R={};const areas=['My body, health, sleep or energy','My mood, stress or emotions','My focus, learning or mental engagement','My relationships or social support','My sense of meaning, values or direction','My work, school or responsibilities','My money or financial security','My home, surroundings or access'];const Q=[{key:'overall',title:'Overall, how is life going right now?',context:'Start with the big picture. We’ll use the next few questions to understand what is helping or getting in the way.',values:['Very difficult','Difficult','Mixed','Mostly good','Very good']},{key:'pressures',title:'What is making life harder right now?',context:'Choose anything creating meaningful pressure, friction or instability.',values:[...areas,'Something else','Nothing significant'],multi:true},{key:'drivers',title:'What tends to throw you off when things are not going well?',context:'Think about the underlying drivers, not wellness categories.',values:['Poor sleep or low energy','Stress, worry or difficult emotions','Low motivation or trouble getting started','Difficulty focusing or staying organized','Conflict, loneliness or lack of support','Workload, unemployment or lack of direction','Money pressure or financial uncertainty','My home, environment or access to what I need','Health symptoms, pain or physical limitations','I am not sure yet','Nothing consistently throws me off'],multi:true},{key:'supports',title:'What is helping you most right now?',context:'Knowing what already works helps EL8 avoid treating your life as a list of problems.',values:['My health or physical habits','My mindset or coping','Learning, interests or creativity','People and relationships','Meaning, values or faith','Work, school or responsibilities','Financial stability','My home or environment','Something else','Nothing feels especially supportive'],multi:true},{key:'change',title:'What has changed recently?',context:'Choose the answer that best describes the last few weeks overall.',values:['Things have become much harder','Things have become a little harder','Not much has changed','Things have become a little better','Things have become much better','It has been up and down','Unsure']},{key:'impact',title:'What is getting in the way the most?',context:'Choose the one issue with the biggest effect on your day-to-day life.',values:[...areas,'Something else','Nothing stands out']},{key:'goal',title:'If EL8 could help improve one part of life first, what would make the biggest difference?',context:'This is your preference, not EL8’s final recommendation. Discovery can uncover connected issues before a plan is chosen.',values:[...areas,'I mainly want life to feel more manageable','I am not sure yet']},{key:'readiness',title:'How ready do you feel to work on something?',context:'EL8 uses this to keep the first plan realistic.',values:['Not ready right now','Open to something very small','Ready to make a change','Very ready to take action']},{key:'capacity',title:'What could realistically fit into your life right now?',context:'Choose the closest answer. A smaller plan is better than an ambitious plan you cannot sustain.',values:['Only a minute or two most days','About 5–15 minutes most days','About 15–30 minutes most days','More than 30 minutes most days','My available time changes a lot']},{key:'constraints',title:'What should EL8 account for when suggesting a plan?',context:'Select anything that could materially affect what is realistic.',values:['Cost','Limited time','Accessibility or physical limitations','Privacy','Culture, beliefs or values','Language','I may need professional guidance','Something else','Nothing specific','Prefer not to say'],multi:true}];const concernMap={'My body, health, sleep or energy':['health','sleep','energy'],'My mood, stress or emotions':['stress'],'My focus, learning or mental engagement':['focus','direction'],'My relationships or social support':['relationships','support'],'My sense of meaning, values or direction':['direction'],'My work, school or responsibilities':['work'],'My money or financial security':['money'],'My home, surroundings or access to what I need':['home'],'Poor sleep or low energy':['sleep','energy'],'Stress, worry or difficult emotions':['stress'],'Low motivation or trouble getting started':['energy','direction'],'Difficulty focusing or staying organized':['focus'],'Conflict, loneliness or lack of support':['relationships','support'],'Workload, unemployment or lack of direction':['work','direction'],'Money pressure or financial uncertainty':['money'],'My home, environment or access to what I need':['home'],'Health symptoms, pain or physical limitations':['health']};const dimMap={'My body, health, sleep or energy':'Physical','My mood, stress or emotions':'Emotional','My focus, learning or mental engagement':'Intellectual','My relationships or social support':'Social','My sense of meaning, values or direction':'Spiritual','My work, school or responsibilities':'Occupational','My money or financial security':'Financial','My home, surroundings or access to what I need':'Environmental'};let page=0;function qHtml(q){return `<section class="screen"><div class="el8-eyebrow">Baseline</div><h1>${q.title}</h1><p class="context">${q.context}</p>${q.multi?'<p class="helper">Select all that apply.</p>':''}<div class="options" data-key="${q.key}" data-multi="${q.multi?'1':'0'}">${q.values.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div></section>`}screens.innerHTML=Q.map(qHtml).join('');document.querySelectorAll('.options').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const key=g.dataset.key;if(g.dataset.multi==='1'){const exclusive=['Nothing significant','Nothing consistently throws me off','Nothing feels especially supportive','Nothing specific','Prefer not to say'];let values=Array.isArray(R[key])?R[key]:[];if(exclusive.includes(b.dataset.v))values=[b.dataset.v];else{values=values.filter(v=>!exclusive.includes(v));values=values.includes(b.dataset.v)?values.filter(v=>v!==b.dataset.v):[...values,b.dataset.v]}R[key]=values;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',values.includes(x.dataset.v)));return}R[key]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))});function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));bar.style.width=((page+1)/Q.length*100)+'%';count.textContent=`${page+1} of ${Q.length}`;back.style.visibility=page?'visible':'hidden';next.textContent=page===Q.length-1?'Continue to Discovery':'Continue';scrollTo(0,0)}function valid(){const q=Q[page];return q.multi?Array.isArray(R[q.key])&&R[q.key].length:Boolean(R[q.key])}back.onclick=()=>{if(page){page--;show()}};next.onclick=async()=>{if(!valid()){message.textContent='Choose an answer to continue.';return}message.textContent='';if(page<Q.length-1){page++;show();return}next.disabled=true;const concerns=[...new Set([...(R.pressures||[]),...(R.drivers||[]),R.impact,R.goal].flatMap(x=>concernMap[x]||[]))],priorityConcerns=[...new Set([R.impact,R.goal].flatMap(x=>concernMap[x]||[]))],conditions={};Object.entries(dimMap).forEach(([label,dim])=>{if((R.pressures||[]).includes(label)||R.impact===label)conditions[dim]='Needs attention';else if((R.supports||[]).includes(label))conditions[dim]='Going well'});const time=R.capacity==='Only a minute or two most days'?'<5 min':R.capacity==='About 5–15 minutes most days'?'5–15 min':R.capacity==='About 15–30 minutes most days'?'15–30 min':R.capacity==='More than 30 minutes most days'?'>30 min':'Varies',readiness=R.readiness==='Not ready right now'?'Not ready':R.readiness==='Open to something very small'?'Somewhat ready':R.readiness==='Ready to make a change'?'Ready':'Very ready',constraintMap={'Accessibility or physical limitations':'Accessibility','Culture, beliefs or values':'Culture','Limited time':'Time','I may need professional guidance':'Professional guidance','Nothing specific':'None'};const derived={condition_baseline:conditions,candidate_concerns:concerns,member_priority_concerns:priorityConcerns,concern_topics:[...(R.pressures||[]),...(R.drivers||[])].flatMap(topic=>(concernMap[topic]||[]).map(concernId=>({concernId,topic}))),functional_impact:[dimMap[R.impact]||null].filter(Boolean),member_priority:dimMap[R.goal]||null,feasibility:{readiness,time,overall_load:R.overall==='Very difficult'?'Overwhelming':R.overall==='Difficult'?'Difficult':R.overall==='Mixed'?'Manageable':'Comfortable'},constraints:(R.constraints||[]).map(x=>constraintMap[x]||x),overall_change:R.change,baseline_summary:{overall:R.overall,pressures:R.pressures||[],drivers:R.drivers||[],supports:R.supports||[],goal:R.goal}};const handoff=buildBaselineDiscoveryHandoff(derived);derived.discovery_handoff=handoff;if(qa){sessionStorage.setItem('el8_qa_baseline',JSON.stringify({responses:R,derived_outputs:derived}));const runId=sessionStorage.getItem('el8_qa_run_id');if(runId)await supabase.from('el8_qa_events').insert({run_id:runId,user_id:auth.user.id,event_type:'baseline_completed',step:'baseline',payload:{responses:R,derived_outputs:derived,next:'adaptive_discovery'}})}else{const saved=await supabase.from('el8_assessment_sessions').insert({user_id:auth.user.id,member_code:profile.member_code||null,module_id:'UNI-BASE-MVP',module_version:'1.0-driver-baseline',module_type:'universal_baseline',status:'completed',trigger_type:'onboarding',local_timezone:profile.timezone||Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC',responses:R,derived_outputs:derived,started_at:new Date().toISOString(),submitted_at:new Date().toISOString()});if(saved.error){next.disabled=false;message.textContent=saved.error.message;return}}sessionStorage.setItem('el8_baseline_discovery_handoff',JSON.stringify(handoff));['el8_discovery_output','el8_initial_plan_proposal','el8_confirmed_priorities'].forEach(k=>sessionStorage.removeItem(k));recordOnboardingEvent('baseline_complete',{qa,next:'adaptive_discovery',candidateConcerns:concerns});location.replace('discovery.html?from=baseline')};show();</script></body></html>
