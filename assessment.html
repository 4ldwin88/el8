<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Universal Baseline</title><style>:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#121417;--muted:#6d6c66;--line:#e5ded1;--gold:#d6a648}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 80px}.top{display:flex;justify-content:space-between}.brand{font-size:28px;font-weight:850}.back{color:var(--ink);font-weight:800;text-decoration:none}.progress{height:5px;background:var(--line);border-radius:5px;margin:24px 0}.bar{height:100%;background:var(--gold);border-radius:5px;transition:.2s}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase}h1{font-size:34px;margin:8px 0 10px}p{color:var(--muted);line-height:1.45}.screen{display:none}.screen.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.q{font-weight:800;margin-bottom:9px}.options{display:flex;flex-wrap:wrap;gap:7px}.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font:inherit}.opt.sel{background:var(--ink);color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:white;font:inherit}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}.actions{display:flex;gap:9px;margin-top:18px}.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;background:var(--ink);color:white}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.hidden{display:none}.notice{padding:13px;background:#eee9df;border-radius:12px;margin:12px 0;font-size:13px}.summary{white-space:pre-wrap}.small{font-size:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div class="brand">EL8</div><a class="back" href="home.html">Back</a></div><div class="progress"><div class="bar" id="bar"></div></div><div id="screens"></div><div id="error" class="notice hidden"></div><div class="actions" id="actions"><button class="btn secondary" id="prev">Back</button><button class="btn" id="next">Continue</button></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const profile=await getMyProfile(),$=id=>document.getElementById(id),dims=['Physical','Emotional','Intellectual','Social','Spiritual','Occupational','Financial','Environmental'],R={},MODULE='UNI-BASE-004',VERSION='0.4';let page=0,started=new Date(),activeMs=0,activeSince=performance.now(),bgMs=0,bgSince=null,interactions=0,sessionRow=null;document.addEventListener('visibilitychange',()=>{if(document.hidden){if(activeSince!=null){activeMs+=performance.now()-activeSince;activeSince=null}bgSince=performance.now()}else{if(bgSince!=null){bgMs+=performance.now()-bgSince;bgSince=null}activeSince=performance.now()}});function choice(key,vals,multi=false){return `<div class="options" data-key="${key}" data-multi="${multi}">${vals.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div>`}function dimChoices(key,multi=false,extras=[]){return choice(key,[...dims,...extras],multi)}const html=[`<section class="screen"><div class="eyebrow">Baseline · 1 of 6</div><h1>Before we begin.</h1><p>EL8 is a wellness support system, not emergency, medical, legal or financial-professional care. You can correct structured records EL8 derives from your submissions.</p><div class="card">${choice('scope',['I understand'])}</div><div class="card">${choice('correction',['I understand'])}</div><div class="grid"><div><label>Date of birth or age</label><input data-input="age" placeholder="YYYY-MM-DD or age"></div><div><label>Sex</label><select data-input="sex"><option value="">Choose…</option><option>Male</option><option>Female</option><option>Other</option><option>Undisclosed</option></select></div><div><label>Timezone</label><input data-input="timezone" value="${profile.timezone||'America/Toronto'}"></div><div><label>Preferred units</label><select data-input="units"><option>Metric</option><option>Imperial</option></select></div></div><div class="card"><div class="q">Any constraints we should account for?</div>${choice('constraints',['Accessibility','Language','Privacy','Cultural','Time','Other','None','Prefer not to say'],true)}</div><div class="card"><div class="q">Optional personalization</div><p class="small">Useful for physical-wellness context. You can skip these and add them later.</p><div class="grid"><input data-input="height" placeholder="Height"><input data-input="current_weight" placeholder="Current weight"><input data-input="baseline_weight" placeholder="Starting weight"><input data-input="target_weight" placeholder="Preferred/target weight"></div></div></section>`,`<section class="screen"><div class="eyebrow">Baseline · 2 of 6</div><h1>Safety first.</h1><p>Answer each item. Any Yes or Unsure response is reviewed before routine prioritization.</p>${['Immediate danger to self or others','Urgent health concern','Mental-health crisis or inability to maintain safety','Abuse, coercion, violence or exploitation','Serious substance/medication-related safety concern','Unsafe or unstable housing/environment threatening immediate wellbeing','Financial threat to essentials or immediate safety','Other urgent issue'].map((q,i)=>`<div class="card"><div class="q">${q}</div>${choice('safety_'+i,['Yes','No','Unsure','Prefer not to say'])}</div>`).join('')}</section>`,`<section class="screen"><div class="eyebrow">Baseline · 3 of 6</div><h1>Your life right now.</h1><p>Choose the condition that best describes each area.</p>${dims.map(d=>`<div class="card"><div class="q">${d}</div>${choice('dim_'+d,['Struggling','Needs attention','Okay','Going well','Very strong'])}</div>`).join('')}</section>`,`<section class="screen"><div class="eyebrow">Baseline · 4 of 6</div><h1>What matters most?</h1><div class="card"><div class="q">Which areas interfere most with daily life? Select up to two.</div>${dimChoices('impact',true,['None'])}</div><div class="card"><div class="q">Which areas have been getting worse recently?</div>${dimChoices('worsening',true,['None','Unsure'])}</div><div class="card"><div class="q">Which area would you most like help with first?</div>${dimChoices('priority',false,['No preference','Unsure'])}</div><div class="card"><div class="q">Does one area seem to be making another harder?</div>${choice('friction_yes',['Yes','No','Unsure'])}<div id="frictionExtra" class="hidden"><label>Possible upstream area</label>${dimChoices('upstream',false,['Unsure'])}<label>Affected areas</label>${dimChoices('affected',true,['Unsure'])}<label>Optional brief explanation</label><input data-input="friction_note"></div></div></section>`,`<section class="screen"><div class="eyebrow">Baseline · 5 of 6</div><h1>What's realistic?</h1><div class="card"><div class="q">Readiness</div>${choice('readiness',['Not ready','Somewhat ready','Ready','Very ready'])}</div><div class="card"><div class="q">Time available</div>${choice('time',['<5 min/day','5–15 min/day','15–30 min/day','>30 min/day','Varies'])}</div><div class="card"><div class="q">Cost tolerance</div>${choice('cost',['No-cost only','Low-cost okay','Some paid options okay','Discuss options','Prefer not to say'])}</div></section>`,`<section class="screen"><div class="eyebrow">Baseline · 6 of 6</div><h1>Material constraints.</h1><p>Tell EL8 what future actions should avoid conflicting with.</p><div class="card">${choice('material',['Professional healthcare guidance','Medication or treatment','Legal requirements/advice','Financial-professional guidance','Accessibility needs','Other material constraint','None','Prefer not to say'],true)}</div><label>Brief detail only if useful</label><textarea data-input="material_note" rows="3"></textarea></section>`];$('screens').innerHTML=html.join('');document.querySelectorAll('[data-input]').forEach(el=>{R[el.dataset.input]=el.value||'';el.oninput=()=>{R[el.dataset.input]=el.value;interactions++}});document.querySelectorAll('.options').forEach(group=>group.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;interactions++;const key=group.dataset.key,multi=group.dataset.multi==='true',v=b.dataset.v;if(multi){R[key]=R[key]||[];if(R[key].includes(v)){R[key]=R[key].filter(x=>x!==v);b.classList.remove('sel')}else{if(key==='impact'&&R[key].filter(x=>x!=='None').length>=2&&v!=='None')return;if(v==='None'||v==='Unsure'||v==='Prefer not to say'){R[key]=[v];[...group.children].forEach(x=>x.classList.remove('sel'))}else{R[key]=R[key].filter(x=>!['None','Unsure','Prefer not to say'].includes(x));[...group.children].filter(x=>['None','Unsure','Prefer not to say'].includes(x.dataset.v)).forEach(x=>x.classList.remove('sel'));R[key].push(v)}b.classList.add('sel')}}else{R[key]=v;[...group.children].forEach(x=>x.classList.toggle('sel',x===b));if(key==='friction_yes')$('frictionExtra').classList.toggle('hidden',v!=='Yes')}});function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));$('bar').style.width=((page+1)/6*100)+'%';$('prev').style.visibility=page?'visible':'hidden';$('next').textContent=page===5?'Complete baseline':'Continue';window.scrollTo(0,0)}function valid(){if(page===0)return R.scope&&R.correction&&R.age&&R.sex&&R.timezone&&R.units;if(page===1)return [...Array(8)].every((_,i)=>R['safety_'+i]);if(page===2)return dims.every(d=>R['dim_'+d]);if(page===3)return R.impact?.length&&R.worsening?.length&&R.priority&&R.friction_yes;if(page===4)return R.readiness&&R.time&&R.cost;if(page===5)return R.material?.length;return true}async function ensureSession(){if(sessionRow)return;const{data,error}=await supabase.from('el8_assessment_sessions').insert({user_id:session.user.id,member_code:profile.member_code||null,module_id:MODULE,module_version:VERSION,module_type:'universal_baseline',status:'in_progress',trigger_type:'onboarding',local_timezone:profile.timezone||'America/Toronto',responses:R,started_at:started.toISOString()}).select().single();if(error)throw error;sessionRow=data}function timing(){if(activeSince!=null){activeMs+=performance.now()-activeSince;activeSince=null}return{active_duration_seconds:Math.round(activeMs/1000),background_duration_seconds:Math.round(bgMs/1000),interaction_count:interactions}}async function complete(){await ensureSession();const safety=Object.keys(R).filter(k=>k.startsWith('safety_')&&['Yes','Unsure'].includes(R[k]));const derived={condition_baseline:Object.fromEntries(dims.map(d=>[d,R['dim_'+d]])),functional_impact:R.impact,worsening:R.worsening,member_priority:R.priority,cross_dimensional_friction:{perceived:R.friction_yes,upstream:R.upstream||null,affected:R.affected||[],note:R.friction_note||null},feasibility:{readiness:R.readiness,time:R.time,cost:R.cost},material_constraints:R.material};const{error}=await supabase.from('el8_assessment_sessions').update({status:'completed',responses:R,derived_outputs:derived,safety_flags:safety,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString(),...timing()}).eq('id',sessionRow.id).eq('user_id',session.user.id);if(error)throw error;document.querySelector('main').innerHTML=`<div class="brand">EL8</div><div class="eyebrow" style="margin-top:30px">Baseline complete</div><h1>Your starting picture is saved.</h1><p>EL8 has recorded your eight-dimension baseline, priority signals, readiness and material constraints. Missing optional information remains missing rather than being inferred.</p>${safety.length?'<div class="notice">A safety response needs routing before routine prioritization continues.</div>':'<div class="notice">No safety branch was triggered by your responses.</div>'}<a class="btn" style="display:block;text-align:center;text-decoration:none" href="home.html">Back to Home</a>`} $('next').onclick=async()=>{if(!valid()){$('error').textContent='Please complete the required items on this screen.';$('error').classList.remove('hidden');return}$('error').classList.add('hidden');try{await ensureSession();await supabase.from('el8_assessment_sessions').update({responses:R,updated_at:new Date().toISOString()}).eq('id',sessionRow.id);if(page<5){page++;show()}else await complete()}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}};$('prev').onclick=()=>{if(page){page--;show()}};show();</script></body></html>
