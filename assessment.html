<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Universal Baseline</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.progress{height:5px;background:var(--line);border-radius:5px;margin:24px 0}.bar{height:100%;background:var(--gold);border-radius:5px}.screen{display:none}.screen.active{display:block}.q{font-weight:800;margin-bottom:9px}.options{display:flex;flex-wrap:wrap;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px}label{display:block;font-size:12px;color:var(--muted);margin:9px 0 5px}.actions{display:flex;gap:9px;margin-top:18px}.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;background:var(--ink);color:var(--bg);text-decoration:none}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.hidden{display:none}.notice{padding:13px;background:var(--soft);border-radius:12px;margin:12px 0;font-size:13px}.small{font-size:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="progress"><div class="bar" id="bar"></div></div><div id="screens"></div><div id="error" class="notice hidden"></div><div class="actions" id="actions"><button class="btn secondary" id="prev">Back</button><button class="btn" id="next">Continue</button></div></main><script type="module">document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light';import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const profile=await getMyProfile(),$=id=>document.getElementById(id),dims=['Physical','Emotional','Intellectual','Social','Spiritual','Occupational','Financial','Environmental'],R={},MODULE='UNI-BASE-004',VERSION='0.4';if(!profile.birthdate||!profile.sex||!profile.measurement_system)location.replace('profile-setup.html');const{data:completed}=await supabase.from('el8_assessment_sessions').select('id').eq('user_id',session.user.id).eq('module_type','universal_baseline').eq('status','completed').maybeSingle();if(completed)location.replace('app.html');let page=0,started=new Date(),activeMs=0,activeSince=performance.now(),bgMs=0,bgSince=null,interactions=0,sessionRow=null;document.addEventListener('visibilitychange',()=>{if(document.hidden){if(activeSince!=null){activeMs+=performance.now()-activeSince;activeSince=null}bgSince=performance.now()}else{if(bgSince!=null){bgMs+=performance.now()-bgSince;bgSince=null}activeSince=performance.now()}});function choice(key,vals,multi=false){return `<div class="options" data-key="${key}" data-multi="${multi}">${vals.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div>`}function dimChoices(key,multi=false,extras=[]){return choice(key,[...dims,...extras],multi)}const html=[`<section class="screen"><div class="el8-eyebrow">Baseline · 1 of 6</div><h1>Before we begin.</h1><p>Your account details are already saved. This baseline focuses on your starting wellness picture.</p><div class="el8-card"><div class="q">EL8 scope</div><p class="small">EL8 is a wellness support system, not emergency, medical, legal or financial-professional care.</p>${choice('scope',['I understand'])}</div><div class="el8-card"><div class="q">Record corrections</div><p class="small">You can correct derived tracking records. Submitted formal assessments remain historical records; later change is captured through reassessment.</p>${choice('correction',['I understand'])}</div><div class="el8-card"><div class="q">Any constraints we should account for?</div>${choice('constraints',['Accessibility','Language','Privacy','Cultural','Time','Other','None','Prefer not to say'],true)}</div><div class="el8-card"><div class="q">Optional physical baseline</div><p class="small">Weight entered here is your baseline starting weight.</p><div class="grid"><input data-input="height" placeholder="Height (${profile.measurement_system==='imperial'?'ft/in':'cm'})"><input data-input="weight" placeholder="Weight (${profile.measurement_system==='imperial'?'lb':'kg'})"><input data-input="target_weight" placeholder="Preferred/target weight (${profile.measurement_system==='imperial'?'lb':'kg'})"></div></div></section>`,`<section class="screen"><div class="el8-eyebrow">Baseline · 2 of 6</div><h1>Safety first.</h1><p>Answer each item. Any Yes or Unsure response is handled before routine prioritization.</p>${['Immediate danger to self or others','Urgent health concern','Mental-health crisis or inability to maintain safety','Abuse, coercion, violence or exploitation','Serious substance/medication-related safety concern','Unsafe or unstable housing/environment threatening immediate wellbeing','Financial threat to essentials or immediate safety','Other urgent issue'].map((q,i)=>`<div class="el8-card"><div class="q">${q}</div>${choice('safety_'+i,['Yes','No','Unsure','Prefer not to say'])}</div>`).join('')}</section>`,`<section class="screen"><div class="el8-eyebrow">Baseline · 3 of 6</div><h1>Your life right now.</h1>${dims.map(d=>`<div class="el8-card"><div class="q">${d}</div>${choice('dim_'+d,['Struggling','Needs attention','Okay','Going well','Very strong'])}</div>`).join('')}</section>`,`<section class="screen"><div class="el8-eyebrow">Baseline · 4 of 6</div><h1>What matters most?</h1><div class="el8-card"><div class="q">Which areas interfere most with daily life? Select up to two.</div>${dimChoices('impact',true,['None'])}</div><div class="el8-card"><div class="q">Which areas have been getting worse recently?</div>${dimChoices('worsening',true,['None','Unsure'])}</div><div class="el8-card"><div class="q">Which area would you most like help with first?</div>${dimChoices('priority',false,['No preference','Unsure'])}</div><div class="el8-card"><div class="q">Does one area seem to be making another harder?</div>${choice('friction_yes',['Yes','No','Unsure'])}<div id="frictionExtra" class="hidden"><label>Possible upstream area</label>${dimChoices('upstream',false,['Unsure'])}<label>Affected areas</label>${dimChoices('affected',true,['Unsure'])}<label>Optional explanation</label><input data-input="friction_note"></div></div></section>`,`<section class="screen"><div class="el8-eyebrow">Baseline · 5 of 6</div><h1>What's realistic?</h1><div class="el8-card"><div class="q">Readiness</div>${choice('readiness',['Not ready','Somewhat ready','Ready','Very ready'])}</div><div class="el8-card"><div class="q">Time available</div>${choice('time',['<5 min/day','5–15 min/day','15–30 min/day','>30 min/day','Varies'])}</div><div class="el8-card"><div class="q">Cost tolerance</div>${choice('cost',['No-cost only','Low-cost okay','Some paid options okay','Discuss options','Prefer not to say'])}</div></section>`,`<section class="screen"><div class="el8-eyebrow">Baseline · 6 of 6</div><h1>Material constraints.</h1><p>Tell EL8 what future actions should avoid conflicting with.</p><div class="el8-card">${choice('material',['Professional healthcare guidance','Medication or treatment','Legal requirements/advice','Financial-professional guidance','Accessibility needs','Other material constraint','None','Prefer not to say'],true)}</div><label>Brief detail only if useful</label><textarea data-input="material_note" rows="3"></textarea><div class="notice"><strong>Ready to submit?</strong><br>Once submitted, this baseline becomes a permanent point-in-time record and cannot be edited. You can go back now to change any response.</div></section>`];$('screens').innerHTML=html.join('');function wire(){document.querySelectorAll('[data-input]').forEach(el=>{el.oninput=()=>{R[el.dataset.input]=el.value;interactions++}});document.querySelectorAll('.options').forEach(group=>group.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;interactions++;const key=group.dataset.key,multi=group.dataset.multi==='true',v=b.dataset.v;if(multi){R[key]=R[key]||[];if(R[key].includes(v))R[key]=R[key].filter(x=>x!==v);else{if(key==='impact'&&R[key].filter(x=>x!=='None').length>=2&&v!=='None')return;if(['None','Unsure','Prefer not to say'].includes(v))R[key]=[v];else{R[key]=R[key].filter(x=>!['None','Unsure','Prefer not to say'].includes(x));R[key].push(v)}}}else R[key]=v;paint()})}function paint(){document.querySelectorAll('[data-input]').forEach(el=>{if(document.activeElement!==el)el.value=R[el.dataset.input]||''});document.querySelectorAll('.options').forEach(g=>{const val=R[g.dataset.key];[...g.children].forEach(b=>b.classList.toggle('sel',Array.isArray(val)?val.includes(b.dataset.v):val===b.dataset.v))});$('frictionExtra')?.classList.toggle('hidden',R.friction_yes!=='Yes')}wire();const{data:draft,error:draftErr}=await supabase.from('el8_assessment_sessions').select('*').eq('user_id',session.user.id).eq('module_type','universal_baseline').eq('status','in_progress').order('started_at',{ascending:false}).limit(1).maybeSingle();if(draftErr)throw draftErr;if(draft){sessionRow=draft;Object.assign(R,draft.responses||{});started=new Date(draft.started_at);activeMs=(draft.active_duration_seconds||0)*1000;bgMs=(draft.background_duration_seconds||0)*1000;interactions=draft.interaction_count||0;page=Math.max(0,Math.min(5,draft.trigger_context?.last_screen||0));paint()}function timing(){if(activeSince!=null){activeMs+=performance.now()-activeSince;activeSince=performance.now()}return{active_duration_seconds:Math.round(activeMs/1000),background_duration_seconds:Math.round(bgMs/1000),interaction_count:interactions}}async function saveDraft(){const payload={responses:R,trigger_context:{last_screen:page},updated_at:new Date().toISOString(),...timing()};if(sessionRow){const{data,error}=await supabase.from('el8_assessment_sessions').update(payload).eq('id',sessionRow.id).eq('user_id',session.user.id).eq('status','in_progress').select().single();if(error)throw error;sessionRow=data}else{const{data,error}=await supabase.from('el8_assessment_sessions').insert({user_id:session.user.id,member_code:profile.member_code||null,module_id:MODULE,module_version:VERSION,module_type:'universal_baseline',status:'in_progress',trigger_type:'onboarding',local_timezone:profile.timezone||'UTC',started_at:started.toISOString(),...payload}).select().single();if(error)throw error;sessionRow=data}}function valid(){if(page===0)return R.scope&&R.correction&&R.constraints?.length;if(page===1)return [...Array(8)].every((_,i)=>R['safety_'+i]);if(page===2)return dims.every(d=>R['dim_'+d]);if(page===3)return R.impact?.length&&R.worsening?.length&&R.priority&&R.friction_yes;if(page===4)return R.readiness&&R.time&&R.cost;if(page===5)return R.material?.length;return true}function show(){document.querySelectorAll('.screen').forEach((s,i)=>s.classList.toggle('active',i===page));$('bar').style.width=((page+1)/6*100)+'%';$('prev').style.visibility=page?'visible':'hidden';$('next').textContent=page===5?'Submit baseline':'Continue';paint();scrollTo(0,0)}async function complete(){await saveDraft();const safety=Object.keys(R).filter(k=>k.startsWith('safety_')&&['Yes','Unsure'].includes(R[k]));const derived={condition_baseline:Object.fromEntries(dims.map(d=>[d,R['dim_'+d]])),functional_impact:R.impact,worsening:R.worsening,member_priority:R.priority,cross_dimensional_friction:{perceived:R.friction_yes,upstream:R.upstream||null,affected:R.affected||[],note:R.friction_note||null},feasibility:{readiness:R.readiness,time:R.time,cost:R.cost},material_constraints:R.material,profile_context:{birthdate:profile.birthdate,sex:profile.sex,measurement_system:profile.measurement_system}};const{error}=await supabase.from('el8_assessment_sessions').update({status:'completed',responses:R,derived_outputs:derived,safety_flags:safety,submitted_at:new Date().toISOString(),updated_at:new Date().toISOString(),...timing()}).eq('id',sessionRow.id).eq('user_id',session.user.id).eq('status','in_progress');if(error)throw error;document.querySelector('main').innerHTML=`<div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Baseline complete</div><h1>Your starting picture is saved.</h1><p>This assessment is now locked as your point-in-time baseline and will be available in History.</p>${safety.length?'<div class="notice">A safety response requires routing before normal EL8 use continues.</div>':'<div class="notice">Your baseline is complete. EL8 is now unlocked.</div>'}<a class="btn" style="display:block;text-align:center" href="${safety.length?'safety-hold.html':'app.html'}">Continue</a>`} $('next').onclick=async()=>{if(!valid()){$('error').textContent='Please complete the required items on this screen.';$('error').classList.remove('hidden');return}$('error').classList.add('hidden');try{if(page<5){await saveDraft();page++;await saveDraft();show()}else await complete()}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}};$('prev').onclick=async()=>{if(page){page--;try{await saveDraft()}catch{}show()}};show();</script></body></html>
