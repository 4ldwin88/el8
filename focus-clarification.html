<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Focus Clarification</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.pill{background:var(--soft);padding:7px 11px;border-radius:999px;display:inline-block;margin-top:14px}.muted{color:var(--muted)}.question{margin:24px 0}.question h2{font-size:20px;line-height:1.25}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;text-align:left;font:inherit}.choice.selected{border:2px solid var(--ink);padding:13px;background:var(--soft)}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:14px}.notice{background:var(--soft);border-radius:14px;padding:14px;line-height:1.5}.hidden{display:none}.error{border-left:3px solid #a55}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Assessment · Focus clarification</div><div id="code" class="pill">…</div><h1>One more signal, not another assessment.</h1><p class="muted">Your baseline left multiple dimensions tied. These three questions compare only the tied areas so EL8 does not invent a priority.</p><div id="loading" class="el8-card">Loading your baseline…</div><div id="module" class="hidden"><div class="el8-card"><div class="notice">Tied dimensions: <b id="tiedText"></b></div><div id="questions"></div><button id="finish" class="btn">Save clarification</button></div></div><div id="result" class="el8-card hidden"></div><button class="el8-bottom-action" onclick="location.href='app.html#home'">Back to EL8</button></main><script type="module">document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light';import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const dims=['Physical','Emotional','Intellectual','Social','Spiritual','Occupational','Financial','Environmental'],states=['Struggling','Needs attention','Okay','Going well','Very strong'];const prompts=['Which area would make the biggest positive difference in the next 30 days?','Which area feels most practical for you to work on right now?','If one area improved first, which would make the other tied areas easier to improve?'];const session=await getSessionOrRedirect();const p=await getMyProfile();code.textContent=p.member_code;const{data:run,error}=await supabase.from('el8_onboarding_runs').select('payload,completed_at').eq('user_id',session.user.id).order('completed_at',{ascending:false}).limit(1).maybeSingle();if(error||!run){loading.className='el8-card error';loading.textContent=error?.message||'No baseline found.';}else{const s=run.payload||{};let tied=[];if(!dims.includes(s.priority)){const signals=[...(s.impact||[]),...(s.worsening||[]),s.upstream].filter(x=>dims.includes(x));if(signals.length){const counts={};signals.forEach(x=>counts[x]=(counts[x]||0)+1);const max=Math.max(...Object.values(counts));const leaders=Object.keys(counts).filter(x=>counts[x]===max);if(leaders.length>1)tied=leaders;else if(leaders.length===1){loading.className='el8-card';loading.innerHTML='<b>Your baseline already has a clear focus: '+leaders[0]+'.</b>';}}if(!tied.length){const rated=dims.filter(d=>states.includes(s.life?.[d])).map(d=>({d,score:states.indexOf(s.life[d])}));if(rated.length){const min=Math.min(...rated.map(x=>x.score));tied=rated.filter(x=>x.score===min).map(x=>x.d)}}}if(tied.length<2){if(!loading.innerHTML.includes('clear focus'))loading.textContent='Your latest baseline does not currently require clarification.';}else{loading.classList.add('hidden');module.classList.remove('hidden');tiedText.textContent=tied.join(', ');const answers={};prompts.forEach((prompt,i)=>{const q=document.createElement('div');q.className='question';q.innerHTML='<h2>'+(i+1)+'. '+prompt+'</h2>';const choices=document.createElement('div');choices.className='choices';[...tied,'Still unsure'].forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{answers[i]=v;[...choices.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};choices.appendChild(b)});q.appendChild(choices);questions.appendChild(q)});finish.onclick=async()=>{if(Object.keys(answers).length!==prompts.length){result.className='el8-card error';result.textContent='Please answer all three questions.';result.classList.remove('hidden');return}const votes=Object.values(answers).filter(x=>dims.includes(x));const counts={};votes.forEach(x=>counts[x]=(counts[x]||0)+1);let selected=null;if(Object.keys(counts).length){const max=Math.max(...Object.values(counts));const leaders=Object.keys(counts).filter(x=>counts[x]===max);if(leaders.length===1&&max>=2)selected=leaders[0]}finish.disabled=true;const{error}=await supabase.from('el8_focus_clarifications').insert({user_id:session.user.id,baseline_completed_at:run.completed_at,tied_dimensions:tied,selected_focus:selected,answers,status:selected?'completed':'still_ambiguous'});if(error){result.className='el8-card error';result.textContent=error.message;result.classList.remove('hidden');finish.disabled=false;return}result.className='el8-card';result.classList.remove('hidden');result.innerHTML=selected?'<h2>Focus clarified: '+selected+'</h2><p>EL8 now has enough evidence to use this as your primary focus.</p>':'<h2>Still no clear focus</h2><p>That is a valid result. EL8 will keep the priority unassigned instead of manufacturing certainty.</p>';finish.textContent='Saved';setTimeout(()=>location.replace('app.html#home'),700)}}}</script></body></html>
