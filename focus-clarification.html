<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 Focus Clarification</title><style>:root{--bg:#f6f3ec;--card:#fffdfa;--ink:#17191c;--muted:#74766f;--line:#e4dfd5;--soft:#eee9df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:700px;margin:auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{font-size:30px;font-weight:850}.pill{background:var(--soft);padding:7px 11px;border-radius:999px}.muted{color:var(--muted)}h1{font-size:36px;line-height:1.05;margin:30px 0 12px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0}.question{margin:24px 0}.question h2{font-size:20px;line-height:1.25}.choices{display:grid;gap:9px}.choice{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;text-align:left;font:inherit}.choice.selected{border:2px solid var(--ink);padding:13px;background:#f1eee7}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:var(--ink);color:white;font:inherit;font-weight:800;margin-top:14px}.secondary{background:var(--soft);color:var(--ink);text-decoration:none;text-align:center;display:block}.notice{background:var(--soft);border-radius:14px;padding:14px;line-height:1.5}.hidden{display:none}.error{color:#7f4037;background:#f6e7e3}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">EL8</div><div class="muted">Focus clarification</div></div><div id="code" class="pill">…</div></div><h1>One more signal, not another assessment.</h1><p class="muted">Your baseline left multiple dimensions tied. These three questions compare only the tied areas so EL8 does not invent a priority.</p><div id="loading" class="card">Loading your baseline…</div><div id="module" class="hidden"><div class="card"><div class="notice">Tied dimensions: <b id="tiedText"></b></div><div id="questions"></div><button id="finish" class="btn">Save clarification</button></div></div><div id="result" class="card hidden"></div><a class="btn secondary" href="app.html">Back to EL8</a></div><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const dims=['Physical','Emotional','Intellectual','Social','Spiritual','Occupational','Financial','Environmental'],states=['Struggling','Needs attention','Okay','Going well','Very strong'];const prompts=['Which area would make the biggest positive difference in the next 30 days?','Which area feels most practical for you to work on right now?','If one area improved first, which would make the other tied areas easier to improve?'];const session=await getSessionOrRedirect();const p=await getMyProfile();code.textContent=p.member_code;const{data:run,error}=await supabase.from('el8_onboarding_runs').select('payload,completed_at').eq('user_id',session.user.id).order('completed_at',{ascending:false}).limit(1).maybeSingle();if(error||!run){loading.className='card error';loading.textContent=error?.message||'No baseline found.';}else{const s=run.payload||{};let tied=[];if(!dims.includes(s.priority)){const signals=[...(s.impact||[]),...(s.worsening||[]),s.upstream].filter(x=>dims.includes(x));if(signals.length){const counts={};signals.forEach(x=>counts[x]=(counts[x]||0)+1);const max=Math.max(...Object.values(counts));const leaders=Object.keys(counts).filter(x=>counts[x]===max);if(leaders.length>1)tied=leaders;else if(leaders.length===1){loading.className='card';loading.innerHTML='<b>Your baseline already has a clear focus: '+leaders[0]+'.</b>';}}if(!tied.length){const rated=dims.filter(d=>states.includes(s.life?.[d])).map(d=>({d,score:states.indexOf(s.life[d])}));if(rated.length){const min=Math.min(...rated.map(x=>x.score));tied=rated.filter(x=>x.score===min).map(x=>x.d)}}}if(tied.length<2){if(!loading.innerHTML.includes('clear focus'))loading.textContent='Your latest baseline does not currently require clarification.';}else{loading.classList.add('hidden');module.classList.remove('hidden');tiedText.textContent=tied.join(', ');const answers={};prompts.forEach((prompt,i)=>{const q=document.createElement('div');q.className='question';q.innerHTML='<h2>'+(i+1)+'. '+prompt+'</h2>';const choices=document.createElement('div');choices.className='choices';[...tied,'Still unsure'].forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>{answers[i]=v;[...choices.children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};choices.appendChild(b)});q.appendChild(choices);questions.appendChild(q)});finish.onclick=async()=>{if(Object.keys(answers).length!==prompts.length){result.className='card error';result.textContent='Please answer all three questions.';result.classList.remove('hidden');return}const votes=Object.values(answers).filter(x=>dims.includes(x));const counts={};votes.forEach(x=>counts[x]=(counts[x]||0)+1);let selected=null;if(Object.keys(counts).length){const max=Math.max(...Object.values(counts));const leaders=Object.keys(counts).filter(x=>counts[x]===max);if(leaders.length===1&&max>=2)selected=leaders[0]}finish.disabled=true;const{error}=await supabase.from('el8_focus_clarifications').insert({user_id:session.user.id,baseline_completed_at:run.completed_at,tied_dimensions:tied,selected_focus:selected,answers,status:selected?'completed':'still_ambiguous'});if(error){result.className='card error';result.textContent=error.message;result.classList.remove('hidden');finish.disabled=false;return}result.className='card';result.classList.remove('hidden');result.innerHTML=selected?'<h2>Focus clarified: '+selected+'</h2><p>EL8 now has enough evidence to use this as your primary focus.</p>':'<h2>Still no clear focus</h2><p>That is a valid result. EL8 will keep the priority unassigned instead of manufacturing certainty.</p>';finish.textContent='Saved';setTimeout(()=>location.replace('app.html'),700)}}}</script></body></html>
