<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Onboarding</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.route-card{margin-top:24px;text-align:center}.spinner{width:26px;height:26px;margin:0 auto 16px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-card route-card"><div class="spinner" aria-hidden="true"></div><h1>Preparing your account.</h1><p id="status" role="status" aria-live="polite">Checking onboarding progress…</p></div></main><script type="module">import{getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{onboardingRoute}from'./app/onboarding/flow.js';const session=await getSessionOrRedirect();if(session){try{const profile=await getMyProfile();if(!profile.birthdate||!profile.sex||!profile.measurement_system){location.replace('profile-setup.html');}else{location.replace(onboardingRoute(profile));}}catch(e){document.getElementById('status').textContent='Unable to verify onboarding: '+e.message;}}</script></body></html>
