<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 Onboarding</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ec;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17191c}.shell{max-width:820px;margin:auto}.account{padding:10px 14px;background:#17191c;color:white;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}.muted{opacity:.72}.frame{width:100%;height:calc(100vh - 42px);border:0;display:block}.saving{display:none;position:fixed;inset:0;background:rgba(23,25,28,.68);padding:24px;align-items:center;justify-content:center;z-index:10}.card{width:min(520px,100%);background:#fffdfa;border-radius:24px;padding:24px}.error{color:#a8564d}.spinner{width:24px;height:24px;border:3px solid #ddd;border-top-color:#17191c;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="shell"><div class="account"><div><b>EL8 onboarding</b> <span class="muted" id="code">Loading account…</span></div><button id="logoutBtn" style="border:0;background:transparent;color:white">Sign out</button></div><iframe id="baselineFrame" class="frame" src="baseline.html" title="EL8 Universal Baseline"></iframe></div><div id="saving" class="saving"><div class="card"><div class="spinner"></div><h2 id="saveTitle">Saving onboarding…</h2><p id="saveStatus" class="muted">We’ll take you to EL8 as soon as the record is verified.</p></div></div><script type="module">import{supabase,getSessionOrRedirect,getMyProfile,signOut}from'./el8-client.js';const session=await getSessionOrRedirect();if(session){const profile=await getMyProfile();code.textContent='· '+profile.member_code;document.getElementById('logoutBtn').onclick=()=>signOut();if(profile.onboarding_status==='completed'){location.replace('app.html')}else if(profile.onboarding_status==='not_started'){await supabase.from('el8_profiles').update({onboarding_status:'in_progress',updated_at:new Date().toISOString()}).eq('user_id',session.user.id)}let savingNow=false;async function saveHandoff(handoff){if(savingNow)return;savingNow=true;saving.style.display='flex';const parsed=handoff||(()=>{try{return JSON.parse(localStorage.getItem('el8-baseline-demo')||'null')}catch{return null}})();if(!parsed){saveTitle.textContent='Could not save onboarding';saveStatus.textContent='The completed baseline record was missing. Please reload and run the baseline again.';saveStatus.className='error';savingNow=false;return}const {error:e1}=await supabase.from('el8_onboarding_runs').insert({user_id:session.user.id,module_version:'Universal Baseline v0.4.2',payload:parsed.store,elapsed_seconds:parsed.elapsed});if(e1){saveTitle.textContent='Save failed';saveStatus.textContent=e1.message;saveStatus.className='error';savingNow=false;return}const {error:e2}=await supabase.from('el8_profiles').update({onboarding_status:'completed',updated_at:new Date().toISOString()}).eq('user_id',session.user.id);if(e2){saveTitle.textContent='Almost saved';saveStatus.textContent='Baseline saved, but account status failed: '+e2.message;saveStatus.className='error';savingNow=false;return}saveTitle.textContent='Onboarding saved';saveStatus.textContent='Opening EL8…';setTimeout(()=>location.replace('app.html'),450)}window.addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='el8-baseline-complete')return;saveHandoff(e.data.handoff)});}</script></body></html>
