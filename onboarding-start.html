<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 Onboarding</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3ec;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17191c}.shell{max-width:820px;margin:auto}.account{padding:10px 14px;background:#17191c;color:white;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}.muted{opacity:.72}.frame{width:100%;height:calc(100vh - 42px);border:0;display:block}.done{display:none;position:fixed;inset:0;background:rgba(23,25,28,.66);padding:24px;align-items:center;justify-content:center}.card{width:min(520px,100%);background:#fffdfa;border-radius:24px;padding:24px}.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:#17191c;color:white;font:inherit;font-weight:800;text-decoration:none;text-align:center}.error{color:#a8564d}</style></head><body><div class="shell"><div class="account"><div><b>EL8 onboarding</b> <span class="muted" id="code">Loading account…</span></div><button id="logout" style="border:0;background:transparent;color:white">Sign out</button></div><iframe id="baselineFrame" class="frame" src="baseline.html" title="EL8 Universal Baseline"></iframe></div><div id="done" class="done"><div class="card"><h2>Onboarding saved</h2><p>Your Universal Baseline has been stored under this prototype account.</p><p id="status" class="muted"></p><a class="btn" href="app.html">Enter EL8 prototype</a></div></div><script type="module">import{supabase,getSessionOrRedirect,getMyProfile,signOut}from'./el8-client.js';const session=await getSessionOrRedirect();if(session){const profile=await getMyProfile();code.textContent='· '+profile.member_code;logout.onclick=signOut;if(profile.onboarding_status==='not_started')await supabase.from('el8_profiles').update({onboarding_status:'in_progress',updated_at:new Date().toISOString()}).eq('user_id',session.user.id);let saved=false;const frame=document.getElementById('baselineFrame');const timer=setInterval(async()=>{if(saved)return;try{const button=frame.contentDocument?.getElementById('finish');if(button?.disabled&&button.textContent==='Completed'){saved=true;clearInterval(timer);const raw=localStorage.getItem('el8-baseline-demo');const parsed=raw?JSON.parse(raw):null;if(!parsed){saved=false;status.textContent='The baseline completed, but its local handoff record was missing. Please rerun onboarding.';status.className='error';done.style.display='flex';return}const {error:e1}=await supabase.from('el8_onboarding_runs').insert({user_id:session.user.id,module_version:'Universal Baseline v0.4.1',payload:parsed.store,elapsed_seconds:parsed.elapsed});if(e1){saved=false;status.textContent='Save failed: '+e1.message;status.className='error';done.style.display='flex';return}const {error:e2}=await supabase.from('el8_profiles').update({onboarding_status:'completed',updated_at:new Date().toISOString()}).eq('user_id',session.user.id);if(e2){status.textContent='Baseline saved, but account status update failed: '+e2.message;status.className='error'}else{status.textContent='Account '+profile.member_code+' · '+Math.floor(parsed.elapsed/60)+'m '+(parsed.elapsed%60)+'s'}done.style.display='flex'} }catch(err){console.warn(err)}},700)}</script></body></html>
