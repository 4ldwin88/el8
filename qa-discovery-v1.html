<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Branching Discovery v1</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.hidden{display:none}.small{color:var(--muted);font-size:13px}.choice{display:block;width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.choice.selected{outline:2px solid var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:10px}.trace{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Tester tools · Branching Discovery v1</div><h1>Adaptive discovery simulator</h1><p>Questions and answers are semantic units. Your answer changes both evidence and the next route.</p><div class="el8-card"><div class="small">Session</div><div id="info"></div></div><div id="setup"><div class="el8-card"><h2>Hidden starting state</h2><div id="scenarios"></div></div><button id="start" class="primary">Start branching cycle</button></div><div id="dialogue" class="hidden"><div id="trace"></div><div id="question" class="el8-card"></div></div><div id="done" class="el8-card hidden"></div><button id="again" class="primary hidden">Start next cycle</button><button class="el8-bottom-action" onclick="location.href='qa.html'">Back to QA Inspector</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{DISCOVERY_QUESTION_BANK as BANK}from'./intelligence/selection/discovery-question-bank-v1.js';const $=id=>document.getElementById(id),s=await getSessionOrRedirect(),p=await getMyProfile();if(!s||!p||!/^T\d+/i.test(p.member_code||'')){location.replace('profile.html');throw Error('Tester only')}const SIGNALS=['sleep','stress','social_connection','employment_stability','financial_security','environmental_stability','purpose','cognitive_load'];const SC={well:{label:'Generally well',hot:[]},sleep:{label:'Sleep deterioration',hot:['sleep']},financial:{label:'Financial pressure',hot:['financial_security','stress']},work:{label:'Work instability',hot:['employment_stability','financial_security','stress']},social:{label:'Social disconnection',hot:['social_connection','stress']},meaning:{label:'Loss of meaning / direction',hot:['purpose','stress']},environment:{label:'Environmental disruption',hot:['environmental_stability','sleep','stress']},multi:{label:'Multiple interacting problems',hot:['employment_stability','financial_security','social_connection','stress','sleep']}};const KEY='el8-adaptive-discovery-v1-semantic';let ss=JSON.parse(localStorage.getItem(KEY)||'null')||{id:crypto.randomUUID(),cycle:1};let selected='well',turns=[],belief={};const reset=()=>belief=Object.fromEntries(SIGNALS.map(x=>[x,{pressure:.15,uncertainty:.85}]));reset();const save=()=>localStorage.setItem(KEY,JSON.stringify(ss));save();$('info').textContent=`Cycle ${ss.cycle} · Semantic Branching v1`;$('scenarios').innerHTML=Object.entries(SC).map(([k,x])=>`<button class="choice ${k==='well'?'selected':''}" data-k="${k}">${x.label}</button>`).join('');document.querySelectorAll('#scenarios .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#scenarios .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.k});const asked=()=>new Set(turns.map(t=>t.id));function trace(){$('trace').innerHTML=turns.map((t,i)=>`<div class="trace"><strong>${i+1}. ${t.prompt}</strong><br><span class="small">${t.answer} · ${t.role}</span></div>`).join('')}function value(q){if(asked().has(q.id))return-99;const bs=q.signals.map(x=>belief[x]),unc=bs.reduce((a,b)=>a+b.uncertainty,0)/bs.length,pressure=Math.max(...bs.map(x=>x.pressure));let role={discriminator:.22,contrast:.18,driver:.16,bridge:.14,state:.08,contradiction:.05}[q.role]||0;if(!turns.length&&['discriminator','contrast'].includes(q.role))role+=.35;const last=turns.at(-1);if(last){if(last.kind==='strain'&&q.signals.some(x=>last.raised.includes(x))&&['driver','bridge','state'].includes(q.role))role+=.48;if(last.kind==='uncertain'&&['discriminator','contrast','bridge'].includes(q.role))role+=.4;if(last.kind==='healthy'&&q.signals.some(x=>last.signals.includes(x)))role-=.32;if(last.kind==='broad'&&q.signals.length>2)role+=.22}return unc*.42+pressure*.25+Math.min(.3,q.signals.length*.035)+role}function choose(){return BANK.slice().sort((a,b)=>value(b)-value(a))[0]}function shouldStop(){if(turns.length>=6)return'question-budget';const unresolved=Object.values(belief).filter(x=>x.uncertainty>.38),pressured=Object.values(belief).filter(x=>x.pressure>.48);if(turns.length>=2&&!pressured.length&&unresolved.length<=2)return'healthy-confidence';if(turns.length>=3&&value(choose())<.28)return'low-information-value';return null}function next(){trace();const stop=shouldStop();if(stop)return finish(stop);const q=choose();$('question').innerHTML=`<div class="small">${q.role}</div><h2>${q.prompt}</h2><div id="opts"></div>`;q.options.forEach(a=>{const b=document.createElement('button');b.className='choice';b.textContent=a.label;b.onclick=()=>answer(q,a);$('opts').appendChild(b)})}function setSignal(sig,pressure,uncertainty){belief[sig]={pressure:Math.max(0,Math.min(1,pressure)),uncertainty:Math.max(.05,Math.min(1,uncertainty))}}function answer(q,a){const e=a.evidence||{},raised=e.raise||[];let kind='neutral';if(e.uncertain){kind='uncertain';q.signals.forEach(sig=>setSignal(sig,belief[sig].pressure,Math.max(.55,belief[sig].uncertainty*.94)))}else if(e.healthy){kind='healthy';q.signals.forEach(sig=>setSignal(sig,Math.min(belief[sig].pressure,.18),.22))}else if(e.broad){kind='broad';q.signals.forEach(sig=>setSignal(sig,Math.max(belief[sig].pressure,.32),Math.min(belief[sig].uncertainty,.58)))}else if(raised.length){kind='strain';q.signals.forEach(sig=>setSignal(sig,Math.max(.08,belief[sig].pressure*.85),Math.min(belief[sig].uncertainty,.55));raised.forEach(sig=>setSignal(sig,Math.max(belief[sig].pressure,.68),.28))}else if(e.direction===-1){kind='healthy';const strong=e.strength>=.8;q.signals.forEach(sig=>setSignal(sig,strong?.04:.2,strong?.1:.28))}else if(e.direction===1){kind='strain';const strong=e.strength>=.8;q.signals.forEach(sig=>setSignal(sig,strong?.9:.58,strong?.08:.3));raised.push(...q.signals)}else{q.signals.forEach(sig=>setSignal(sig,belief[sig].pressure,Math.max(.5,belief[sig].uncertainty*.95)))}turns.push({id:q.id,role:q.role,signals:q.signals,prompt:q.prompt,answer:a.label,answerId:a.id,kind,raised});next()}async function finish(reason){$('dialogue').classList.add('hidden');$('done').classList.remove('hidden');$('again').classList.remove('hidden');const hot=SC[selected].hot,ranked=Object.entries(belief).sort((a,b)=>b[1].pressure-a[1].pressure),top=ranked.filter(([,v])=>v.pressure>=.48).map(([k])=>k),hits=hot.filter(x=>top.includes(x)).length,recall=hot.length?hits/hot.length:top.length?0:1,precision=top.length?hits/top.length:hot.length?0:1,f1=precision+recall?2*precision*recall/(precision+recall):0,scorecard={driver_detection:+f1.toFixed(3),questions:turns.length,information_efficiency:+(f1/Math.max(1,turns.length)).toFixed(3),true_driver_rank:hot.map(h=>ranked.findIndex(([k])=>k===h)+1)};const{error}=await supabase.from('el8_qa_accelerated_checkins').insert({user_id:s.user.id,member_code:p.member_code,qa_session_id:ss.id,qa_cycle:ss.cycle,interval_seconds:0,answers:{scenario:selected,hidden_drivers:hot,turns},intelligence_shadow:{engine:'adaptive-discovery-v1-semantic-human',belief,scorecard,stop_reason:reason}});$('done').innerHTML=`<h2>Cycle ${ss.cycle} complete</h2><p>Stopped: <strong>${reason}</strong></p><p>Driver detection <strong>${Math.round(f1*100)}%</strong> · questions <strong>${turns.length}</strong></p><p class="small">${error?'Save failed: '+error.message:'Saved as semantic Discovery v1 test.'}</p>`;if(!error){ss.cycle++;save()}}$('start').onclick=()=>{turns=[];reset();$('setup').classList.add('hidden');$('dialogue').classList.remove('hidden');$('info').textContent=`Cycle ${ss.cycle} · ${SC[selected].label} · Semantic Branching v1`;next()};$('again').onclick=()=>location.reload();</script></body></html>
