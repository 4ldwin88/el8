<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Branching Discovery v1</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.hidden{display:none}.small{color:var(--muted);font-size:13px}.choice{display:block;width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.choice.selected{outline:2px solid var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:10px}.trace{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Tester tools · Branching Discovery v1</div><h1>Adaptive discovery simulator</h1><p>Question-bank prototype. Answers change the next route; positive evidence has magnitude.</p><div class="el8-card"><div class="small">Session</div><div id="info"></div></div><div id="setup"><div class="el8-card"><h2>Hidden starting state</h2><div id="scenarios"></div></div><button id="start" class="primary">Start branching cycle</button></div><div id="dialogue" class="hidden"><div id="trace"></div><div id="question" class="el8-card"></div></div><div id="done" class="el8-card hidden"></div><button id="again" class="primary hidden">Start next cycle</button><button class="el8-bottom-action" onclick="location.href='qa.html'">Back to QA Inspector</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{DISCOVERY_ANSWERS,DISCOVERY_QUESTION_BANK as BANK}from'./intelligence/selection/discovery-question-bank-v1.js';const $=id=>document.getElementById(id),s=await getSessionOrRedirect(),p=await getMyProfile();if(!s||!p||!/^T\d+/i.test(p.member_code||'')){location.replace('profile.html');throw Error('Tester only')}const SIGNALS=['sleep','stress','social_connection','employment_stability','financial_security','environmental_stability','purpose','cognitive_load'];const SC={well:{label:'Generally well',hot:[]},sleep:{label:'Sleep deterioration',hot:['sleep']},financial:{label:'Financial pressure',hot:['financial_security','stress']},work:{label:'Work instability',hot:['employment_stability','financial_security','stress']},social:{label:'Social disconnection',hot:['social_connection','stress']},meaning:{label:'Loss of meaning / direction',hot:['purpose','stress']},environment:{label:'Environmental disruption',hot:['environmental_stability','sleep','stress']},multi:{label:'Multiple interacting problems',hot:['employment_stability','financial_security','social_connection','stress','sleep']}};const KEY='el8-adaptive-discovery-v1-branching';let ss=JSON.parse(localStorage.getItem(KEY)||'null')||{id:crypto.randomUUID(),cycle:1};let selected='well',turns=[],belief=Object.fromEntries(SIGNALS.map(x=>[x,{pressure:.15,uncertainty:.85}]));const save=()=>localStorage.setItem(KEY,JSON.stringify(ss));save();$('info').textContent=`Cycle ${ss.cycle} · Branching Discovery v1`;$('scenarios').innerHTML=Object.entries(SC).map(([k,x])=>`<button class="choice ${k==='well'?'selected':''}" data-k="${k}">${x.label}</button>`).join('');document.querySelectorAll('#scenarios .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#scenarios .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.k});const asked=()=>new Set(turns.map(t=>t.id));function trace(){$('trace').innerHTML=turns.map((t,i)=>`<div class="trace"><strong>${i+1}. ${t.prompt}</strong><br><span class="small">${t.answer} · ${t.role}</span></div>`).join('')}function value(q){if(asked().has(q.id))return-99;const bs=q.signals.map(x=>belief[x]);const uncertainty=bs.reduce((a,b)=>a+b.uncertainty,0)/bs.length;const pressure=Math.max(...bs.map(x=>x.pressure));const multi=q.signals.length>1?Math.min(.35,q.signals.length*.045):0;let role=q.role==='discriminator'?.22:q.role==='contrast'?.18:q.role==='driver'?.16:q.role==='bridge'?.14:.08;if(!turns.length&&['discriminator','contrast'].includes(q.role))role+=.35;if(turns.length){const last=turns.at(-1);if(['some_strain','significant_strain'].includes(last.answerId)&&q.signals.some(x=>last.signals.includes(x))&&['driver','bridge','state'].includes(q.role))role+=.42;if(last.answerId==='unsure'&&['discriminator','contrast','bridge'].includes(q.role))role+=.4;if(['very_well','okay'].includes(last.answerId)&&q.signals.some(x=>last.signals.includes(x)))role-=.3}return uncertainty*.42+pressure*.25+multi+role}function choose(){return BANK.slice().sort((a,b)=>value(b)-value(a))[0]}function shouldStop(){if(turns.length>=6)return'question-budget';const unresolved=Object.values(belief).filter(x=>x.uncertainty>.38);const pressured=Object.values(belief).filter(x=>x.pressure>.48);if(turns.length>=2&&!pressured.length&&unresolved.length<=2)return'healthy-confidence';if(turns.length>=3&&value(choose())<.28)return'low-information-value';return null}function next(){trace();const stop=shouldStop();if(stop)return finish(stop);const q=choose();$('question').innerHTML=`<div class="small">${q.role} · ${q.signals.join(' / ').replaceAll('_',' ')}</div><h2>${q.prompt}</h2><div id="opts"></div>`;const opts=q.format==='weighted'?DISCOVERY_ANSWERS:DISCOVERY_ANSWERS;opts.forEach(a=>{const b=document.createElement('button');b.className='choice';b.textContent=a.label;b.onclick=()=>answer(q,a);$('opts').appendChild(b)})}function answer(q,a){q.signals.forEach(sig=>{const old=belief[sig];if(a.id==='very_well')belief[sig]={pressure:.04,uncertainty:.1};else if(a.id==='okay')belief[sig]={pressure:.2,uncertainty:.28};else if(a.id==='some_strain')belief[sig]={pressure:.58,uncertainty:.3};else if(a.id==='significant_strain')belief[sig]={pressure:.9,uncertainty:.08};else belief[sig]={pressure:old.pressure,uncertainty:Math.max(.55,old.uncertainty*.94)}});turns.push({id:q.id,role:q.role,signals:q.signals,prompt:q.prompt,answer:a.label,answerId:a.id});next()}async function finish(reason){$('dialogue').classList.add('hidden');$('done').classList.remove('hidden');$('again').classList.remove('hidden');const hot=SC[selected].hot,ranked=Object.entries(belief).sort((a,b)=>b[1].pressure-a[1].pressure),top=ranked.filter(([,v])=>v.pressure>=.48).map(([k])=>k),hits=hot.filter(x=>top.includes(x)).length,recall=hot.length?hits/hot.length:top.length?0:1,precision=top.length?hits/top.length:hot.length?0:1,f1=precision+recall?2*precision*recall/(precision+recall):0,scorecard={driver_detection:+f1.toFixed(3),questions:turns.length,information_efficiency:+(f1/Math.max(1,turns.length)).toFixed(3),true_driver_rank:hot.map(h=>ranked.findIndex(([k])=>k===h)+1)};const{error}=await supabase.from('el8_qa_accelerated_checkins').insert({user_id:s.user.id,member_code:p.member_code,qa_session_id:ss.id,qa_cycle:ss.cycle,interval_seconds:0,answers:{scenario:selected,hidden_drivers:hot,turns},intelligence_shadow:{engine:'adaptive-discovery-v1-branching-human',belief,scorecard,stop_reason:reason}});$('done').innerHTML=`<h2>Cycle ${ss.cycle} complete</h2><p>Stopped: <strong>${reason}</strong></p><p>Driver detection <strong>${Math.round(f1*100)}%</strong> · questions <strong>${turns.length}</strong> · efficiency <strong>${scorecard.information_efficiency}</strong></p><p class="small">${error?'Save failed: '+error.message:'Saved as branching Discovery v1 test.'}</p>`;if(!error){ss.cycle++;save()}}$('start').onclick=()=>{turns=[];belief=Object.fromEntries(SIGNALS.map(x=>[x,{pressure:.15,uncertainty:.85}]));$('setup').classList.add('hidden');$('dialogue').classList.remove('hidden');$('info').textContent=`Cycle ${ss.cycle} · ${SC[selected].label} · Branching v1`;next()};$('again').onclick=()=>location.reload();</script></body></html>
