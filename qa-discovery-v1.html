<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Discovery v1</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.hidden{display:none}.small{color:var(--muted);font-size:13px}.choice{display:block;width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.choice.selected{outline:2px solid var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:10px}.trace{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Tester tools · Semantic Discovery v1</div><h1>Adaptive discovery simulator</h1><p>Questions and answers are semantic units. Your answer changes both evidence and the next route.</p><div class="el8-card"><div class="small">Session</div><div id="info">Ready</div></div><div id="setup"><div class="el8-card"><h2>Hidden starting state</h2><div id="scenarios"></div></div><button id="start" class="primary">Start discovery cycle</button></div><div id="dialogue" class="hidden"><div id="trace"></div><div id="question" class="el8-card"></div></div><div id="done" class="el8-card hidden"></div><button id="again" class="primary hidden">Start next cycle</button><button class="el8-bottom-action" onclick="location.href='qa.html'">Back to QA Inspector</button></main><script type="module">import{DISCOVERY_QUESTION_BANK as BANK}from'./intelligence/selection/discovery-question-bank-v1.js';const $=x=>document.getElementById(x),SIG=['sleep','stress','social_connection','employment_stability','financial_security','environmental_stability','purpose','cognitive_load'],SC={well:{label:'Generally well',hot:[]},sleep:{label:'Sleep deterioration',hot:['sleep']},financial:{label:'Financial pressure',hot:['financial_security','stress']},work:{label:'Work instability',hot:['employment_stability','financial_security','stress']},social:{label:'Social disconnection',hot:['social_connection','stress']},meaning:{label:'Loss of meaning / direction',hot:['purpose','stress']},environment:{label:'Environmental disruption',hot:['environmental_stability','sleep','stress']},multi:{label:'Multiple interacting problems',hot:['employment_stability','financial_security','social_connection','stress','sleep']}};let selected='well',turns=[],belief={};const reset=()=>belief=Object.fromEntries(SIG.map(x=>[x,{pressure:.15,uncertainty:.85}]));reset();$('scenarios').innerHTML=Object.entries(SC).map(([k,v])=>`<button class="choice ${k==='well'?'selected':''}" data-k="${k}">${v.label}</button>`).join('');document.querySelectorAll('#scenarios .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#scenarios .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.k});const asked=()=>new Set(turns.map(t=>t.id));function value(q){if(asked().has(q.id))return-99;const bs=q.signals.map(x=>belief[x]),u=bs.reduce((a,b)=>a+b.uncertainty,0)/bs.length,p=Math.max(...bs.map(x=>x.pressure));let r={discriminator:.22,contrast:.18,driver:.16,bridge:.14,state:.08,contradiction:.05}[q.role]||0;if(!turns.length&&['discriminator','contrast'].includes(q.role))r+=.35;const l=turns.at(-1);if(l){if(l.kind==='strain'&&q.signals.some(x=>l.raised.includes(x))&&['driver','bridge','state'].includes(q.role))r+=.48;if(l.kind==='uncertain'&&['discriminator','contrast','bridge'].includes(q.role))r+=.4;if(l.kind==='healthy'&&q.signals.some(x=>l.signals.includes(x)))r-=.32;if(l.kind==='broad'&&q.signals.length>2)r+=.22}return u*.42+p*.25+Math.min(.3,q.signals.length*.035)+r}const choose=()=>BANK.slice().sort((a,b)=>value(b)-value(a))[0];function trace(){$('trace').innerHTML=turns.map((t,i)=>`<div class="trace"><strong>${i+1}. ${t.prompt}</strong><br><span class="small">${t.answer} · ${t.role}</span></div>`).join('')}function stop(){if(turns.length>=6)return'question-budget';const unresolved=Object.values(belief).filter(x=>x.uncertainty>.38),pressured=Object.values(belief).filter(x=>x.pressure>.48);if(turns.length>=2&&!pressured.length&&unresolved.length<=2)return'healthy-confidence';if(turns.length>=3&&value(choose())<.28)return'low-information-value';return null}function next(){trace();const why=stop();if(why)return finish(why);const q=choose();$('question').innerHTML=`<div class="small">${q.role}</div><h2>${q.prompt}</h2><div id="opts"></div>`;q.options.forEach(a=>{const b=document.createElement('button');b.className='choice';b.textContent=a.label;b.onclick=()=>answer(q,a);$('opts').appendChild(b)})}const set=(s,p,u)=>belief[s]={pressure:Math.max(0,Math.min(1,p)),uncertainty:Math.max(.05,Math.min(1,u))};function answer(q,a){const e=a.evidence||{},raised=[...(e.raise||[])];let kind='neutral';if(e.uncertain){kind='uncertain';q.signals.forEach(s=>set(s,belief[s].pressure,Math.max(.55,belief[s].uncertainty*.94)))}else if(e.healthy){kind='healthy';q.signals.forEach(s=>set(s,Math.min(belief[s].pressure,.18),.22))}else if(e.broad){kind='broad';q.signals.forEach(s=>set(s,Math.max(belief[s].pressure,.32),Math.min(belief[s].uncertainty,.58)))}else if(raised.length){kind='strain';q.signals.forEach(s=>set(s,Math.max(.08,belief[s].pressure*.85),Math.min(belief[s].uncertainty,.55)));raised.forEach(s=>set(s,Math.max(belief[s].pressure,.68),.28))}else if(e.direction===-1){kind='healthy';const strong=e.strength>=.8;q.signals.forEach(s=>set(s,strong ? .04 : .2,strong ? .1 : .28))}else if(e.direction===1){kind='strain';const strong=e.strength>=.8;q.signals.forEach(s=>set(s,strong ? .9 : .58,strong ? .08 : .3));raised.push(...q.signals)}turns.push({id:q.id,role:q.role,signals:q.signals,prompt:q.prompt,answer:a.label,answerId:a.id,kind,raised});next()}function finish(reason){$('dialogue').classList.add('hidden');$('done').classList.remove('hidden');$('again').classList.remove('hidden');const hot=SC[selected].hot,ranked=Object.entries(belief).sort((a,b)=>b[1].pressure-a[1].pressure),top=ranked.filter(([,v])=>v.pressure>=.48).map(([k])=>k),hits=hot.filter(x=>top.includes(x)).length,recall=hot.length?hits/hot.length:top.length?0:1,precision=top.length?hits/top.length:hot.length?0:1,f1=precision+recall?2*precision*recall/(precision+recall):0,record={engine:'adaptive-discovery-v1-semantic-local',scenario:selected,hidden_drivers:hot,turns,belief,scorecard:{driver_detection:+f1.toFixed(3),questions:turns.length},stop_reason:reason,created_at:new Date().toISOString()};const all=JSON.parse(localStorage.getItem('el8-discovery-v1-runs')||'[]');all.push(record);localStorage.setItem('el8-discovery-v1-runs',JSON.stringify(all));$('done').innerHTML=`<h2>Cycle complete</h2><p>Stopped: <strong>${reason}</strong></p><p>Driver detection <strong>${Math.round(f1*100)}%</strong> · questions <strong>${turns.length}</strong></p><p class="small">Saved locally on this device.</p>`}$('start').onclick=()=>{turns=[];reset();$('setup').classList.add('hidden');$('dialogue').classList.remove('hidden');$('info').textContent=`${SC[selected].label} · Semantic Discovery v1`;next()};$('again').onclick=()=>location.reload();</script></body></html>
