<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Adaptive Discovery v1</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.hidden{display:none}.small{color:var(--muted);font-size:13px}.choice{display:block;width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.choice.selected{outline:2px solid var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:10px}.trace{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Tester tools · Adaptive Discovery v1</div><h1>Hypothesis discovery simulator</h1><p>Experimental challenger to v0.13. Questions are selected by unresolved hypothesis value rather than dimension order.</p><div class="el8-card"><div class="small">Session</div><div id="info"></div></div><div id="setup"><div class="el8-card"><h2>Hidden starting state</h2><div id="scenarios"></div></div><button id="start" class="primary">Start Discovery v1 cycle</button></div><div id="dialogue" class="hidden"><div id="trace"></div><div id="question" class="el8-card"></div></div><div id="done" class="el8-card hidden"></div><button id="again" class="primary hidden">Start next cycle</button><button class="el8-bottom-action" onclick="location.href='qa.html'">Back to QA Inspector</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{selectDiscoveryQuestion}from'./intelligence/selection/adaptive-discovery-v1.js';const $=id=>document.getElementById(id),s=await getSessionOrRedirect(),p=await getMyProfile();if(!s||!p||!/^T\d+/i.test(p.member_code||'')){location.replace('profile.html');throw Error('Tester only')}const SC={well:{label:'Generally well',hot:[]},sleep:{label:'Sleep deterioration',hot:['sleep']},financial:{label:'Financial pressure',hot:['financial_security','stress']},work:{label:'Work instability',hot:['employment_stability','financial_security','stress']},social:{label:'Social disconnection',hot:['social_connection','stress']},meaning:{label:'Loss of meaning / direction',hot:['purpose','stress']},environment:{label:'Environmental disruption',hot:['environmental_stability','sleep','stress']},multi:{label:'Multiple interacting problems',hot:['employment_stability','financial_security','social_connection','stress','sleep']}};const Q=[['Q_SLEEP','sleep','How has your sleep and physical energy been lately?'],['Q_STRESS','stress','How much background stress or emotional weight have you been carrying?'],['Q_SOCIAL','social_connection','Do you feel genuinely connected to people you can rely on?'],['Q_WORK','employment_stability','How stable and manageable do your work, school, or daytime responsibilities feel?'],['Q_MONEY','financial_security','How secure and manageable do money and essential expenses feel right now?'],['Q_HOME','environmental_stability','How supportive and stable does your home or everyday environment feel?'],['Q_MEANING','purpose','How clear does your sense of direction or purpose feel?'],['Q_FOCUS','cognitive_load','How manageable has your mental load and ability to focus been?']].map(([id,signal,prompt])=>({id,signal,prompt,active:true,options:['Doing well','Some strain','Significant strain','Unsure'],information_value:4,actionability:4,burden:1,decision_impact:['employment_stability','financial_security'].includes(signal)?1:.65,answer_evidence:{'Doing well':{uncertainty_reduction:.7,confidence:.9},'Some strain':{uncertainty_reduction:.55,confidence:.75},'Significant strain':{uncertainty_reduction:.75,confidence:.9},Unsure:{uncertainty_reduction:.05,confidence:.2}}}));const KEY='el8-adaptive-discovery-v1';let ss=JSON.parse(localStorage.getItem(KEY)||'null')||{id:crypto.randomUUID(),cycle:1};let selected='well',turns=[],belief={};const save=()=>localStorage.setItem(KEY,JSON.stringify(ss));save();$('info').textContent=`Cycle ${ss.cycle} · Discovery v1`;$('scenarios').innerHTML=Object.entries(SC).map(([k,x])=>`<button class="choice ${k==='well'?'selected':''}" data-k="${k}">${x.label}</button>`).join('');document.querySelectorAll('#scenarios .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#scenarios .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.k});function hyps(){return Q.map(q=>{const b=belief[q.signal]||{confidence:.15,uncertainty:.85};return{id:'H_'+q.signal,signals:[q.signal],confidence:b.confidence,uncertainty:b.uncertainty,status:b.uncertainty<.25?'resolved':'candidate'}})}function trace(){$('trace').innerHTML=turns.map((t,i)=>`<div class="trace"><strong>${i+1}. ${t.prompt}</strong><br><span class="small">${t.answer} · ${t.signal}</span></div>`).join('')}function next(){trace();const seen=turns.map(t=>t.id),context={includeInactive:true,activeTriggers:[],availableEvidence:seen.map(id=>Q.find(q=>q.id===id)?.signal).filter(Boolean),completedQuestionIds:seen,recentQuestionIds:seen,recentSignals:turns.map(t=>t.signal),evidenceAgeDays:{},friction:0,capacity:1,questionsAsked:turns.length,burdenUsed:turns.length,maxQuestions:6,maxBurden:6,minimumDiscoveryValue:.1,hypotheses:hyps(),decisionRelevantSignals:SC[selected].hot};const r=selectDiscoveryQuestion(Q,context);if(!r.selected){finish(r.stop.reason);return}const q=r.selected.question;$('question').innerHTML=`<div class="small">Information-seeking probe · ${q.signal.replaceAll('_',' ')}</div><h2>${q.prompt}</h2><div id="opts"></div>`;q.options.forEach(a=>{const b=document.createElement('button');b.className='choice';b.textContent=a;b.onclick=()=>answer(q,a);$('opts').appendChild(b)})}function answer(q,a){const old=belief[q.signal]||{confidence:.15,uncertainty:.85};if(a==='Doing well')belief[q.signal]={confidence:.08,uncertainty:.12};else if(a==='Some strain')belief[q.signal]={confidence:.58,uncertainty:.32};else if(a==='Significant strain')belief[q.signal]={confidence:.88,uncertainty:.1};else belief[q.signal]={confidence:old.confidence,uncertainty:Math.max(.45,old.uncertainty*.95)};turns.push({id:q.id,signal:q.signal,prompt:q.prompt,answer:a});next()}async function finish(reason){$('dialogue').classList.add('hidden');$('done').classList.remove('hidden');$('again').classList.remove('hidden');const hot=SC[selected].hot,ranked=Object.entries(belief).sort((a,b)=>b[1].confidence-a[1].confidence),top=ranked.filter(([,v])=>v.confidence>=.5).map(([k])=>k),hits=hot.filter(x=>top.includes(x)).length,recall=hot.length?hits/hot.length:top.length?0:1,precision=top.length?hits/top.length:hot.length?0:1,f1=precision+recall?2*precision*recall/(precision+recall):0,scorecard={driver_detection:+f1.toFixed(3),questions:turns.length,information_efficiency:+(f1/Math.max(1,turns.length)).toFixed(3),true_driver_rank:hot.map(h=>ranked.findIndex(([k])=>k===h)+1)};const{error}=await supabase.from('el8_qa_accelerated_checkins').insert({user_id:s.user.id,member_code:p.member_code,qa_session_id:ss.id,qa_cycle:ss.cycle,interval_seconds:0,answers:{scenario:selected,hidden_drivers:hot,turns},intelligence_shadow:{engine:'adaptive-discovery-v1-human',belief,hypotheses:hyps(),scorecard,stop_reason:reason}});$('done').innerHTML=`<h2>Cycle ${ss.cycle} complete</h2><p>Stopped: <strong>${reason}</strong></p><p>Driver detection <strong>${Math.round(f1*100)}%</strong> · questions <strong>${turns.length}</strong> · efficiency <strong>${scorecard.information_efficiency}</strong></p><p class="small">${error?'Save failed: '+error.message:'Saved as Discovery v1 human test.'}</p>`;if(!error){ss.cycle++;save()}}$('start').onclick=()=>{turns=[];belief={};$('setup').classList.add('hidden');$('dialogue').classList.remove('hidden');$('info').textContent=`Cycle ${ss.cycle} · ${SC[selected].label} · Discovery v1`;next()};$('again').onclick=()=>location.reload();</script></body></html>
