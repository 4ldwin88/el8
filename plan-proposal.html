<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Proposed plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:var(--muted);text-align:center}.dimension{margin:18px 0 6px;font-size:12px;color:var(--g);font-weight:900;text-transform:uppercase;letter-spacing:.09em}.action{display:block;width:100%;text-align:left;margin:8px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.action.selected{outline:2px solid currentColor}.small{font-size:13px;color:var(--muted);line-height:1.45}.review{display:flex;gap:8px;margin:14px 0}.review button{flex:1}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span></span><span></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Plan</span></div><div class="el8-eyebrow">Priorities confirmed</div><h1>Your proposed plan.</h1><p>Choose one or two actions. EL8 will review how the plan is working instead of silently changing it.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><p><strong>When should EL8 review this plan with you?</strong></p><div class="review"><button class="action selected" data-days="7">1 week</button><button class="action" data-days="14">2 weeks</button></div><p id="message" class="small"></p><button id="accept" class="el8-btn">Accept plan</button></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{createPlanProposal,canAcceptPlan,acceptPlan}from'./app/onboarding/plan-proposal-contract.js';import{persistInitialPlan,dimensionFor}from'./app/onboarding/persistence.js';import{initialPlanProposal}from'./app/onboarding/discovery-runtime.js';import{instrumentOnboardingStage,recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');instrumentOnboardingStage('plan');const raw=sessionStorage.getItem('el8_initial_plan_proposal'),discoveryRaw=sessionStorage.getItem('el8_discovery_output'),stored=raw?JSON.parse(raw):null,discoveryOutput=discoveryRaw?JSON.parse(discoveryRaw):null;const actions=document.getElementById('actions'),message=document.getElementById('message');let selected=[],reviewDays=7,source=stored;if(stored?.confirmedPriorities?.length&&discoveryOutput?.plan){const confirmed=new Set(stored.confirmedPriorities),focus=(discoveryOutput.plan.focus||[]).filter(x=>confirmed.has(x.concernId)),candidateActions=(stored.candidateActions||[]).filter(x=>confirmed.has(x.concernId));source={...stored,focus,candidateActions};sessionStorage.setItem('el8_initial_plan_proposal',JSON.stringify(source))}if(!source){message.textContent='Discovery results are not available. Please complete Discovery first.';accept.disabled=true}else if(!source.confirmedPriorities?.length){message.textContent='Confirm your priorities before reviewing a plan.';accept.disabled=true;setTimeout(()=>location.replace('proposed-priorities.html'),500)}else{explanation.textContent=source.explanation||'EL8 found a small set of actions worth considering for the priorities you confirmed.';let last='';(source.candidateActions||[]).forEach(a=>{if(!source.confirmedPriorities.includes(a.concernId))return;const dim=dimensionFor(a.concernId);if(dim!==last){const h=document.createElement('div');h.className='dimension';h.textContent=dim;actions.appendChild(h);last=dim}const b=document.createElement('button');b.className='action';b.innerHTML=`<strong>${a.title||a.label||a.id}</strong>${a.measurement?`<div class="small">${a.measurement}</div>`:''}`;b.onclick=()=>{const was=selected.includes(a.id);if(was)selected=selected.filter(x=>x!==a.id);else if(selected.length<2)selected=[...selected,a.id];b.classList.toggle('selected',selected.includes(a.id));message.textContent=selected.length?'':'Choose one or two actions.'};actions.appendChild(b)});if(!source.candidateActions?.some(a=>source.confirmedPriorities.includes(a.concernId))){message.textContent='EL8 does not yet have a suitable starter action for the priority you confirmed. Change priorities or Discovery answers.';accept.disabled=true}}document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{reviewDays=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('selected',x===b))});accept.onclick=async()=>{const draft=createPlanProposal(source,{selectedActionIds:selected,reviewDays});if(!canAcceptPlan(draft)){message.textContent='Choose one or two actions before accepting your plan.';message.classList.add('error');return}const plan=acceptPlan(draft);accept.disabled=true;accept.textContent='Saving…';try{await persistInitialPlan({userId:auth.user.id,plan,discoveryOutput});recordOnboardingEvent('plan_accepted',{selectedActionIds:selected,reviewDays,confirmedPriorities:source.confirmedPriorities});location.replace('introduction.html')}catch(e){accept.disabled=false;accept.textContent='Accept plan';message.textContent=e.message;message.classList.add('error')}};</script></body></html>
