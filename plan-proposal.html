<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Starting plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 30px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.action{display:block;width:100%;text-align:left;margin:8px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:13px;color:var(--muted);line-height:1.45}.why{margin-top:7px;font-size:12px;line-height:1.45}.alt{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}.alt button{width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:left}.deepening{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.actions{display:grid;gap:8px;margin-top:12px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span></span><span></span><span></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Your starting plan · canonical</div><h1 id="title">Start small. Learn what works.</h1><p id="intro">EL8 is using your Discovery evidence, confirmed focuses and capacity to determine the smallest justified next step.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><div id="deepening" class="deepening" hidden><strong id="deepeningTitle"></strong><div id="deepeningText" class="small"></div></div><p id="message" class="small"></p><div class="actions"><button id="accept" class="el8-btn" hidden></button><button id="focus" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Change my focuses</button><button id="qa" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Back to QA</button></div></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{buildCanonicalPlan}from'./intelligence/planning/canonical-plan-engine.js';import{canonicalPlanningInputFromBrowser,canonicalBrowserPlanView}from'./app/onboarding/browser-planning-adapter.js';import{projectOnboardingMemberState}from'./app/onboarding/member-state-projection.js';import{loadCanonicalMemberState}from'./app/onboarding/member-state-persistence.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const qaRun=Boolean(sessionStorage.getItem('el8_qa_run_id'));let output=null,confirmed=[];try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');confirmed=JSON.parse(sessionStorage.getItem('el8_confirmed_priorities')||'[]')}catch{}if(!output||!confirmed.length){location.replace('discovery.html');throw Error('Discovery and confirmed focus required')}let selectionEvidence={},activationEvidence={},rejected=[];try{selectionEvidence=JSON.parse(sessionStorage.getItem('el8_plan_selection_evidence')||'{}');activationEvidence=JSON.parse(sessionStorage.getItem('el8_plan_activation_evidence')||'{}');rejected=JSON.parse(sessionStorage.getItem('el8_rejected_action_ids')||'[]')}catch{}let persisted=null;if(!qaRun)persisted=await loadCanonicalMemberState(auth.user.id);const memberState=persisted?.state||projectOnboardingMemberState({memberId:auth.user.id,discoveryOutput:output,confirmedPriorities:confirmed});if(persisted&&persisted.revision!==memberState.revision)throw Error('Stored Member State revision mismatch');const input=canonicalPlanningInputFromBrowser({discoveryOutput:output,confirmedPriorities:confirmed,memberStateRevision:memberState.revision});const build=()=>buildCanonicalPlan(input,{selectionEvidence,activationEvidence,rejectedInterventionIds:rejected});let plan=build(),view=canonicalBrowserPlanView(plan);const explanation=document.getElementById('explanation'),actionsEl=document.getElementById('actions'),deepening=document.getElementById('deepening'),deepeningTitle=document.getElementById('deepeningTitle'),deepeningText=document.getElementById('deepeningText'),message=document.getElementById('message'),accept=document.getElementById('accept'),qa=document.getElementById('qa'),focus=document.getElementById('focus'),adjust=new URLSearchParams(location.search).get('adjust')==='1'||sessionStorage.getItem('el8_plan_adjust_mode')==='1';const nice=s=>String(s||'').replace(/^problem:/,'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());function save(){sessionStorage.setItem('el8_canonical_initial_plan',JSON.stringify(plan));sessionStorage.setItem('el8_plan_deepening',JSON.stringify(view.deepening))}function rerender(){actionsEl.innerHTML='';if(adjust){document.getElementById('title').textContent='What would work better?';document.getElementById('intro').textContent='EL8 will only offer alternatives that remain supported by your evidence and confirmed focus. Rejecting an action does not remove the focus.'}view.actions.forEach(a=>{const d=document.createElement('div');d.className='action';const alternatives=(plan.backlog||[]).filter(x=>x.problemId===a.problemId&&!rejected.includes(x.intervention_id));d.innerHTML=`<strong>${a.title||a.intervention_id}</strong><div class="why"><strong>Why:</strong> Covers ${nice(a.problemId)}, fits the evidence for that focus and stays within current capacity.</div>${adjust?`<div class="alt"><div class="small">If this action does not fit, choose another supported option:</div>${alternatives.map(x=>`<button type="button" data-reject="${a.intervention_id}" data-alt="${x.intervention_id}">${x.title||x.intervention_id}</button>`).join('')||'<div class="small">No other supported action is currently available for this focus.</div>'}</div>`:''}`;actionsEl.appendChild(d)});actionsEl.querySelectorAll('button[data-reject]').forEach(b=>b.onclick=()=>{const old=b.dataset.reject;rejected=[...new Set([...rejected,old])];sessionStorage.setItem('el8_rejected_action_ids',JSON.stringify(rejected));recordOnboardingEvent('plan_action_rejected',{rejectedActionId:old,requestedAlternativeId:b.dataset.alt,confirmedPriorities:confirmed});plan=build();view=canonicalBrowserPlanView(plan);save();rerender()})}save();recordOnboardingEvent('plan_proposal_viewed',{status:view.status,focusCount:confirmed.length,actionCount:view.actions.length,adjust,planner:'canonical'});if(view.status==='deepen'&&view.selectionDeepening.required){recordOnboardingEvent('plan_selection_deepening_started',{requirementCount:view.selectionDeepening.requirements.length});location.replace('plan-assessment.html?stage=selection')}else if(view.status==='active'){explanation.textContent='EL8 has translated your confirmed focuses into a small evidence-supported plan. You retain final control over both the focuses and the actions.';rerender();if(view.deepening.blocking.length){deepening.hidden=false;deepeningTitle.textContent='One final plan detail';deepeningText.textContent='Only action-specific information still required for activation will be asked.';accept.hidden=false;accept.textContent='Continue';accept.onclick=()=>location.assign('plan-assessment.html?stage=activation')}else{message.textContent=adjust?'When the actions look workable, continue to final review.':'This plan is ready for your review.';accept.hidden=false;accept.textContent='Review plan';accept.onclick=()=>{sessionStorage.removeItem('el8_plan_adjust_mode');location.assign('plan-assessment.html?stage=ready')}}}else{explanation.textContent='EL8 does not yet have enough justified evidence to activate a plan.';message.textContent=view.reason||'More information is required.';accept.hidden=false;accept.textContent='Return to Discovery';accept.onclick=()=>location.assign('discovery.html?mode=clarify')}focus.onclick=()=>location.assign('proposed-priorities.html?adjust=1');qa.onclick=()=>location.assign('qa.html');</script></body></html>
