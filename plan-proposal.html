<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Starting plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.action{display:block;width:100%;text-align:left;margin:8px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:13px;color:var(--muted);line-height:1.45}.deepening{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.deepening strong{display:block;margin-bottom:4px}.actions{display:grid;gap:8px;margin-top:12px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span></span><span></span><span></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Your starting plan</div><h1>Start small. Learn what works.</h1><p id="intro">EL8 is using your Discovery evidence and confirmed focuses to choose the smallest useful next step.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><div id="deepening" class="deepening" hidden><strong id="deepeningTitle"></strong><div id="deepeningText" class="small"></div></div><p id="message" class="small"></p><div class="actions"><button id="accept" class="el8-btn" hidden></button><button id="qa" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Back to QA</button></div></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{buildOnboardingAdaptivePlan,onboardingPlanView}from'./app/onboarding/adaptive-plan.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');let output=null,confirmed=[];try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');confirmed=JSON.parse(sessionStorage.getItem('el8_confirmed_priorities')||'[]')}catch{}if(!output||!confirmed.length){location.replace('discovery.html');throw Error('Discovery and confirmed focus required')}sessionStorage.removeItem('el8_initial_plan_proposal');let selectionEvidence={},evidence={};try{selectionEvidence=JSON.parse(sessionStorage.getItem('el8_plan_selection_evidence')||'{}');evidence=JSON.parse(sessionStorage.getItem('el8_plan_activation_evidence')||'{}')}catch{}const baselineHandoff=output.baselineHandoff||{},recommended=(output.plan?.focus||[]).map(x=>x.concernId).filter(Boolean),plan=buildOnboardingAdaptivePlan({discoveryOutput:output,recommendedPriorities:recommended,confirmedPriorities:confirmed,baselineHandoff,selectionEvidence,evidence}),view=onboardingPlanView(plan),explanation=document.getElementById('explanation'),actionsEl=document.getElementById('actions'),deepening=document.getElementById('deepening'),deepeningTitle=document.getElementById('deepeningTitle'),deepeningText=document.getElementById('deepeningText'),message=document.getElementById('message'),accept=document.getElementById('accept'),qa=document.getElementById('qa');function discoveryFallback(){const byConcern=new Map((output.plan?.focus||[]).map(f=>[f.concernId,f])),picked=[];for(const id of confirmed){const focus=byConcern.get(id);if(focus?.actions?.length)picked.push({...focus.actions[0],concernId:id,dimension:focus.label||id})}return picked.slice(0,3)}let effective=plan,fallback=[];if(view.status!=='active'&&view.reason==='no_eligible_authorized_action'){fallback=discoveryFallback();if(fallback.length){effective={...plan,status:'active',reason:null,active:fallback,actions:fallback,reviewDays:7,uncertainty:'Discovery found supported, low-burden actions. This first plan is provisional and will be reviewed from actual results.'}}sessionStorage.setItem('el8_adaptive_initial_plan',JSON.stringify(effective));const effectiveView=onboardingPlanView(effective);sessionStorage.setItem('el8_plan_deepening',JSON.stringify(effectiveView.deepening));if(effectiveView.status==='deepen'&&effectiveView.selectionDeepening.required){explanation.textContent='EL8 needs one small piece of information before choosing between otherwise reasonable actions.';deepening.hidden=false;deepeningTitle.textContent='One quick question comes next.';deepeningText.textContent='This changes which action EL8 chooses rather than repeating Discovery.';message.textContent=`${effectiveView.selectionDeepening.requirements.length} decision-relevant item${effectiveView.selectionDeepening.requirements.length===1?'':'s'} needed.`;accept.hidden=false;accept.textContent='Continue';accept.onclick=()=>location.assign('plan-assessment.html?stage=selection')}else if(effectiveView.status==='active'){explanation.textContent=effective.uncertainty||'This is a provisional evidence-informed plan.';effectiveView.actions.forEach(a=>{const d=document.createElement('div');d.className='action';d.innerHTML=`<strong>${a.title||a.id}</strong><div class="small">${a.rationale||a.measurement||'Selected from your current evidence and capacity.'}</div>`;actionsEl.appendChild(d)});if(fallback.length){message.textContent='This MVP plan uses Discovery’s supported intervention candidates rather than sending you back through a loop.';accept.hidden=false;accept.textContent='Review and activate plan';accept.onclick=()=>location.assign('plan-assessment.html?stage=ready')}else if(effectiveView.activationStatus==='needs_plan_specific_assessment'||effectiveView.deepening.blocking.length){deepening.hidden=false;deepeningTitle.textContent='A short plan-specific assessment comes next.';deepeningText.textContent='EL8 has selected an action but needs distinct activation evidence.';accept.hidden=false;accept.textContent='Continue to plan assessment';accept.onclick=()=>location.assign('plan-assessment.html?stage=activation')}else{message.textContent='This action is ready to activate.';accept.hidden=false;accept.textContent='Review and activate plan';accept.onclick=()=>location.assign('plan-assessment.html?stage=ready')}}else{explanation.textContent='EL8 needs more information before it can justify a useful action.';message.textContent='You can return to Discovery or exit to QA instead of being trapped in the flow.';accept.hidden=false;accept.textContent='Return to Discovery';accept.onclick=()=>location.assign('discovery.html?mode=clarify')}qa.onclick=()=>location.assign('qa.html');</script></body></html>
