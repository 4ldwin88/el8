<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Your first plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:28px 0 10px}.action{display:block;width:100%;text-align:left;margin:10px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.action.selected{outline:2px solid currentColor}.small{font-size:13px;color:var(--muted);line-height:1.45}.review{display:flex;gap:8px;margin:14px 0}.review button{flex:1}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Your first plan</div><h1>Start small enough to follow through.</h1><p>Based on Discovery, choose one or two actions. You can adjust the plan; EL8 will review how it is working rather than locking you into it.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><p><strong>When should EL8 review this plan with you?</strong></p><div class="review"><button class="action selected" data-days="7">1 week</button><button class="action" data-days="14">2 weeks</button></div><p id="message" class="small"></p><button id="accept" class="el8-btn">Accept plan</button></div></main><script type="module">import{getSessionOrRedirect,supabase}from'./el8-client.js';import{createPlanProposal,canAcceptPlan,acceptPlan}from'./app/onboarding/plan-proposal-contract.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const raw=sessionStorage.getItem('el8_initial_plan_proposal');const source=raw?JSON.parse(raw):null;const actions=document.getElementById('actions'),message=document.getElementById('message');let selected=[],reviewDays=7;if(!source){message.textContent='Discovery results are not available. Please complete Discovery first.';accept.disabled=true}else{explanation.textContent=source.explanation||'EL8 found a small set of actions worth considering.';(source.candidateActions||[]).forEach(a=>{const b=document.createElement('button');b.className='action';b.innerHTML=`<strong>${a.title||a.label||a.id}</strong>${a.description?`<div class="small">${a.description}</div>`:''}`;b.onclick=()=>{if(selected.includes(a.id))selected=selected.filter(x=>x!==a.id);else if(selected.length<2)selected=[...selected,a.id];b.classList.toggle('selected',selected.includes(a.id));message.textContent=selected.length?'':'Choose one or two actions.'};actions.appendChild(b)})}document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{reviewDays=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('selected',x===b))});accept.onclick=async()=>{const draft=createPlanProposal(source,{selectedActionIds:selected,reviewDays});if(!canAcceptPlan(draft)){message.textContent='Choose one or two actions before accepting your plan.';message.classList.add('error');return}const plan=acceptPlan(draft);sessionStorage.setItem('el8_accepted_initial_plan',JSON.stringify(plan));accept.disabled=true;accept.textContent='Saving…';const{error}=await supabase.from('el8_profiles').update({onboarding_status:'preferences_required',updated_at:new Date().toISOString()}).eq('user_id',auth.user.id);if(error){accept.disabled=false;accept.textContent='Accept plan';message.textContent=error.message;return}location.replace('preferences.html')};</script></body></html>
