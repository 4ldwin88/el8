<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Starting plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 30px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:var(--muted);text-align:center}.action{display:block;width:100%;text-align:left;margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:13px;color:var(--muted);line-height:1.45}.why{margin-top:7px;font-size:12px;line-height:1.45}.actions{display:grid;gap:8px;margin-top:12px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span></span><span></span><span></span></div><div class="labels"><span>Discovery</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Your starting plan</div><h1>Choose what feels workable.</h1><p>Planning now uses only your confirmed canonical Focus and the evidence carried forward from Discovery.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><p id="message" class="small"></p><div class="actions"><button id="accept" class="el8-btn" hidden></button><button id="focus" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Change my focus</button><button id="qa" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Back to QA</button></div></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{buildPlan}from'./intelligence/planning/planningEngine.js';import{focusConfirmationPlanningInput}from'./intelligence/prioritization/focus-confirmation.js';import{canonicalBrowserPlanView}from'./app/onboarding/browser-planning-adapter.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');let output=null,confirmation=null,memberState=null;try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');confirmation=JSON.parse(sessionStorage.getItem('el8_focus_confirmation')||'null');memberState=JSON.parse(sessionStorage.getItem('el8_canonical_member_state')||'null')}catch{}if(!output||!confirmation||!memberState){location.replace('proposed-priorities.html');throw Error('Canonical Discovery, Focus confirmation and Member State are required')}const evidenceRefs=[...new Set((output.trace?.states||[]).flatMap(x=>x.evidenceRefs||[]))],input=focusConfirmationPlanningInput(confirmation,{memberState,evidenceRefs}),plan=buildPlan(input),view=canonicalBrowserPlanView(plan),explanation=document.getElementById('explanation'),actionsEl=document.getElementById('actions'),message=document.getElementById('message'),accept=document.getElementById('accept'),qa=document.getElementById('qa'),focus=document.getElementById('focus'),nice=s=>String(s||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());sessionStorage.setItem('el8_canonical_initial_plan',JSON.stringify(plan));recordOnboardingEvent('plan_proposal_viewed',{status:view.status,focusCount:view.focusIds.length,actionCount:view.actions.length,planner:'canonical-v4',memberStateRevision:memberState.revision});function renderActions(){actionsEl.innerHTML='';view.actions.forEach(a=>{const d=document.createElement('div');d.className='action';d.innerHTML=`<strong>${a.title||nice(a.actionId)}</strong><div class="why">${a.rationale||a.instruction||'Supported by your confirmed Focus and current evidence.'}</div><div class="small">Focus: ${(a.focusIds||[]).map(nice).join(', ')}</div>`;actionsEl.appendChild(d)})}if(view.status==='proposed'){explanation.textContent='EL8 selected the smallest useful Action portfolio that passed the current Planning gates. Focus and Action count are independent.';renderActions();message.textContent=view.uncoveredFocusIds.length?'Some confirmed Focus evidence still lacks an eligible Action. EL8 will not invent one.':'Review the proposed Action set before activation.';accept.hidden=false;accept.textContent='Review plan';accept.onclick=()=>location.assign('plan-confirmation.html')}else if(view.status==='deepen'){explanation.textContent='Planning needs additional Action-specific evidence before it can propose a safe, workable Action.';message.textContent=view.reason||'Required evidence is missing.';accept.hidden=false;accept.textContent='Add plan details';accept.onclick=()=>location.assign('plan-assessment.html?stage=selection')}else if(view.status==='blocked'){explanation.textContent='Ordinary Planning is blocked by the current Safety disposition.';message.textContent=view.reason||'Safety must resolve before Planning can continue.'}else{explanation.textContent='EL8 does not currently have a justified Action to propose.';message.textContent=view.reason||'No eligible Action is available.';accept.hidden=false;accept.textContent='Return to Discovery';accept.onclick=()=>location.assign('discovery.html?mode=clarify')}focus.onclick=()=>location.assign('proposed-priorities.html?adjust=1');qa.onclick=()=>location.assign('qa.html');</script></body></html>
