<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Proposed plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:var(--muted);text-align:center}.dimension{margin:18px 0 6px;font-size:12px;color:var(--g);font-weight:900;text-transform:uppercase;letter-spacing:.09em}.action{display:block;width:100%;text-align:left;margin:8px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:13px;color:var(--muted);line-height:1.45}.deepening{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.deepening strong{display:block;margin-bottom:4px}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span></span><span></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Plan</span></div><div class="el8-eyebrow">Priorities confirmed</div><h1>Your proposed plan.</h1><p>EL8 has built a small starting plan from the priorities and evidence you confirmed. Each action is reviewed independently and can change as EL8 learns what works for you.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><div id="deepening"></div><p id="message" class="small" aria-live="polite"></p><button id="accept" class="el8-btn">Accept plan</button></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{persistAdaptiveInitialPlan,dimensionFor}from'./app/onboarding/persistence.js';import{buildOnboardingAdaptivePlan,onboardingPlanView}from'./app/onboarding/adaptive-plan.js';import{instrumentOnboardingStage,recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');instrumentOnboardingStage('plan');const proposalRaw=sessionStorage.getItem('el8_initial_plan_proposal'),discoveryRaw=sessionStorage.getItem('el8_discovery_output'),baselineRaw=sessionStorage.getItem('el8_baseline_handoff');let proposal=null,discoveryOutput=null,baselineHandoff={};try{proposal=proposalRaw?JSON.parse(proposalRaw):null;discoveryOutput=discoveryRaw?JSON.parse(discoveryRaw):null;baselineHandoff=baselineRaw?JSON.parse(baselineRaw):discoveryOutput?.baselineHandoff||{}}catch{}const actionsEl=document.getElementById('actions'),deepeningEl=document.getElementById('deepening'),message=document.getElementById('message'),accept=document.getElementById('accept'),explanation=document.getElementById('explanation');if(!proposal?.confirmedPriorities?.length||!discoveryOutput?.trace){message.textContent='Discovery results and confirmed priorities are required before EL8 can build your plan.';message.classList.add('error');accept.disabled=true}else{const plan=buildOnboardingAdaptivePlan({discoveryOutput,confirmedPriorities:proposal.confirmedPriorities,baselineHandoff});const view=onboardingPlanView(plan);sessionStorage.setItem('el8_adaptive_initial_plan',JSON.stringify(plan));explanation.textContent=view.uncertainty||'This is a starting plan based on current evidence. EL8 will review outcomes before adapting it.';if(view.status!=='active'||!view.actions.length){message.textContent=view.reason==='insufficient_evidence'?'EL8 needs a little more evidence before recommending an action.':'EL8 does not yet have an eligible action for the priorities you confirmed.';accept.disabled=true}else{view.actions.forEach(a=>{const wrap=document.createElement('div');wrap.className='action';wrap.innerHTML=`<div class="dimension">${dimensionFor(a.driver)}</div><strong>${a.title}</strong>${a.measurement?`<div class="small">How EL8 will review it: ${a.measurement}</div>`:''}`;actionsEl.appendChild(wrap)});if(view.deepening?.required){const box=document.createElement('div');box.className='deepening';const blocking=view.deepening.blocking||[],optional=view.deepening.optional||[];box.innerHTML=`<strong>${blocking.length?'A short plan-specific assessment comes next.':'EL8 may ask a little more to personalize this plan.'}</strong><div class="small">${blocking.length?'Your onboarding established enough for a basic plan. Before activating it, EL8 needs a few details specific to the selected action so success can be measured properly.':`${optional.length} optional detail${optional.length===1?'':'s'} can improve personalization without blocking the plan.`}</div>`;deepeningEl.appendChild(box)}accept.textContent=view.activationStatus==='needs_plan_specific_assessment'?'Continue to plan assessment':'Accept plan';accept.onclick=async()=>{accept.disabled=true;if(view.activationStatus==='needs_plan_specific_assessment'){recordOnboardingEvent('plan_deepening_required',{actionIds:view.actions.map(a=>a.id),requirementIds:view.deepening.blocking.map(r=>r.requirementId)});sessionStorage.setItem('el8_plan_deepening',JSON.stringify(view.deepening));location.assign('plan-assessment.html');return}accept.textContent='Saving…';try{await persistAdaptiveInitialPlan({userId:auth.user.id,plan,discoveryOutput});recordOnboardingEvent('plan_accepted',{actionIds:view.actions.map(a=>a.id),confirmedPriorities:proposal.confirmedPriorities,reviewDays:view.reviewDays});location.replace('introduction.html')}catch(e){accept.disabled=false;accept.textContent='Accept plan';message.textContent=e.message;message.classList.add('error')}}}};</script></body></html>
