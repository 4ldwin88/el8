<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Starting plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 30px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.action{display:block;width:100%;text-align:left;margin:8px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:13px;color:var(--muted);line-height:1.45}.deepening{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.deepening strong{display:block;margin-bottom:4px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span></span><span></span><span></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Your starting plan</div><h1>Start small. Learn what works.</h1><p>EL8 is using your Baseline, Discovery evidence, confirmed focus and capacity to determine the smallest justified next step.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><div id="deepening" class="deepening" hidden><strong id="deepeningTitle"></strong><div id="deepeningText" class="small"></div></div><p id="message" class="small"></p><button id="accept" class="el8-btn" hidden></button></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{buildOnboardingAdaptivePlan,onboardingPlanView}from'./app/onboarding/adaptive-plan.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');let output=null,confirmed=[];try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');confirmed=JSON.parse(sessionStorage.getItem('el8_confirmed_priorities')||'[]')}catch{}if(!output||!confirmed.length){location.replace('discovery.html');throw Error('Discovery and confirmed focus required')}let selectionEvidence={},evidence={};try{selectionEvidence=JSON.parse(sessionStorage.getItem('el8_plan_selection_evidence')||'{}');evidence=JSON.parse(sessionStorage.getItem('el8_plan_activation_evidence')||'{}')}catch{}const plan=buildOnboardingAdaptivePlan({discoveryOutput:output,confirmedPriorities:confirmed,baselineHandoff:output.baselineHandoff||{},selectionEvidence,evidence}),view=onboardingPlanView(plan),explanation=document.getElementById('explanation'),actionsEl=document.getElementById('actions'),deepening=document.getElementById('deepening'),deepeningTitle=document.getElementById('deepeningTitle'),deepeningText=document.getElementById('deepeningText'),message=document.getElementById('message'),accept=document.getElementById('accept');sessionStorage.setItem('el8_adaptive_initial_plan',JSON.stringify(plan));sessionStorage.setItem('el8_plan_deepening',JSON.stringify(view.deepening));recordOnboardingEvent('plan_proposal_viewed',{status:view.status,focusCount:confirmed.length,actionCount:view.actions?.length||0});if(view.status==='deepen'&&view.selectionDeepening.required){explanation.textContent='EL8 needs only the information that can change which action fits your focus.';deepening.hidden=false;deepeningTitle.textContent=view.selectionDeepening.requirements.length===1?'One quick question comes next.':'A few quick questions come next.';deepeningText.textContent='This is action-selection evidence, not a restart of Discovery.';message.textContent=`${view.selectionDeepening.requirements.length} decision-relevant item${view.selectionDeepening.requirements.length===1?'':'s'} needed.`;accept.hidden=false;accept.textContent='Continue';accept.onclick=()=>location.assign('plan-assessment.html?stage=selection')}else if(view.status==='active'){explanation.textContent=view.uncertainty||'This is a provisional evidence-informed plan.';view.actions.forEach(a=>{const d=document.createElement('div');d.className='action';d.innerHTML=`<strong>${a.title||a.id}</strong><div class="small">${a.rationale||'Selected from your current evidence and capacity.'}</div>`;actionsEl.appendChild(d)});if(view.activationStatus==='needs_plan_specific_assessment'||view.deepening.blocking.length){deepening.hidden=false;deepeningTitle.textContent='A short plan-specific assessment comes next.';deepeningText.textContent='Only action-specific evidence still required for safe activation will be asked.';accept.hidden=false;accept.textContent='Continue to plan assessment';accept.onclick=()=>location.assign('plan-assessment.html?stage=activation')}else{message.textContent='This plan is ready for final review.';accept.hidden=false;accept.textContent='Review and activate plan';accept.onclick=()=>location.assign('plan-assessment.html?stage=ready')}}else{explanation.textContent='EL8 does not yet have enough justified evidence to activate a plan.';message.textContent=view.reason||'More information is required.';accept.hidden=false;accept.textContent='Return to Discovery';accept.onclick=()=>location.assign('discovery.html?mode=clarify')}</script></body></html>
