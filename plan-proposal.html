<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Starting plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 30px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:var(--muted);text-align:center}.action{display:block;width:100%;text-align:left;margin:12px 0;padding:15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:13px;color:var(--muted);line-height:1.45}.why{margin-top:7px;font-size:12px;line-height:1.45}.choices{display:grid;gap:7px;margin-top:12px}.choice{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit;text-align:left;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}.choice.selected{border-color:var(--gold);font-weight:700}.choice small{display:block;margin-top:3px;color:var(--muted);font-weight:400}.action-icon{width:32px;height:32px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:18px;line-height:1;background:var(--bg)}.deepening{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:12px}.actions{display:grid;gap:8px;margin-top:12px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span></span><span></span><span></span></div><div class="labels"><span>Discovery</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Your starting plan</div><h1 id="title">Choose what feels workable.</h1><p id="intro">EL8 narrowed each focus to actions supported by what you told us. You choose the action you are willing to try.</p><div class="el8-card"><div id="explanation" class="small"></div><div id="actions"></div><div id="deepening" class="deepening" hidden><strong id="deepeningTitle"></strong><div id="deepeningText" class="small"></div></div><p id="message" class="small"></p><div class="actions"><button id="accept" class="el8-btn" hidden></button><button id="focus" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Change my focuses</button><button id="qa" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Back to QA</button></div></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{buildCanonicalPlan}from'./intelligence/planning/canonical-plan-engine.js';import{canonicalPlanningInputFromBrowser,canonicalBrowserPlanView}from'./app/onboarding/browser-planning-adapter.js';import{projectOnboardingMemberState}from'./app/onboarding/member-state-projection.js';import{loadCanonicalMemberState}from'./app/onboarding/member-state-persistence.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const qaRun=Boolean(sessionStorage.getItem('el8_qa_run_id'));let output=null,confirmed=[];try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');confirmed=JSON.parse(sessionStorage.getItem('el8_confirmed_priorities')||'[]')}catch{}if(!output||!confirmed.length){location.replace('discovery-snapshot.html');throw Error('Discovery and confirmed focus required')}let selectionEvidence={},activationEvidence={},rejected=[],preferred={};try{selectionEvidence=JSON.parse(sessionStorage.getItem('el8_plan_selection_evidence')||'{}');activationEvidence=JSON.parse(sessionStorage.getItem('el8_plan_activation_evidence')||'{}');rejected=JSON.parse(sessionStorage.getItem('el8_plan_rejected_interventions')||sessionStorage.getItem('el8_rejected_action_ids')||'[]');preferred=JSON.parse(sessionStorage.getItem('el8_plan_preferred_interventions')||sessionStorage.getItem('el8_preferred_action_ids')||'{}')}catch{}let persisted=null;if(!qaRun)persisted=await loadCanonicalMemberState(auth.user.id);const memberState=persisted?.state||projectOnboardingMemberState({memberId:auth.user.id,discoveryOutput:output,confirmedPriorities:confirmed});if(persisted&&persisted.revision!==memberState.revision)throw Error('Stored Member State revision mismatch');const input=canonicalPlanningInputFromBrowser({discoveryOutput:output,confirmedPriorities:confirmed,memberStateRevision:memberState.revision});const build=()=>buildCanonicalPlan(input,{selectionEvidence,activationEvidence,rejectedInterventionIds:rejected,preferredInterventionIds:preferred});let plan=build(),view=canonicalBrowserPlanView(plan);const explanation=document.getElementById('explanation'),actionsEl=document.getElementById('actions'),deepening=document.getElementById('deepening'),deepeningTitle=document.getElementById('deepeningTitle'),deepeningText=document.getElementById('deepeningText'),message=document.getElementById('message'),accept=document.getElementById('accept'),qa=document.getElementById('qa'),focus=document.getElementById('focus');const FOCUS_NAMES=Object.freeze({'problem:low_activity':'Movement','problem:poor_sleep':'Sleep','problem:financial_strain':'Money','problem:execution_gap':'Direction and follow-through','problem:income_gap':'Income','problem:stress':'Stress','problem:social_disconnection':'Connection','problem:environment_friction':'Environment'});const nice=s=>FOCUS_NAMES[s]||String(s||'').replace(/^problem:/,'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());const iconFor=a=>{const text=`${a.title||''} ${a.purpose||''} ${(a.actionTemplates||[]).join(' ')}`.toLowerCase();if(/walk|movement|activity|exercise|physical/.test(text))return'🏃';if(/write|journal|note|plan|list|next step/.test(text))return'✏️';if(/sleep|bed|wind.?down/.test(text))return'🌙';if(/money|financial|budget|spend|income/.test(text))return'💰';if(/call|contact|connect|social|relationship/.test(text))return'💬';if(/home|environment|friction|cue|space/.test(text))return'🏠';if(/track|log|check|snapshot|measure/.test(text))return'✓';if(/stress|calm|coping|breath/.test(text))return'◌';return'→'};function save(){sessionStorage.setItem('el8_canonical_initial_plan',JSON.stringify(plan));sessionStorage.setItem('el8_plan_deepening',JSON.stringify(view.deepening));sessionStorage.setItem('el8_plan_preferred_interventions',JSON.stringify(preferred));sessionStorage.removeItem('el8_preferred_action_ids')}function rerender(){actionsEl.innerHTML='';view.actions.forEach(a=>{const d=document.createElement('div');d.className='action';const alternatives=(plan.backlog||[]).filter(x=>x.priorityId===a.priorityId&&!rejected.includes(x.intervention_id));const options=[a,...alternatives];d.innerHTML=`<strong>${nice(a.problemId)} focus</strong><div class="why">Choose one supported action. EL8 will keep the rest available if you want to change it later.</div><div class="choices">${options.map(x=>`<button type="button" class="choice ${x.intervention_id===a.intervention_id?'selected':''}" data-priority="${a.priorityId}" data-choice="${x.intervention_id}" ${x.intervention_id===a.intervention_id?'aria-pressed="true"':'aria-pressed="false"'}><span class="action-icon" aria-hidden="true">${iconFor(x)}</span><span>${x.title||x.intervention_id}<small>${x.rationale||'Supported by your Discovery evidence and current focus.'}</small></span></button>`).join('')}</div>`;actionsEl.appendChild(d)});actionsEl.querySelectorAll('button[data-choice]').forEach(b=>b.onclick=()=>{preferred={...preferred,[b.dataset.priority]:b.dataset.choice};recordOnboardingEvent('plan_action_selected',{priorityId:b.dataset.priority,selectedActionId:b.dataset.choice,confirmedPriorities:confirmed});plan=build();view=canonicalBrowserPlanView(plan);save();rerender()})}save();recordOnboardingEvent('plan_proposal_viewed',{status:view.status,focusCount:confirmed.length,actionCount:view.actions.length,planner:'canonical'});if(view.status==='deepen'&&view.selectionDeepening.required){recordOnboardingEvent('plan_selection_deepening_started',{requirementCount:view.selectionDeepening.requirements.length});location.replace('plan-assessment.html?stage=selection')}else if(view.status==='active'){explanation.textContent='These choices stay inside the evidence and capacity boundaries EL8 established. Selecting an option changes the plan; it does not change your focus.';rerender();if(view.deepening.blocking.length){deepening.hidden=false;deepeningTitle.textContent='One final plan detail';deepeningText.textContent='After you choose, EL8 will ask only for information required to make that action specific enough to start.';accept.hidden=false;accept.textContent='Continue';accept.onclick=()=>location.assign('plan-assessment.html?stage=activation')}else{message.textContent='When the actions feel workable, continue to final review.';accept.hidden=false;accept.textContent='Review plan';accept.onclick=()=>location.assign('plan-confirmation.html')}}else{explanation.textContent='EL8 does not yet have enough justified evidence to activate a plan.';message.textContent=view.reason||'More information is required.';accept.hidden=false;accept.textContent='Return to Discovery';accept.onclick=()=>location.assign('discovery.html?mode=clarify')}focus.onclick=()=>location.assign('proposed-priorities.html?adjust=1');qa.onclick=()=>location.assign('qa.html');</script></body></html>
