<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Profile setup</title><style>:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#121417;--muted:#6d6c66;--line:#e5ded1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:620px;margin:auto;padding:32px 20px}.brand{font-size:30px;font-weight:850}h1{font-size:38px;margin:44px 0 10px}p{color:var(--muted);line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:20px}label{display:block;font-weight:750;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font:inherit}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--ink);color:white;font:inherit;font-weight:800;margin-top:16px}.msg{color:var(--muted);margin-top:12px}</style></head><body><main class="wrap"><div class="brand">EL8</div><h1>Complete your profile.</h1><p>EL8 uses your date of birth as account information, so assessments do not need to ask for your age repeatedly.</p><div class="card"><label>Date of birth</label><input id="birthdate" type="date" autocomplete="bday"><button id="save" class="btn">Save & continue</button><div id="msg" class="msg"></div></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const p=await getMyProfile();if(p.birthdate)location.replace('assessment.html');save.onclick=async()=>{if(!birthdate.value){msg.textContent='Enter your date of birth.';return}save.disabled=true;const{error}=await supabase.from('el8_profiles').update({birthdate:birthdate.value,updated_at:new Date().toISOString()}).eq('user_id',session.user.id);if(error){msg.textContent=error.message;save.disabled=false;return}location.replace('assessment.html')};</script></body></html>
