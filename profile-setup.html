<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Profile</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.field{margin:14px 0}.field label{display:block;font-weight:750;margin-bottom:8px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px}.msg{color:var(--muted);margin-top:12px}.profileCard{margin-top:20px}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Me · Profile</div><h1>Complete your profile.</h1><p>These account details are kept outside assessments so EL8 doesn't repeatedly ask for stable information.</p><div class="el8-card profileCard"><div class="field"><label>Name</label><input id="displayName" autocomplete="name"></div><div class="field"><label>Date of birth</label><input id="birthdate" type="date" autocomplete="bday"></div><div class="field"><label>Sex</label><select id="sex"><option value="">Choose…</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="prefer_not_to_say">Prefer not to say</option></select></div><div class="field"><label>Measurement preference</label><select id="units"><option value="metric">Metric · kg, cm</option><option value="imperial">Imperial · lb, ft/in</option></select></div><button id="saveBtn" class="el8-btn" type="button">Save & continue</button><div id="statusMsg" class="msg"></div></div><button id="backMe" class="el8-bottom-action" type="button">Back to Me</button></main><script type="module">document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light';import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const byId=id=>document.getElementById(id);const session=await getSessionOrRedirect();if(!session)throw Error('No session');const p=await getMyProfile();const displayNameEl=byId('displayName'),birthdateEl=byId('birthdate'),sexEl=byId('sex'),unitsEl=byId('units'),saveButton=byId('saveBtn'),statusMsg=byId('statusMsg');displayNameEl.value=p.display_name||session.user.user_metadata?.display_name||'';birthdateEl.value=p.birthdate||session.user.user_metadata?.birthdate||'';sexEl.value=p.sex||session.user.user_metadata?.sex||'';unitsEl.value=p.measurement_system||session.user.user_metadata?.measurement_system||'metric';const params=new URLSearchParams(location.search),returnTo=params.get('return')==='me'?'app.html#me':null;byId('backMe').style.display=returnTo?'block':'none';byId('backMe').onclick=()=>location.assign('app.html#me');saveButton.addEventListener('click',async()=>{statusMsg.textContent='Saving…';if(!displayNameEl.value.trim()||!birthdateEl.value||!sexEl.value||!unitsEl.value){statusMsg.textContent='Complete all required profile fields.';return}saveButton.disabled=true;try{const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||p.timezone||'UTC',locale=navigator.language||p.locale||'en-CA';const{data,error}=await supabase.from('el8_profiles').update({display_name:displayNameEl.value.trim(),birthdate:birthdateEl.value,sex:sexEl.value,measurement_system:unitsEl.value,timezone,locale,updated_at:new Date().toISOString()}).eq('user_id',session.user.id).select('user_id,birthdate,sex,measurement_system').single();if(error)throw error;if(!data)throw new Error('No profile row was returned.');statusMsg.textContent='Profile saved.';if(returnTo)return location.assign(returnTo);const{data:baseline}=await supabase.from('el8_assessment_sessions').select('id').eq('user_id',session.user.id).eq('module_type','universal_baseline').eq('status','completed').maybeSingle();location.assign(baseline?'app.html#me':'assessment.html?v=3')}catch(e){statusMsg.textContent='Could not save profile: '+(e?.message||String(e));saveButton.disabled=false}});</script></body></html>
