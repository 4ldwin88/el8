<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Profile setup</title><style>:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#121417;--muted:#6d6c66;--line:#e5ded1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{max-width:620px;margin:auto;padding:32px 20px}.brand{font-size:30px;font-weight:850}h1{font-size:38px;margin:44px 0 10px}p{color:var(--muted);line-height:1.5}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:20px}.field{margin:14px 0}label{display:block;font-weight:750;margin-bottom:8px}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;font:inherit;background:white}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--ink);color:white;font:inherit;font-weight:800;margin-top:16px}.msg{color:var(--muted);margin-top:12px}</style></head><body><main class="wrap"><div class="brand">EL8</div><h1>Complete your profile.</h1><p>These account details are kept outside assessments so EL8 doesn't repeatedly ask for stable information.</p><div class="card"><div class="field"><label>Name</label><input id="name" autocomplete="name"></div><div class="field"><label>Date of birth</label><input id="birthdate" type="date" autocomplete="bday"></div><div class="field"><label>Sex</label><select id="sex"><option value="">Choose…</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option><option value="prefer_not_to_say">Prefer not to say</option></select></div><div class="field"><label>Measurement preference</label><select id="units"><option value="metric">Metric · kg, cm</option><option value="imperial">Imperial · lb, ft/in</option></select></div><button id="save" class="btn">Save & continue</button><div id="msg" class="msg"></div></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const p=await getMyProfile();name.value=p.display_name||session.user.user_metadata?.display_name||'';birthdate.value=p.birthdate||session.user.user_metadata?.birthdate||'';sex.value=p.sex||session.user.user_metadata?.sex||'';units.value=p.measurement_system||session.user.user_metadata?.measurement_system||'metric';save.onclick=async()=>{if(!name.value.trim()||!birthdate.value||!sex.value||!units.value){msg.textContent='Complete all required profile fields.';return}save.disabled=true;const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone||p.timezone||'UTC',locale=navigator.language||p.locale||'en-CA';const{error}=await supabase.from('el8_profiles').update({display_name:name.value.trim(),birthdate:birthdate.value,sex:sex.value,measurement_system:units.value,timezone,locale,updated_at:new Date().toISOString()}).eq('user_id',session.user.id);if(error){msg.textContent=error.message;save.disabled=false;return}location.replace('assessment.html')};</script></body></html>
