<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Track</title><script>try{const t=localStorage.getItem('el8-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script><link rel="stylesheet" href="assets/el8-ui.css"><style>.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px calc(82px + env(safe-area-inset-bottom))}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:11px 14px;margin:10px 0 12px}.card b{font-size:13px}.card p{font-size:12px;line-height:1.35;margin:4px 0 0}#text{display:block;width:100%;min-height:145px;resize:vertical;border:2px solid var(--line);border-radius:18px 18px 0 0;padding:16px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}.media{display:grid;grid-template-columns:repeat(4,1fr)}.mediaBtn{position:relative;overflow:hidden;min-height:96px;border:1px solid var(--line);border-top:0;border-radius:0;background:var(--card);color:var(--ink);font:inherit;font-weight:800;display:grid;place-items:center;align-content:center;gap:6px;padding:8px}.mediaBtn:first-child{border-radius:0 0 0 18px}.mediaBtn:last-child{border-radius:0 0 18px 0}.mediaBtn+.mediaBtn{border-left:0}.mediaBtn svg{width:26px;height:26px;stroke:var(--g);fill:none;stroke-width:1.8}.mediaBtn small{font-weight:400;color:var(--muted);font-size:10px}.mediaBtn input[type=file]{display:block!important;position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:3}.mediaBtn svg,.mediaBtn span,.mediaBtn small{pointer-events:none}.reviewBtn{background:var(--ink);color:var(--bg);border-color:var(--ink)}.reviewBtn small{color:inherit;opacity:.72}.selected{border-color:var(--g)}.error{font-size:12px;color:#a33;margin:10px 2px}.nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 96%,transparent);border-top:1px solid var(--line);backdrop-filter:blur(12px);padding-bottom:max(7px,env(safe-area-inset-bottom));z-index:20}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:transparent;color:var(--muted);padding:8px 2px 7px;font-size:11px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}.mark{width:62px;height:62px;margin:-30px auto -1px}.mark img{width:100%;height:100%}</style></head><body><main class="app"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Track</div><h1>Tell EL8 what happened.</h1><div class="card"><b>How tracking works</b><p>Write naturally, take a photo, attach an existing image, record a voice note, or combine text with media. EL8 shows its interpretation before anything becomes part of your record.</p></div><textarea id="text" placeholder="What happened?"></textarea><div class="media"><label class="mediaBtn" id="cameraLabel"><svg viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Camera</span><small id="cameraName">Take photo</small><input id="camera" type="file" accept="image/*" capture="environment"></label><label class="mediaBtn" id="attachLabel"><svg viewBox="0 0 24 24"><path d="M8 12.5l5.5-5.5a3 3 0 014.2 4.2l-7.1 7.1a5 5 0 01-7.1-7.1l7-7"/></svg><span>Attach</span><small id="attachName">Choose image</small><input id="attach" type="file" accept="image/*"></label><button class="mediaBtn" id="voice"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0012 0M12 17v4M9 21h6"/></svg><span>Voice</span><small id="voiceState">Record note</small></button><button class="mediaBtn reviewBtn" id="submit"><svg viewBox="0 0 24 24"><path d="M5 12h14M14 7l5 5-5 5"/></svg><span id="reviewText">Review</span><small id="reviewSmall">Interpret</small></button></div><p id="error" class="error"></p></main><nav class="nav"><div class="navin"><button onclick="location.href='home.html'"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button><button onclick="location.href='explore.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/></svg>Explore</button><button><span class="mark"><img src="assets/brand/el8-mark.svg" alt=""></span>Track</button><button onclick="location.href='insights.html'"><svg viewBox="0 0 24 24"><path d="M4 19V9M10 19V5M16 19v-7M22 19V3"/></svg>Insights</button><button onclick="location.href='profile.html'"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c.7-5 3.3-7 8-7s7.3 2 8 7z"/></svg>Profile</button></div></nav><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const $=id=>document.getElementById(id);const session=await getSessionOrRedirect();if(!session)throw Error('No session');const profile=await getMyProfile();document.documentElement.dataset.theme=profile.appearance||'light';let selectedImage=null,audioBlob=null,recorder=null,chunks=[];sessionStorage.removeItem('el8-track-review');function select(file,source){selectedImage=file||null;if(file){$(source+'Label').classList.add('selected');$(source+'Name').textContent=file.name||'Selected'}}$('camera').onchange=()=>select($('camera').files[0],'camera');$('attach').onchange=()=>select($('attach').files[0],'attach');$('voice').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return}const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{audioBlob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});stream.getTracks().forEach(t=>t.stop());$('voiceState').textContent='Recorded'};recorder.start();$('voiceState').textContent='Recording… tap to stop'};async function invoke(name,body){const{data:{session:s}}=await supabase.auth.getSession();const r=await fetch(`https://jprdsidxwjkgiqqakwpr.supabase.co/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${s.access_token}`,'apikey':'sb_publishable_CkcqWpD6nkzRzBfuJV08TQ_t38C9j34'},body:JSON.stringify(body)});const p=await r.json();if(!r.ok)throw Error(p?.error||`Processing failed (${r.status})`);return p}async function prep(file){const img=await createImageBitmap(file),max=2560,scale=Math.min(1,max/Math.max(img.width,img.height));if(scale===1&&file.type==='image/jpeg')return file;const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.9))}$('submit').onclick=async()=>{const raw=$('text').value.trim();if(!raw&&!selectedImage&&!audioBlob){$('error').textContent='Add text, an image, or a voice note first.';return}const b=$('submit');b.disabled=true;$('reviewText').textContent='Reviewing';$('reviewSmall').textContent='Please wait';$('error').textContent='';try{let transcript='';if(audioBlob){const fd=new FormData();fd.append('audio',audioBlob,'voice.webm');const{data:{session:s}}=await supabase.auth.getSession();const r=await fetch('https://jprdsidxwjkgiqqakwpr.supabase.co/functions/v1/transcribe-audio',{method:'POST',headers:{Authorization:`Bearer ${s.access_token}`,apikey:'sb_publishable_CkcqWpD6nkzRzBfuJV08TQ_t38C9j34'},body:fd});const p=await r.json();if(!r.ok)throw Error(p?.error||'Transcription failed');transcript=p.transcript||''}let imageResult=null;if(selectedImage){const fd=new FormData();fd.append('image',await prep(selectedImage),selectedImage.name||'image.jpg');if(raw)fd.append('context',raw);if(transcript)fd.append('transcript',transcript);const{data:{session:s}}=await supabase.auth.getSession();const r=await fetch('https://jprdsidxwjkgiqqakwpr.supabase.co/functions/v1/interpret-image',{method:'POST',headers:{Authorization:`Bearer ${s.access_token}`,apikey:'sb_publishable_CkcqWpD6nkzRzBfuJV08TQ_t38C9j34'},body:fd});const p=await r.json();if(!r.ok)throw Error(p?.error||'Image interpretation failed');imageResult=p.interpretation||p}const combined=[raw,transcript&&`Voice note: ${transcript}`].filter(Boolean).join('\n');const out=await invoke('interpret-track',imageResult?{raw_input:combined||'[image]',input_type:'image',client_interpretation:imageResult,media:{has_image:true,has_audio:!!audioBlob,keep_original:false}}:{raw_input:combined,input_type:audioBlob?'voice':'text',media:{has_image:false,has_audio:!!audioBlob,keep_original:false}});sessionStorage.setItem('el8-track-review',JSON.stringify({interpretation_id:out.interpretation_id,interpretation:out.interpretation}));location.href='track-review.html'}catch(e){$('error').textContent=e.message;b.disabled=false;$('reviewText').textContent='Review';$('reviewSmall').textContent='Interpret'}};</script></body></html>
