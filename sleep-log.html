<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Log Sleep · EL8</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.field{margin:18px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.duration{font-size:28px;font-weight:800}.actions{display:flex;gap:10px;margin-top:22px}.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;background:var(--soft);color:var(--ink)}.btn.primary{background:var(--ink);color:var(--bg)}.notice{display:none;margin-top:14px;padding:12px;border-radius:12px;background:var(--soft);font-weight:700}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Quick log</div><h1>Log sleep.</h1><div class="el8-card"><div class="field"><label for="start">Start</label><input id="start" type="datetime-local"></div><div class="field"><label for="end">End</label><input id="end" type="datetime-local"></div><div><span class="el8-eyebrow">Duration</span><div class="duration" id="duration">—</div></div><div id="notice" class="notice"></div><div class="actions"><button class="btn" id="cancel">Cancel</button><button class="btn primary" id="save">Log sleep</button></div></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const profile=await getMyProfile();document.documentElement.dataset.theme=profile.appearance||'light';const pad=n=>String(n).padStart(2,'0');function localInput(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}const now=new Date(),guess=new Date(now.getTime()-8*3600000);start.value=localInput(guess);end.value=localInput(now);function calc(){const s=new Date(start.value),e=new Date(end.value),ms=e-s;if(!start.value||!end.value||ms<=0){duration.textContent='—';return null}const mins=Math.round(ms/60000),h=Math.floor(mins/60),m=mins%60;duration.textContent=`${h}h ${m}m`;return{mins,s,e}}start.oninput=end.oninput=calc;calc();cancel.onclick=()=>history.length>1?history.back():location.replace('app.html#home');save.onclick=async()=>{const x=calc();if(!x){notice.style.display='block';notice.textContent='End time must be after start time.';return}save.disabled=true;const localDate=start.value.slice(0,10);const metadata={start_time:x.s.toISOString(),end_time:x.e.toISOString(),duration_minutes:x.mins,entry_method:'manual_interval'};const{error}=await supabase.from('el8_quick_logs').insert({user_id:session.user.id,local_date:localDate,measure:'sleep_end',value:x.mins,unit:'minutes',metadata});if(error){notice.style.display='block';notice.textContent=error.message;save.disabled=false;return}notice.style.display='block';notice.textContent='Sleep logged';setTimeout(()=>location.replace('app.html#home'),850)};</script></body></html>
