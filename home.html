<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Home</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:max(7px,env(safe-area-inset-bottom));z-index:20}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:var(--muted);text-decoration:none;text-align:center;padding:14px 2px 10px;font-size:11px}.nav a.active{color:var(--ink);font-weight:800}.mark{width:42px;display:block;margin:-25px auto 3px}.mark img{width:100%}.quickDetails>summary{cursor:pointer;list-style:none}.quickDetails>summary::-webkit-details-marker{display:none}.quickSummary{display:inline-flex;flex-direction:column;gap:4px}.quickSummary strong{font-size:20px}.quickMeta{font-size:12px;color:var(--muted)}.quickBody{padding-top:10px}.reviewLink{display:block;text-align:center;text-decoration:none;background:var(--ink);color:var(--bg);padding:14px;border-radius:14px;font-weight:800;margin-top:14px}</style></head><body><main class="el8-shell" style="padding-bottom:110px"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Home</div><h1>Today, keep it simple.</h1><div class="el8-card"><details class="quickDetails"><summary><span class="quickSummary"><strong>Quick log</strong><span class="quickMeta" id="quickCount">Loading</span></span></summary><div class="quickBody"><div id="quickActive"></div><div id="quickCompleted"></div></div></details></div><div id="coverageSlot"></div><div id="dailySlot"><a class="el8-card" href="daily-checkin.html" style="display:block;text-decoration:none;color:inherit"><h2>Daily check-in</h2><p>How did today go?</p></a></div><div class="el8-card"><h2>Today’s plan</h2><div id="homePlan">No active plan has been generated yet.</div></div><div class="el8-card"><h2>Why this today?</h2><p id="homeRationale">When an active plan exists, EL8 will show why these actions were prioritized.</p></div></main><nav class="nav"><div class="navin"><a class="active" href="home.html">Home</a><a href="explore.html">Explore</a><a href="track.html"><span class="mark"><img src="assets/brand/el8-mark.svg" alt=""></span>Track</a><a href="insights.html">Insights</a><a href="profile.html">Profile</a></div></nav><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{planFocus,planInterventions,isProductionPlan}from'./plan-model.js';import{mountQuickLog}from'./quick-log.js';import{mountHomeCoverage}from'./home-coverage.js';const s=await getSessionOrRedirect();if(!s)throw Error('No session');const p=await getMyProfile();document.documentElement.dataset.theme=p.appearance||'light';if(p.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const{data:raw}=await supabase.from('el8_plans').select('*').eq('user_id',s.user.id).eq('status','active').eq('is_test',false).order('created_at',{ascending:false}).limit(1).maybeSingle(),plan=isProductionPlan(raw)?raw:null;if(plan){const focus=planFocus(plan),actions=planInterventions(plan);homePlan.innerHTML=actions.length?actions.map(a=>`<div style="padding:11px 0;border-top:1px solid var(--line)"><b>${a.title||a.action||a.label||'Action'}</b>${a.description?`<p>${a.description}</p>`:''}</div>`).join(''):'EL8 is monitoring your current focus before adding another action.';homeRationale.textContent=focus.length?`Current focus: ${focus.map(x=>x.dimension||x.name||x).join(' · ')}. EL8 adapts the number of actions independently from the number of focus dimensions.`:'EL8 is keeping the plan intentionally light until more evidence supports a change.'}await mountQuickLog();await mountHomeCoverage();</script></body></html>
