<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Home</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:max(7px,env(safe-area-inset-bottom));z-index:20}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.nav a{color:var(--muted);text-decoration:none;text-align:center;padding:8px 2px 7px;font-size:11px}.nav a.active{color:var(--ink);font-weight:800}.mark{width:62px;height:62px;display:block;margin:-30px auto -1px}.mark img{width:100%;height:100%}.quickDetails>summary{cursor:pointer;list-style:none}.quickDetails>summary::-webkit-details-marker{display:none}.quickDetails>summary:after{content:'▾';float:right;color:var(--muted)}.quickDetails[open]>summary:after{content:'▴'}.quickSummary{display:inline-flex;flex-direction:column;gap:4px}.quickSummary strong{font-size:20px}.quickMeta{font-size:12px;color:var(--muted)}.quickBody{padding-top:10px}.reviewLink{display:block;text-align:center;text-decoration:none;background:var(--ink);color:var(--bg);padding:14px;border-radius:14px;font-weight:800;margin-top:14px}.action{padding:13px 0;border-top:1px solid var(--line)}.action:first-child{border-top:0}#coverageSlot{min-height:1px}</style></head><body><main class="el8-shell" style="padding-bottom:110px"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Home</div><h1>Today, keep it simple.</h1><div class="el8-card"><details class="quickDetails"><summary><span class="quickSummary"><strong>Quick log</strong><span class="quickMeta" id="quickCount">Loading</span></span></summary><div class="quickBody"><div id="quickActive"></div><div id="quickCompleted"></div></div></details></div><div class="el8-card"><h2>Today’s plan</h2><div id="homePlan">No active plan has been generated yet.</div></div><div class="el8-card"><h2>Why this today?</h2><p id="homeRationale">When an active plan exists, EL8 will show why these actions were prioritized.</p></div><div id="coverageSlot"></div></main><nav class="nav"><div class="navin"><a class="active" href="home.html">Home</a><a href="explore.html">Explore</a><a href="track.html"><span class="mark"><img src="assets/brand/el8-mark.svg" alt=""></span>Track</a><a href="insights.html">Insights</a><a href="profile.html">Profile</a></div></nav><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{planFocus,planInterventions,isProductionPlan}from'./plan-model.js';import{mountQuickLog}from'./quick-log.js';import{mountHomeCoverage}from'./home-coverage.js';const s=await getSessionOrRedirect();if(!s)throw Error('No session');const p=await getMyProfile();document.documentElement.dataset.theme=p.appearance||'light';try{localStorage.setItem('el8-theme',p.appearance||'light')}catch(e){}if(p.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const homePlan=document.getElementById('homePlan'),homeRationale=document.getElementById('homeRationale');const{data:raw}=await supabase.from('el8_plans').select('*').eq('user_id',s.user.id).eq('status','active').eq('is_test',false).order('created_at',{ascending:false}).limit(1).maybeSingle(),plan=isProductionPlan(raw)?raw:null;if(plan){const focus=planFocus(plan),actions=planInterventions(plan),names=focus.map(x=>x.dimension||x.name||x).filter(Boolean);homePlan.innerHTML=actions.length?actions.map(a=>`<div class="action"><b>${a.action||a.title||a.label||'Plan action'}</b>${Array.isArray(a.dimensions)&&a.dimensions.length?`<div class="quickMeta" style="margin-top:5px">Supports ${a.dimensions.join(' · ')}</div>`:''}</div>`).join(''):'<p>No intervention is required right now.</p>';homeRationale.textContent=!names.length?'Maintain what is working and respond when something meaningfully changes.':names.length===1?`Make useful progress in ${names[0]} without adding unnecessary load.`:`Make useful progress across ${names.slice(0,-1).join(', ')} and ${names.at(-1)} with a manageable plan.`}await mountQuickLog();await mountHomeCoverage();</script></body></html>
