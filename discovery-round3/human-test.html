<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 — H1 Round 3</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>
body{margin:0;min-height:100vh;background:var(--bg,#f5f5f2);font-family:Inter,system-ui,sans-serif;color:var(--text,#171717)}.shell{max-width:720px;margin:auto;padding:24px 18px 64px}.card{background:var(--surface,#fff);border:1px solid rgba(127,127,127,.18);border-radius:20px;padding:22px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px;line-height:1.3}.muted{opacity:.68;line-height:1.5}.options{display:grid;gap:10px;margin:18px 0}.opt{width:100%;text-align:left;border:1px solid rgba(127,127,127,.28);background:transparent;border-radius:13px;padding:14px;cursor:pointer;font:inherit;color:inherit}.opt.selected{border-color:#b89242;background:rgba(184,146,66,.12)}.primary{border:0;border-radius:12px;padding:12px 16px;background:#b89242;color:#111;font-weight:700;cursor:pointer}.primary:disabled{opacity:.4}.scale{display:grid;grid-template-columns:1fr;gap:12px;margin:16px 0}.scale label{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}.result{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:rgba(127,127,127,.08);padding:14px;border-radius:12px;max-height:420px;overflow:auto}.error{color:#a22}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(184,146,66,.15);font-size:12px;font-weight:700}
</style></head><body><main class="shell"><section class="card" id="app"><div class="eyebrow">EL8 Member Zero · H1</div><h1>Round 3</h1><p class="muted">Semantic Discovery human validation.</p><p>Loading assessment…</p></section></main>
<script type="module">
import Discovery from './round3-engine.js';
const app=document.querySelector('#app');let s=Discovery.session();let current=null;const labels={money:'Money',work:'Work / income',sleep:'Sleep',energy:'Health / energy',stress:'Stress',relationships:'Relationships',support:'Support / loneliness',home:'Home / surroundings',focus:'Focus',direction:'Direction / purpose'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function head(extra=''){return `<div class="eyebrow">EL8 Member Zero · H1</div><h1>Round 3</h1><span class="badge">Human Test</span>${extra}`}
function render(){try{current=Discovery.next(s);if(current.type==='question')return renderQuestion(current.question);if(current.type==='triage')return renderTriage(current.question);if(current.type==='finish')return renderFinish(current);app.innerHTML=head()+`<p class="error">Unexpected step: ${esc(current.type)}</p><pre class="result">${esc(JSON.stringify(current,null,2))}</pre>`}catch(e){app.innerHTML=head()+`<h2>Assessment error</h2><p class="error">${esc(e.stack||e.message)}</p>`}}
function renderQuestion(q){const multi=q.multiSelect||q.role==='gateway';app.innerHTML=head(`<p class="muted">Question ${s.questionsAsked}${q.role==='gateway'?' · broad gateway':''}</p>`)+`<h2>${esc(q.text||q.prompt||q.question||'Which of these fits best?')}</h2><div class="options">${(q.options||[]).map(o=>`<button class="opt" data-id="${esc(o.id)}">${esc(o.label||o.text||o.id)}</button>`).join('')}</div><div class="footer"><span class="muted">${multi?'Select all that apply, then continue.':'Choose one answer.'}</span><button class="primary" id="next" disabled>Next</button></div>`;const chosen=new Set;document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!multi){chosen.clear();document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'))}b.classList.toggle('selected',multi?!chosen.has(b.dataset.id):true);if(multi){chosen.has(b.dataset.id)?chosen.delete(b.dataset.id):chosen.add(b.dataset.id)}else chosen.add(b.dataset.id);document.querySelector('#next').disabled=!chosen.size});document.querySelector('#next').onclick=()=>{Discovery.answer(s,q,[...chosen]);render()}}
function renderTriage(q){const concerns=q.concerns||s.concernIds.map(id=>({id,label:labels[id]||id}));app.innerHTML=head(`<p class="muted">Priority check</p>`)+`<h2>How much are these affecting you right now?</h2><p class="muted">Rate only the areas you identified. This helps Discovery decide where to narrow first.</p><div class="scale">${concerns.map(c=>`<label><span>${esc(c.label||labels[c.id]||c.id)}</span><select data-c="${esc(c.id)}"><option value="">Choose…</option><option value="1">Low</option><option value="2">Moderate</option><option value="3">High</option><option value="4">Very high</option></select></label>`).join('')}</div><div class="footer"><span></span><button class="primary" id="triageNext">Continue</button></div>`;document.querySelector('#triageNext').onclick=()=>{const vals={};let ok=true;document.querySelectorAll('select[data-c]').forEach(x=>{if(!x.value)ok=false;else vals[x.dataset.c]=Number(x.value)});if(!ok)return alert('Please rate each selected area.');Discovery.triage(s,vals);render()}}
function renderFinish(step){const trace=Discovery.trace(s);app.innerHTML=head()+`<h2>Discovery complete</h2><p class="muted">Questions asked: ${s.questionsAsked}. Reason: ${esc(step.stop?.reason||'resolved')}.</p><h2>Round 3 output</h2><pre class="result">${esc(JSON.stringify(trace,null,2))}</pre><div class="footer"><button class="opt" id="restart">Start another test</button><button class="primary" id="copy">Copy result</button></div>`;document.querySelector('#restart').onclick=()=>{s=Discovery.session();render()};document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(trace,null,2));document.querySelector('#copy').textContent='Copied'}}
render();
</script></body></html>
