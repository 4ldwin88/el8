<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 — Discovery Human Test v0.9</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>body{margin:0;min-height:100vh;background:var(--bg,#f5f5f2);font-family:Inter,system-ui,sans-serif;color:var(--text,#171717)}.shell{max-width:720px;margin:auto;padding:24px 18px 64px}.card{background:var(--surface,#fff);border:1px solid #bbb4;border-radius:20px;padding:22px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px;margin-bottom:5px}.instruction{font-size:14px;font-style:italic;opacity:.62;margin:0 0 18px}.muted{opacity:.68;line-height:1.5}.options,.plan{display:grid;gap:10px;margin:18px 0}.opt{width:100%;text-align:left;border:1px solid #9996;background:transparent;border-radius:13px;padding:14px;cursor:pointer;font:inherit;color:inherit}.opt.selected{border-color:#7778;background:#7772}.primary{border:0;border-radius:12px;padding:12px 18px;background:#111;color:#fff;font-weight:700;cursor:pointer}.primary:disabled{opacity:.32}.footer{display:flex;justify-content:flex-end;margin-top:18px}.planItem,.testerNote{border:1px solid #9994;border-radius:15px;padding:16px}.testerNote{margin-top:22px}.testerNote textarea,.planItem select{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 12px}.testerNote textarea{min-height:70px}.actionChoice{margin-top:10px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#7772;font-size:12px;font-weight:700}.result{white-space:pre-wrap;font:12px/1.45 monospace;max-height:420px;overflow:auto}.scale label{display:grid;grid-template-columns:1fr 150px;gap:12px;margin:12px 0}.focusFeedback{margin-top:16px;padding-top:14px;border-top:1px solid #9993}.status{padding:14px;border-radius:12px;background:#7771;margin-top:14px}@media(max-width:520px){.scale label{grid-template-columns:1fr}}</style></head><body><main class="shell"><section class="card" id="app">Loading…</section></main><script type="module">
import Discovery from './round3-engine.js';const TEST_VERSION='v0.9',TEST_NAME=`EL8 Discovery Human Test ${TEST_VERSION}`,SUBMIT_URL='https://jprdsidxwjkgiqqakwpr.supabase.co/functions/v1/submit-discovery-human-test';const app=document.querySelector('#app'),labels={money:'Money',work:'Work / income',sleep:'Sleep',energy:'Health / energy',stress:'Stress',relationships:'Relationships',support:'Support / loneliness',home:'Home / surroundings',focus:'Focus',direction:'Direction / purpose'};let s=Discovery.session({labels}),current=null,questionStarted=Date.now(),displayQuestionNumber=0,testerNotes=[];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const head=(x='')=>`<div class="eyebrow">EL8 · ${TEST_VERSION} · Human Test</div><h1>Discovery Round 3</h1>${x}`;const noteBox=()=>`<div class="testerNote"><strong>Tester note (optional)</strong><p class="muted">Anything confusing, missing, irrelevant, or worth changing?</p><textarea id="screenNote"></textarea></div>`;const nav=l=>`<div class="footer"><button class="primary" id="go" disabled>${l}</button></div>`;function saveNote(t,id){const text=document.querySelector('#screenNote')?.value.trim();if(text)testerNotes.push({questionNumber:displayQuestionNumber,screenType:t,questionId:id??null,note:text,timestamp:new Date().toISOString()})}function selectable(sel,max,next,exclusive=false){const c=new Set;document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{const ex=b.dataset.exclusive==='true';if(c.has(b.dataset.id)){c.delete(b.dataset.id);b.classList.remove('selected')}else{if(max===1||ex){c.clear();document.querySelectorAll(sel).forEach(x=>x.classList.remove('selected'))}else if(exclusive)[...c].forEach(id=>{const o=document.querySelector(`${sel}[data-id="${id}"]`);if(o?.dataset.exclusive==='true'){c.delete(id);o.classList.remove('selected')}});if(c.size<max){c.add(b.dataset.id);b.classList.add('selected')}}document.querySelector(next).disabled=!c.size});return c}function render(){try{current=Discovery.next(s);if(current.type==='question')return renderQ(current.question);if(current.type==='triage')return renderT(current.question);if(current.type==='priority-resolution')return renderP(current.question);if(current.type==='finish'){Discovery.complete(s);return finish()}app.innerHTML=head()+`<h2>Assessment paused</h2>`}catch(e){app.innerHTML=head()+`<h2>Assessment error</h2><pre>${esc(e.stack||e.message)}</pre>`}}function renderQ(q){questionStarted=Date.now();displayQuestionNumber++;const multi=q.responseMode==='multi';app.innerHTML=head(`<p class="muted">Question ${displayQuestionNumber} · ID ${esc(q.id)}</p>`)+`<h2>${esc(q.text||q.prompt||q.question)}</h2><p class="instruction">${multi?'Select all that apply.':'Choose one.'}</p><div class="options">${(q.options||[]).map(o=>`<button class="opt" data-id="${esc(o.id)}" data-exclusive="${o.exclusiveWithinGroup===true}">${esc(o.label||o.text||o.id)}</button>`).join('')}</div>${noteBox()}${nav('Next')}`;const c=selectable('.opt',multi?99:1,'#go',multi);document.querySelector('#go').onclick=()=>{saveNote('question',q.id);Discovery.recordQuestionTiming(s,q.id,questionStarted);Discovery.answer(s,q,[...c]);render()}}function renderT(q){displayQuestionNumber++;const cs=q.concerns||s.concernIds.map(id=>({id,label:labels[id]||id}));app.innerHTML=head(`<p class="muted">Question ${displayQuestionNumber} · Priority rating</p>`)+`<h2>${cs.length===1?`How much is ${esc(cs[0].label||cs[0].id)} affecting you right now?`:'How much is each of these affecting you right now?'}</h2><p class="instruction">${cs.length===1?'Choose one rating.':'Rate each area separately.'}</p><div class="scale">${cs.map(c=>`<label>${esc(c.label||c.id)}<select data-c="${esc(c.id)}"><option value="">Choose…</option><option value="1">Low</option><option value="2">Moderate</option><option value="3">High</option><option value="4">Very high</option></select></label>`).join('')}</div>${noteBox()}${nav('Next')}`;const go=document.querySelector('#go');document.querySelectorAll('[data-c]').forEach(x=>x.onchange=()=>go.disabled=[...document.querySelectorAll('[data-c]')].some(y=>!y.value));go.onclick=()=>{const v={};document.querySelectorAll('[data-c]').forEach(x=>v[x.dataset.c]=+x.value);saveNote('triage','TRIAGE');Discovery.triage(s,v);render()}}function renderP(q){displayQuestionNumber++;app.innerHTML=head(`<p class="muted">Question ${displayQuestionNumber} · Priority resolution</p>`)+`<h2>${esc(q.text)}</h2><p class="instruction">Choose 1 or 2 areas you want EL8 to address first.</p><div class="options">${q.concerns.map(c=>`<button class="opt" data-id="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</div>${noteBox()}${nav('Next')}`;const c=selectable('.opt',2,'#go');document.querySelector('#go').onclick=()=>{saveNote('priority-resolution','PRIORITY_RESOLUTION');Discovery.prioritize(s,[...c]);render()}}function finish(){const plan=Discovery.trace(s).memberPlan;app.innerHTML=head()+`<h2>Your initial EL8 plan</h2><p class="muted">${esc(plan.explanation)}</p><p class="instruction">Choose up to 2 actions in each focus area.</p><div class="plan">${plan.focus.map(f=>`<div class="planItem"><h3>${esc(f.label)}</h3>${f.memberSelected?'<span class="badge">Your selected focus</span>':''}${f.actions.slice(0,4).map(a=>`<button class="opt actionChoice" data-focus="${esc(f.concernId)}" data-id="${esc(a.id)}"><strong>${esc(a.title)}</strong><br><span class="muted">${esc(a.why||'')}</span>${a.measurement?`<br><small class="muted">What to do / measure: ${esc(a.measurement)}</small>`:''}</button>`).join('')}<div class="focusFeedback"><strong>Rate this ${esc(f.label)} plan</strong><label>Relevance<select class="focusRel" data-focus="${esc(f.concernId)}"><option value="">Choose…</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Usefulness<select class="focusUse" data-focus="${esc(f.concernId)}"><option value="">Choose…</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join('')}</select></label></div></div>`).join('')}</div>${noteBox()}${nav('Finish test')}<div id="status"></div><details><summary>Developer / technical output</summary><pre class="result" id="technical"></pre><button class="opt" id="copy">Copy technical report</button></details>`;const chosen=new Set,go=document.querySelector('#go');function valid(){go.disabled=!(chosen.size&&[...document.querySelectorAll('.focusRel,.focusUse')].every(x=>x.value))}document.querySelectorAll('.actionChoice').forEach(b=>b.onclick=()=>{const k=b.dataset.focus+'::'+b.dataset.id,sel=[...chosen].filter(x=>x.startsWith(b.dataset.focus+'::'));if(chosen.has(k)){chosen.delete(k);b.classList.remove('selected')}else if(sel.length<2){chosen.add(k);b.classList.add('selected')}valid()});document.querySelectorAll('.focusRel,.focusUse').forEach(x=>x.onchange=valid);go.onclick=async()=>{go.disabled=true;go.textContent='Submitting…';saveNote('plan','PLAN');Discovery.chooseActions(s,[...chosen].map(x=>x.split('::').slice(1).join('::')));const trace=Discovery.trace(s),focusFeedback=plan.focus.map(f=>({concernId:f.concernId,label:f.label,relevance:+document.querySelector(`.focusRel[data-focus="${f.concernId}"]`).value,usefulness:+document.querySelector(`.focusUse[data-focus="${f.concernId}"]`).value})),report={test:TEST_NAME,testVersion:TEST_VERSION,timestamp:new Date().toISOString(),displayQuestionsShown:displayQuestionNumber,testerNotes:[...testerNotes],focusFeedback,...trace};document.querySelector('#technical').textContent=JSON.stringify(report,null,2);try{const r=await fetch(SUBMIT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(report)});if(!r.ok)throw new Error(`Submission failed (${r.status})`);document.querySelector('#status').innerHTML='<div class="status"><strong>Test submitted.</strong><br><span class="muted">Your assessment and feedback were saved for EL8 review.</span></div>';go.style.display='none'}catch(e){document.querySelector('#status').innerHTML=`<div class="status"><strong>Could not submit automatically.</strong><br><span class="muted">${esc(e.message)}. Technical output remains available below.</span></div>`;go.disabled=false;go.textContent='Retry submission'}document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(JSON.stringify(report,null,2));document.querySelector('#copy').textContent='Copied'}};valid()}render();</script></body></html>
