<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 — H1 Round 3</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>body{margin:0;min-height:100vh;background:var(--bg,#f5f5f2);font-family:Inter,system-ui,sans-serif;color:var(--text,#171717)}.shell{max-width:720px;margin:auto;padding:24px 18px 64px}.card{background:var(--surface,#fff);border:1px solid rgba(127,127,127,.18);border-radius:20px;padding:22px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px;line-height:1.3}.muted{opacity:.68;line-height:1.5}.options{display:grid;gap:10px;margin:18px 0}.opt{width:100%;text-align:left;border:1px solid rgba(127,127,127,.28);background:transparent;border-radius:13px;padding:14px;cursor:pointer;font:inherit;color:inherit}.opt.selected{border-color:#b89242;background:rgba(184,146,66,.12)}.primary{border:0;border-radius:12px;padding:12px 16px;background:#b89242;color:#111;font-weight:700;cursor:pointer}.primary:disabled{opacity:.4}.scale{display:grid;gap:12px;margin:16px 0}.scale label{display:grid;grid-template-columns:1fr 150px;gap:12px;align-items:center}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}.result{white-space:pre-wrap;font:12px/1.45 ui-monospace,monospace;background:rgba(127,127,127,.08);padding:14px;border-radius:12px;max-height:420px;overflow:auto}.error{color:#a22}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(184,146,66,.15);font-size:12px;font-weight:700}.plan{margin:20px 0;display:grid;gap:14px}.planItem,.feedback{border:1px solid rgba(127,127,127,.18);border-radius:15px;padding:16px}.planItem h3{margin:0 0 8px}.action{padding:10px 0;border-top:1px solid rgba(127,127,127,.14)}.action:first-of-type{border-top:0}.debug{margin-top:20px}details summary{cursor:pointer;font-weight:700}.feedback{margin-top:22px}.feedback label{display:block;font-weight:700;margin:12px 0 6px}.feedback select,.feedback textarea{box-sizing:border-box;width:100%;border:1px solid rgba(127,127,127,.28);border-radius:10px;padding:11px;background:transparent;color:inherit;font:inherit}.feedback textarea{min-height:90px;resize:vertical}</style></head><body><main class="shell"><section class="card" id="app"><div class="eyebrow">EL8 Member Zero · H1</div><h1>Round 3</h1><p>Loading assessment…</p></section></main><script type="module">
import Discovery from './round3-engine.js';const app=document.querySelector('#app');const labels={money:'Money',work:'Work / income',sleep:'Sleep',energy:'Health / energy',stress:'Stress',relationships:'Relationships',support:'Support / loneliness',home:'Home / surroundings',focus:'Focus',direction:'Direction / purpose'};let s=Discovery.session({labels});let current=null;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function head(extra=''){return`<div class="eyebrow">EL8 Member Zero · H1</div><h1>Round 3</h1><span class="badge">Human Test</span>${extra}`}
function render(){try{current=Discovery.next(s);if(current.type==='question')return renderQuestion(current.question);if(current.type==='triage')return renderTriage(current.question);if(current.type==='priority-resolution')return renderPriority(current.question);if(current.type==='finish')return renderFinish(current);app.innerHTML=head()+`<h2>Assessment paused</h2><p class="muted">Discovery could not safely determine the next step.</p>`}catch(e){app.innerHTML=head()+`<h2>Assessment error</h2><p class="error">${esc(e.stack||e.message)}</p>`}}
function chooseButtons(selector,max,next){const chosen=new Set;document.querySelectorAll(selector).forEach(b=>b.onclick=()=>{if(chosen.has(b.dataset.id)){chosen.delete(b.dataset.id);b.classList.remove('selected')}else{if(max===1){chosen.clear();document.querySelectorAll(selector).forEach(x=>x.classList.remove('selected'))}if(chosen.size<max){chosen.add(b.dataset.id);b.classList.add('selected')}}document.querySelector(next).disabled=!chosen.size});return chosen}
function renderQuestion(q){const multi=q.multiSelect||q.role==='gateway';app.innerHTML=head(`<p class="muted">Question ${s.questionsAsked}${q.role==='gateway'?' · broad gateway':''}</p>`)+`<h2>${esc(q.text||q.prompt||q.question||'Which of these fits best?')}</h2><div class="options">${(q.options||[]).map(o=>`<button class="opt" data-id="${esc(o.id)}">${esc(o.label||o.text||o.id)}</button>`).join('')}</div><div class="footer"><span class="muted">${multi?'Select all that apply, then continue.':'Choose one answer.'}</span><button class="primary" id="next" disabled>Next</button></div>`;const chosen=chooseButtons('.opt',multi?99:1,'#next');document.querySelector('#next').onclick=()=>{Discovery.answer(s,q,[...chosen]);render()}}
function renderTriage(q){const concerns=q.concerns||s.concernIds.map(id=>({id,label:labels[id]||id}));app.innerHTML=head(`<p class="muted">Priority check</p>`)+`<h2>How much are these affecting you right now?</h2><p class="muted">Rate only the areas you identified. This helps Discovery decide where to narrow first.</p><div class="scale">${concerns.map(c=>`<label><span>${esc(c.label||labels[c.id]||c.id)}</span><select data-c="${esc(c.id)}"><option value="">Choose…</option><option value="1">Low</option><option value="2">Moderate</option><option value="3">High</option><option value="4">Very high</option></select></label>`).join('')}</div><div class="footer"><span></span><button class="primary" id="triageNext">Continue</button></div>`;document.querySelector('#triageNext').onclick=()=>{const vals={};let ok=true;document.querySelectorAll('select[data-c]').forEach(x=>{if(!x.value)ok=false;else vals[x.dataset.c]=Number(x.value)});if(!ok)return alert('Please rate each selected area.');Discovery.triage(s,vals);render()}}
function renderPriority(q){app.innerHTML=head(`<p class="muted">Focus check</p>`)+`<h2>${esc(q.text)}</h2><p class="muted">Select up to two. This tells EL8 what you want addressed first; it does not change what Discovery believes caused the issue.</p><div class="options">${q.concerns.map(c=>`<button class="opt" data-id="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</div><div class="footer"><span class="muted">Choose 1 or 2.</span><button class="primary" id="priorityNext" disabled>Continue</button></div>`;const chosen=chooseButtons('.opt',2,'#priorityNext');document.querySelector('#priorityNext').onclick=()=>{Discovery.prioritize(s,[...chosen]);render()}}
function renderFinish(step){const trace=Discovery.trace(s),plan=trace.memberPlan;const focus=plan.focus.map(f=>`<div class="planItem"><h3>${esc(f.label)} — ${esc(f.title)}</h3>${f.memberSelected?'<span class="badge">Your selected focus</span>':''}${f.actions.map(a=>`<div class="action"><strong>${esc(a.title)}</strong><div class="muted">${esc(a.measurement)}</div></div>`).join('')}<p class="muted">Review in ${f.reviewDays} days.</p></div>`).join('');app.innerHTML=head()+`<h2>Your initial EL8 plan</h2><p class="muted">${esc(plan.explanation)}</p><div class="plan">${focus||'<p class="muted">Discovery does not yet have enough information to recommend an initial action.</p>'}</div><p class="muted">Questions asked: ${s.questionsAsked}. ${step.stop?.incomplete?'Some uncertainty remains; that is carried into the plan rather than treated as a proven cause.':'Discovery reached a sufficient stopping point.'}</p><div class="feedback"><h2>Test feedback</h2><p class="muted">Rate the assessment before copying the result to share for review.</p><label for="relevance">Question relevance</label><select id="relevance"><option value="">Choose…</option><option value="1">1 — Frequently irrelevant</option><option value="2">2 — Somewhat irrelevant</option><option value="3">3 — Mixed</option><option value="4">4 — Mostly relevant</option><option value="5">5 — Highly relevant</option></select><label for="planUseful">Plan usefulness</label><select id="planUseful"><option value="">Choose…</option><option value="1">1 — Not useful</option><option value="2">2 — Slightly useful</option><option value="3">3 — Moderately useful</option><option value="4">4 — Useful</option><option value="5">5 — Very useful</option></select><label for="notes">Notes</label><textarea id="notes" placeholder="Anything that felt wrong, repetitive, irrelevant, missing, or especially useful?"></textarea></div><details class="debug"><summary>Technical test output</summary><pre class="result">${esc(JSON.stringify(trace,null,2))}</pre></details><div class="footer"><button class="opt" id="restart">Start another test</button><button class="primary" id="copy">Copy test report</button></div>`;document.querySelector('#restart').onclick=()=>{s=Discovery.session({labels});render()};document.querySelector('#copy').onclick=async()=>{const report={test:'EL8 H1 Round 3',timestamp:new Date().toISOString(),feedback:{relevance:document.querySelector('#relevance').value?Number(document.querySelector('#relevance').value):null,planUsefulness:document.querySelector('#planUseful').value?Number(document.querySelector('#planUseful').value):null,notes:document.querySelector('#notes').value.trim()},...trace};await navigator.clipboard.writeText(JSON.stringify(report,null,2));document.querySelector('#copy').textContent='Copied — paste into ChatGPT'}}render();
</script></body></html>
