<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 — H1 Round 3</title><link rel="stylesheet" href="../assets/el8-ui.css"><style>body{margin:0;min-height:100vh;background:var(--bg,#f5f5f2);font-family:Inter,system-ui,sans-serif;color:var(--text,#171717)}.shell{max-width:720px;margin:auto;padding:24px 18px 64px}.card{background:var(--surface,#fff);border:1px solid #bbb4;border-radius:20px;padding:22px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px}.muted{opacity:.68;line-height:1.5}.options,.plan{display:grid;gap:10px;margin:18px 0}.opt{width:100%;text-align:left;border:1px solid #9996;background:transparent;border-radius:13px;padding:14px;cursor:pointer;font:inherit;color:inherit}.opt.selected{border-color:#b89242;background:#b892421f}.primary{border:0;border-radius:12px;padding:12px 16px;background:#b89242;color:#111;font-weight:700}.primary:disabled{opacity:.4}.footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:18px}.planItem,.feedback{border:1px solid #9994;border-radius:15px;padding:16px}.actionChoice{margin-top:10px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#b8924226;font-size:12px;font-weight:700}.feedback select,.feedback textarea{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 12px}.result{white-space:pre-wrap;font:12px/1.45 monospace;max-height:420px;overflow:auto}.scale label{display:grid;grid-template-columns:1fr 150px;gap:12px;margin:12px 0}</style></head><body><main class="shell"><section class="card" id="app">Loading…</section></main><script type="module">
import Discovery from './round3-engine.js';const app=document.querySelector('#app'),labels={money:'Money',work:'Work / income',sleep:'Sleep',energy:'Health / energy',stress:'Stress',relationships:'Relationships',support:'Support / loneliness',home:'Home / surroundings',focus:'Focus',direction:'Direction / purpose'};let s=Discovery.session({labels}),current=null,questionStarted=Date.now();const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const head=(x='')=>`<div class="eyebrow">EL8 Member Zero · H1</div><h1>Round 3</h1><span class="badge">Human Test</span>${x}`;
function selectable(selector,max,next,exclusive=false){const chosen=new Set;document.querySelectorAll(selector).forEach(b=>b.onclick=()=>{const isEx=b.dataset.exclusive==='true';if(chosen.has(b.dataset.id)){chosen.delete(b.dataset.id);b.classList.remove('selected')}else{if(max===1||isEx){chosen.clear();document.querySelectorAll(selector).forEach(x=>x.classList.remove('selected'))}else if(exclusive){[...chosen].forEach(id=>{const old=document.querySelector(`${selector}[data-id="${id}"]`);if(old?.dataset.exclusive==='true'){chosen.delete(id);old.classList.remove('selected')}})}if(chosen.size<max){chosen.add(b.dataset.id);b.classList.add('selected')}}document.querySelector(next).disabled=!chosen.size});return chosen}
function render(){try{current=Discovery.next(s);if(current.type==='question')return renderQ(current.question);if(current.type==='triage')return renderT(current.question);if(current.type==='priority-resolution')return renderP(current.question);if(current.type==='finish'){Discovery.complete(s);return renderFinish(current)}app.innerHTML=head()+`<h2>Assessment paused</h2>`}catch(e){app.innerHTML=head()+`<h2>Assessment error</h2><pre>${esc(e.stack||e.message)}</pre>`}}
function renderQ(q){questionStarted=Date.now();const multi=q.responseMode==='multi';app.innerHTML=head(`<p class="muted">Question ${s.questionsAsked}</p>`)+`<h2>${esc(q.text||q.prompt||q.question)}</h2><div class="options">${(q.options||[]).map(o=>`<button class="opt" data-id="${esc(o.id)}" data-exclusive="${o.exclusiveWithinGroup===true}">${esc(o.label||o.text||o.id)}</button>`).join('')}</div><div class="footer"><span class="muted">${multi?'Select all that apply.':'Choose one answer.'}</span><button class="primary" id="next" disabled>Next</button></div>`;const c=selectable('.opt',multi?99:1,'#next',multi);document.querySelector('#next').onclick=()=>{Discovery.recordQuestionTiming(s,q.id,questionStarted);Discovery.answer(s,q,[...c]);render()}}
function renderT(q){const cs=q.concerns||s.concernIds.map(id=>({id,label:labels[id]||id}));app.innerHTML=head()+`<h2>How much are these affecting you right now?</h2><div class="scale">${cs.map(c=>`<label>${esc(c.label||c.id)}<select data-c="${esc(c.id)}"><option value="">Choose…</option><option value="1">Low</option><option value="2">Moderate</option><option value="3">High</option><option value="4">Very high</option></select></label>`).join('')}</div><button class="primary" id="go">Continue</button>`;document.querySelector('#go').onclick=()=>{const v={};let ok=true;document.querySelectorAll('[data-c]').forEach(x=>x.value?v[x.dataset.c]=+x.value:ok=false);if(!ok)return alert('Please rate each area.');Discovery.triage(s,v);render()}}
function renderP(q){app.innerHTML=head()+`<h2>${esc(q.text)}</h2><p class="muted">Choose 1 or 2 areas you want EL8 to address first.</p><div class="options">${q.concerns.map(c=>`<button class="opt" data-id="${esc(c.id)}">${esc(c.label)}</button>`).join('')}</div><button class="primary" id="go" disabled>Continue</button>`;const c=selectable('.opt',2,'#go');document.querySelector('#go').onclick=()=>{Discovery.prioritize(s,[...c]);render()}}
function renderFinish(step){const trace=Discovery.trace(s),plan=trace.memberPlan,allActions=plan.focus.flatMap(f=>f.actions.map(a=>({...a,concernId:f.concernId,label:f.label})));app.innerHTML=head()+`<h2>Your initial EL8 plan</h2><p class="muted">${esc(plan.explanation)}</p><div class="plan">${plan.focus.map(f=>`<div class="planItem"><h3>${esc(f.label)} — ${esc(f.title)}</h3>${f.memberSelected?'<span class="badge">Your selected focus</span>':''}<p class="muted">Which action would you be most willing to start with?</p>${f.actions.slice(0,4).map(a=>`<button class="opt actionChoice" data-id="${esc(a.id)}"><strong>${esc(a.title)}</strong><br><span class="muted">${esc(a.measurement)}</span></button>`).join('')}</div>`).join('')}</div><p class="muted">Choose 1 or 2 actions total.</p><button class="primary" id="lock" disabled>Confirm actions</button><div id="after" style="display:none"><div class="feedback"><h2>Test feedback</h2><label>Question relevance</label><select id="relevance"><option value="">Choose…</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join('')}</select><label>Plan usefulness</label><select id="planUseful"><option value="">Choose…</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join('')}</select><label>Notes</label><textarea id="notes"></textarea></div><details><summary>Technical test output</summary><pre class="result" id="technical"></pre></details><div class="footer"><button class="opt" id="restart">Start another test</button><button class="primary" id="copy">Copy test report</button></div></div>`;const c=selectable('.actionChoice',2,'#lock');document.querySelector('#lock').onclick=()=>{Discovery.chooseActions(s,[...c]);document.querySelector('#lock').disabled=true;document.querySelector('#after').style.display='block';document.querySelector('#technical').textContent=JSON.stringify(Discovery.trace(s),null,2)};setTimeout(()=>{if(!allActions.length){document.querySelector('#lock').disabled=true;document.querySelector('#after').style.display='block'}},0);document.querySelector('#app').addEventListener('click',async e=>{if(e.target.id==='restart'){s=Discovery.session({labels});render()}if(e.target.id==='copy'){const t=Discovery.trace(s),report={test:'EL8 H1 Round 3',timestamp:new Date().toISOString(),feedback:{relevance:document.querySelector('#relevance')?.value?+document.querySelector('#relevance').value:null,planUsefulness:document.querySelector('#planUseful')?.value?+document.querySelector('#planUseful').value:null,notes:document.querySelector('#notes')?.value.trim()||''},...t};await navigator.clipboard.writeText(JSON.stringify(report,null,2));e.target.textContent='Copied — paste into ChatGPT'}})}render();
</script></body></html>
