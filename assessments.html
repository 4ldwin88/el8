<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Assessments</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.item{padding:15px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.meta{font-size:12px;color:var(--muted);margin-top:5px}.empty{color:var(--muted)}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Profile · Assessments</div><h1>Your assessments.</h1><p>Submitted assessments are permanent point-in-time records. Reassessment captures change without rewriting earlier results.</p><div class="el8-card" id="list"><p class="empty">Loading…</p></div><button class="el8-bottom-action" onclick="location.href='profile.html'">Back to Profile</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const s=await getSessionOrRedirect();if(!s)throw Error('No session');const p=await getMyProfile();document.documentElement.dataset.theme=p.appearance||'light';try{localStorage.setItem('el8-theme',p.appearance||'light')}catch(e){}if(p.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const{data,error}=await supabase.from('el8_assessment_sessions').select('id,module_type,module_version,submitted_at,active_duration_seconds').eq('user_id',s.user.id).eq('status','completed').order('submitted_at',{ascending:false});const list=document.getElementById('list'),pretty=x=>String(x||'Assessment').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());if(error)list.innerHTML='<p class="empty">Assessments could not be loaded.</p>';else if(!data?.length)list.innerHTML='<p class="empty">No completed assessments yet.</p>';else list.innerHTML=data.map(a=>`<div class="item"><b>${pretty(a.module_type)}</b><div class="meta">Version ${a.module_version||'—'} · ${a.submitted_at?new Intl.DateTimeFormat('en-CA',{dateStyle:'medium',timeStyle:'short',timeZone:p.timezone||'America/Toronto'}).format(new Date(a.submitted_at)):'—'}${a.active_duration_seconds!=null?` · ${Math.floor(a.active_duration_seconds/60)}m ${a.active_duration_seconds%60}s active`:''}</div></div>`).join('');</script></body></html>
