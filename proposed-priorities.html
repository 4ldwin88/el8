<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Starting focus</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--line)}.stage .done,.stage .active{background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.priority{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{outline:2px solid currentColor}.recommendation{display:block;margin-bottom:4px;font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--g)}.small{font-size:12px;color:var(--muted);line-height:1.4}.actions{display:grid;gap:8px;margin-top:14px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span class="done"></span><span class="done"></span><span class="active"></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Starting focus</div><h1>Does this look like the right place to start?</h1><p>Discovery has identified the concerns that may matter most. Confirm one to three areas. Planning will still keep the actual plan small based on your capacity.</p><div class="el8-card"><form id="priorityForm"><div id="priorities"></div><p id="message" class="small" aria-live="polite"></p><div class="actions"><button id="confirm" type="submit" class="el8-btn">Use selected focus</button><button id="redo" type="button" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">This doesn't look right</button><button id="qaBack" type="button" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Back to QA</button></div></form></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{discoveryPriorityCandidates}from'./app/onboarding/discovery-runtime.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const form=document.getElementById('priorityForm'),priorities=document.getElementById('priorities'),message=document.getElementById('message'),redo=document.getElementById('redo'),qaBack=document.getElementById('qaBack');let output;try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null')}catch{}if(!output){location.replace('discovery.html');throw Error('No Discovery output')}sessionStorage.removeItem('el8_initial_plan_proposal');const candidates=discoveryPriorityCandidates(output),selected=new Set();candidates.filter(x=>x.recommended).slice(0,3).forEach(x=>selected.add(x.concernId));if(!selected.size&&candidates[0])selected.add(candidates[0].concernId);if(!candidates.length){location.replace('discovery.html?mode=clarify');throw Error('Clarification required')}function render(){priorities.innerHTML='';candidates.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='priority'+(selected.has(a.concernId)?' selected':'');b.innerHTML=`${a.recommended?'<span class="recommendation">EL8 RECOMMENDS</span>':''}<strong>${String(a.label||a.concernId).replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase())}</strong><div class="small">Based on Discovery evidence and what you said matters now.</div>`;b.onclick=()=>{if(selected.has(a.concernId))selected.delete(a.concernId);else if(selected.size<3)selected.add(a.concernId);else{message.textContent='Choose up to three focuses.';return}render()};priorities.appendChild(b)});message.textContent=selected.size?`${selected.size} selected · choose up to 3. The plan may use fewer actions.`:'Choose at least one focus.'}render();form.onsubmit=e=>{e.preventDefault();if(!selected.size)return;sessionStorage.setItem('el8_confirmed_priorities',JSON.stringify([...selected]));sessionStorage.removeItem('el8_initial_plan_proposal');location.assign('plan-proposal.html')};redo.onclick=()=>location.assign('discovery.html?mode=clarify');qaBack.onclick=()=>location.assign('qa.html');</script></body></html>
