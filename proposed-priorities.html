<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Proposed priorities</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--line)}.stage .done,.stage .active{background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:var(--muted);text-align:center}.priority{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{outline:2px solid currentColor}.recommendation{display:block;margin-bottom:4px;font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--g)}.dim{display:block;margin-bottom:5px;font-size:10px;color:var(--g);font-weight:850;text-transform:uppercase;letter-spacing:.08em}.small{font-size:12px;color:var(--muted);line-height:1.4}.actions{display:grid;gap:8px;margin-top:14px}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span class="done"></span><span class="active"></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Plan</span></div><div class="el8-eyebrow">Discovery complete</div><h1 id="title">Review your priorities.</h1><p id="intro">EL8 has highlighted what appears most important, while keeping other supported issues visible. Choose up to two priorities for your first plan.</p><div class="el8-card"><form id="priorityForm"><div id="priorities"></div><p id="message" class="small" aria-live="polite"></p><div class="actions"><button id="confirm" type="submit" class="el8-btn">Confirm priorities</button><button id="redo" type="button" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Change Discovery answers</button></div></form></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{dimensionFor}from'./app/onboarding/persistence.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const form=document.getElementById('priorityForm'),priorities=document.getElementById('priorities'),message=document.getElementById('message'),confirm=document.getElementById('confirm'),redo=document.getElementById('redo'),title=document.getElementById('title'),intro=document.getElementById('intro');let proposal;try{proposal=JSON.parse(sessionStorage.getItem('el8_initial_plan_proposal')||'null')}catch{}if(!proposal){location.replace('discovery.html');throw Error('No proposal')}const candidates=proposal.candidatePriorities||[],selected=new Set();const labels={money:'Money',work:'Work',sleep:'Sleep',poor_sleep:'Sleep',health:'Health',physical_condition:'Health',low_activity:'Physical activity',energy:'Energy',low_energy:'Energy',stress:'Stress',relationships:'Relationships',support:'Support',home:'Home',focus:'Focus',low_focus:'Focus',direction:'Direction',low_activation:'Getting started'};if(!candidates.length){title.textContent='Discovery needs another look.';intro.textContent='EL8 did not find a supported issue to prioritize yet.';confirm.style.display='none'}else if(candidates.length===1){title.textContent='Review your priority.';intro.textContent='EL8 found one supported issue. Confirm it, or change your Discovery answers.'}function renderSelection(){priorities.querySelectorAll('.priority').forEach(b=>b.classList.toggle('selected',selected.has(b.dataset.id)));message.textContent=selected.size?`${selected.size} of 2 selected.`:'Choose one or two priorities.';message.classList.remove('error')}candidates.forEach(a=>{const b=document.createElement('button');b.type='button';b.dataset.id=a.concernId;b.className='priority';const importance=a.memberImportance===0?'You marked this not important right now.':a.memberImportance===1?'You marked this somewhat important.':a.memberImportance===2?'You marked this important.':a.memberImportance===3?'You marked this very important.':'';const evidence=Number(a.evidenceConfidence||0)>0?`Discovery found supporting evidence (${Math.round(Number(a.evidenceConfidence)*100)}% confidence).`:'';b.innerHTML=`${a.recommended?'<span class="recommendation">EL8 RECOMMENDS</span>':''}<span class="dim">${dimensionFor(a.concernId)}</span><strong>${labels[a.concernId]||a.label||a.concernId}</strong>${importance?`<div class="small">${importance}</div>`:''}${evidence?`<div class="small">${evidence}</div>`:''}`;b.addEventListener('click',()=>{if(selected.has(a.concernId))selected.delete(a.concernId);else if(selected.size<2)selected.add(a.concernId);else{message.textContent='You can choose up to two priorities.';message.classList.add('error');return}renderSelection()});priorities.appendChild(b);if(candidates.length===1||a.memberSelected||a.recommended&&selected.size<2)selected.add(a.concernId)});renderSelection();form.addEventListener('submit',e=>{e.preventDefault();if(!selected.size){message.textContent='Select at least one priority to continue.';message.classList.add('error');return}confirm.disabled=true;confirm.textContent='Continuing…';try{proposal.confirmedPriorities=[...selected];sessionStorage.setItem('el8_initial_plan_proposal',JSON.stringify(proposal));const saved=JSON.parse(sessionStorage.getItem('el8_initial_plan_proposal')||'null');if(!saved?.confirmedPriorities?.length)throw Error('Your priority selection could not be saved.');location.assign('plan-proposal.html')}catch(err){confirm.disabled=false;confirm.textContent='Confirm priorities';message.textContent=err.message||'EL8 could not continue. Please try again.';message.classList.add('error')}});redo.addEventListener('click',()=>location.assign('discovery.html?review=1'));</script></body></html>
