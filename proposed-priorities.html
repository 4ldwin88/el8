<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Proposed priorities</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--line)}.stage .done,.stage .active{background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(3,1fr);font-size:9px;color:var(--muted);text-align:center}.priority{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{outline:2px solid currentColor}.dim{font-size:10px;color:var(--g);font-weight:850;text-transform:uppercase;letter-spacing:.08em}.small{font-size:12px;color:var(--muted)}.actions{display:grid;gap:8px;margin-top:14px}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span class="done"></span><span class="active"></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Plan</span></div><div class="el8-eyebrow">Discovery complete</div><h1>These look most important right now.</h1><p>Before EL8 builds your proposed plan, confirm that this matches what you meant. Select one or two priorities.</p><div class="el8-card"><div id="priorities"></div><p id="message" class="small"></p><div class="actions"><button id="confirm" class="el8-btn">Confirm priorities</button><button id="redo" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Redo Discovery</button></div></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{dimensionFor}from'./app/onboarding/persistence.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const raw=sessionStorage.getItem('el8_initial_plan_proposal'),proposal=raw?JSON.parse(raw):null;if(!proposal){location.replace('discovery.html');throw Error('No proposal')}const candidates=proposal.candidateActions||[],byConcern=[...new Map(candidates.filter(a=>a.concernId).map(a=>[a.concernId,a])).values()],selected=[];const labels={money:'Money',work:'Work',sleep:'Sleep',health:'Health',energy:'Energy',stress:'Stress',relationships:'Relationships',support:'Support',home:'Home',focus:'Focus',direction:'Direction'};byConcern.forEach(a=>{const b=document.createElement('button');b.className='priority';b.innerHTML=`<span class="dim">${dimensionFor(a.concernId)}</span><br><strong>${labels[a.concernId]||a.concernId}</strong>${a.why?`<div class="small">${a.why}</div>`:''}`;b.onclick=()=>{const i=selected.indexOf(a.concernId);if(i>=0)selected.splice(i,1);else if(selected.length<2)selected.push(a.concernId);b.classList.toggle('selected',selected.includes(a.concernId))};priorities.appendChild(b)});confirm.onclick=()=>{if(!selected.length){message.textContent='Select at least one priority to continue.';return}proposal.candidateActions=candidates.filter(a=>selected.includes(a.concernId));proposal.confirmedPriorities=[...selected];sessionStorage.setItem('el8_initial_plan_proposal',JSON.stringify(proposal));location.replace('plan-proposal.html')};redo.onclick=()=>{sessionStorage.removeItem('el8_initial_plan_proposal');sessionStorage.removeItem('el8_discovery_output');location.replace('discovery.html')};</script></body></html>
