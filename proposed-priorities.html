<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Starting focuses</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.stage{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:22px 0 8px}.stage span{height:6px;border-radius:99px;background:var(--line)}.stage .done,.stage .active{background:var(--gold)}.labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:var(--muted);text-align:center}.priority{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}.priority.selected{outline:2px solid currentColor}.recommendation,.category{display:block;margin-bottom:4px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.recommendation{color:var(--g)}.category{color:var(--muted)}.small{font-size:12px;color:var(--muted);line-height:1.4}.actions{display:grid;gap:8px;margin-top:14px}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="stage"><span class="done"></span><span class="done"></span><span class="active"></span><span></span></div><div class="labels"><span>Baseline</span><span>Discovery</span><span>Focus</span><span>Plan</span></div><div class="el8-eyebrow">Starting focuses</div><h1>What should EL8 work on first?</h1><p>Discovery found several supported concerns. Keep the smallest useful set—one to three. EL8 can keep multiple focuses active without giving you a separate task for every focus.</p><div class="el8-card"><form id="priorityForm"><div id="priorities"></div><p id="message" class="small" aria-live="polite"></p><div class="actions"><button id="confirm" type="submit" class="el8-btn">Confirm focuses</button><button id="redo" type="button" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Review Discovery</button><button id="qa" type="button" class="el8-btn" style="background:var(--card);color:var(--ink);border:1px solid var(--line)">Back to QA</button></div></form></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{discoveryPriorityCandidates}from'./app/onboarding/discovery-runtime.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const form=document.getElementById('priorityForm'),priorities=document.getElementById('priorities'),message=document.getElementById('message'),redo=document.getElementById('redo'),qa=document.getElementById('qa');let output;try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null')}catch{}if(!output){location.replace('discovery.html');throw Error('No Discovery output')}sessionStorage.removeItem('el8_initial_plan_proposal');const labels={health:'Health',sleep:'Sleep',energy:'Energy',stress:'Stress',focus:'Focus',direction:'Direction',work:'Work',money:'Money',relationships:'Relationships',support:'Support',home:'Home',low_activity:'Physical Activity',lack_direction:'Direction',work_instability:'Work'},categories={health:'Physical',sleep:'Physical',energy:'Physical',low_activity:'Physical',stress:'Emotional',focus:'Intellectual',direction:'Occupational / Spiritual',lack_direction:'Occupational / Spiritual',work:'Occupational',work_instability:'Occupational',money:'Financial',relationships:'Social',support:'Social',home:'Environmental'};const candidates=discoveryPriorityCandidates(output),selected=new Set();candidates.filter(x=>x.recommended).slice(0,2).forEach(x=>selected.add(x.concernId));if(!selected.size&&candidates[0])selected.add(candidates[0].concernId);if(!candidates.length){location.replace('discovery.html?mode=clarify');throw Error('Clarification required')}function render(){priorities.innerHTML='';candidates.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='priority'+(selected.has(a.concernId)?' selected':'');b.innerHTML=`${a.recommended?'<span class="recommendation">EL8 recommends</span>':''}<span class="category">${categories[a.concernId]||'Wellness'}</span><strong>${labels[a.concernId]||a.label||a.concernId}</strong><div class="small">Supported by Discovery evidence and what you said matters now.</div>`;b.onclick=()=>{if(selected.has(a.concernId))selected.delete(a.concernId);else if(selected.size<3)selected.add(a.concernId);else{message.textContent='Choose no more than three starting focuses.';message.classList.add('error');return}render()};priorities.appendChild(b)});message.classList.remove('error');message.textContent=selected.size?`${selected.size} of 3 possible focuses selected. Planning will still minimize the number of actions.`:'Choose at least one starting focus.'}render();form.onsubmit=e=>{e.preventDefault();if(!selected.size){message.textContent='Choose at least one starting focus.';message.classList.add('error');return}sessionStorage.setItem('el8_confirmed_priorities',JSON.stringify([...selected]));sessionStorage.removeItem('el8_initial_plan_proposal');location.assign('plan-proposal.html')};redo.onclick=()=>location.assign('discovery.html?review=1');qa.onclick=()=>location.assign('qa.html');</script></body></html>
