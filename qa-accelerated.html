<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Adaptive QA v0.11</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.hidden{display:none}.small{color:var(--muted);font-size:13px}.choice{display:block;width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.choice.selected{outline:2px solid var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:10px}.trace{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Tester tools · v0.11 gated inference QA</div><h1>Adaptive dialogue simulator</h1><p>Experience-first routing with candidate confirmation before cross-dimensional expansion.</p><div class="el8-card"><div class="small">Session</div><div id="info">Loading…</div></div><div id="setup"><div class="el8-card"><h2>Hidden starting state</h2><div id="scenarios"></div></div><button id="start" class="primary">Start v0.11 cycle</button></div><div id="dialogue" class="hidden"><div id="trace"></div><div id="question" class="el8-card"></div></div><div id="done" class="el8-card hidden"></div><button id="again" class="primary hidden">Start next cycle</button><button class="el8-bottom-action" onclick="location.href='qa.html'">Back to QA Inspector</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{inferQuestionOptionEvidence}from'./intelligence/evidence/question-option-evidence.js';import{inferDriverSpilloverEvidence}from'./intelligence/evidence/driver-spillover-evidence.js';import{createHierarchicalState,applySubdimensionEvidence,deriveDimensions,dimensionEvidenceCounts,dimensionEvidenceStatus}from'./intelligence/model/hierarchical-state.js?v=011';import{EXPERIENCE_OPTIONS,EXPERIENCE_SCREEN,EXPERIENCE_SEVERITY,inferExperienceRoute,applyExperienceSeverity,shouldDiscover}from'./intelligence/integration/experience-router.js?v=011';import{createDimensionHypotheses,addDimensionClue,confirmedDimensions}from'./intelligence/model/dimension-hypothesis-state.js?v=011';const $=id=>document.getElementById(id),s=await getSessionOrRedirect(),p=await getMyProfile();if(!s||!p||!/^T\d+/i.test(p.member_code||'')){location.replace('profile.html');throw Error('Tester only')}const D=['Physical','Emotional','Social','Spiritual','Intellectual','Occupational','Financial','Environmental'],BASE=()=>Object.fromEntries(D.map(d=>[d,.12])),SC={well:{label:'Generally well',v:{}},sleep:{label:'Sleep deterioration',v:{Physical:.85,Emotional:.42,Intellectual:.48}},financial:{label:'Financial pressure',v:{Financial:.95,Emotional:.62,Occupational:.55}},work:{label:'Work instability',v:{Occupational:.95,Financial:.72,Emotional:.62}},social:{label:'Social disconnection',v:{Social:.95,Emotional:.62,Spiritual:.42}},meaning:{label:'Loss of meaning / direction',v:{Spiritual:.95,Emotional:.58,Occupational:.52}},environment:{label:'Environmental disruption',v:{Environmental:.95,Physical:.62,Emotional:.58,Intellectual:.52}},multi:{label:'Multiple interacting problems',v:{Physical:.72,Emotional:.88,Social:.62,Spiritual:.58,Intellectual:.72,Occupational:.88,Financial:.82,Environmental:.58}}};const KEY='el8-adaptive-qa-v011';let ss=JSON.parse(localStorage.getItem(KEY)||'null')||{id:crypto.randomUUID(),cycle:1};const save=()=>localStorage.setItem(KEY,JSON.stringify(ss));save();let selected='well',truth,belief,hstate,turns=[],route={},experienceIds=[],discovery=false,hypotheses={};$('info').textContent=`Cycle ${ss.cycle} · v0.11 gated inference`;$('scenarios').innerHTML=Object.entries(SC).map(([k,x])=>`<button class="choice ${k==='well'?'selected':''}" data-k="${k}">${x.label}</button>`).join('');document.querySelectorAll('#scenarios .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#scenarios .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.k});function trace(){$('trace').innerHTML=turns.map((t,i)=>`<div class="trace"><strong>${i+1}. ${t.prompt}</strong><br><span class="small">${t.stage} · ${Array.isArray(t.answer)?t.answer.join(', '):t.answer}</span></div>`).join('')}function experience(){let picks=new Set();$('question').innerHTML=`<div class="small">Experience routing</div><h2>${EXPERIENCE_SCREEN.prompt}</h2><p class="small">${EXPERIENCE_SCREEN.helper}</p><div id="opts"></div><button id="continue" class="primary">Continue</button>`;EXPERIENCE_OPTIONS.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.label;b.onclick=()=>{if(['none','unsure'].includes(o.id)){picks=new Set([o.id]);document.querySelectorAll('#opts .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}else{picks.delete('none');picks.delete('unsure');b.classList.toggle('selected');b.classList.contains('selected')?picks.add(o.id):picks.delete(o.id)}};$('opts').appendChild(b)});$('continue').onclick=()=>{if(!picks.size)return;experienceIds=[...picks];route=inferExperienceRoute(experienceIds);discovery=shouldDiscover(experienceIds,route);turns.push({stage:'experience',question:'EXP01',prompt:EXPERIENCE_SCREEN.prompt,answer:experienceIds});trace();if(experienceIds.includes('none')){hypotheses=createDimensionHypotheses({});finish('Nothing in particular was reported.');return}severity()}}function severity(){$('question').innerHTML=`<div class="small">Impact</div><h2>${EXPERIENCE_SEVERITY.prompt}</h2><div id="opts"></div>`;EXPERIENCE_SEVERITY.options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{route=applyExperienceSeverity(route,o);if(o==='Unsure')discovery=true;hypotheses=createDimensionHypotheses(route);turns.push({stage:'severity',question:'EXP02',prompt:EXPERIENCE_SEVERITY.prompt,answer:o});belief={...belief,...route};next()};$('opts').appendChild(b)})}async function next(){trace();const qs=turns.filter(t=>['drill','discovery','confirmation'].includes(t.stage));if(qs.length>=6){finish('Investigation budget reached.');return}const seen=qs.map(t=>t.question),{data,error}=await supabase.functions.invoke('adaptive-qa-v11',{body:{turns:qs,seen_question_ids:seen,hypotheses,belief,evidence_status:dimensionEvidenceStatus(hstate)}});if(error){alert('v0.11 policy failed: '+error.message);return}if(!data.question){finish('No further useful question was available.');return}const q=data.question;$('question').innerHTML=`<div class="small">${data.stage==='confirmation'?'Candidate confirmation':data.stage==='discovery'?'Discovery':'Targeted drill'} · ${q.dimension}</div><h2>${q.prompt}</h2><div id="opts"></div>`;(q.options||[]).forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=typeof o==='string'?o:o.label||o.value;b.onclick=()=>answer(q,b.textContent,data.stage);$('opts').appendChild(b)})}async function answer(q,a,stage){const primary=inferQuestionOptionEvidence(a,q),spill=inferDriverSpilloverEvidence(a,q),delta={...primary.delta};for(const[k,v]of Object.entries(spill.delta))delta[k]=(delta[k]||0)+v;hstate=applySubdimensionEvidence(hstate,delta,Object.keys(primary.delta).length?.3:.22);const byDim={};for(const[k,v]of Object.entries(delta)){const d=k.split('.')[0];byDim[d]=(byDim[d]||0)+Number(v||0)}for(const[d,v]of Object.entries(byDim)){const source=d===q.dimension?(stage==='confirmation'?'confirmation':'direct-answer'):'spillover';hypotheses=addDimensionClue(hypotheses,d,v,source)}const counts=dimensionEvidenceCounts(hstate),derived=deriveDimensions(hstate);for(const d of D)if(counts[d]>0)belief[d]=derived[d];turns.push({stage,question:q.id,prompt:q.prompt,answer:a,dimension:q.dimension,affected_dimensions:q.affected_dimensions||[],evidence:delta,subdimensions:Object.keys(delta)});if(Object.keys(delta).length)discovery=false;await next()}async function finish(reason){$('dialogue').classList.add('hidden');$('done').classList.remove('hidden');$('again').classList.remove('hidden');const counts=dimensionEvidenceCounts(hstate),evidenceDims=D.filter(d=>counts[d]>0),truthHot=D.filter(d=>truth[d]>=.55),predHot=confirmedDimensions(hypotheses),tp=truthHot.filter(d=>predHot.includes(d)).length,precision=predHot.length?tp/predHot.length:truthHot.length?0:1,recall=truthHot.length?tp/truthHot.length:predHot.length?0:1,detection=precision+recall?2*precision*recall/(precision+recall):0,coverage=evidenceDims.length/8,cal=Math.max(0,1-D.reduce((n,d)=>n+Math.abs(truth[d]-belief[d]),0)/8),composite=.5*detection+.2*coverage+.3*cal,scorecard={confirmed_dimension_detection:+detection.toFixed(3),actual_evidence_coverage:+coverage.toFixed(3),calibration:+cal.toFixed(3),composite:+composite.toFixed(3)};const{error}=await supabase.from('el8_qa_accelerated_checkins').insert({user_id:s.user.id,member_code:p.member_code,qa_session_id:ss.id,qa_cycle:ss.cycle,interval_seconds:0,answers:{scenario:selected,hidden_truth:truth,experience_ids:experienceIds,turns},intelligence_shadow:{engine:'adaptive-qa-v0.11-gated',route,hypotheses,confirmed_dimensions:predHot,final_belief:belief,evidence_count:counts,evidence_status:dimensionEvidenceStatus(hstate),subdimension_state:hstate,scorecard,turn_count:turns.length}});$('done').innerHTML=`<h2>Cycle ${ss.cycle} complete</h2><p>${reason}</p><p>Confirmed detection <strong>${Math.round(detection*100)}%</strong> · evidence coverage <strong>${Math.round(coverage*100)}%</strong> · composite <strong>${Math.round(composite*100)}%</strong></p><p class="small">${error?'Save failed: '+error.message:'Saved as v0.11 gated inference.'}</p>`;if(!error){ss.cycle++;save()}}$('start').onclick=()=>{truth={...BASE(),...(SC[selected].v||{})};belief=BASE();hstate=createHierarchicalState();turns=[];route={};experienceIds=[];discovery=false;hypotheses=createDimensionHypotheses({});$('setup').classList.add('hidden');$('dialogue').classList.remove('hidden');$('info').textContent=`Cycle ${ss.cycle} · ${SC[selected].label} · v0.11`;experience()};$('again').onclick=()=>location.reload();</script></body></html>
