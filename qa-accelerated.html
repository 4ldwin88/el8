<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Adaptive QA v0.9</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.hidden{display:none}.small{color:var(--muted);font-size:13px}.choice{display:block;width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.choice.selected{outline:2px solid var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dim{padding:10px;border:1px solid var(--line);border-radius:12px}.dim label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.dim input{width:100%}.trace{border-left:2px solid var(--line);padding-left:12px;margin:10px 0}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Tester tools · v0.9 routing QA</div><h1>Adaptive dialogue simulator</h1><p>Broad routing identifies relevant dimensions first. The question bank then gathers subdimension evidence only where useful.</p><div class="el8-card"><div class="small">Session</div><div id="info">Loading…</div></div><div id="setup"><div class="el8-card"><h2>Hidden starting state</h2><div id="scenarios"></div></div><div id="custom" class="el8-card hidden"><h2>Custom dimension pressure</h2><div id="dims" class="grid"></div></div><button id="start" class="primary">Start v0.9 cycle</button></div><div id="dialogue" class="hidden"><div id="trace"></div><div id="question" class="el8-card"></div></div><div id="done" class="el8-card hidden"></div><button id="again" class="primary hidden">Start next cycle</button><button class="el8-bottom-action" onclick="location.href='qa.html'">Back to QA Inspector</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{inferQuestionOptionEvidence}from'./intelligence/evidence/question-option-evidence.js';import{inferDriverSpilloverEvidence}from'./intelligence/evidence/driver-spillover-evidence.js';import{createHierarchicalState,applySubdimensionEvidence,deriveDimensions,dimensionEvidenceCounts,dimensionEvidenceStatus}from'./intelligence/model/hierarchical-state.js?v=09';import{ROUTING_SCREEN,ROUTING_SEVERITY,routeDimensions,routingState}from'./intelligence/integration/routing-screen.js?v=09';const $=id=>document.getElementById(id),s=await getSessionOrRedirect(),p=await getMyProfile();if(!s||!p||!/^T\d+/i.test(p.member_code||'')){location.replace('profile.html');throw Error('Tester only')}const D=['Physical','Emotional','Social','Spiritual','Intellectual','Occupational','Financial','Environmental'],BASE=()=>Object.fromEntries(D.map(d=>[d,.12])),SC={well:{label:'Generally well',v:{}},sleep:{label:'Sleep deterioration',v:{Physical:.85,Emotional:.42,Intellectual:.48}},financial:{label:'Financial pressure',v:{Financial:.95,Emotional:.62,Occupational:.55}},work:{label:'Work instability',v:{Occupational:.95,Financial:.72,Emotional:.62}},social:{label:'Social disconnection',v:{Social:.95,Emotional:.62,Spiritual:.42}},meaning:{label:'Loss of meaning / direction',v:{Spiritual:.95,Emotional:.58,Occupational:.52}},environment:{label:'Environmental disruption',v:{Environmental:.95,Physical:.62,Emotional:.58,Intellectual:.52}},multi:{label:'Multiple interacting problems',v:{Physical:.72,Emotional:.88,Social:.62,Spiritual:.58,Intellectual:.72,Occupational:.88,Financial:.82,Environmental:.58}},custom:{label:'Custom',v:null}};const KEY='el8-adaptive-qa-v09';let ss;try{ss=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}if(!ss)ss={id:crypto.randomUUID(),cycle:1};const save=()=>localStorage.setItem(KEY,JSON.stringify(ss));save();let selected='well',custom=BASE(),truth,belief,hstate,evidenceCount,turns=[],route={dimensions:[],dimension_severity:{}},routingStep=0;$('info').textContent=`Cycle ${ss.cycle} · v0.9 routing`;$('scenarios').innerHTML=Object.entries(SC).map(([k,x])=>`<button class="choice ${k==='well'?'selected':''}" data-k="${k}">${x.label}</button>`).join('');$('dims').innerHTML=D.map(d=>`<div class="dim"><label>${d}<span id="n-${d}">12</span></label><input id="r-${d}" type="range" min="0" max="100" value="12"></div>`).join('');D.forEach(d=>$(`r-${d}`).oninput=e=>{custom[d]=+e.target.value/100;$(`n-${d}`).textContent=e.target.value});document.querySelectorAll('#scenarios .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#scenarios .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.k;$('custom').classList.toggle('hidden',selected!=='custom')});function trace(){$('trace').innerHTML=turns.map((t,i)=>`<div class="trace"><strong>${i+1}. ${t.prompt}</strong><br><span class="small">${t.stage} · ${Array.isArray(t.answer)?t.answer.join(', '):t.answer}</span></div>`).join('')}function routingQuestion(){if(routingStep===0){let picks=new Set();$('question').innerHTML=`<div class="small">Routing</div><h2>${ROUTING_SCREEN.prompt}</h2><p class="small">${ROUTING_SCREEN.helper}</p><div id="opts"></div><button id="continue" class="primary">Continue</button>`;ROUTING_SCREEN.options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{if(o==='None right now'||o==='Unsure'){picks=new Set([o]);document.querySelectorAll('#opts .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}else{picks.delete('None right now');picks.delete('Unsure');b.classList.toggle('selected');b.classList.contains('selected')?picks.add(o):picks.delete(o)}};$('opts').appendChild(b)});$('continue').onclick=()=>{if(!picks.size)return;const a=[...picks],dims=routeDimensions(a);route.dimensions=dims;turns.push({stage:'route',question:'ROUTE01',prompt:ROUTING_SCREEN.prompt,answer:a});routingStep=1;trace();if(!dims.length){route.dimension_severity={};finish(a.includes('Unsure')?'Routing remained uncertain.':'No affected dimensions reported.');return}routingQuestion()}}else{$('question').innerHTML=`<div class="small">Routing confirmation</div><h2>${ROUTING_SEVERITY.prompt}</h2><div id="opts"></div>`;ROUTING_SEVERITY.options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{const st=routingState(route.dimensions,o);route.dimension_severity=Object.fromEntries(route.dimensions.map(d=>[d,st.severity]));turns.push({stage:'route-severity',question:'ROUTE02',prompt:ROUTING_SEVERITY.prompt,answer:o});routingStep=2;belief={...belief,...route.dimension_severity};nextDrill()};$('opts').appendChild(b)})}}async function nextDrill(){trace();if(turns.filter(t=>t.stage==='drill').length>=6){finish('Drill question budget reached.');return}const seen=turns.filter(t=>t.stage==='drill').map(t=>t.question);const{data,error}=await supabase.functions.invoke('adaptive-qa-v09',{body:{turns:turns.filter(t=>t.stage==='drill').map(t=>({question:t.question,answer:t.answer,dimension:t.dimension,affected_dimensions:t.affected_dimensions})),seen_question_ids:seen,route,belief,evidence_status:dimensionEvidenceStatus(hstate)}});if(error){alert('v0.9 policy failed: '+error.message);return}if(!data.question){finish('No further relevant drill question was available.');return}const q=data.question;$('question').innerHTML=`<div class="small">Targeted drill · ${q.dimension}</div><h2>${q.prompt}</h2><div id="opts"></div>`;(q.options||[]).forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=typeof o==='string'?o:o.label||o.value;b.onclick=()=>answerDrill(q,b.textContent);$('opts').appendChild(b)})}async function answerDrill(q,a){const primary=inferQuestionOptionEvidence(a,q),spill=inferDriverSpilloverEvidence(a,q),delta={...primary.delta};for(const[k,v]of Object.entries(spill.delta))delta[k]=(delta[k]||0)+v;hstate=applySubdimensionEvidence(hstate,delta,Object.keys(primary.delta).length?.3:.22);const derived=deriveDimensions(hstate);belief={...belief};for(const d of D)if((dimensionEvidenceCounts(hstate)[d]||0)>0)belief[d]=derived[d];evidenceCount=dimensionEvidenceCounts(hstate);turns.push({stage:'drill',question:q.id,prompt:q.prompt,answer:a,dimension:q.dimension,affected_dimensions:q.affected_dimensions||[],evidence:delta,subdimensions:Object.keys(delta)});await nextDrill()}async function finish(reason){$('dialogue').classList.add('hidden');$('done').classList.remove('hidden');$('again').classList.remove('hidden');const drill=turns.filter(t=>t.stage==='drill'),actualCovered=new Set(drill.flatMap(t=>[t.dimension,...(t.affected_dimensions||[])])).size/8,truthHot=D.filter(d=>truth[d]>=.55),routeHot=route.dimensions,tp=truthHot.filter(d=>routeHot.includes(d)).length,precision=routeHot.length?tp/routeHot.length:truthHot.length?0:1,recall=truthHot.length?tp/truthHot.length:routeHot.length?0:1,detection=precision+recall?2*precision*recall/(precision+recall):0,calibration=Math.max(0,1-D.reduce((n,d)=>n+Math.abs(truth[d]-belief[d]),0)/8),composite=.5*detection+.2*actualCovered+.3*calibration,scorecard={routing_detection:+detection.toFixed(3),actual_evidence_coverage:+actualCovered.toFixed(3),calibration:+calibration.toFixed(3),composite:+composite.toFixed(3)};const{error}=await supabase.from('el8_qa_accelerated_checkins').insert({user_id:s.user.id,member_code:p.member_code,qa_session_id:ss.id,qa_cycle:ss.cycle,interval_seconds:0,answers:{scenario:selected,hidden_truth:truth,route,turns},intelligence_shadow:{engine:'adaptive-qa-v0.9-routing-drill',route,final_belief:belief,evidence_count:evidenceCount,evidence_status:dimensionEvidenceStatus(hstate),subdimension_state:hstate,scorecard,turn_count:turns.length}});$('done').innerHTML=`<h2>Cycle ${ss.cycle} complete</h2><p>${reason}</p><p>Routing detection <strong>${Math.round(detection*100)}%</strong> · actual evidence coverage <strong>${Math.round(actualCovered*100)}%</strong> · composite <strong>${Math.round(composite*100)}%</strong></p><p class="small">${error?'Save failed: '+error.message:'Saved as v0.9 routing-drill.'}</p>`;if(!error){ss.cycle++;save()}}$('start').onclick=()=>{truth=selected==='custom'?{...custom}:{...BASE(),...(SC[selected].v||{})};hstate=createHierarchicalState();belief=BASE();evidenceCount=Object.fromEntries(D.map(d=>[d,0]));turns=[];route={dimensions:[],dimension_severity:{}};routingStep=0;$('setup').classList.add('hidden');$('dialogue').classList.remove('hidden');$('info').textContent=`Cycle ${ss.cycle} · ${SC[selected]?.label||selected} · v0.9`;routingQuestion()};$('again').onclick=()=>location.reload();</script></body></html>
