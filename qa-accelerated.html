<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Accelerated QA</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.hidden{display:none}.small{color:var(--muted);font-size:13px}.choice{display:block;width:100%;margin:7px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:left}.choice.selected{outline:2px solid var(--ink)}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.dim{padding:10px;border:1px solid var(--line);border-radius:12px}.dim label{display:flex;justify-content:space-between;font-size:13px;font-weight:700}.dim input{width:100%}</style></head><body><main class="el8-shell"><div class="el8-eyebrow">Tester tools · Accelerated QA</div><h1>8-dimension intelligence simulator</h1><p>Choose a scenario or build a custom member state. Each cycle is test-only and the selector chooses from the Question & Signal Matrix.</p><div class="el8-card"><div class="small">Session</div><div id="sessionInfo"></div></div><div id="form"><div class="el8-card"><h2>Scenario</h2><div id="scenarios"></div></div><div id="custom" class="el8-card hidden"><h2>Custom dimension pressure</h2><p class="small">0 = doing well · 100 = severe pressure / unmet need</p><div id="dims" class="grid"></div></div><button id="submit" class="primary">Submit QA cycle</button></div><div id="result" class="el8-card hidden"></div><button id="next" class="primary hidden">Start next cycle</button><button class="el8-bottom-action" onclick="location.href='qa.html'">Back to QA Inspector</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{selectMatrixQuestion}from'./intelligence/integration/matrix-qa-selector.js';const $=id=>document.getElementById(id),s=await getSessionOrRedirect(),p=await getMyProfile();if(!s||!/^T\d+/i.test(p.member_code||'')){location.replace('profile.html');throw Error('Tester only')}const D=['Physical','Emotional','Social','Spiritual','Intellectual','Occupational','Financial','Environmental'],BASE=()=>Object.fromEntries(D.map(d=>[d,.15])),SC={well:{label:'Generally well',v:{}},sleep:{label:'Sleep deterioration',v:{Physical:.85,Emotional:.45,Intellectual:.5}},financial:{label:'Financial pressure',v:{Financial:.95,Emotional:.65,Occupational:.55}},work:{label:'Work instability',v:{Occupational:.95,Financial:.7,Emotional:.65}},social:{label:'Social disconnection',v:{Social:.95,Emotional:.65,Spiritual:.4}},meaning:{label:'Loss of meaning / direction',v:{Spiritual:.95,Emotional:.6,Occupational:.55}},environment:{label:'Environmental disruption',v:{Environmental:.95,Physical:.65,Emotional:.6,Intellectual:.55}},multi:{label:'Multiple interacting problems',v:{Physical:.7,Emotional:.85,Social:.6,Spiritual:.55,Intellectual:.7,Occupational:.85,Financial:.8,Environmental:.55}},custom:{label:'Custom',v:null}};const KEY='el8-qa-matrix-v2-session';let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!state)state={id:crypto.randomUUID(),cycle:1};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));save();$('sessionInfo').textContent=`Cycle ${state.cycle} · matrix v0.2`;let selected='well',custom=BASE();$('scenarios').innerHTML=Object.entries(SC).map(([k,x])=>`<button type="button" class="choice ${k==='well'?'selected':''}" data-k="${k}">${x.label}</button>`).join('');$('dims').innerHTML=D.map(d=>`<div class="dim"><label>${d}<span id="n-${d}">15</span></label><input id="r-${d}" type="range" min="0" max="100" value="15"></div>`).join('');D.forEach(d=>$(`r-${d}`).oninput=e=>{custom[d]=+e.target.value/100;$(`n-${d}`).textContent=e.target.value});document.querySelectorAll('#scenarios .choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('#scenarios .choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.k;$('custom').classList.toggle('hidden',selected!=='custom')});$('submit').onclick=async()=>{const dimensionSeverity=selected==='custom'?custom:{...BASE(),...(SC[selected].v||{})};$('submit').disabled=true;const[{data:matrix,error:me},{data:history,error:he}]=await Promise.all([supabase.from('el8_question_matrix').select('*').eq('active',true).eq('qa_only',true),supabase.from('el8_qa_accelerated_checkins').select('qa_cycle,answers,intelligence_shadow,created_at').eq('user_id',s.user.id).eq('qa_session_id',state.id).order('qa_cycle',{ascending:true})]);if(me||he){alert((me||he).message);$('submit').disabled=false;return}const shadow=selectMatrixQuestion({matrix:matrix||[],history:history||[],dimensionSeverity});shadow.qa_state={cycle:state.cycle,scenario:selected,dimension_severity:dimensionSeverity,history_cycles:(history||[]).length,matrix_candidates:(matrix||[]).length};const answers={scenario:selected,dimension_severity:dimensionSeverity};const{error}=await supabase.from('el8_qa_accelerated_checkins').insert({user_id:s.user.id,member_code:p.member_code,qa_session_id:state.id,qa_cycle:state.cycle,interval_seconds:0,answers,intelligence_shadow:shadow});if(error){alert(error.message);$('submit').disabled=false;return}$('form').classList.add('hidden');$('result').classList.remove('hidden');const q=shadow.selected?.[0],top=shadow.ranked||[];$('result').innerHTML=`<h2>Cycle ${state.cycle} saved</h2><p><strong>Scenario:</strong> ${SC[selected]?.label||selected}</p><p><strong>Selected:</strong> ${q?q.prompt:'No adaptive question'}</p>${q?`<p class="small">${q.dimension} · ${q.family} · ${q.signal} · score ${q.score}</p>`:''}<p class="small">Engine: ${shadow.engine} · ${(matrix||[]).length} candidates · ${shadow.context.problemDimensions} pressured dimensions</p>${top.length?`<p class="small"><strong>Top candidates:</strong><br>${top.map((x,i)=>`${i+1}. ${x.id} · ${x.dimension} · ${x.family} (${x.score})`).join('<br>')}</p>`:''}`;state.cycle++;save();$('next').classList.remove('hidden')};$('next').onclick=()=>location.reload();</script></body></html>
