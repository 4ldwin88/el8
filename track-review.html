<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · Review</title><script>try{const t=localStorage.getItem('el8-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script><link rel="stylesheet" href="assets/el8-ui.css"><style>.app{max-width:760px;margin:auto;min-height:100vh;padding:22px 18px 40px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0}.field{margin:14px 0}.field label,.label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)}textarea{min-height:110px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{border:1px solid var(--line);border-radius:12px;padding:11px}.metric b{display:block}.metric span{font-size:11px;color:var(--muted)}.items{margin:8px 0}.item{display:grid;grid-template-columns:1.2fr .9fr auto;gap:7px;margin:7px 0}.item input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink)}.item button{border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--muted)}.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;margin-top:10px;background:var(--ink);color:var(--bg)}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.hidden{display:none}.error{color:#a33}.fine{font-size:12px;color:var(--muted)}</style></head><body><main class="app"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Review</div><h1>Confirm what EL8 understood.</h1><div id="missing" class="card hidden">This review is no longer available. <button class="btn" onclick="location.replace('track.html')">Back to Track</button></div><section id="review" class="card hidden"><div class="field"><label>Summary</label><textarea id="summary"></textarea></div><div id="food" class="hidden"><span class="label">Detected food · edit before saving</span><div id="items" class="items"></div><button id="addFood" class="btn secondary" type="button">+ Add food item</button><span class="label" style="margin-top:16px">Estimated nutrition</span><div class="grid"><div class="metric"><b id="cal">—</b><span>Calories</span></div><div class="metric"><b id="protein">—</b><span>Protein</span></div><div class="metric"><b id="carbs">—</b><span>Carbs</span></div><div class="metric"><b id="fat">—</b><span>Fat</span></div></div><p class="fine">Quantities are estimates unless directly visible.</p></div><div id="expense" class="hidden"><div class="grid"><div class="field"><label>Merchant</label><input id="merchant"></div><div class="field"><label>Total</label><input id="total" inputmode="decimal"></div><div class="field"><label>Currency</label><input id="currency"></div><div class="field"><label>Date</label><input id="date"></div></div><div class="field"><label>Subcategory</label><input id="subcategory"></div></div><div class="field"><label>Dimension</label><input id="dimension"></div><div class="field"><label>Category</label><input id="category"></div><p class="fine" id="confidence"></p><p id="error" class="error"></p><button id="confirm" class="btn">Confirm & save</button><button id="discard" class="btn secondary">Discard</button></section></main><script type="module">import{supabase,getSessionOrRedirect}from'./el8-client.js';const $=id=>document.getElementById(id);await getSessionOrRedirect();let packet;try{packet=JSON.parse(sessionStorage.getItem('el8-track-review')||'null')}catch{}if(!packet?.interpretation_id||!packet?.interpretation){$('missing').classList.remove('hidden')}else{const i=packet.interpretation;$('review').classList.remove('hidden');$('summary').value=i.summary||'';$('dimension').value=i.dimension||'';$('category').value=i.category||'';$('confidence').textContent=`Interpretation confidence: ${i.confidence||'low'}`;const val=(v,u='')=>v==null?'—':typeof v==='object'?`${v.min??v.low??''}${(v.max??v.high)!=null?'–'+(v.max??v.high):''}${u}`:`${v}${u}`;function addItem(x={}){const r=document.createElement('div');r.className='item';r.innerHTML=`<input class="name" placeholder="Food item"><input class="portion" placeholder="Quantity"><button type="button">×</button>`;r.querySelector('.name').value=x.name||x.item||x.food||'';r.querySelector('.portion').value=x.portion||'';r.querySelector('button').onclick=()=>r.remove();$('items').appendChild(r)}if(i.structured_type==='food_intake'){ $('food').classList.remove('hidden');(i.items||[]).forEach(addItem);$('cal').textContent=val(i.nutrition_estimate?.calories,' kcal');$('protein').textContent=val(i.nutrition_estimate?.protein_g,' g');$('carbs').textContent=val(i.nutrition_estimate?.carbs_g,' g');$('fat').textContent=val(i.nutrition_estimate?.fat_g,' g')}if(i.structured_type==='expense'){const e=i.expense||{};$('expense').classList.remove('hidden');$('merchant').value=e.merchant||'';$('total').value=e.total??'';$('currency').value=e.currency||'CAD';$('date').value=e.receipt_date||'';$('subcategory').value=e.subcategory||''}$('addFood').onclick=()=>addItem();async function invoke(name,body){const{data:{session}}=await supabase.auth.getSession();const r=await fetch(`https://jprdsidxwjkgiqqakwpr.supabase.co/functions/v1/${name}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':'sb_publishable_CkcqWpD6nkzRzBfuJV08TQ_t38C9j34'},body:JSON.stringify(body)});const p=await r.json();if(!r.ok)throw Error(p?.error||`Save failed (${r.status})`);return p}$('confirm').onclick=async()=>{const b=$('confirm');b.disabled=true;b.textContent='Saving…';$('error').textContent='';try{let c={...i,summary:$('summary').value.trim(),dimension:$('dimension').value.trim(),category:$('category').value.trim(),member_confirmed:true};if(c.structured_type==='food_intake')c.items=[...document.querySelectorAll('.item')].map(r=>({name:r.querySelector('.name').value.trim(),portion:r.querySelector('.portion').value.trim()||null,source:'member_confirmed'})).filter(x=>x.name);if(c.structured_type==='expense')c.expense={...(c.expense||{}),merchant:$('merchant').value.trim()||null,total:Number($('total').value)||null,currency:$('currency').value.trim()||'CAD',receipt_date:$('date').value||null,subcategory:$('subcategory').value.trim()||null};await invoke('confirm-track',{interpretation_id:packet.interpretation_id,confirmed_interpretation:c});sessionStorage.removeItem('el8-track-review');location.replace('track.html')}catch(e){$('error').textContent=e.message;b.disabled=false;b.textContent='Confirm & save'}};$('discard').onclick=()=>{sessionStorage.removeItem('el8-track-review');location.replace('track.html')}};</script></body></html>
