<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 Discovery Test</title><style>body{font-family:system-ui,sans-serif;background:#f7f7f5;color:#171717;margin:0}.wrap{max-width:620px;margin:auto;padding:28px 20px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#777}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 3px 14px #0000000b}h1{font-size:25px;margin:7px 0 8px}p{line-height:1.45;color:#555}.options{display:grid;gap:10px;margin-top:22px}.option{width:100%;text-align:left;padding:14px 15px;border:1px solid #ccc;background:#fff;border-radius:12px;font-size:16px;cursor:pointer}.option.selected{border:2px solid #222;background:#f0f0ed}.actions{display:flex;gap:10px;margin-top:20px}.primary,.secondary{padding:12px 16px;border-radius:10px;border:0;font-size:15px;cursor:pointer}.primary{background:#171717;color:white}.primary:disabled{opacity:.35}.secondary{background:#e9e9e5}.meta{font-size:13px;color:#888;margin-top:12px}.result pre{white-space:pre-wrap;word-break:break-word;background:#f4f4f1;padding:12px;border-radius:10px;font-size:12px}.hidden{display:none}</style></head><body><main class="wrap"><div class="eyebrow">EL8 · Discovery v2 pilot</div><div id="app" class="card"></div></main><script type="module">import E from './discovery-v2-engine.js';
let s=E.session(),q=null,selected=[];const app=document.querySelector('#app');
const exclusive=new Set(['other','unsure']);
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toggle(id){if(q.mode!=='multi'){selected=[id];render();return;}if(exclusive.has(id)){selected=selected.length===1&&selected[0]===id?[]:[id];}else{selected=selected.filter(x=>!exclusive.has(x));selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];}render();}
function submit(){if(!selected.length)return;E.answer(s,q.id,q.mode==='multi'?selected:selected[0]);selected=[];advance();}
function advance(){q=E.next(s);if(!q){finish();return;}render();}
function render(){app.innerHTML=`<div class="eyebrow">Question ${s.asked.length+1} · ${esc(q.role.replaceAll('-',' '))}</div><h1>${esc(q.text)}</h1><div class="options">${q.options.map(o=>`<button class="option ${selected.includes(o.id)?'selected':''}" data-id="${esc(o.id)}">${esc(o.label)}</button>`).join('')}</div><div class="actions"><button id="next" class="primary" ${selected.length?'':'disabled'}>${q.mode==='multi'?'Continue':'Next'}</button></div><div class="meta">${q.mode==='multi'?'Choose all that fit. “Something else” and “Not sure” cannot be combined with other answers.':'Choose the answer that fits best.'}</div>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>toggle(b.dataset.id));app.querySelector('#next').onclick=submit;}
function finish(){const t=E.trace(s),top=t.ranked.slice(0,5);app.innerHTML=`<div class="result"><div class="eyebrow">Test complete</div><h1>Thanks. This run is finished.</h1><p>This pilot screen intentionally avoids presenting internal hypotheses as diagnoses. Use the trace below only for EL8 testing.</p><p><b>Questions asked:</b> ${t.asked.length}</p><p><b>Top internal signals:</b> ${top.map(x=>esc(x.id)).join(', ')||'none'}</p><details><summary>Developer route trace</summary><pre>${esc(JSON.stringify(t,null,2))}</pre></details><div class="actions"><button id="again" class="secondary">Start another test</button></div></div>`;app.querySelector('#again').onclick=()=>{s=E.session();selected=[];advance();};}
advance();</script></body></html>
