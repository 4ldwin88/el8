<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Reassess plan</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:32px;margin:18px 0 8px}.q{margin:15px 0}.q label{display:block;font-weight:800;margin-bottom:7px}.q select,.q textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}.q textarea{min-height:82px}.small{font-size:12px;color:var(--muted);line-height:1.45}.candidate{margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:12px}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Focused reassessment</div><h1>Update what this plan needs.</h1><p class="small">This is not a new onboarding assessment. EL8 only asks what is needed to decide whether the current action, priority, or plan should change.</p><div class="el8-card"><form id="form"><div id="questions"></div><div id="candidate"></div><p id="message" class="small" aria-live="polite"></p><button id="submit" class="el8-btn" type="submit">Build updated proposal</button></form></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{reassessmentQuestions,deriveReassessmentDecision}from'./app/plan/reassessment-model.js';import{startPlanReassessment,completePlanReassessment}from'./app/plan/reassessment-persistence.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const member=await getMyProfile();document.documentElement.dataset.theme=member.appearance||'light';if(member.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const params=new URLSearchParams(location.search),kind=params.get('kind')==='reprioritize'?'reprioritize':'reassess';const{data:plan,error}=await supabase.from('el8_plans').select('*').eq('user_id',session.user.id).eq('status','needs_reassessment').eq('is_test',false).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;const form=document.getElementById('form'),questions=document.getElementById('questions'),candidate=document.getElementById('candidate'),message=document.getElementById('message'),submit=document.getElementById('submit');let proposal=null,reassessmentId=null;if(!plan){message.textContent='There is no plan awaiting reassessment.';message.classList.add('error');submit.disabled=true}else{const qs=reassessmentQuestions({kind,dimension:plan.dimension});questions.innerHTML=qs.map(q=>`<div class="q"><label for="${q.id}">${q.label}</label>${q.type==='choice'?`<select id="${q.id}" ${q.optional?'':'required'}><option value="">Choose…</option>${q.options.map(o=>`<option value="${o}">${o.replaceAll('_',' ')}</option>`).join('')}</select>`:`<textarea id="${q.id}" ${q.optional?'':'required'}></textarea>`}</div>`).join('')+(kind==='reprioritize'?`<div class="q"><label for="new_dimension">If the priority changed, which dimension should lead now?</label><select id="new_dimension"><option value="">Keep current / not sure</option>${['Physical','Emotional','Social','Occupational','Financial','Environmental','Intellectual','Spiritual'].map(x=>`<option>${x}</option>`).join('')}</select></div>`:'');form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='';message.classList.remove('error');if(proposal){submit.disabled=true;try{proposal.decision.confirmed=true;await completePlanReassessment({reassessmentId,responses:proposal.responses,decision:proposal.decision});location.replace('plan.html')}catch(err){submit.disabled=false;message.textContent=err.message;message.classList.add('error')}return}const responses={};qs.forEach(q=>responses[q.id]=document.getElementById(q.id).value.trim());if(kind==='reprioritize')responses.new_dimension=document.getElementById('new_dimension').value||null;const targetDimension=responses.new_dimension||plan.dimension;const generated=plan.generated_from||{},rawDrivers=generated.planning_evidence||generated.planningEvidence||generated.drivers||plan.evidence_used||[];const drivers=(Array.isArray(rawDrivers)?rawDrivers:[]).map(d=>typeof d==='string'?{id:d,confidence:null}:d).map(d=>({...d,dimension:d.dimension||targetDimension}));const rejected=[...(plan.decision_trace?.rejectedActionIds||plan.decisionTrace?.rejectedActionIds||[])];for(const intervention of plan.interventions||[])if(intervention.status==='rejected'||intervention.status==='removed')rejected.push(intervention.id);const out=deriveReassessmentDecision({kind,sourcePlan:plan,responses,drivers,rejectedActionIds:[...new Set(rejected)]});if(!out.ready){message.textContent=out.reason==='new_priority_required'?'Choose the new priority before EL8 proposes a replacement.':out.reason==='desired_outcome_required'?'Describe what meaningful progress should look like now.':out.reason==='insufficient_driver_evidence'?'EL8 does not have enough confirmed driver evidence to justify a replacement yet. More focused assessment is required.':'EL8 does not yet have an eligible evidence-backed action for this reassessment.';message.classList.add('error');return}try{reassessmentId=await startPlanReassessment({planId:plan.id,kind,reason:responses.what_changed||`${kind} requested from accumulated plan evidence`,requestedDimension:targetDimension});proposal={...out,responses};candidate.innerHTML=`<div class="el8-eyebrow">Updated proposal</div>${out.decision.interventions.map(x=>`<div class="candidate"><strong>${x.action}</strong>${x.driver?`<div class="small">Supported by: ${x.driver.replaceAll('_',' ')}</div>`:''}${x.rationale?`<div class="small">${x.rationale}</div>`:''}</div>`).join('')}<p class="small">Nothing changes until you confirm this proposal.</p>`;submit.textContent='Confirm updated plan'}catch(err){message.textContent=err.message;message.classList.add('error')}})}}</script></body></html>
