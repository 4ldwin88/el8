<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan detail</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.question{margin:16px 0}.question label{display:block;font-weight:800;margin-bottom:7px}.question input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}.options{display:flex;flex-wrap:wrap;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.small{font-size:13px;color:var(--muted);line-height:1.45}.action{padding:13px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow" id="eyebrow">Plan detail</div><h1 id="title">One more detail.</h1><p id="intro">EL8 will only ask for information that can change or complete the action.</p><div id="action" class="action" hidden></div><div class="el8-card"><form id="form"><div id="questions"></div><p id="message" class="small" aria-live="polite"></p><button class="el8-btn" type="submit">Continue</button></form></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{buildCanonicalPlan}from'./intelligence/planning/canonical-plan-engine.js';import{canonicalPlanningInputFromBrowser,canonicalBrowserPlanView}from'./app/onboarding/browser-planning-adapter.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const stage=new URLSearchParams(location.search).get('stage')||'activation';if(stage==='ready'){location.replace('plan-confirmation.html');throw Error('Ready step consolidated into final review')}let output=null,confirmed=[],selectionEvidence={},activationEvidence={},rejected=[],storedPlan=null;try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');confirmed=JSON.parse(sessionStorage.getItem('el8_confirmed_priorities')||'[]');selectionEvidence=JSON.parse(sessionStorage.getItem('el8_plan_selection_evidence')||'{}');activationEvidence=JSON.parse(sessionStorage.getItem('el8_plan_activation_evidence')||'{}');rejected=JSON.parse(sessionStorage.getItem('el8_rejected_action_ids')||'[]');storedPlan=JSON.parse(sessionStorage.getItem('el8_canonical_initial_plan')||'null')}catch{}if(!output||!confirmed.length){location.replace('discovery.html');throw Error('Discovery and confirmed focus required')}const memberStateRevision=storedPlan?.memberStateRevision;if(!Number.isInteger(memberStateRevision)){location.replace('plan-proposal.html');throw Error('Canonical plan revision required')}const input=canonicalPlanningInputFromBrowser({discoveryOutput:output,confirmedPriorities:confirmed,memberStateRevision});const build=()=>buildCanonicalPlan(input,{selectionEvidence,activationEvidence,rejectedInterventionIds:rejected});let plan=build(),view=canonicalBrowserPlanView(plan);const requirements=stage==='selection'?view.selectionDeepening.requirements:view.deepening.blocking;if(stage==='selection'&&!requirements.length){location.replace('plan-proposal.html');throw Error('No selection evidence required')}if(stage==='activation'&&!requirements.length){location.replace('plan-confirmation.html');throw Error('No activation evidence required')}const action=document.getElementById('action');if(view.actions[0]){action.hidden=false;action.innerHTML=`<strong>${view.actions[0].title||'Recommended action'}</strong><div class="small">${view.actions[0].rationale||'Selected from your Discovery evidence and confirmed focus.'}</div>`}if(stage==='selection'){eyebrow.textContent='Choose the right action';title.textContent=requirements.length===1?'One quick question.':'A few quick questions.';intro.textContent='These answers can change which supported action EL8 recommends.'}else{eyebrow.textContent='Make the action workable';title.textContent='One final plan detail.';intro.textContent='Only information required to make this action ready is asked here.'}const R={},q=document.getElementById('questions'),message=document.getElementById('message');requirements.forEach((r,i)=>{const key=r.evidenceKey||r.requirementId||r.id||`requirement_${i}`,div=document.createElement('div');div.className='question';const label=r.prompt||r.question||r.decisionImpact||r.reason||'Provide the information needed for this plan.';if(r.options?.length)div.innerHTML=`<label>${label}</label><div class="options" data-key="${key}">${r.options.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div>`;else div.innerHTML=`<label for="q${i}">${label}</label><input id="q${i}" data-key="${key}" autocomplete="off" required>`;q.appendChild(div)});q.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const g=b.closest('.options');R[g.dataset.key]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))};q.oninput=e=>{const input=e.target.closest('input[data-key]');if(input)R[input.dataset.key]=input.value.trim()};document.getElementById('form').onsubmit=e=>{e.preventDefault();if(requirements.some((r,i)=>!R[r.evidenceKey||r.requirementId||r.id||`requirement_${i}`])){message.textContent='Complete the required item'+(requirements.length===1?'':'s')+' to continue.';message.classList.add('error');return}if(stage==='selection'){selectionEvidence={...selectionEvidence,...R};sessionStorage.setItem('el8_plan_selection_evidence',JSON.stringify(selectionEvidence));recordOnboardingEvent('plan_selection_evidence_completed',{evidenceKeys:Object.keys(R),planner:'canonical'});location.assign('plan-proposal.html');return}activationEvidence={...activationEvidence,...R};sessionStorage.setItem('el8_plan_activation_evidence',JSON.stringify(activationEvidence));recordOnboardingEvent('plan_activation_evidence_completed',{actionId:view.actions[0]?.intervention_id||null,evidenceKeys:Object.keys(R),planner:'canonical'});location.assign('plan-proposal.html')};</script></body></html>
