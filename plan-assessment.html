<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan assessment</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.question{margin:14px 0}.question label{display:block;font-weight:800;margin-bottom:7px}.question input{width:100%;box-sizing:border-box;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}.small{font-size:13px;color:var(--muted);line-height:1.45}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Plan-specific assessment</div><h1>A few details for this plan.</h1><p>Your onboarding established the baseline and priorities. These questions only collect information that changes how the selected plan is activated or measured.</p><div class="el8-card"><form id="form"><div id="questions"></div><p id="message" class="small" aria-live="polite"></p><button id="continue" class="el8-btn" type="submit">Activate plan</button></form></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{persistAdaptiveInitialPlan}from'./app/onboarding/persistence.js';import{buildOnboardingAdaptivePlan,onboardingPlanView}from'./app/onboarding/adaptive-plan.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const form=document.getElementById('form'),questions=document.getElementById('questions'),message=document.getElementById('message'),button=document.getElementById('continue');let proposal,discoveryOutput,baselineHandoff={},savedPlan;try{proposal=JSON.parse(sessionStorage.getItem('el8_initial_plan_proposal')||'null');discoveryOutput=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');baselineHandoff=JSON.parse(sessionStorage.getItem('el8_baseline_handoff')||'null')||discoveryOutput?.baselineHandoff||{};savedPlan=JSON.parse(sessionStorage.getItem('el8_adaptive_initial_plan')||'null')}catch{}if(!proposal?.confirmedPriorities?.length||!discoveryOutput?.trace||!savedPlan){message.textContent='Your proposed plan could not be restored. Return to the plan step.';message.classList.add('error');button.disabled=true}else{const required=(savedPlan.deepening?.blocking||[]);if(!required.length){location.replace('plan-proposal.html')}else{required.forEach((r,i)=>{const div=document.createElement('div');div.className='question';const id=`q${i}`;div.innerHTML=`<label for="${id}">${r.prompt||'Please provide the detail needed for this plan.'}</label><input id="${id}" data-key="${r.evidenceKey}" autocomplete="off" required><div class="small">This changes: ${r.decisionImpact}</div>`;questions.appendChild(div)});form.addEventListener('submit',async e=>{e.preventDefault();const evidence={};questions.querySelectorAll('input[data-key]').forEach(input=>{evidence[input.dataset.key]=input.value.trim()});if(Object.values(evidence).some(v=>!v)){message.textContent='Complete each required question to activate the plan.';message.classList.add('error');return}const plan=buildOnboardingAdaptivePlan({discoveryOutput,confirmedPriorities:proposal.confirmedPriorities,baselineHandoff,evidence});const view=onboardingPlanView(plan);if(view.activationStatus==='needs_plan_specific_assessment'){message.textContent='EL8 still needs required plan information before activation.';message.classList.add('error');return}button.disabled=true;button.textContent='Saving…';try{await persistAdaptiveInitialPlan({userId:auth.user.id,plan,discoveryOutput});recordOnboardingEvent('plan_deepening_completed',{actionIds:view.actions.map(a=>a.id),evidenceKeys:Object.keys(evidence)});recordOnboardingEvent('plan_accepted',{actionIds:view.actions.map(a=>a.id),confirmedPriorities:proposal.confirmedPriorities,reviewDays:view.reviewDays});sessionStorage.removeItem('el8_plan_deepening');sessionStorage.setItem('el8_adaptive_initial_plan',JSON.stringify(plan));location.replace('introduction.html')}catch(err){button.disabled=false;button.textContent='Activate plan';message.textContent=err.message;message.classList.add('error')}})}};</script></body></html>
