<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan assessment</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.question{margin:16px 0}.question label{display:block;font-weight:800;margin-bottom:7px}.question input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}.options{display:flex;flex-wrap:wrap;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.small{font-size:13px;color:var(--muted);line-height:1.45}.action{padding:13px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow" id="eyebrow">Plan assessment</div><h1 id="title">One more detail.</h1><p id="intro">EL8 will ask only for evidence the Planning engine says can change the decision.</p><div id="action" class="action" hidden></div><div class="el8-card"><form id="form"><div id="questions"></div><p id="message" class="small" aria-live="polite"></p><button id="continue" class="el8-btn" type="submit">Continue</button></form></div></main><script type="module" src="qa-dev-note.js"></script><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{buildOnboardingAdaptivePlan,onboardingPlanView}from'./app/onboarding/adaptive-plan.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const stage=new URLSearchParams(location.search).get('stage')||'activation';let output=null,confirmed=[],selectionEvidence={},activationEvidence={};try{output=JSON.parse(sessionStorage.getItem('el8_discovery_output')||'null');confirmed=JSON.parse(sessionStorage.getItem('el8_confirmed_priorities')||'[]');selectionEvidence=JSON.parse(sessionStorage.getItem('el8_plan_selection_evidence')||'{}');activationEvidence=JSON.parse(sessionStorage.getItem('el8_plan_activation_evidence')||'{}')}catch{}if(!output||!confirmed.length){location.replace('discovery.html');throw Error('Discovery and confirmed focus required')}const build=()=>buildOnboardingAdaptivePlan({discoveryOutput:output,confirmedPriorities:confirmed,baselineHandoff:output.baselineHandoff||{},selectionEvidence,evidence:activationEvidence});let plan=build(),view=onboardingPlanView(plan);const requirements=stage==='selection'?(view.selectionDeepening?.requirements||[]):stage==='ready'?[]:(view.deepening?.blocking||[]);if(stage==='selection'&&!requirements.length){location.replace('plan-proposal.html');throw Error('No selection evidence required')}if(stage==='activation'&&!requirements.length){location.replace('plan-proposal.html');throw Error('No activation evidence required')}const action=document.getElementById('action');if(view.actions[0]){action.hidden=false;action.innerHTML=`<strong>${view.actions[0].title||view.actions[0].id}</strong><div class="small">${view.actions[0].rationale||'Selected from your Discovery evidence and confirmed focus.'}</div>`}if(stage==='selection'){document.getElementById('eyebrow').textContent='Action selection';document.getElementById('title').textContent=requirements.length===1?'One quick question.':'A few quick questions.';document.getElementById('intro').textContent='These answers can change which action EL8 selects. They are not a repeat of Discovery.'}else if(stage==='activation'){document.getElementById('eyebrow').textContent='Plan-specific assessment';document.getElementById('title').textContent='Make the selected action ready.';document.getElementById('intro').textContent='These are only the remaining action-specific details required before activation.'}else{document.getElementById('title').textContent='Ready to activate.';document.getElementById('intro').textContent='No additional evidence is required for this action.'}const R={},q=document.getElementById('questions');requirements.forEach((r,i)=>{const key=r.evidenceKey||r.requirementId||r.id||`requirement_${i}`,div=document.createElement('div');div.className='question';const label=r.prompt||r.question||r.decisionImpact||r.reason||'Provide the information needed for this plan.';if(r.options?.length){div.innerHTML=`<label>${label}</label><div class="options" data-key="${key}">${r.options.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div>`}else div.innerHTML=`<label for="q${i}">${label}</label><input id="q${i}" data-key="${key}" autocomplete="off" required>`;q.appendChild(div)});q.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const g=b.closest('.options');R[g.dataset.key]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))};q.oninput=e=>{const input=e.target.closest('input[data-key]');if(input)R[input.dataset.key]=input.value.trim()};document.getElementById('form').onsubmit=e=>{e.preventDefault();if(requirements.some((r,i)=>{const key=r.evidenceKey||r.requirementId||r.id||`requirement_${i}`;return !R[key]})){message.textContent='Complete the required item'+(requirements.length===1?'':'s')+' to continue.';message.classList.add('error');return}if(stage==='selection'){selectionEvidence={...selectionEvidence,...R};sessionStorage.setItem('el8_plan_selection_evidence',JSON.stringify(selectionEvidence));recordOnboardingEvent('plan_selection_evidence_completed',{evidenceKeys:Object.keys(R)});location.assign('plan-proposal.html');return}if(stage==='activation'){activationEvidence={...activationEvidence,...R};sessionStorage.setItem('el8_plan_activation_evidence',JSON.stringify(activationEvidence));recordOnboardingEvent('plan_activation_evidence_completed',{actionId:view.actions[0]?.id||null,evidenceKeys:Object.keys(R)});location.assign('plan-proposal.html');return}plan=build();sessionStorage.setItem('el8_adaptive_initial_plan',JSON.stringify(plan));recordOnboardingEvent('plan_ready_confirmed',{actionId:view.actions[0]?.id||null});location.assign('plan-confirmation.html')};</script></body></html>
