<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan assessment</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.page{max-width:650px;margin:auto;min-height:100vh;padding:26px 18px 70px}.page h1{font-size:34px;margin:20px 0 10px}.question{margin:16px 0}.question label{display:block;font-weight:800;margin-bottom:7px}.options{display:flex;flex-wrap:wrap;gap:7px}.opt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}.opt.sel{background:var(--ink);color:var(--bg)}.small{font-size:13px;color:var(--muted);line-height:1.45}.action{padding:13px;border:1px solid var(--line);border-radius:12px;margin:12px 0}.error{color:#9b4038}</style></head><body><main class="page"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Plan-specific assessment</div><h1>Make this plan measurable.</h1><p>These questions are about the starting action you just chose. EL8 is not reassessing your whole life; it is collecting the minimum detail needed to judge fit, adherence and outcome.</p><div id="action" class="action"></div><div class="el8-card"><form id="form"><div id="questions"></div><p id="message" class="small" aria-live="polite"></p><button id="continue" class="el8-btn" type="submit">Activate starting plan</button></form></div></main><script type="module">import{getSessionOrRedirect}from'./el8-client.js';import{recordOnboardingEvent}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');let plan;try{plan=JSON.parse(sessionStorage.getItem('el8_adaptive_initial_plan')||'null')}catch{}if(!plan?.actions?.length){location.replace('plan-proposal.html');throw Error('No starting plan')}const a=plan.actions[0],R={};document.getElementById('action').innerHTML=`<strong>${a.label||a.title}</strong><div class="small">Starting focus: ${a.concernLabel||a.concernId||plan.confirmedPriorities?.[0]||'your selected priority'}</div>`;const defs=[{key:'baseline_frequency',label:'Right now, how often are you already doing something like this?',values:['Never','Rarely','Sometimes','Often','Already consistent']},{key:'fit',label:'How realistic does this action feel for the next week?',values:['Not realistic','A little difficult','Manageable','Easy']},{key:'success',label:'After one week, what would count as meaningful progress?',values:['I did it at least once','I did it on several days','It felt easier or more manageable','I noticed a useful outcome']},{key:'barrier',label:'What is most likely to get in the way?',values:['Time','Energy','Forgetting','Cost or access','Environment','Motivation','Nothing obvious']}];const q=document.getElementById('questions');defs.forEach(d=>{const div=document.createElement('div');div.className='question';div.innerHTML=`<label>${d.label}</label><div class="options" data-key="${d.key}">${d.values.map(v=>`<button type="button" class="opt" data-v="${v}">${v}</button>`).join('')}</div>`;q.appendChild(div)});q.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const g=b.closest('.options');R[g.dataset.key]=b.dataset.v;g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b))};document.getElementById('form').onsubmit=e=>{e.preventDefault();if(defs.some(d=>!R[d.key])){message.textContent='Complete the four plan-specific questions to continue.';message.classList.add('error');return}const evidence={version:'plan-specific-v1',actionId:a.id,concernId:a.concernId||plan.confirmedPriorities?.[0],capturedAt:new Date().toISOString(),...R};plan={...plan,status:'active',activationStatus:'active',planSpecificEvidence:evidence,measurement:{baseline:R.baseline_frequency,successCriterion:R.success,primaryBarrier:R.barrier,fit:R.fit},activatedAt:new Date().toISOString()};sessionStorage.setItem('el8_adaptive_initial_plan',JSON.stringify(plan));sessionStorage.setItem('el8_plan_specific_evidence',JSON.stringify(evidence));recordOnboardingEvent('plan_specific_assessment_completed',{actionId:a.id,evidenceKeys:Object.keys(R),fit:R.fit});location.assign('plan-confirmation.html')};</script></body></html>
