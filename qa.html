<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · QA</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.row{padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.value{font-weight:700;margin-top:3px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);margin:3px 4px 3px 0;font-size:12px}select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--card);color:var(--ink);font:inherit}textarea{resize:vertical}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800}.hidden{display:none}.notice{padding:12px;border-radius:12px;background:var(--soft);margin:10px 0}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Tester tools</div><h1>QA inspector</h1><p>This page is available only to T-series test accounts. It is separate from the member experience.</p><div class="el8-card"><h2>Current intelligence state</h2><div id="state">Loading…</div></div><div class="el8-card"><h2>Pending follow-ups</h2><div id="followups">Loading…</div></div><div class="el8-card"><h2>Question scheduling</h2><div id="questions">Loading…</div></div><div class="el8-card"><h2>Report feedback</h2><select id="type"><option value="bug">Bug</option><option value="friction">Friction</option><option value="question">Question issue</option><option value="suggestion">Suggestion</option><option value="general">General</option></select><textarea id="feedback" rows="4" placeholder="What happened or what should improve?" style="margin-top:10px"></textarea><div id="msg" class="notice hidden"></div><button id="send" class="primary" style="margin-top:10px">Save QA feedback</button></div><button class="el8-bottom-action" onclick="location.href='profile.html'">Back to Profile</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const s=await getSessionOrRedirect();if(!s)throw Error('No session');const p=await getMyProfile();document.documentElement.dataset.theme=p.appearance||'light';if(!/^T\d+/i.test(p.member_code||'')){location.replace('profile.html');throw Error('Tester only')}const esc=x=>String(x??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const [{data:load},{data:pending},{data:bank},{data:activity}]=await Promise.all([supabase.from('el8_member_load_state').select('*').eq('user_id',s.user.id).maybeSingle(),supabase.from('el8_checkin_followups').select('*').eq('user_id',s.user.id).in('status',['pending','presented']).order('priority',{ascending:false}),supabase.from('el8_checkin_question_bank').select('question_key,question_kind,prompt_template,primary_dimensions,signal_map,schedule_rule,min_member_day,max_member_day,cadence_days').eq('active',true).order('question_key'),supabase.from('el8_member_activity').select('*').eq('user_id',s.user.id).maybeSingle()]);document.getElementById('state').innerHTML=[['Adaptation direction',load?.adaptation_direction],['Recommended direction',load?.recommended_direction],['Load level',load?.load_level],['Last manageability',load?.last_manageability],['Recommendation reason',load?.recommendation_reason],['Last meaningful activity',activity?.last_meaningful_activity_at]].map(([a,b])=>`<div class="row"><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div></div>`).join('');document.getElementById('followups').innerHTML=pending?.length?pending.map(f=>`<div class="row"><div class="label">${esc(f.followup_kind)} · priority ${esc(f.priority)}</div><div class="value">${esc(f.prompt)}</div><div>${(f.signal_map?.dimensions||[]).map(d=>`<span class="pill">${esc(d)}</span>`).join('')}</div><div class="label">Due ${esc(f.due_on)} · expires ${esc(f.expires_on)}</div></div>`).join(''):'<p>No pending follow-ups.</p>';document.getElementById('questions').innerHTML=bank?.length?bank.map(q=>`<div class="row"><div class="label">${esc(q.question_key)} · ${esc(q.question_kind)}</div><div class="value">${esc(q.prompt_template)}</div><div>${(q.primary_dimensions||[]).map(d=>`<span class="pill">${esc(d)}</span>`).join('')}</div><div class="label">Schedule ${esc(JSON.stringify(q.schedule_rule||{}))}</div></div>`).join(''):'<p>No active questions.</p>';document.getElementById('send').onclick=async()=>{const feedback=document.getElementById('feedback').value.trim(),msg=document.getElementById('msg');if(!feedback){msg.textContent='Enter feedback first.';msg.classList.remove('hidden');return}const{error}=await supabase.from('el8_qa_feedback').insert({user_id:s.user.id,member_code:p.member_code,page:'qa.html',feedback_type:document.getElementById('type').value,feedback,context:{adaptation_direction:load?.adaptation_direction||null,recommended_direction:load?.recommended_direction||null,pending_followups:pending?.length||0}});msg.textContent=error?error.message:'Feedback saved.';msg.classList.remove('hidden');if(!error)document.getElementById('feedback').value=''};</script></body></html>
