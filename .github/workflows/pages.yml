name: Deploy EL8 Human QA to GitHub Pages

on:
  push:
    branches:
      - reconcile/g02-intelligence
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write exact deployed candidate provenance
        env:
          CONTEXT: github-pages
          DEPLOY_ID: github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/write-intelligence-test-build-meta.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
