name: Publish EL8 prototype QA harness to GitHub Pages

on:
  push:
    branches:
      - reconcile/g02-intelligence
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish prototype QA harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write exact prototype QA provenance
        env:
          CONTEXT: github-pages-prototype-qa
          DEPLOY_ID: github-actions-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/write-intelligence-test-build-meta.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload prototype QA site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
