name: Discovery Round 3 Recovery Validation
on:
  push:
    branches: [feature/discovery-round-3-recovery]
  pull_request:
    paths:
      - 'discovery-round3/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Architecture regressions
        run: node discovery-round3/regression-tests.mjs
      - name: Adversarial end-to-end scenarios
        run: node discovery-round3/end-to-end-tests.mjs
      - name: Human harness readiness
        run: node discovery-round3/human-readiness-tests.mjs
