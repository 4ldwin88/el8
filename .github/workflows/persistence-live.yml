name: Live Persistence Validation

on:
  workflow_dispatch:

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run live persistence concurrency suite
        run: npm run test:persistence:live
