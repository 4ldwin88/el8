name: Owner-approved live persistence check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence:
    name: Manual live persistence check after Supabase reactivation approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EL8_SUPABASE_URL: https://jprdsidxwjkgiqqakwpr.supabase.co
      EL8_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EL8_SUPABASE_PUBLISHABLE_KEY }}
      EL8_QA_EMAIL: ${{ secrets.EL8_QA_EMAIL }}
      EL8_QA_PASSWORD: ${{ secrets.EL8_QA_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run authenticated live persistence concurrency suite after owner-approved Supabase reactivation
        run: npm run test:persistence:live
