name: Live Persistence Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EL8_SUPABASE_URL: https://jprdsidxwjkgiqqakwpr.supabase.co
      EL8_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EL8_SUPABASE_PUBLISHABLE_KEY }}
      EL8_QA_EMAIL: ${{ secrets.EL8_QA_EMAIL }}
      EL8_QA_PASSWORD: ${{ secrets.EL8_QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run authenticated live persistence concurrency suite
        run: npm run test:persistence:live
