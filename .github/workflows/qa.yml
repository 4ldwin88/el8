name: Canonical Repository QA

on:
  workflow_dispatch:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main, migration/intelligence-canonical-contracts]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run canonical repository release gate
        run: npm test
