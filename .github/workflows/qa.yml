name: Canonical Repository QA
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, development, 'remediation/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-checks-${{ github.sha }}
          path: .candidate/checks.json
          include-hidden-files: true
          if-no-files-found: error
