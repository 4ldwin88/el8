name: Canonical Repository QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Run canonical test suite
        run: npm test
      - name: Temporary cleanup gate - live persistence concurrency
        run: npm run test:persistence:live
