name: Discovery Gate A Evidence
on:
  push:
    branches:
      - 'discovery-v2-*'
      - 'discovery-gate-a-evidence'
    paths:
      - 'discovery-v2-*.js'
      - 'intelligence/**'
      - 'package.json'
      - '.github/workflows/discovery-v2-qa.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  gate-a-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete Gate A suite
        run: npm run test:gate-a 2>&1 | tee gate-a-evidence-output.txt
      - name: Run Discovery v2 synthetic metrics
        if: always()
        run: node discovery-v2-synthetic-runner.js | tee discovery-v2-qa-output.json
      - name: Enforce Discovery v2 release gates
        if: always()
        run: node discovery-v2-synthetic-runner.js --enforce
      - name: Run Discovery v2.7 contract QA
        if: always()
        run: node discovery-v2-7-contract-qa.js
      - name: Run permanent human-test regression
        if: always()
        run: node discovery-v2-5-driver-closure-qa.js
      - name: Run 5000-case adversarial stress simulation
        if: always()
        run: node discovery-v2-large-adversarial.js --enforce | tee discovery-v2-large-adversarial-output.json
      - name: Upload Gate A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-gate-a-evidence
          path: |
            gate-a-evidence-output.txt
            discovery-v2-qa-output.json
            discovery-v2-large-adversarial-output.json
          retention-days: 90
