name: Discovery v2 Synthetic QA
on:
  push:
    branches:
      - 'discovery-v2-*'
    paths: ['discovery-v2-*.js','.github/workflows/discovery-v2-qa.yml']
  pull_request:
    branches: [main]
    paths: ['discovery-v2-*.js','.github/workflows/discovery-v2-qa.yml']
  workflow_dispatch:
jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Discovery v2 synthetic suite
        run: node discovery-v2-synthetic-runner.js | tee discovery-v2-qa-output.json
      - name: Enforce release gates
        run: node discovery-v2-synthetic-runner.js --enforce > /dev/null
      - name: Run Discovery v2.7 contract QA
        run: node discovery-v2-7-contract-qa.js
      - name: Run permanent human-test regression
        run: node discovery-v2-5-driver-closure-qa.js
      - name: Upload QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-qa-output
          path: discovery-v2-qa-output.json
          retention-days: 30
