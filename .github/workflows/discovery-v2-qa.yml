name: Discovery v2 Synthetic QA

on:
  push:
    branches:
      - discovery-v2-bank-expansion
    paths:
      - 'discovery-v2-*.js'
      - '.github/workflows/discovery-v2-qa.yml'
  pull_request:
    paths:
      - 'discovery-v2-*.js'
      - '.github/workflows/discovery-v2-qa.yml'
  workflow_dispatch:

jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Discovery v2 synthetic suite
        shell: bash
        run: |
          node discovery-v2-synthetic-runner.js | tee discovery-v2-qa-output.json

      - name: Enforce release gates
        shell: bash
        run: |
          node - <<'NODE'
          const QA = require('./discovery-v2-synthetic-runner.js');
          const out = QA.report();
          console.log('\nRelease gate checks:');
          console.table(out.checks);
          console.log('\nMetrics:');
          console.table(out.metrics);
          if (!out.pass) {
            console.error('\nDiscovery v2 synthetic QA FAILED one or more release gates.');
            process.exit(1);
          }
          console.log('\nDiscovery v2 synthetic QA passed all currently enforced release gates.');
          NODE

      - name: Upload QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-v2-qa-output
          path: discovery-v2-qa-output.json
          retention-days: 30
