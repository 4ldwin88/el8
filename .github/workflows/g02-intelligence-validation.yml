name: G-02 Intelligence Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [reconcile/g02-intelligence]

permissions:
  contents: read

jobs:
  discovery:
    name: Intelligence Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove exact checked-out registry source
        shell: bash
        run: |
          set -euo pipefail
          echo "event_sha=${GITHUB_SHA}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --short
          echo "registry_test_blob=$(git hash-object intelligence/registries/registry.test.mjs)"
          echo "registry_test_tree_blob=$(git rev-parse HEAD:intelligence/registries/registry.test.mjs)"
          test "$(git hash-object intelligence/registries/registry.test.mjs)" = "$(git rev-parse HEAD:intelligence/registries/registry.test.mjs)"
          echo '--- registry cardinality assertions from checked-out bytes ---'
          grep -nE 'ALL_(QUESTIONS|ANSWERS|EFFECTS)\.length|ACTIONS\.length' intelligence/registries/registry.test.mjs
          grep -q "ALL_ANSWERS.length, 629" intelligence/registries/registry.test.mjs

      - name: Install dependencies when declared
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif node -e "const p=require('./package.json'); process.exit((p.dependencies||p.devDependencies)?0:1)"; then
            npm install --ignore-scripts --no-audit --no-fund
          else
            echo "No package dependencies declared; skipping npm install."
          fi

      - name: Verify registry source unchanged after dependency install
        shell: bash
        run: |
          set -euo pipefail
          echo "registry_test_blob_after_install=$(git hash-object intelligence/registries/registry.test.mjs)"
          echo "registry_test_tree_blob=$(git rev-parse HEAD:intelligence/registries/registry.test.mjs)"
          test "$(git hash-object intelligence/registries/registry.test.mjs)" = "$(git rev-parse HEAD:intelligence/registries/registry.test.mjs)"
          grep -n "ALL_ANSWERS.length" intelligence/registries/registry.test.mjs

      - name: Run canonical Intelligence contracts, state, Planning, Review and personalization validation
        run: npm run test:intelligence

      - name: Run persistence and migration validation
        run: npm run test:persistence

      - name: Run Discovery validation
        run: npm run test:discovery

      - name: Run human-QA harness regression validation
        run: npm run test:intelligence-test

      - name: Guard Home navigation against secondary module failures
        run: node app/home/home-shell-resilience.test.mjs

      - name: Run E01 raw lifecycle validation
        run: npm run test:e01

      - name: Run adversarial G-02 lifecycle and hostile matrix
        run: npm run test:g02-adversarial

      - name: Run E02 E03 QA isolation and replay validation
        run: npm run test:e02-e03

      - name: Run T01 T02 decision trace validation
        run: npm run test:t01-t02

      - name: Run S01 deterministic Safety validation
        run: npm run test:s01

      - name: Run S02 adversarial Safety validation
        run: npm run test:s02

      - name: Run R01 registry governance validation
        run: npm run test:r01
