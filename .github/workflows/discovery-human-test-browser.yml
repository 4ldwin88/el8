name: Discovery Human Test Browser

on:
  push:
    branches: [a4-v0.12-compatibility]
    paths:
      - 'discovery-round3/human-test.html'
      - 'discovery-round3/human-test.css'
      - 'discovery-round3/human-test.js'
      - 'discovery-round3/human-test-browser.spec.js'
      - 'discovery-round3/round3-engine.js'
      - '.github/workflows/discovery-human-test-browser.yml'
  pull_request:
    paths:
      - 'discovery-round3/human-test.html'
      - 'discovery-round3/human-test.css'
      - 'discovery-round3/human-test.js'
      - 'discovery-round3/human-test-browser.spec.js'
      - 'discovery-round3/round3-engine.js'
      - '.github/workflows/discovery-human-test-browser.yml'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/el8-http.log 2>&1 &
      - name: Run browser smoke tests
        run: npx playwright test discovery-round3/human-test-browser.spec.js --browser=chromium --reporter=line
