name: Discovery Candidate Regression
on:
  push:
    paths:
      - 'experiments/discovery/candidate/**'
  pull_request:
    paths:
      - 'experiments/discovery/candidate/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Question-bank structure
        run: node experiments/discovery/candidate/questions/validate.mjs
      - name: Question-bank behavior
        run: node experiments/discovery/candidate/questions/behavior-tests.mjs
      - name: Evidence contracts
        run: node experiments/discovery/candidate/evidence-contract-tests.mjs
      - name: State contracts
        run: node experiments/discovery/candidate/state-contract-tests.mjs
      - name: Architecture regressions
        run: node experiments/discovery/candidate/regression-tests.mjs
      - name: Adversarial end-to-end scenarios
        run: node experiments/discovery/candidate/end-to-end-tests.mjs
