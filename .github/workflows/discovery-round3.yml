name: Discovery Regression
on:
  push:
    paths:
      - 'development/discovery/**'
      - 'development/app/onboarding/discovery-*.js'
      - 'experiments/discovery/candidate/**'
      - 'package.json'
      - '.github/workflows/discovery-round3.yml'
  pull_request:
    paths:
      - 'development/discovery/**'
      - 'development/app/onboarding/discovery-*.js'
      - 'experiments/discovery/candidate/**'
      - 'package.json'
      - '.github/workflows/discovery-round3.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promoted Discovery runtime and onboarding boundary
        run: npm run test:discovery:promoted
      - name: Candidate behavioral regression during migration
        run: npm run test:discovery:candidate
