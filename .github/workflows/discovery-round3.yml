name: Discovery Development Regression
on:
  push:
    paths:
      - 'development/discovery/**'
  pull_request:
    paths:
      - 'development/discovery/**'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Question-bank structure
        run: node development/discovery/questions/validate.mjs
      - name: Question-bank behavior
        run: node development/discovery/questions/behavior-tests.mjs
      - name: Architecture regressions
        run: node development/discovery/regression-tests.mjs
      - name: Adversarial end-to-end scenarios
        run: node development/discovery/end-to-end-tests.mjs
