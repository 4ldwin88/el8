<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EL8 · App Introduction</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.intro{min-height:72vh;display:flex;flex-direction:column}.progress{display:flex;gap:7px;margin:18px 0 28px}.dot{height:5px;flex:1;border-radius:9px;background:var(--line)}.dot.on{background:var(--ink)}.stage{flex:1}.stage h1{font-size:40px;line-height:1.04;margin:12px 0 18px}.stage p{font-size:20px;line-height:1.45;color:var(--muted)}.nav{display:flex;gap:10px;margin-top:24px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.hidden{display:none}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-card intro"><div class="el8-eyebrow">Welcome to EL8</div><div id="progress" class="progress"></div><div id="stage" class="stage"></div><div class="nav"><button id="back" class="el8-btn secondary hidden">Back</button><button id="next" class="el8-btn">Next</button></div></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const session=await getSessionOrRedirect();if(!session)throw Error('No session');const profile=await getMyProfile();document.documentElement.dataset.theme=profile.appearance||'light';if(profile.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}const slides=[{title:'Your life works as a whole.',body:'EL8 looks across eight interconnected dimensions of wellness. It uses what you tell it and what you track to help identify what deserves attention without turning your life into a checklist.'},{title:'Home keeps today simple.',body:'Home brings together quick logging, today’s evidence, check-ins and the actions that matter now. You do not need to fill every possible data point for EL8 to be useful.'},{title:'Explore helps you understand and act.',body:'Explore is where modules, lessons and practical guidance live. Use it when you want to learn, go deeper or find useful content across the eight dimensions.'},{title:'Track records what actually happens.',body:'Track is your place for logs and history. Your entries become evidence EL8 can use over time instead of relying only on memory or one-time assessments.'},{title:'Insights connects the dots.',body:'Insights shows patterns across your dimensions, logs, check-ins and progress. It is the place to understand the bigger picture rather than just today.'},{title:'Profile is your EL8 record.',body:'Profile brings together your overview, saved items, history, achievements, assessments, goals, rewards, reports, connections, settings and data. Your adaptive plan can narrow, stay steady or expand as your needs, evidence and capacity change.'}];let i=0;function render(){progress.innerHTML=slides.map((_,n)=>`<span class="dot ${n<=i?'on':''}"></span>`).join('');stage.innerHTML=`<h1>${slides[i].title}</h1><p>${slides[i].body}</p>`;back.classList.toggle('hidden',i===0);next.textContent=i===slides.length-1?'Go to Home':'Next'}render();back.onclick=()=>{if(i){i--;render()}};next.onclick=async()=>{if(i<slides.length-1){i++;render();return}next.disabled=true;next.textContent='Opening EL8…';const{error}=await supabase.from('el8_profiles').update({onboarding_status:'completed',updated_at:new Date().toISOString()}).eq('user_id',session.user.id);if(error){next.disabled=false;next.textContent='Go to Home';alert(error.message);return}location.replace('home.html')};</script></body></html>
