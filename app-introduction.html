<!doctype html><html lang="en"><head><meta charset="utf-8"><script>try{document.documentElement.dataset.theme=localStorage.getItem('el8-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Introduction</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.intro{min-height:68vh;display:flex;flex-direction:column}.progress{display:flex;gap:6px;margin:18px 0 26px}.dot{height:5px;flex:1;border-radius:9px;background:var(--line)}.dot.on{background:var(--ink)}.stage{flex:1}.stage h1{font-size:38px;line-height:1.06;margin:12px 0 16px}.stage p{font-size:18px;line-height:1.5;color:var(--muted)}.nav{display:flex;gap:9px}.nav button{flex:1}.secondary{background:var(--card);color:var(--ink);border:1px solid var(--line)}.hidden{display:none}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-card intro"><div class="el8-eyebrow">Welcome to EL8</div><div id="progress" class="progress"></div><div id="stage" class="stage"></div><div class="nav"><button id="back" class="el8-btn secondary hidden">Back</button><button id="next" class="el8-btn">Next</button></div></div></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';import{instrumentOnboardingStage,recordOnboardingEvent,completeOnboardingTelemetry}from'./app/onboarding/telemetry.js';const auth=await getSessionOrRedirect();if(!auth)throw Error('No session');const profile=await getMyProfile();if(profile.onboarding_status==='safety_paused'){location.replace('safety-hold.html');throw Error('Safety pause')}instrumentOnboardingStage('introduction');const slides=[{title:'Your life works as a whole.',body:'EL8 looks across eight connected dimensions and helps decide what deserves attention without turning your life into a giant checklist.'},{title:'Your plan keeps today simple.',body:'Home shows what matters now. Track captures what actually happens. Insights helps connect the dots as evidence builds.'},{title:'EL8 adapts with evidence.',body:'Your plan can stay steady or change as EL8 learns what is working, what is not, and what is realistic for you. You stay in control.'}];let i=0,shownAt=performance.now();function render(){progress.innerHTML=slides.map((_,n)=>`<span class="dot ${n<=i?'on':''}"></span>`).join('');stage.innerHTML=`<h1>${slides[i].title}</h1><p>${slides[i].body}</p>`;back.classList.toggle('hidden',i===0);next.textContent=i===slides.length-1?'Enter EL8':'Next';shownAt=performance.now();recordOnboardingEvent('intro_slide_view',{slide:i+1,total:slides.length})}back.onclick=()=>{recordOnboardingEvent('intro_back',{from:i+1,dwellMs:Math.round(performance.now()-shownAt)});if(i){i--;render()}};next.onclick=async()=>{recordOnboardingEvent('intro_next',{slide:i+1,dwellMs:Math.round(performance.now()-shownAt)});if(i<slides.length-1){i++;render();return}next.disabled=true;next.textContent='Opening EL8…';const{error}=await supabase.rpc('el8_complete_onboarding');if(error){next.disabled=false;next.textContent='Enter EL8';alert(error.message);return}completeOnboardingTelemetry({completed:true});location.replace('home.html')};render();</script></body></html>
