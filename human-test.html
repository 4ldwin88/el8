<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 — H1 Round 2</title><link rel="stylesheet" href="assets/el8-ui.css"><style>body{margin:0;min-height:100vh;background:var(--bg,#f5f5f2);font-family:Inter,system-ui,sans-serif;color:var(--text,#171717)}.shell{max-width:720px;margin:auto;padding:24px 18px 64px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.brand img{width:42px;height:42px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.card{background:var(--surface,#fff);border:1px solid rgba(127,127,127,.18);border-radius:20px;padding:22px}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px}.muted{opacity:.68;line-height:1.5}.options{display:grid;gap:10px;margin:22px 0}.option{width:100%;text-align:left;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit;border-radius:14px;padding:14px 15px;font-size:15px}.option.sel{border-color:#b89242;background:rgba(184,146,66,.16);box-shadow:inset 0 0 0 1px #b89242}.progress{height:5px;background:rgba(127,127,127,.15);border-radius:9px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#b89242}.primary,.secondary{border-radius:12px;padding:12px 16px;cursor:pointer}.primary{border:0;background:#b89242;color:#111;font-weight:700}.primary:disabled{opacity:.4}.secondary{border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit}.actions{display:flex;gap:10px;flex-wrap:wrap}.plan-item{border-top:1px solid rgba(127,127,127,.18);padding:16px 0}.meta{font-size:12px;opacity:.62;margin-top:6px}.rating{display:flex;gap:7px;margin:10px 0 18px}.rating button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit}.rating button.sel{background:#b89242;color:#111}textarea{box-sizing:border-box;width:100%;min-height:90px;border-radius:12px;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit;padding:12px}.error{white-space:pre-wrap;word-break:break-word}</style></head><body><main class="shell"><div class="brand"><img src="assets/brand/el8-mark.svg" alt="EL8"><div><div class="eyebrow">Member Zero · H1</div><strong>Human Validation</strong></div></div><section class="card" id="app"><div class="eyebrow">Human Validation</div><h1>Round 2</h1><p class="muted">Testing revised answer selection, multi-select handling, conditional questioning and normalized plan evidence.</p><button class="primary" id="start">Start Round 2</button></section></main><script type="module">const app=document.querySelector('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function fail(stage,e){app.innerHTML=`<h1>Round 2 error</h1><p>${esc(stage)}</p><pre class="error">${esc(e?.stack||e?.message||e)}</pre>`}async function boot(){try{app.innerHTML='<h1>Round 2</h1><p>Loading…</p>';const Discovery=(await import('./discovery-v2-engine.js')).default,{discoveryToPlan,assessmentPlanView}=await import('./intelligence/planning/end-to-end-assessment.js');let session=Discovery.session({}),step=0,result=null;const MAX=8;function render(){const q=Discovery.next(session);if(!q)return finish();step++;let selected=new Set();app.innerHTML=`<div class="eyebrow">Round 2 · Question ${step} of up to ${MAX}</div><div class="progress"><div class="bar" style="width:${Math.min(100,step/MAX*100)}%"></div></div><h2>${esc(q.text||q.question||q.prompt||q.label)}</h2><p class="muted">${q.mode==='multi'?'Select all that apply, then press Next.':'Select one answer, then press Next.'}</p><div class="options">${q.options.map(o=>`<button class="option" data-id="${esc(o.id)}">${esc(o.text||o.label||o.title||o.id)}</button>`).join('')}</div><div class="actions"><button class="primary" id="next" disabled>Next</button><button class="secondary" id="stop">Stop test</button></div>`;const next=app.querySelector('#next');app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(q.mode!=='multi'){selected.clear();app.querySelectorAll('.option').forEach(x=>x.classList.remove('sel'))}const id=b.dataset.id;if(q.mode==='multi'&&selected.has(id)){selected.delete(id);b.classList.remove('sel')}else{selected.add(id);b.classList.add('sel')}next.disabled=!selected.size});next.onclick=()=>{Discovery.answer(session,q.id,[...selected]);render()};app.querySelector('#stop').onclick=finish}function finish(){result=discoveryToPlan(session,{capacity:'medium'});const view=assessmentPlanView(result),trace=Discovery.trace(session);app.innerHTML=`<div class="eyebrow">Round 2 result</div><h1>${view.status==='escalate'?'Plan held':'Your EL8 starting plan'}</h1>${view.active.length?view.active.map(x=>`<div class="plan-item"><strong>${esc(x.title||x.id)}</strong>${x.measurement?`<div class="meta">Measure: ${esc(x.measurement)}</div>`:''}</div>`).join(''):'<p>No active actions generated.</p>'}<h2>Human judgment</h2><p>Understanding accuracy</p><div class="rating" id="accuracy">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><p>Plan usefulness/manageability</p><div class="rating" id="useful">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><textarea id="notes" placeholder="What improved? What is still wrong?"></textarea><div class="actions" style="margin-top:14px"><button class="primary" id="copy">Copy Round 2 report</button><button class="secondary" id="restart">Run again</button></div><div id="status" class="meta"></div>`;let accuracy=null,useful=null;for(const[id,set]of[['accuracy',v=>accuracy=v],['useful',v=>useful=v]])app.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{app.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');set(+b.dataset.n)});app.querySelector('#copy').onclick=async()=>{const report={test:'EL8 Member Zero H1 Round 2',timestamp:new Date().toISOString(),accuracy,usefulness:useful,notes:app.querySelector('#notes').value,assessment:result.assessment,trace,plan:view};await navigator.clipboard.writeText(JSON.stringify(report,null,2));app.querySelector('#status').textContent='Round 2 report copied.'};app.querySelector('#restart').onclick=()=>{session=Discovery.session({});step=0;render()}}render()}catch(e){fail('initialization',e)}}document.querySelector('#start').onclick=boot;</script></body></html>
