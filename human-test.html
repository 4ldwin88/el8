<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL8 — Human Validation</title>
<link rel="stylesheet" href="assets/el8-ui.css">
<style>
body{margin:0;min-height:100vh;background:var(--bg,#f5f5f2);font-family:Inter,system-ui,sans-serif;color:var(--text,#171717)}.shell{max-width:720px;margin:auto;padding:24px 18px 64px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.brand img{width:42px;height:42px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.card{background:var(--surface,#fff);border:1px solid rgba(127,127,127,.18);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.05)}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px;margin:0 0 8px}.muted{opacity:.68;line-height:1.5}.options{display:grid;gap:10px;margin:22px 0}.option{width:100%;text-align:left;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit;border-radius:14px;padding:14px 15px;font-size:15px;cursor:pointer}.progress{height:5px;background:rgba(127,127,127,.15);border-radius:9px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#b89242}.primary,.secondary{border-radius:12px;padding:12px 16px;cursor:pointer}.primary{border:0;background:#b89242;color:#111;font-weight:700}.secondary{border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit}.plan-item{border-top:1px solid rgba(127,127,127,.18);padding:16px 0}.meta{font-size:12px;opacity:.62;margin-top:6px}.error{white-space:pre-wrap;word-break:break-word;background:rgba(180,40,40,.08);border:1px solid rgba(180,40,40,.3);padding:12px;border-radius:12px;margin-top:14px}textarea{box-sizing:border-box;width:100%;min-height:90px;border-radius:12px;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit;padding:12px}.rating{display:flex;gap:7px;margin:10px 0 18px}.rating button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit}.rating button.sel{background:#b89242;color:#111}.actions{display:flex;gap:10px;flex-wrap:wrap}
</style></head>
<body><main class="shell"><div class="brand"><img src="assets/brand/el8-mark.svg" alt="EL8"><div><div class="eyebrow">Member Zero · H1</div><strong>Human Validation</strong></div></div><section class="card" id="app"><p>Loading assessment…</p><p class="meta">Runtime diagnostic v2</p></section></main>
<script type="module">
const app=document.querySelector('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function fail(stage,e){console.error(stage,e);app.innerHTML=`<div class="eyebrow">Human validation diagnostic</div><h1>Assessment could not start</h1><p>The test page loaded, but EL8 hit a runtime error during <strong>${esc(stage)}</strong>.</p><div class="error">${esc(e?.stack||e?.message||e)}</div><p class="meta">Send a screenshot of this error back to ChatGPT. Diagnostic v2.</p>`}
window.addEventListener('error',e=>fail('browser runtime',e.error||e.message));window.addEventListener('unhandledrejection',e=>fail('module promise',e.reason));
(async()=>{try{
 app.innerHTML='<p>Loading Discovery engine…</p><p class="meta">Runtime diagnostic v2</p>';
 const discoveryModule=await import('./discovery-v2-engine.js'); const Discovery=discoveryModule.default;
 app.innerHTML='<p>Loading Plan Engine…</p><p class="meta">Runtime diagnostic v2</p>';
 const planning=await import('./intelligence/planning/end-to-end-assessment.js'); const {discoveryToPlan,assessmentPlanView}=planning;
 let session=Discovery.session({}),step=0,result=null;const MAX=8;
 const questionText=q=>q.text||q.question||q.prompt||q.label||'Choose the answer that fits best.';const optionText=o=>o.text||o.label||o.title||o.id.replaceAll('_',' ');
 function render(){try{const q=Discovery.next(session);if(!q){finish();return;}step++;app.innerHTML=`<div class="eyebrow">Discovery · Question ${step} of up to ${MAX}</div><div class="progress"><div class="bar" style="width:${Math.min(100,step/MAX*100)}%"></div></div><h2>${esc(questionText(q))}</h2><p class="muted">Answer as you actually are today. There are no preferred answers.</p><div class="options">${q.options.map(o=>`<button class="option" data-id="${esc(o.id)}">${esc(optionText(o))}</button>`).join('')}</div><button class="secondary" id="stop">Stop test</button>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{Discovery.answer(session,q.id,b.dataset.id);render()});app.querySelector('#stop').onclick=finish}catch(e){fail('question rendering',e)}}
 function finish(){try{result=discoveryToPlan(session,{capacity:'medium'});const view=assessmentPlanView(result),trace=Discovery.trace(session);app.innerHTML=`<div class="eyebrow">Human validation result</div><h1>${view.status==='escalate'?'Plan held':'Your EL8 starting plan'}</h1><p class="muted">Experimental result. Judge whether EL8 understood you and whether the plan is useful.</p>${view.active.length?view.active.map(x=>`<div class="plan-item"><strong>${esc(x.title||x.id)}</strong>${x.measurement?`<div class="meta">Measure: ${esc(x.measurement)}</div>`:''}</div>`).join(''):'<p>No active actions were generated.</p>'}<h2>Human judgment</h2><p class="muted">Understanding accuracy</p><div class="rating" id="accuracy">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><p class="muted">Plan usefulness/manageability</p><div class="rating" id="useful">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><textarea id="notes" placeholder="What did EL8 misunderstand, miss, or get right?"></textarea><div class="actions" style="margin-top:14px"><button class="primary" id="copy">Copy validation report</button><button class="secondary" id="restart">Run again</button></div><div id="status" class="meta"></div>`;let accuracy=null,useful=null;for(const[id,set]of[['accuracy',v=>accuracy=v],['useful',v=>useful=v]])app.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{app.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');set(+b.dataset.n)});app.querySelector('#copy').onclick=async()=>{const report={test:'EL8 Member Zero H1',timestamp:new Date().toISOString(),accuracy,usefulness:useful,notes:app.querySelector('#notes').value,assessment:result.assessment,trace,plan:view};try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));app.querySelector('#status').textContent='Report copied. Paste it into ChatGPT.'}catch(e){app.querySelector('#status').textContent='Clipboard blocked: '+e.message}};app.querySelector('#restart').onclick=()=>{session=Discovery.session({});step=0;render()}}catch(e){fail('plan generation',e)}}
 render();
}catch(e){fail('module loading',e)}})();
</script></body></html>
