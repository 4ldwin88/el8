<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EL8 — Human Validation</title>
<link rel="stylesheet" href="assets/el8-ui.css">
<style>
body{margin:0;min-height:100vh;background:var(--bg,#f5f5f2);font-family:Inter,system-ui,sans-serif;color:var(--text,#171717)}
.shell{max-width:720px;margin:auto;padding:24px 18px 64px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.brand img{width:42px;height:42px}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}.card{background:var(--surface,#fff);border:1px solid rgba(127,127,127,.18);border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.05)}h1{font-size:26px;margin:4px 0 8px}h2{font-size:21px;margin:0 0 8px}.muted{opacity:.68;line-height:1.5}.options{display:grid;gap:10px;margin:22px 0}.option{width:100%;text-align:left;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit;border-radius:14px;padding:14px 15px;font-size:15px;cursor:pointer}.option:hover,.option:focus{border-color:#b89242;outline:none}.progress{height:5px;background:rgba(127,127,127,.15);border-radius:9px;overflow:hidden;margin:16px 0 24px}.bar{height:100%;background:#b89242;transition:width .2s}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{border:0;border-radius:12px;padding:12px 16px;background:#b89242;color:#111;font-weight:700;cursor:pointer}.secondary{border:1px solid rgba(127,127,127,.25);border-radius:12px;padding:12px 16px;background:transparent;color:inherit;cursor:pointer}.plan-item{border-top:1px solid rgba(127,127,127,.18);padding:16px 0}.plan-item:first-child{border-top:0}.meta{font-size:12px;opacity:.58;margin-top:6px}.feedback{margin-top:24px;padding-top:18px;border-top:1px solid rgba(127,127,127,.18)}.rating{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 18px}.rating button{width:38px;height:38px;border-radius:10px;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit}.rating button.sel{background:#b89242;color:#111;border-color:#b89242}textarea{box-sizing:border-box;width:100%;min-height:90px;border-radius:12px;border:1px solid rgba(127,127,127,.25);background:transparent;color:inherit;padding:12px}.debug{font-size:12px;white-space:pre-wrap;word-break:break-word;opacity:.6;margin-top:20px}.hidden{display:none}
</style>
</head>
<body><main class="shell">
<div class="brand"><img src="assets/brand/el8-mark.svg" alt="EL8"><div><div class="eyebrow">Member Zero · H1</div><strong>Human Validation</strong></div></div>
<section class="card" id="app"><p>Loading assessment…</p></section>
</main>
<script type="module">
import Discovery from './discovery-v2-engine.js';
import { discoveryToPlan, assessmentPlanView } from './intelligence/planning/end-to-end-assessment.js';
const app=document.querySelector('#app');
let session=Discovery.session({});let step=0;let result=null;const MAX=8;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function questionText(q){return q.text||q.question||q.prompt||q.label||'Choose the answer that fits best.'}
function optionText(o){return o.text||o.label||o.title||o.id.replaceAll('_',' ')}
function render(){const q=Discovery.next(session);if(!q){finish();return;}step++;app.innerHTML=`<div class="eyebrow">Discovery · Question ${step} of up to ${MAX}</div><div class="progress"><div class="bar" style="width:${Math.min(100,step/MAX*100)}%"></div></div><h2>${esc(questionText(q))}</h2><p class="muted">Answer as you actually are today. There are no preferred answers.</p><div class="options">${q.options.map(o=>`<button class="option" data-id="${esc(o.id)}">${esc(optionText(o))}</button>`).join('')}</div><button class="secondary" id="stop">Stop test</button>`;app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{Discovery.answer(session,q.id,b.dataset.id);render()});app.querySelector('#stop').onclick=finish}
function finish(){result=discoveryToPlan(session,{capacity:'medium'});const view=assessmentPlanView(result);const trace=Discovery.trace(session);app.innerHTML=`<div class="eyebrow">Human validation result</div><h1>${view.status==='escalate'?'Plan held':'Your EL8 starting plan'}</h1><p class="muted">This is an experimental result. Judge whether EL8 understood you and whether the plan is useful—not whether the interface looks polished.</p>${view.active.length?view.active.map(x=>`<div class="plan-item"><strong>${esc(x.title||x.id)}</strong>${x.goal?`<div>${esc(x.goal)}</div>`:''}${x.measurement?`<div class="meta">Measure: ${esc(x.measurement)}</div>`:''}${x.rationale?`<div class="meta">Why: ${esc(x.rationale)}</div>`:''}</div>`).join(''):'<p>No active actions were generated.</p>'}<div class="feedback"><h2>Human judgment</h2><p class="muted">How accurately did EL8 understand what matters most?</p><div class="rating" id="accuracy">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><p class="muted">How useful and manageable is this plan?</p><div class="rating" id="useful">${[1,2,3,4,5].map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div><textarea id="notes" placeholder="What did EL8 misunderstand, miss, or get right?"></textarea><div class="actions" style="margin-top:14px"><button class="primary" id="copy">Copy validation report</button><button class="secondary" id="restart">Run again</button></div><div id="copied" class="meta"></div></div><details><summary class="meta">Technical trace</summary><pre class="debug">${esc(JSON.stringify({assessment:result.assessment,trace,plan:view},null,2))}</pre></details>`;let accuracy=null,useful=null;for(const [id,set] of [['accuracy',v=>accuracy=v],['useful',v=>useful=v]])app.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{app.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');set(+b.dataset.n)});app.querySelector('#copy').onclick=async()=>{const report={test:'EL8 Member Zero H1',timestamp:new Date().toISOString(),accuracy,usefulness:useful,notes:app.querySelector('#notes').value,assessment:result.assessment,trace,plan:view};try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));app.querySelector('#copied').textContent='Validation report copied. Paste it back into ChatGPT.'}catch{app.querySelector('#copied').textContent='Copy was blocked. Open Technical trace and send your ratings/notes manually.'}};app.querySelector('#restart').onclick=()=>{session=Discovery.session({});step=0;render()}}
render();
</script></body></html>
