<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EL8 · Plan History</title><link rel="stylesheet" href="assets/el8-ui.css"><style>.muted{color:var(--muted)}.plan{margin-bottom:14px}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px}.row{padding:9px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.small{font-size:13px}</style></head><body><main class="el8-shell"><div class="el8-brand"><img class="el8-brand-mark" src="assets/brand/el8-mark.svg" alt=""><div class="el8-brand-copy"><div class="el8-wordmark">EL8</div><div class="el8-tagline">Life, in balance.</div></div></div><div class="el8-eyebrow">Plan · History</div><h1>Your plan history</h1><p>Previous plans are preserved as evidence. EL8 creates a new version when the plan materially changes rather than rewriting the past.</p><div id="list"><div class="el8-card">Loading…</div></div><button class="el8-bottom-action" onclick="location.href='app.html#plan'">Back to Plan</button></main><script type="module">import{supabase,getSessionOrRedirect,getMyProfile}from'./el8-client.js';const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const session=await getSessionOrRedirect();if(!session)throw Error('No session');const profile=await getMyProfile();document.documentElement.dataset.theme=profile?.appearance||'light';const{data:plans,error}=await supabase.from('el8_plans').select('*').eq('user_id',session.user.id).not('status','in','(qa_isolated,qa_result)').order('created_at',{ascending:false});if(error){list.innerHTML=`<div class="el8-card">${esc(error.message)}</div>`}else if(!plans?.length){list.innerHTML='<div class="el8-card">No plan history yet.</div>'}else{const ids=plans.map(p=>p.id);const{data:reviews}=await supabase.from('el8_plan_reviews').select('plan_id,recommendation,rationale,created_at,resulting_plan_id').eq('user_id',session.user.id).in('plan_id',ids).order('created_at',{ascending:false});const byPlan={};for(const r of reviews||[])(byPlan[r.plan_id]??=[]).push(r);list.innerHTML=plans.map(p=>{const f=Array.isArray(p.focus_dimensions)&&p.focus_dimensions.length?p.focus_dimensions:[p.dimension,p.supporting_dimension].filter(Boolean).map(d=>({dimension:d}));const ints=Array.isArray(p.interventions)&&p.interventions.length?p.interventions:(p.actions||[]).map(x=>({action:x.action,dimensions:[x.dimension].filter(Boolean)}));const rs=byPlan[p.id]||[];return`<section class="el8-card plan"><div class="meta"><span class="pill">Version ${p.version||1}</span><span class="pill">${esc(p.status)}</span><span class="pill">${new Date(p.created_at).toLocaleDateString()}</span></div><h2>${esc(p.plan_objective||p.rationale||'Active plan')}</h2><div class="row"><b>Focus</b><br>${f.map(x=>esc(x.dimension)).join(' · ')||'—'}</div>${ints.map((x,i)=>`<div class="row"><b>${ints.length===1?'Intervention':`Intervention ${i+1}`}</b><br>${esc(x.action||'—')}${x.dimensions?.length?`<div class="muted small">May support: ${x.dimensions.map(esc).join(' · ')}</div>`:''}</div>`).join('')}${p.adjustment_reason?`<div class="row"><b>Why this version ended or changed</b><br>${esc(p.adjustment_reason)}</div>`:''}${rs.length?`<div class="row"><b>Review decision</b><br>${esc(rs[0].recommendation)}${rs[0].rationale?`<div class="muted small">${esc(rs[0].rationale)}</div>`:''}</div>`:''}${p.parent_plan_id?'<div class="row muted small">Created from a previous plan version.</div>':''}</section>`}).join('')}</script></body></html>
